<!DOCTYPE html>
<!-- Apex 26 — three.js migration spike harness.
     Standalone: NOT part of index.html / tools/manifest.cjs / the test suite.
     Loads the real track-build pipeline (script list mirrors manifest TRACK_VM —
     hand-copied, can drift; fixed properly if this graduates) + ONE circuit,
     then renders it with three.js r185.1 (vendored) via spike/three-spike.js.
     Run:  npx serve -l 3456 .   ->  http://localhost:3456/spike/three-spike.html
           ?gl=1 pins the WebGL2 backend (SwiftShader/CI); default auto-picks WebGPU.
           ?track=<id> picks a circuit (default singapore). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Apex 26 — three.js spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: 8px; left: 8px; color: #9f9; background: rgba(0,0,0,.55);
    font: 12px/1.5 monospace; padding: 6px 10px; border-radius: 4px; white-space: pre;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>

<!-- GLX stub + data seam: MUST precede the js/track scripts -->
<script src="./spike-data.js"></script>

<!-- Real engine scripts, order mirroring tools/manifest.cjs TRACK_VM -->
<script src="../js/log.js"></script>
<script src="../js/track/geom.js"></script>
<script src="../js/track/scenery-data.js"></script>
<script src="../js/track/space.js"></script>
<script src="../js/track/surface.js"></script>
<script src="../js/track/models.js"></script>
<script src="../js/track/graph.js"></script>
<script src="../js/track/themes.js"></script>
<script src="../js/track/landmark-kit.js"></script>
<script src="../js/track/circuit-kit.js"></script>
<script src="../js/track/spline.js"></script>
<script src="../js/track/mesh.js"></script>
<script src="../js/track/scenery-nature.js"></script>
<script src="../js/track/scenery-structures.js"></script>
<script src="../js/track/scenery-city.js"></script>
<script src="../js/track/scenery-identity.js"></script>
<!-- one circuit def instead of @circuits (street_night theme -> 32-light pressure) -->
<script src="../js/circuits/singapore.js"></script>
<script src="../js/track/tracks.js"></script>
<!-- car + lighting (call-time deps only; lighting reads the GLX stub at eval) -->
<script src="../js/car/car3d.js"></script>
<script src="../js/game/lighting.js"></script>

<!-- three.js r185.1 (vendored) — the only ES-module island -->
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.185.1/three.webgpu.min.js",
    "three/webgpu": "../vendor/three-0.185.1/three.webgpu.min.js",
    "three/tsl": "../vendor/three-0.185.1/three.tsl.min.js",
    "three/addons/": "../vendor/three-0.185.1/addons/"
  }
}
</script>
<script type="module" src="./three-spike.js"></script>
</body>
</html>
