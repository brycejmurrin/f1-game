<!DOCTYPE html>
<!-- Apex 26 — Babylon.js migration spike harness (comparison arm to three-spike.html).
     Standalone: NOT part of index.html / tools/manifest.cjs / the test suite.
     NEEDS ITS VENDOR BACK BEFORE IT RUNS: the 8 MB vendored babylon.js was removed
     once the comparison concluded in three.js's favour (see spike/README.md and
     ADOPTION-PLAN.md for the measured numbers this arm produced). Drop a Babylon
     9.19.0 UMD build at spike/vendor/babylon/babylon.js — the path below — to
     re-run it; nothing else here changed.
     Loads the real track-build pipeline (script list copied verbatim from
     three-spike.html) + ONE circuit, then renders it with the vendored Babylon.js
     UMD build via spike/babylon-spike.js (plain script, global BABYLON — no modules).
     Run:  npx serve -l 3456 .   ->  http://localhost:3456/spike/babylon-spike.html
           ?track=<id> picks a circuit (default singapore).
           ?lamps=N caps the spotlight count (default 32).
           ?gain=X scales lamp intensity (default tuned vs glx-t030). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Apex 26 — Babylon.js spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; outline: none; }
  #hud {
    position: fixed; top: 8px; left: 8px; color: #9cf; background: rgba(0,0,0,.55);
    font: 12px/1.5 monospace; padding: 6px 10px; border-radius: 4px; white-space: pre;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>

<!-- GLX stub + data seam: MUST precede the js/track scripts -->
<script src="./spike-data.js"></script>

<!-- Real engine scripts, order mirroring tools/manifest.cjs TRACK_VM -->
<script src="../js/track/geo-paths.js"></script>
<script src="../js/track/geom.js"></script>
<script src="../js/track/scenery-data.js"></script>
<script src="../js/track/markings.js"></script>

<script src="../js/track/landmark-kit.js"></script>

<script src="../js/track/mesh.js"></script>
<script src="../js/track/scenery-nature.js"></script>
<script src="../js/track/scenery-structures.js"></script>
<script src="../js/track/scenery-city.js"></script>
<script src="../js/track/scenery-identity.js"></script>
<!-- one circuit def instead of @circuits (street_night theme -> 32-light pressure) -->

<script src="../js/track/tracks.js"></script>
<!-- car + lighting (call-time deps only; lighting reads the GLX stub at eval) -->
<script src="../js/car/car3d.js"></script>
<script src="../js/game/lighting.js"></script>

<!-- Babylon.js UMD (vendored) — plain script, no modules -->
<script src="./vendor/babylon/babylon.js"></script>
<script src="./babylon-spike.js"></script>
</body>
</html>
