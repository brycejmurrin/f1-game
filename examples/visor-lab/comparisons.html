<!doctype html>
<!-- @doc Portable screenshot-pair viewer populated by tools/shot/ab-gallery.mjs. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex / Capture Comparisons</title><link rel="stylesheet" href="comparisons.css"></head><body>
<header><strong>APEX / CAPTURE LAB</strong><a id="lab-link" href="index.html" hidden>Visor Lab</a><span>CAPTURE COMPARISONS</span><button id="toggle" aria-controls="selector" aria-expanded="true">Hide selector</button></header>
<main><aside id="selector"><p class="eyebrow">SAME VIEW / TWO TAKES</p><h1>See the difference.</h1><label for="pairs">Comparison</label><select id="pairs"></select><p id="description"></p><p class="help">Drag the divider, or use the slider and arrow keys. Both images keep the same scale.</p><div class="downloads"><a id="download-a" download>Download A</a><a id="download-b" download>Download B</a></div><details><summary>Capture details</summary><pre id="details"></pre></details><a id="optics-link" href="optics.html" hidden>Animated visor lab ↗</a></aside>
<section aria-label="Screenshot comparison"><div id="stage" style="--wipe:50%"><img id="a" alt="Original view"><img id="b" alt="Candidate view"><div id="divider" aria-hidden="true"><span>‹ ›</span></div><span class="label left" id="label-a">A</span><span class="label right" id="label-b">B</span></div><div class="slider"><label for="wipe">Original ← Compare → Candidate <output id="value">50% A</output></label><input id="wipe" type="range" min="0" max="100" value="50" aria-label="A/B comparison divider"></div><p id="status" role="status">Loading comparisons…</p></section></main><script src="comparisons.js" defer></script></body></html>
