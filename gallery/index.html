<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex 26 — circuit surveys</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b10; --text:#e8e8ee; --muted:#9a9aaa; --accent:#7fd89a; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text);
    padding: 24px; text-align: center; }
  main { max-width: 28rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  a.btn { display: inline-block; background: #1a3d2a; color: var(--accent); text-decoration: none;
    padding: 14px 22px; border-radius: 10px; font-weight: 600; border: 1px solid #2d5a40; }
  a.btn:active { transform: scale(0.98); }
  .meta { margin-top: 20px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Circuit survey gallery</h1>
  <p>Sector and weather stills from track survey agents — filterable on phone or desktop.</p>
  <a class="btn" href="tracks/">Open track gallery</a>
  <p class="meta">Rebuild: <code>npm run gallery:tracks</code> · <code>docs/tracks/GALLERY.md</code></p>
</main>
</body>
</html>
