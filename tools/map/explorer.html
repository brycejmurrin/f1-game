<title>Apex 26 Project Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pit-wall split — module board (areas as rows of tiles) on the left, a detail sheet on the right;
   in portrait the sheet rises from the bottom. Generated by tools/map/build-project-map.mjs --html. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --ink: #1b2430; --muted: #5c6878; --line: #d5dae1; --chip: #e3e7ec;
  --accent: #c8102e; --accent-ink: #ffffff; --caller: #1f6fd1; --callee: #d97a00; --ok: #23824a;
  --heat0: #dfe5ec; --heat1: #f6d38b; --heat2: #f0a24a; --heat3: #dc5a2c; --heat4: #a3172a;
  --l-core: #3b4a5c; --l-render: #7a3db8; --l-track: #2f7d6d; --l-circ: #5aa469; --l-sim: #c8102e; --l-car: #d47a1f;
  --l-input: #1f6fd1; --l-pres: #c2449a; --l-modes: #8a6d1d; --l-net: #138a9e; --l-agent: #556b2f; --l-dev: #7d7d8c;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2c3542; --chip: #252d39;
  --accent: #ff4d5e; --accent-ink: #12161c; --caller: #5aa2ff; --callee: #ffb04a; --ok: #4cc27c;
  --heat0: #2a323e; --heat1: #6b5a2a; --heat2: #9c6526; --heat3: #c9532a; --heat4: #ff4d5e;
  --l-core: #8aa0bb; --l-render: #b48af0; --l-track: #5fc2ac; --l-circ: #87d396; --l-sim: #ff5f6e; --l-car: #f2a35a;
  --l-input: #5aa2ff; --l-pres: #f07fc8; --l-modes: #d6b85a; --l-net: #4fcfe2; --l-agent: #a7c46a; --l-dev: #a9a9ba; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2c3542; --chip: #252d39;
  --accent: #ff4d5e; --accent-ink: #12161c; --caller: #5aa2ff; --callee: #ffb04a; --ok: #4cc27c;
  --heat0: #2a323e; --heat1: #6b5a2a; --heat2: #9c6526; --heat3: #c9532a; --heat4: #ff4d5e;
  --l-core: #8aa0bb; --l-render: #b48af0; --l-track: #5fc2ac; --l-circ: #87d396; --l-sim: #ff5f6e; --l-car: #f2a35a;
  --l-input: #5aa2ff; --l-pres: #f07fc8; --l-modes: #d6b85a; --l-net: #4fcfe2; --l-agent: #a7c46a; --l-dev: #a9a9ba; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); }
.search { position: relative; flex: 1 1 200px; min-width: 0; }
.search input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.results { position: absolute; z-index: 30; left: 0; right: 0; top: 40px; max-height: 60vh; overflow: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
.results button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; border-bottom: 1px solid var(--line); min-height: 44px; }
.results button:hover, .results button.on { background: var(--chip); }
.results .k { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tabs { display: flex; gap: 4px; }
.tab { height: 36px; padding: 0 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font: 600 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 38%); }
.board { min-height: 0; min-width: 0; overflow: auto; padding-block: 10px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.chip { min-height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .45; }
.bar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.bar select { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 6px; }
.legend { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -2px 0 10px; }
.legend .sw { display: inline-flex; gap: 2px; } .legend .sw i { width: 16px; height: 10px; display: block; border-radius: 2px; }
.legend .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: -1px; }
.area { margin-bottom: 12px; }
.area h3 { margin: 0 0 4px; font: 600 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
.area h3 small { font: 400 11px var(--f-mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.tiles { display: flex; flex-wrap: wrap; gap: 3px; }
.t { border: 0; padding: 0; border-radius: 3px; cursor: pointer; background: var(--heat0); position: relative; }
.t.dim { opacity: .18; }
.t.sel { outline: 3px solid var(--ink); outline-offset: 1px; z-index: 2; }
.t.caller { box-shadow: 0 0 0 2px var(--caller); }
.t.callee { box-shadow: 0 0 0 2px var(--callee); }
.t.both { box-shadow: 0 0 0 2px var(--caller), 0 0 0 4px var(--callee); }
.t.flow { box-shadow: 0 0 0 3px var(--accent); }
.sheet { min-height: 0; min-width: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding-block: 12px 40px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet h2 { margin: 0; font: 700 22px/1.1 var(--f-display); letter-spacing: .01em; word-break: break-all; text-wrap: balance; }
.path { font: 12px var(--f-mono); color: var(--muted); word-break: break-all; }
.doc { margin: 8px 0; max-width: 65ch; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin: 10px 0; }
.kv div { background: var(--bg); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.kv span { display: block; font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font: 600 15px var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; word-break: break-word; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font: 600 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; min-height: 32px; display: flex; align-items: center; gap: 6px; }
summary .n { font: 500 12px var(--f-mono); color: var(--muted); }
summary .key { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
ul.rows { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 2px; }
ul.rows li { min-width: 0; }
.row { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 4px; border-radius: 6px; min-height: 36px; }
button.row:hover { background: var(--chip); }
.row .p { font: 12.5px var(--f-mono); word-break: break-all; min-width: 0; flex: 1; }
.row .m { font: 11.5px var(--f-mono); color: var(--muted); word-break: break-word; }
.mems { font: 11.5px/1.7 var(--f-mono); color: var(--muted); word-break: break-word; padding: 0 4px 6px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; margin: 2px 2px 0 0; }
.pill.skill { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.hint { color: var(--muted); font-size: 13px; max-width: 60ch; }
.flows { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.flow { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.flow h3 { margin: 0 0 6px; font: 700 17px var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.flow ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.flow li { counter-increment: s; position: relative; padding: 4px 0 6px 28px; border-left: 2px solid var(--line); margin-left: 10px; }
.flow li::before { content: counter(s); position: absolute; left: -11px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent);
  font: 600 11px/16px var(--f-mono); text-align: center; color: var(--ink); }
.flow li button { border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.flow .sym { font: 500 12.5px var(--f-mono); word-break: break-all; }
.flow .loc { font: 11px var(--f-mono); color: var(--muted); }
.flow .note { font-size: 12.5px; }
.flow .stale { color: var(--accent); font-size: 11px; }
.pathf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.pathf input { flex: 1 1 140px; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); font: 12px var(--f-mono); }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 14px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 12px var(--f-mono); }
.chain button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 6px; word-break: break-all; text-align: left; }
.chain .via { color: var(--muted); font-size: 11px; }
.close { display: none; }
.foot { font: 11px var(--f-mono); color: var(--muted); margin-top: 18px; word-break: break-word; }
@media (max-width: 720px), (orientation: portrait) and (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 62%; z-index: 20; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .2); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateY(0); transition: transform .2s; }
  .sheet.hide { transform: translateY(105%); }
  .close { display: inline-flex; position: sticky; top: -12px; float: right; }
}
@media (max-height: 430px) and (orientation: landscape) {
  header { padding-block: 4px; } .brand { font-size: 17px; } .tab, .search input { height: 32px; }
  main { grid-template-columns: minmax(0, 1fr) minmax(280px, 42%); }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div class="app">
  <header>
    <div class="brand">Apex 26 <b>Map</b></div>
    <div class="search">
      <input id="q" type="search" placeholder="Find a file, global or member (Tracks.curvature)" autocomplete="off" aria-label="Search files and symbols">
      <div class="results" id="results" hidden role="listbox"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-board" aria-selected="true">Board</button>
      <button class="tab" role="tab" id="tab-flows" aria-selected="false">Flows</button>
      <button class="tab" role="tab" id="tab-path" aria-selected="false">Path</button>
    </div>
  </header>
  <main>
    <section class="board" id="board"></section>
    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </main>
</div>

<script>
const MAP = /*__MAP_DATA__*/null;
const LAYER_VAR = { core: "--l-core", render: "--l-render", "track-engine": "--l-track", circuits: "--l-circ", simulation: "--l-sim",
  "car-garage": "--l-car", input: "--l-input", presentation: "--l-pres", "modes-data": "--l-modes", net: "--l-net", agent: "--l-agent", "dev-platform": "--l-dev" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem("apexmap:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("apexmap:" + k, JSON.stringify(v)); } catch {} } };

const nodes = MAP.nodes, byId = new Map(nodes.map((n) => [n.id, n]));
const out = new Map(), inn = new Map(), loadsB = new Map(), loadsA = new Map();
for (const n of nodes) { out.set(n.id, []); inn.set(n.id, []); loadsB.set(n.id, []); loadsA.set(n.id, []); }
for (const e of MAP.edges) {
  if (e.type === "calls" || e.type === "facade") { out.get(e.from)?.push(e); inn.get(e.to)?.push(e); }
  else if (e.type === "loads-before") { loadsA.get(e.to)?.push(e.from); loadsB.get(e.from)?.push(e.to); }
}
const skillDesc = new Map((MAP.meta.skills || []).map((s) => [s.name, s.desc]));
// symbol index: Global and Global.member → declaring file
const symIndex = [];
for (const n of nodes) for (const s of n.symbols) {
  symIndex.push({ key: s.name, file: n.id, line: s.line, kind: s.kind });
  for (const m of s.members) if (m !== "…") symIndex.push({ key: `${s.name}.${m}`, file: n.id, line: s.line, kind: "member" });
}
const base = (f) => f.split("/").pop().replace(/\.js$/, "");

// ── state ──
const st = { tab: store.get("tab", "board"), sel: null, color: store.get("color", "layer"), layers: new Set(store.get("layers", Object.keys(LAYER_VAR))), bundle: "all", flow: null };
const save = () => { store.set("tab", st.tab); store.set("color", st.color); store.set("layers", [...st.layers]); };

// ── colour ──
const q = (arr, p) => { const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
const metric = { churn: (n) => n.churn, size: (n) => n.lines, callers: (n) => n.callsIn, tests: (n) => n.tests.length };
const cuts = {};
for (const [k, f] of Object.entries(metric)) { const v = nodes.map(f).filter((x) => x > 0); cuts[k] = [q(v, .25), q(v, .5), q(v, .75), q(v, .93)]; }
function tileColor(n) {
  if (st.color === "layer") return `var(${LAYER_VAR[n.layer] || "--l-dev"})`;
  const v = metric[st.color](n); if (!v) return st.color === "tests" ? "var(--heat4)" : "var(--heat0)";
  const c = cuts[st.color]; let i = 1; while (i < 4 && v > c[i - 1]) i++;
  if (st.color === "tests") i = 5 - i; // few tests = hot
  return `var(--heat${Math.max(1, Math.min(4, i))})`;
}
const tileSize = (n) => Math.round(Math.max(14, Math.min(46, 6 + Math.sqrt(n.lines) * 0.75)));

// ── board ──
function renderBoard() {
  const bundles = [...new Set(nodes.map((n) => n.bundle.split(":")[0]))];
  const layers = Object.keys(LAYER_VAR);
  const areas = new Map();
  for (const n of nodes) {
    if (!st.layers.has(n.layer)) continue;
    if (st.bundle !== "all" && !n.bundle.startsWith(st.bundle)) continue;
    (areas.get(n.area) || areas.set(n.area, []).get(n.area)).push(n);
  }
  const order = [...areas.keys()].sort((a, b) => layers.indexOf(areas.get(a)[0].layer) - layers.indexOf(areas.get(b)[0].layer) || a.localeCompare(b));
  const heatLegend = st.color === "layer" ? layers.filter((l) => st.layers.has(l)).map((l) => `<span><i class="dot" style="background:var(${LAYER_VAR[l]})"></i> ${l}</span>`).join("")
    : `<span>${{ churn: "commits, last 30 days", size: "lines", callers: "files that call it", tests: "tests naming it (red = none)" }[st.color]}</span>
       <span class="sw"><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i></span>
       <span>${st.color === "tests" ? "many → none" : "low → high"}</span>`;
  $("board").innerHTML = `
    <div class="bar">${layers.map((l) => `<button class="chip" data-layer="${l}" aria-pressed="${st.layers.has(l)}"><i style="background:var(${LAYER_VAR[l]})"></i>${l}</button>`).join("")}</div>
    <div class="bar">
      <label>Colour <select id="color">${["layer", "churn", "size", "callers", "tests"].map((c) => `<option ${c === st.color ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      <label>Loads <select id="bundle"><option value="all">all</option>${bundles.map((b) => `<option ${b === st.bundle ? "selected" : ""}>${b}</option>`).join("")}</select></label>
      <span class="legend" style="margin:0">tile size = lines · <span><i class="dot" style="background:var(--caller)"></i> calls it</span><span><i class="dot" style="background:var(--callee)"></i> it calls</span></span>
    </div>
    <div class="legend">${heatLegend}</div>
    ${order.map((a) => { const ns = areas.get(a).sort((x, y) => (x.order ?? 1e4) - (y.order ?? 1e4) || x.id.localeCompare(y.id));
      return `<div class="area"><h3>${esc(a)} <small>${ns.length} files · ${ns.reduce((s, n) => s + n.lines, 0).toLocaleString()} lines</small></h3><div class="tiles">${
        ns.map((n) => { const z = tileSize(n); return `<button class="t" data-id="${esc(n.id)}" title="${esc(n.id)}" aria-label="${esc(n.id)}" style="width:${z}px;height:${z}px;background:${tileColor(n)}"></button>`; }).join("")
      }</div></div>`; }).join("")}`;
  paintSelection();
}
function paintSelection() {
  const tiles = document.querySelectorAll(".t");
  const flowFiles = st.flow ? new Set(st.flow) : null;
  if (!st.sel && !flowFiles) { tiles.forEach((t) => (t.className = "t")); return; }
  const callers = new Set(st.sel ? inn.get(st.sel).map((e) => e.from) : []), callees = new Set(st.sel ? out.get(st.sel).map((e) => e.to) : []);
  tiles.forEach((t) => {
    const id = t.dataset.id; let c = "t";
    if (flowFiles) c += flowFiles.has(id) ? " flow" : " dim";
    if (st.sel) {
      if (id === st.sel) c += " sel";
      else if (callers.has(id) && callees.has(id)) c += " both";
      else if (callers.has(id)) c += " caller";
      else if (callees.has(id)) c += " callee";
      else if (!flowFiles) c += " dim";
    }
    t.className = c;
  });
}

// ── detail sheet ──
function group(edges, key) {
  const m = new Map();
  for (const e of edges) { const k = e[key]; const g = m.get(k) || { id: k, syms: new Set(), members: new Set(), facade: [] };
    if (e.type === "facade") g.facade = e.members; else { g.syms.add(e.symbol); e.members.forEach((x) => g.members.add(`${e.symbol}.${x}`)); }
    m.set(k, g); }
  return [...m.values()].sort((a, b) => (byId.get(b.id)?.layer === byId.get(a.id)?.layer ? 0 : 0) || a.id.localeCompare(b.id));
}
function rowList(items, fmt) { return `<ul class="rows">${items.map((g) => `<li><button class="row" data-go="${esc(g.id)}"><span class="p">${esc(g.id)}</span></button>${fmt(g) ? `<div class="mems">${fmt(g)}</div>` : ""}</li>`).join("")}</ul>`; }
const via = (g) => esc([...(g.members.size ? g.members : g.syms)].slice(0, 30).join("  ")) + (g.facade.length ? ` G: ${esc(g.facade.slice(0, 30).join(" "))}${g.facade.length > 30 ? " …" : ""}` : "");
function renderSheet(id) {
  const n = byId.get(id), sh = $("sheet");
  if (!n) { sh.innerHTML = intro(); return; }
  const callers = group(inn.get(id), "from"), callees = group(out.get(id), "to");
  const skills = n.owners.filter((o) => o.startsWith("skill:")).map((o) => o.slice(6));
  const other = n.owners.filter((o) => !o.startsWith("skill:"));
  sh.classList.remove("hide");
  sh.innerHTML = `
    <button class="btn ghost close" id="close">Close</button>
    <h2>${esc(base(n.id))}</h2>
    <div class="path">${esc(n.id)}</div>
    ${n.doc ? `<p class="doc">${esc(n.doc)}</p>` : ""}
    <div class="kv">
      <div><span>Layer</span><b style="color:var(${LAYER_VAR[n.layer]})">${esc(n.layer)}</b></div>
      <div><span>Loads</span><b>${esc(n.bundle)}</b></div>
      <div><span>Tag order</span><b>${n.order ?? "—"}</b></div>
      <div><span>Lines</span><b>${n.lines.toLocaleString()}</b></div>
      <div><span>30-day commits</span><b>${n.churn}</b></div>
      <div><span>Called by</span><b>${n.callsIn} files</b></div>
      <div><span>Calls</span><b>${n.callsOut} files</b></div>
      <div><span>Tests</span><b>${n.tests.length}</b></div>
    </div>
    <div>${skills.map((s) => `<span class="pill skill" title="${esc(skillDesc.get(s) || "")}">skill ${esc(s)}</span>`).join("")}${other.map((o) => `<span class="pill">${esc(o)}</span>`).join("")}${n.groups.map((g) => `<span class="pill">CI ${esc(g)}</span>`).join("")}</div>
    ${skills.length ? `<p class="hint">${skills.map((s) => `<b>${esc(s)}</b>: ${esc((skillDesc.get(s) || "").split(". Not for")[0])}`).join("<br>")}</p>` : ""}
    <details open><summary>Globals it declares <span class="n">${n.symbols.length}</span></summary>
      ${n.symbols.map((s) => `<div class="row"><span class="p">${esc(s.name)}</span><span class="m">${esc(s.kind)} :${s.line}${s.declaredBy ? ` · ${s.declaredBy} files declare it` : ""}</span></div>
        ${s.members.length ? `<div class="mems">${esc(s.members.join("  "))}</div>` : ""}`).join("") || `<p class="hint">No top-level global.</p>`}
    </details>
    <details ${callers.length < 25 ? "open" : ""}><summary><i class="key" style="background:var(--caller)"></i>Called by <span class="n">${callers.length}</span></summary>${rowList(callers, via)}</details>
    <details ${callees.length < 25 ? "open" : ""}><summary><i class="key" style="background:var(--callee)"></i>Calls <span class="n">${callees.length}</span></summary>${rowList(callees, via)}</details>
    ${n.facade.length ? `<details><summary>Reads the G façade <span class="n">${n.facade.length}</span></summary><div class="mems">${esc(n.facade.join("  "))}</div></details>` : ""}
    <details><summary>Load order <span class="n">${loadsA.get(id).length + loadsB.get(id).length}</span></summary>
      ${loadsA.get(id).length ? `<p class="hint">Must load after:</p>${rowList(loadsA.get(id).map((x) => ({ id: x })), () => "")}` : ""}
      ${loadsB.get(id).length ? `<p class="hint">Must load before:</p>${rowList(loadsB.get(id).map((x) => ({ id: x })), () => "")}` : ""}
      ${loadsA.get(id).length + loadsB.get(id).length ? "" : `<p class="hint">No declared eval-time edge.</p>`}
    </details>
    <details><summary>Tests that load or name it <span class="n">${n.tests.length}</span></summary><ul class="rows">${n.tests.map((t) => `<li><div class="row"><span class="p">${esc(t)}</span></div></li>`).join("") || `<li class="hint">No test names this path.</li>`}</ul></details>
    <div class="pathf"><button class="btn ghost" data-pathfrom="${esc(n.id)}">Path from here</button><button class="btn ghost" data-pathto="${esc(n.id)}">Path to here</button></div>`;
  sh.scrollTop = 0;
}
function intro() {
  const m = MAP.meta;
  return `<h2>How to read the board</h2>
    <p class="doc">Every js module the manifest loads is one tile, grouped by folder. Tile size is lines of code; colour is layer, or a heat measure you pick.
    Tap a tile to see what it declares, who calls it, what it calls, its tests and its owning skill. Blue rings call the selection; orange rings are what it calls.</p>
    <p class="doc"><b>Flows</b> walks the game's main paths step by step (a frame tick, touch steering, race start to results). <b>Path</b> finds the shortest call chain between two modules.</p>
    <div class="kv"><div><span>Modules</span><b>${m.nodes}</b></div><div><span>Call edges</span><b>${MAP.edges.filter((e) => e.type === "calls").length}</b></div>
    <div><span>Façade users</span><b>${MAP.edges.filter((e) => e.type === "facade").length}</b></div><div><span>Load edges</span><b>${MAP.edges.filter((e) => e.type === "loads-before").length}</b></div></div>
    <p class="foot">Built from tools/manifest.cjs at ${esc(m.head)} on ${esc(m.generated.slice(0, 10))} by ${esc(m.generator)}. Symbols: ${esc(m.symbols)}. Churn counts commits since ${esc(m.churnSince)}.</p>`;
}

// ── flows ──
function renderFlows() {
  $("board").innerHTML = `<p class="hint" style="margin-top:0">Tap a step to open its module. Tap a flow's title to light its files on the board.</p><div class="flows">${MAP.flows.map((f) => `
    <div class="flow"><h3><button class="row" style="padding:0;min-height:0;font:inherit" data-flow="${esc(f.id)}">${esc(f.title)}</button></h3><ol>${f.steps.map((s) => `
      <li><button data-go="${esc(s.file)}" data-line="${s.line}"><div class="sym">${esc(s.symbol)}</div><div class="loc">${esc(s.file)}:${s.line}</div><div class="note">${esc(s.note)}</div>${s.stale ? `<div class="stale">stale: ${esc(s.stale)}</div>` : ""}</button></li>`).join("")}</ol></div>`).join("")}</div>`;
}

// ── path finder ──
// Calls are walked both ways (a module reaches another through a common caller such as game.js) and the shared
// utilities everything calls (Log, M4, GameStore …) are never a middle hop, or every path would run through them.
const HUB = 30;
function shortest(a, b, directed) {
  if (!byId.has(a) || !byId.has(b)) return null;
  const prev = new Map([[a, null]]), qq = [a];
  const hop = (x, y, e, dir) => { if (prev.has(y)) return; if (y !== b && byId.get(y).callsIn >= HUB && y !== "js/game.js") return; prev.set(y, { e, dir, from: x }); qq.push(y); };
  while (qq.length) { const x = qq.shift(); if (x === b) break;
    for (const e of out.get(x)) if (e.type === "calls") hop(x, e.to, e, "→");
    if (!directed) for (const e of inn.get(x)) if (e.type === "calls") hop(x, e.from, e, "←"); }
  if (!prev.has(b)) return null;
  const chain = []; for (let x = b; x !== a; x = prev.get(x).from) chain.unshift({ ...prev.get(x), to: x }); return chain;
}
function resolveFile(s) { s = s.trim(); if (byId.has(s)) return s; const hit = symIndex.find((x) => x.key === s) || nodes.find((n) => n.id.endsWith("/" + s) || base(n.id) === s); return hit ? (hit.file || hit.id) : null; }
function renderPath(from = store.get("pfrom", "js/input/input.js"), to = store.get("pto", "js/ui/hud.js")) {
  $("board").innerHTML = `<p class="hint" style="margin-top:0">The shortest route between two modules. → means the left module calls the right one, ← means the right one calls the left. Each hop names the global used. Type a path, a file name or a global.</p>
    <div class="pathf"><input id="pfrom" value="${esc(from)}" aria-label="From module"><span>→</span><input id="pto" value="${esc(to)}" aria-label="To module"><button class="btn" id="pgo">Find</button><button class="btn ghost" id="pswap">Swap</button><label class="hint"><input type="checkbox" id="pdir"> calls only (→)</label></div>
    <div id="pout"></div>`;
  const go = () => {
    const a = resolveFile($("pfrom").value), b = resolveFile($("pto").value); store.set("pfrom", $("pfrom").value); store.set("pto", $("pto").value);
    if (!a || !b) { $("pout").innerHTML = `<p class="hint">No module matches ${!a ? `“${esc($("pfrom").value)}”` : `“${esc($("pto").value)}”`}. Try a path such as js/track/tracks.js or a global such as Tracks.</p>`; return; }
    const c = shortest(a, b, $("pdir").checked);
    if (!c) { $("pout").innerHTML = `<p class="hint">${esc(a)} does not reach ${esc(b)} through script globals without passing a shared utility. The link may run through the G façade or a create(G) callback instead.</p>`; return; }
    st.flow = [a, ...c.map((e) => e.to)];
    $("pout").innerHTML = `<div class="chain"><button data-go="${esc(a)}">${esc(a)}</button>${c.map((h) => `<span class="via">${h.dir} ${esc(h.e.symbol)}${h.e.members.length ? "." + esc(h.e.members.slice(0, 3).join("|")) : ""} ${h.dir}</span><button data-go="${esc(h.to)}">${esc(h.to)}</button>`).join("")}</div>
      <p class="hint">${c.length} hop${c.length === 1 ? "" : "s"}. Switch to Board to see the chain lit.</p>`;
  };
  $("pgo").onclick = go; $("pdir").onchange = go; $("pswap").onclick = () => { const t = $("pfrom").value; $("pfrom").value = $("pto").value; $("pto").value = t; go(); };
  go();
}

// ── search ──
let hits = [], hi = -1;
function search(s) {
  s = s.trim().toLowerCase(); if (s.length < 2) return [];
  const files = nodes.filter((n) => n.id.toLowerCase().includes(s)).slice(0, 12).map((n) => ({ kind: "file", label: n.id, file: n.id, sub: n.doc }));
  const syms = symIndex.filter((x) => x.key.toLowerCase().includes(s)).sort((a, b) => a.key.length - b.key.length).slice(0, 20)
    .map((x) => ({ kind: x.kind === "member" ? "member" : "global", label: x.key, file: x.file, sub: `${x.file}:${x.line} · used in ${usedIn(x.key).length} files` }));
  return [...syms.filter((x) => x.label.toLowerCase() === s), ...files, ...syms.filter((x) => x.label.toLowerCase() !== s)].slice(0, 28);
}
function usedIn(key) { const [g, m] = key.split("."); const r = new Set();
  for (const e of MAP.edges) if (e.type === "calls" && e.symbol === g && (!m || e.members.includes(m))) r.add(e.from); return [...r]; }
function showResults() {
  const box = $("results");
  if (!hits.length) { box.hidden = true; return; }
  box.innerHTML = hits.map((h, i) => `<button role="option" class="${i === hi ? "on" : ""}" data-hit="${i}"><div class="k">${h.kind}</div><div class="p" style="font:12.5px var(--f-mono);word-break:break-all">${esc(h.label)}</div>${h.sub ? `<div class="m" style="font-size:11.5px;color:var(--muted)">${esc(String(h.sub).slice(0, 120))}</div>` : ""}</button>`).join("");
  box.hidden = false;
}
function pickHit(h) {
  $("results").hidden = true;
  if (h.kind === "member" || h.kind === "global") {
    const users = usedIn(h.label);
    select(h.file);
    const sh = $("sheet");
    sh.insertAdjacentHTML("afterbegin", `<details open><summary>Where ${esc(h.label)} is used <span class="n">${users.length} files</span></summary>${rowList(users.sort().map((x) => ({ id: x })), () => "")}</details>`);
    st.flow = [h.file, ...users]; paintSelection();
  } else select(h.file);
}

// ── wiring ──
function select(id) { st.sel = id; if (st.tab === "board") paintSelection(); renderSheet(id); }
function setTab(t) {
  st.tab = t; save();
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.id === "tab-" + t));
  if (t === "board") renderBoard(); else if (t === "flows") renderFlows(); else renderPath();
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-id],[data-go],[data-layer],[data-hit],[data-flow],[data-pathfrom],[data-pathto],#close,.tab");
  if (!t) { if (!ev.target.closest(".search")) $("results").hidden = true; return; }
  if (t.classList.contains("tab")) return setTab(t.id.slice(4));
  if (t.id === "close") { $("sheet").classList.add("hide"); return; }
  if (t.dataset.id) return select(t.dataset.id);
  if (t.dataset.go) { if (byId.has(t.dataset.go)) select(t.dataset.go); return; }
  if (t.dataset.hit) return pickHit(hits[+t.dataset.hit]);
  if (t.dataset.layer) { const l = t.dataset.layer; st.layers.has(l) ? st.layers.delete(l) : st.layers.add(l); if (!st.layers.size) st.layers.add(l); save(); return renderBoard(); }
  if (t.dataset.flow) { const f = MAP.flows.find((x) => x.id === t.dataset.flow); st.flow = [...new Set(f.steps.map((s) => s.file))]; st.sel = null; return setTab("board"); }
  if (t.dataset.pathfrom) { store.set("pfrom", t.dataset.pathfrom); return setTab("path"); }
  if (t.dataset.pathto) { store.set("pto", t.dataset.pathto); return setTab("path"); }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "color") { st.color = ev.target.value; save(); renderBoard(); }
  if (ev.target.id === "bundle") { st.bundle = ev.target.value; renderBoard(); }
});
$("q").addEventListener("input", (e) => { hits = search(e.target.value); hi = -1; showResults(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { hi = Math.min(hits.length - 1, hi + 1); showResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); showResults(); e.preventDefault(); }
  else if (e.key === "Enter" && hits.length) { pickHit(hits[Math.max(0, hi)]); e.target.blur(); }
  else if (e.key === "Escape") { $("results").hidden = true; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { st.flow = null; paintSelection(); } });
const narrow = matchMedia("(max-width: 720px), (orientation: portrait) and (max-width: 900px)");
setTab(st.tab);
if (narrow.matches) { $("sheet").innerHTML = intro(); $("sheet").classList.add("hide"); } else renderSheet(null);
</script>
