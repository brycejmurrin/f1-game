<script>
// ── iOS DOUBLE-TAP / GESTURE ZOOM ────────────────────────────────────────────
// CSS `touch-action: manipulation` plus `maximum-scale=1` is not enough:
// Safari ignores the viewport cap (a11y, since iOS 10), and `pan-y` / `pan-x`
// on scroll panes override the * reset — WebKit still double-tap-zooms those.
// A second tap on the same spot within 350 ms is the zoom gesture; cancel it.
// A second tap on a DIFFERENT control (rapid menu work) is left alone.
// Another finger still down is driving (GAS+steer), not a double-tap.
// iOS GestureEvents are the pinch-page path; the garage car viewer uses
// TouchEvents, so cancelling gesture* does not steal that.
(function () {
  var lastT = 0, lastX = 0, lastY = 0;
  var TAP_MS = 350, TAP_PX2 = 900;
  function kill(e) { e.preventDefault(); }
  document.addEventListener("gesturestart", kill, { capture: true, passive: false });
  document.addEventListener("gesturechange", kill, { capture: true, passive: false });
  document.addEventListener("gestureend", kill, { capture: true, passive: false });
  document.addEventListener("dblclick", kill, { capture: true });
  document.addEventListener("touchend", function (e) {
    if (e.touches && e.touches.length) return;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var now = Date.now();
    var dx = t.clientX - lastX, dy = t.clientY - lastY;
    if (now - lastT <= TAP_MS && dx * dx + dy * dy <= TAP_PX2) kill(e);
    lastT = now; lastX = t.clientX; lastY = t.clientY;
  }, { capture: true, passive: false });
})();
</script>

<script>
(function () {
  try {
    var buildMeta = document.querySelector('meta[name="apex-build"]');
    var loaded = buildMeta ? parseInt(buildMeta.content, 10) : 0;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js" + (loaded ? "?v=" + loaded : "")).catch(function () {});
    }
    if (!loaded) return;
    fetch("version.json?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (!v || !v.build || v.build <= loaded) return;
        var key = "apex26.shellReloadedTo";
        if (sessionStorage.getItem(key) === String(v.build)) return;
        sessionStorage.setItem(key, String(v.build));
        location.replace(location.pathname + "?b=" + v.build + location.hash);
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
