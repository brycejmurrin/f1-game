# Codex CLI project config — loaded only once you mark this project trusted.
# Mirrors the MCP servers in .mcp.json (Claude Code) and .cursor/mcp.json
# (Cursor); tests/unit/agent-config.test.mjs locksteps the three files.
# Codex Desktop currently reads only ~/.codex/config.toml for MCP servers
# (openai/codex#13025): copy these tables there if the CLI's do not appear.
#
# Codex reads AGENTS.md natively (32 KiB cap) and scans .agents/skills/, not
# .claude/skills/ — run `bash tools/env/mirror-skills.sh` after a pull.
#
# Custom agents: .codex/agents/*.toml, generated from .claude/agents/*.md by
# `npm run gen` (tools/gen/gen-codex-agents.mjs). Fleet cap: 3-6 concurrent
# workers (agent-fleet SKILL.md), so at most six threads per session.
# https://learn.chatgpt.com/docs/agent-configuration/subagents (read 2026-10-26)
[agents]
max_concurrent_threads_per_session = 6

[mcp_servers.apex-tools]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "apex-tools", "--", "bash", "tools/mcp/apex-tools-mcp.sh", "serve"]
# apex_verify_change_fast runs the whole fast gate; the default 60 s per-tool
# timeout would abort it.
tool_timeout_sec = 900

[mcp_servers.playwright-official]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "playwright-official", "--", "bash", "tools/mcp/playwright-mcp.sh", "run"]
startup_timeout_sec = 60

[mcp_servers.chrome-devtools]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "chrome-devtools", "--", "bash", "tools/mcp/chrome-devtools-mcp.sh", "run"]
startup_timeout_sec = 60
tool_timeout_sec = 300

[mcp_servers.js-debugger]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "js-debugger", "--", "bash", "tools/mcp/js-debugger-mcp.sh", "serve"]
startup_timeout_sec = 60

[mcp_servers.apex-lsp]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "apex-lsp", "--", "bash", "tools/mcp/lsp-mcp.sh", "serve"]
startup_timeout_sec = 30

# Official @browserstack/mcp-server (pinned in the wrapper). Credentials are
# read from the environment at runtime (BROWSERSTACK_USERNAME /
# BROWSERSTACK_ACCESS_KEY) — never write their values into this file.
[mcp_servers.browserstack]
command = "bash"
args = ["tools/mcp/output-level-mcp.sh", "--server", "browserstack", "--", "bash", "tools/mcp/browserstack-mcp.sh", "run"]
startup_timeout_sec = 60
