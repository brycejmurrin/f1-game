# Project MCP for Codex CLI / IDE. Loaded only when this repo is trusted.
# Keep lockstep with root `.mcp.json` (three servers). Skills live under
# `.agents/skills/` (symlink mirror of `.claude/skills/`). See
# docs/AGENT-SURFACE.md §Bootstrap.

[mcp_servers.apex-tools]
command = "bash"
args = ["tools/mcp/apex-tools-mcp.sh", "serve"]

[mcp_servers.playwright-official]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.79"]

[mcp_servers.chrome-devtools]
command = "bash"
args = ["tools/mcp/chrome-devtools-mcp.sh", "run"]
