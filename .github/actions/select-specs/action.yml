name: select-specs
description: Resolve comparison base (HEAD~1 fallback) and select Playwright specs
runs:
  using: composite
  steps:
    - name: Select specs for this change
      id: sel
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: bash tools/ci/ci-select-specs-step.sh
outputs:
  specs:
    description: space-separated spec paths of the budgeted shard
    value: ${{ steps.sel.outputs.specs }}
  shards:
    description: JSON matrix — the budgeted shard plus one shard per oversize affected spec, each with its derived cap
    value: ${{ steps.sel.outputs.shards }}
  any:
    description: "true when there is at least one shard to run"
    value: ${{ steps.sel.outputs.any }}
