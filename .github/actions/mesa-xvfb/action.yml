name: Mesa llvmpipe + Xvfb
description: >-
  MESA LLVMPIPE, NOT SWIFTSHADER, for the browser gates (2026-09-16). MEASURED
  on the first dispatch (run 35062479811, all four smoke shards green): corner
  approach 17.8 s against a 214 s SwiftShader median, grid start 21.4 s vs
  138, jump() 9.7 s vs 171, DRIVING LINE 18.4 s vs 65 — every non-blank frame
  assertion held. llvmpipe is Mesa's software rasteriser reached through
  ANGLE's GL backend; it needs a display to bind through (Xvfb, started here
  and exported via DISPLAY so the pinned `npm run test:…` line in the calling
  job is unchanged) and the launch flags APEX_GL swaps in playwright.config.js.
  Dead in the dev container (no /dev/dri — docs/notes/CI-RENDERING-PERFORMANCE.md
  §llvmpipe), alive on GitHub's runners. Callers keep the `gl: swiftshader`
  opt-out on their own `if:`; this action has no opinion about it.
runs:
  using: composite
  steps:
    # MIRROR-INDEPENDENT INSTALL (#5519, 2026-11-11). From about 13:50Z a runner
    # apt mirror / DNS outage failed every browser leg here before a spec ran
    # (job 130489678362: three apt attempts, five minutes, a red PR). The
    # install is tools/ci/apt-cached-install.sh: nothing when dpkg already has
    # the packages, the cached .debs offline when it does not, a fast distinct
    # "runner package mirror unreachable" when no apt host resolves, else the
    # bounded apt of 2026-09-30 / 2026-11-10 (caps, one shared 300 s budget,
    # dpkg repair). The .debs apt fetches are saved with actions/cache, keyed on
    # the runner image and this package list; a deploy-branch run's cache is
    # what every PR restores. Passing job 130492997085 measured the image: xvfb
    # and libgl1-mesa-dri ship on it, apt fetched 8 .debs (libegl1, libgles2,
    # mesa-utils and their deps).
    # CONCURRENT SAVES: on a cold key every leg of a run reaches the save step
    # with the same key; the losers' save is a log line, not a step failure.
    # actions/cache@55cc834 (v6.1.0) src/saveImpl.ts catches every save error
    # as `utils.logWarning(...)` and never calls setFailed, and saveOnlyRun
    # logs a -1 cacheId at debug level. The Playwright cache action makes the
    # same many-legs-one-key save on every lockfile bump.
    - id: plan
      shell: bash
      env:
        MESA_PKGS: mesa-utils libgl1-mesa-dri libegl1 libgles2 xvfb
      run: |
        # shellcheck disable=SC2086 # MESA_PKGS is a word list
        bash "$GITHUB_WORKSPACE/tools/ci/apt-cached-install.sh" --label mesa-xvfb --plan $MESA_PKGS
        echo "key=mesa-debs-v1-${ImageOS:-os}-${ImageVersion:-img}-${RUNNER_ARCH}-$(printf '%s' "$MESA_PKGS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - id: restore
      if: steps.plan.outputs.missing != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apex-apt-debs/mesa-xvfb
        key: ${{ steps.plan.outputs.key }}
    - id: install
      if: steps.plan.outputs.missing != ''
      shell: bash
      env:
        MESA_PKGS: mesa-utils libgl1-mesa-dri libegl1 libgles2 xvfb
      run: |
        # shellcheck disable=SC2086 # MESA_PKGS is a word list
        bash "$GITHUB_WORKSPACE/tools/ci/apt-cached-install.sh" --label mesa-xvfb --cache "$HOME/.cache/apex-apt-debs/mesa-xvfb" --budget 300 $MESA_PKGS
    - if: steps.install.outputs.populated == '1' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apex-apt-debs/mesa-xvfb
        key: ${{ steps.plan.outputs.key }}
    - shell: bash
      run: |
        Xvfb :99 -screen 0 1280x800x24 >"$RUNNER_TEMP/apex-xvfb.log" 2>&1 &
        # WAIT FOR THE DISPLAY (2026-10-04): the first Chromium launch raced a
        # server that had not created its socket yet. Xvfb makes
        # /tmp/.X11-unix/X99 once it accepts connections; 5 s, then say so.
        for i in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
        if [ ! -S /tmp/.X11-unix/X99 ]; then
          echo "::error::mesa-xvfb: Xvfb :99 has no socket after 5 s"
          cat "$RUNNER_TEMP/apex-xvfb.log"
          exit 1
        fi
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
