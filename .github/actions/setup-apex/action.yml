name: Set up Apex
description: >-
  Node 22 with npm's cache, then `npm ci`. Every job in ci.yml starts this way;
  one copy here means one place to bump the Node version or the setup-node pin.
  Browser binaries are NOT installed here: only the browser jobs pay for
  Chromium, through ./.github/actions/playwright-chromium.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm
    # `npm ci` installs the playwright PACKAGE (some tool modules require it at
    # import time even when they never launch a browser) but not the browser
    # binaries — those cost ~200 MB and only the browser jobs need them.
    - run: npm ci
      shell: bash
    # The served generated files are gitignored (AGENTS.md rule 11, 2026-10-28;
    # docs/notes/DEPLOY-TIME-GEN-2026-10-28.md): build them before any job serves,
    # tests or stages the checkout. Skipped on a commit older than the tool.
    - run: if [ -f tools/gen/ensure-built.mjs ]; then node tools/gen/ensure-built.mjs; fi
      shell: bash
