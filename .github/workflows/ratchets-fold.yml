name: Ratchets fold

# Sum the tests/data/ratchets.d/ fragments into ratchets.json (#2538).
#
# `ratchets.mjs --update` / `--auto-raise` on a topic branch writes a per-branch
# delta fragment (#2291, #2514); nothing folded them, so they piled up. This
# runs `ratchets.mjs --fold --min-fragments=N` daily (and on dispatch): the
# effective ceilings do not change, only where the number lives moves. Each run
# pushes a NEW branch `bot/ratchets-fold-<run_id>` (plain `git push`; the repo
# pre-push hook blocks history rewrites on an existing ref like the stale
# bot/ratchets-fold) and opens a PR into the deploy branch, never a direct push
# (the deploy branch is protected).
#
# In-flight PRs are not touched: a fold only deletes fragments that are already
# on the deploy branch, and a PR's own new fragment merges beside the folded
# ratchets.json. A run is a no-op while fewer than `min_fragments` exist or
# while an earlier fold PR is still open (any open PR whose head starts with
# bot/ratchets-fold).
#
# DAILY, AND IT STARTS ITS OWN CI (audit 2026-10-26, lane X3). Weekly let the
# fragments pile up between folds, and the fold PR sat with no CI: a PR opened
# with GITHUB_TOKEN creates no `pull_request` run (or one in an approval-required
# state), but `workflow_dispatch` is the documented exception that always
# creates a run ("events triggered by the GITHUB_TOKEN will not create a new
# workflow run ... workflow_dispatch and repository_dispatch events always create
# workflow runs": https://docs.github.com/en/actions/concepts/security/github_token).
# The PR opens with LAND_TOKEN (the token land.yml uses for its PR operations), so
# its own `pull_request` run starts; without LAND_TOKEN the job dispatches ci.yml on
# the per-run fold branch instead (`actions: write`; .github/actions/open-bot-pr).
# Schedules fire late (the measured lag is 3-7 h; "The schedule event can be
# delayed during periods of high loads", https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule),
# so the minute is off the hour and nothing depends on the exact time.
#
# Syntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
# (on.schedule cron is UTC, runs from the default branch; permissions per job).

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      min_fragments:
        description: "Fold only when at least this many fragments exist"
        required: false
        default: "20"

permissions:
  contents: write
  pull-requests: write
  issues: write    # the "fold PR needs a hand" issue when gh pr create is refused

concurrency:
  group: ratchets-fold
  cancel-in-progress: false

jobs:
  fold:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # workflow_dispatch of ci.yml on the fold branch (the fold PR's CI)
    runs-on: ubuntu-latest
    # LAND_TOKEN can be scoped to the deploy branch in this environment; until then the repo secret serves.
    environment:
      name: land
      deployment: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/f1-game-project-26h3ng
          persist-credentials: false   # npm ci runs below: the token goes to the one push in Fold, not .git/config

      # Node 22 + npm ci: ratchets.mjs imports tools/check/check-gctx.mjs, which
      # needs espree (run 39259294196 failed "Cannot find package 'espree'").
      - uses: ./.github/actions/setup-apex

      - name: Skip while a fold PR is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/ratchets-fold"))] | length')"
          echo "open fold PRs: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Fold
        id: fold
        if: steps.open.outputs.n == '0'
        env:
          MIN_FRAGMENTS: ${{ inputs.min_fragments || '20' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$MIN_FRAGMENTS" in ''|*[!0-9]*) echo "::error::min_fragments must be a number"; exit 2 ;; esac
          node tools/check/ratchets.mjs --fold "--min-fragments=$MIN_FRAGMENTS" | tee fold.log
          # The fold moves where numbers live; the check proves none changed.
          if git diff --quiet -- tests/data && [ -z "$(git ls-files --others --exclude-standard tests/data)" ] && [ -z "$(git ls-files --deleted tests/data)" ]; then
            echo "nothing to fold"; exit 0
          fi
          # Its verdict line rides the PR body as Plan evidence (#5520, open-bot-pr `evidence:`).
          node tools/check/ratchets.mjs | tee ratchets.log
          # Regenerate on the folded tree so no generated file drifts (run 39277641065
          # failed on docs/agent-index.json's old ratchetLines copy, dropped 2026-10-26).
          npm run -s gen
          git config user.name "apex-ratchets-bot"
          git config user.email "noreply@anthropic.com"
          FOLD_BRANCH="bot/ratchets-fold-${GITHUB_RUN_ID}"
          git checkout -b "$FOLD_BRANCH"
          git add -A tests/data docs/agent-index.json docs/notes/CEILING-HISTORY.md
          git commit -m "chore(ratchets): fold ratchets.d fragments into ratchets.json

          $(cat fold.log)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$FOLD_BRANCH"
          PR_BODY="Scheduled fold (#2538): $(cat fold.log). Every effective ceiling is unchanged. Opened by .github/workflows/ratchets-fold.yml on branch \`$FOLD_BRANCH\`."
          { echo "branch=$FOLD_BRANCH"; echo "body<<APEX_PR_BODY_EOF"; echo "$PR_BODY"; echo "APEX_PR_BODY_EOF"
            echo "evidence<<APEX_PR_BODY_EOF"; echo "\`node tools/check/ratchets.mjs\` on the folded tree: $(tail -n 1 ratchets.log)"; echo "APEX_PR_BODY_EOF"; } >> "$GITHUB_OUTPUT"

      # The PR opens with LAND_TOKEN, the token land.yml uses for its PR operations: this repository does not let
      # the default token create PRs (issue #5177). Without LAND_TOKEN the default token tries, and a refusal
      # fails the job and opens (or, after a day, re-pings) one issue: .github/actions/open-bot-pr.
      - name: Open the PR
        if: steps.fold.outputs.branch != ''
        uses: ./.github/actions/open-bot-pr
        with:
          branch: ${{ steps.fold.outputs.branch }}
          title: "chore(ratchets): fold ratchets.d fragments"
          body: ${{ steps.fold.outputs.body }}
          evidence: ${{ steps.fold.outputs.evidence }}
          issue-title: "fold PR needs a hand (bot/ratchets-fold)"
          what: ratchets fold
          pr-token: ${{ secrets.LAND_TOKEN }}
          github-token: ${{ github.token }}
