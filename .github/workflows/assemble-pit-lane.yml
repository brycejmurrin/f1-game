name: assemble-pit-lane
on:
  workflow_dispatch:
  push:
    branches: [pit-lane-ribbon-boxes]
    paths:
      - ".github/workflows/assemble-pit-lane.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore mesh.js and drop garage boxes
        run: |
          set -euo pipefail
          git show a251b02098f3113b19026ba76545008f099a7ec1:js/track/core/mesh.js > js/track/core/mesh.js
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('js/track/core/mesh.js')
          t = p.read_text()
          t2, n = re.subn(
              r'  function buildPitGarages\(track, out\) \{.*?\n  \}\n\n  // buildKerbs',
              '  function buildPitGarages(track, out) {\n    return out;\n  }\n\n  // buildKerbs',
              t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'garage patch count={n}')
          if 'TrackGeom.addBox(out, c, [6.4' in t2:
              raise SystemExit('garage addBox still present')
          p.write_text(t2)
          tp = Path('js/track/tracks.js')
          tt = tp.read_text()
          needle = '      if (track.pitLane && TrackMesh.buildPitGarages) TrackMesh.buildPitGarages(track, _props.out);\n'
          tp.write_text(tt.replace(needle, ''))
          print('mesh', p.stat().st_size)
          PY
      - name: Commit restored engine files
        run: |
          git config user.name "pit-lane-assemble"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/track/core/mesh.js js/track/tracks.js
          if git diff --staged --quiet; then
            echo no change
            exit 0
          fi
          git commit -m "fix(pits): restore mesh.js, drop clipping garage boxes"
          git push
