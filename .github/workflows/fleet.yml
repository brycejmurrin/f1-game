name: Fleet board

# The backlog's phone view (tools/ci/fleet-board.mjs): syncs .github/labels.json,
# keeps the `claimed` label derived from the claims board and open PR bodies
# (`Closes #n`), rewrites the pinned "Fleet board" issue, and mirrors `to:#<PR>`
# fleet-bus lines as PR comments (tools/ci/fleet-bus-mirror.mjs). The `tick` job is the
# fleet watch (tools/ci/fleet-tick.mjs): changed PR/ship/Pages rows in the run summary and
# a `fleet-board` artifact.
# Why: docs/notes/AGENT-WORK-TRACKING-2026-10-14.md.
#
# Hourly at :23 (audit4 D1 / audit3 F5, 2026-10-26: the 30-minute :23,:53 cron
# delivered 42 of 336 expected runs in 7 d, 12.5 %, while dispatches brought
# ~132 runs a day; GitHub drops and delays schedules under load, so the
# sub-hourly cron bought nothing but a promise it did not keep. Dispatch after
# every board or bus write is the real cadence; the cron is the backstop.
# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule),
# and on workflow_dispatch, which `who-is-on-it.mjs --claim/--release` sends after
# every board write. NOT `push: [claude/claims-board]`: GitHub runs a
# push-triggered workflow from the pushed commit's tree, and the board's tree has
# no .github/ — that trigger never fired (live test, 2026-10-14). No pull_request
# trigger on purpose: a check on every PR head would join ci-watch's per-sha
# verdict for no gain; a closed PR releases its issue within the hour.
# Edits made with GITHUB_TOKEN start no workflow runs, so the board cannot loop.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Per-job permissions: the board job writes issues, the tick job only reads
# (zizmor excessive-permissions: a write grant stays off the workflow level once
# there are two jobs; https://docs.zizmor.sh/audits/#excessive-permissions).
permissions: {}

# One fleet-board run at a time (cancel-in-progress: false). who-is-on-it.mjs
# skips workflow_dispatch while a run is already queued, so claim bursts do not
# stack dispatches on the same sha.
concurrency:
  group: fleet-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests: write is for the "Bus to PR comments" step: POST issues/<n>/comments on a PR
    # number returned 403 "Resource not accessible by integration" with only issues: write
    # (run 39350106641; the endpoint is listed under both Issues and Pull requests write:
    # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps, read 2026-10-20).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # fetch-only job; the repo is public
          ref: claude/f1-game-project-26h3ng   # a push to the claims board checks out a tree with no tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Claims board
        run: git fetch --depth=1 origin "claude/claims-board:refs/remotes/origin/claude/claims-board" || echo "no claims board yet"
      - name: Board, labels, claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/fleet-board.mjs --apply
      # Bus -> PR comments (tools/ci/fleet-bus-mirror.mjs; docs/plans/2026-10-19-fleet-redesign.md §7 item 2):
      # each `to:#<PR>` line on claude/fleet-bus becomes one comment on that open PR, which wakes its owner on
      # any host. Idempotent (a mirrored sha is skipped), so the hourly schedule and the dispatch that
      # `fleet-bus.mjs send --to '#<n>'` sends never double-post. PR conversation comments are issue comments,
      # so `issues: write` above covers them:
      # https://docs.github.com/en/rest/issues/comments#create-an-issue-comment ("Issues" write in
      # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps, read 2026-10-19).
      - name: Fleet bus
        if: ${{ !cancelled() }}   # a failed board step must not hold the bus lines back
        run: git fetch --no-tags --depth=500 origin "+refs/heads/claude/fleet-bus:refs/remotes/origin/claude/fleet-bus" || echo "no fleet bus yet"
      - name: Bus to PR comments
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/fleet-bus-mirror.mjs --no-fetch

  # THE FLEET WATCH AS A JOB, NOT A SESSION (docs/plans/2026-10-19-fleet-redesign.md §4B item 6): one
  # tools/ci/fleet-tick.mjs tick per run — pr-board.mjs --json (needs-sync per SYNC/FIX row) plus ci-watch.mjs
  # --once on the deploy tip and --pages --once — diffed against the previous run's state. It runs on the
  # Actions token (GH_TOKEN below), so the cloud proxy's 403 on session-side API reads does not apply. The
  # session-side watcher only reads sessions/cost (fleet-flags.mjs on a saved list_sessions page) and posts
  # flags: .claude/skills/agent-fleet/references/role-fleet-watch.md.
  # Read-only job, its own permissions (GET only; the board job above keeps issues: write):
  #   actions: read  workflow runs + jobs (ci-watch, needs-sync), checks: read  check-runs (ready-gate's
  #   guards verdict), pull-requests/issues: read  PR list, comments, issue events, contents: read  checkout.
  #   https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps (read 2026-10-19).
  # Advisory: every tick step is continue-on-error with a ::warning::, so a tick failure never reds the run
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepscontinue-on-error).
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      # needs-sync.mjs runs `git merge-base` / `git merge-tree` against each SYNC/FIX branch, which a depth-1
      # clone cannot answer; full history without blobs is the same trade ci.yml makes
      # (https://github.com/actions/checkout#usage, `filter`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # fetch-only; the repo is public
          ref: claude/f1-game-project-26h3ng
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # STATE ACROSS RUNS: caches are immutable, so each run saves under a run-unique key and the next restores
      # the newest one by prefix ("If there are multiple partial matches for a restore key, the action returns
      # the most recently created cache"). Schedule runs use the default branch and who-is-on-it dispatches on
      # it too (same branch = same cache scope); entries unused for 7 days are evicted, and a state file is a
      # few KB. https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching and
      # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache (read 2026-10-19).
      # A miss is a first tick: fleet-tick reports everything once as the baseline.
      - name: Restore previous tick state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/fleet-watch/state.json
          key: fleet-tick-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fleet-tick-
      - name: Fleet tick
        id: tick
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/fleet-watch
          node tools/ci/fleet-tick.mjs --state artifacts/fleet-watch/state.json --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee artifacts/fleet-watch/tick.log
          exit "${PIPESTATUS[0]}"
      - name: Tick failure is a warning, not a red
        if: ${{ steps.tick.outcome == 'failure' }}
        run: |
          echo "::warning title=fleet-tick::fleet-tick.mjs failed; see the Fleet tick step log (state not advanced)"
          echo "fleet-tick failed this run; state not advanced. See the Fleet tick step log." >> "$GITHUB_STEP_SUMMARY"
      - name: Save tick state
        if: ${{ steps.tick.outcome == 'success' && hashFiles('artifacts/fleet-watch/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/fleet-watch/state.json
          key: fleet-tick-${{ github.run_id }}-${{ github.run_attempt }}
      # The board artifact: this tick's state (every open PR's compact row, ship, Pages) and its printed lines.
      # Short retention: the next tick supersedes it. https://github.com/actions/upload-artifact (retention-days).
      - name: Upload fleet board
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-board
          path: artifacts/fleet-watch/
          retention-days: 2
          if-no-files-found: warn
