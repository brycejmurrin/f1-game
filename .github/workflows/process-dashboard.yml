name: Process dashboard

# NIGHTLY PROCESS DASHBOARD (docs/plans/research-2026-09-16/measurement.md §1).
# Writes per-job p50/p90, cancel rate, same-SHA re-gate count and push-to-live
# for the last 60 completed ci.yml runs, plus pages.yml on the deploy branch.
# The JSON and its markdown twin land on `metrics`, which agents read with
#   git fetch origin metrics && git show origin/metrics:process-dashboard.json
# They never land on claude/f1-game-project-26h3ng: a bot commit on the deploy
# branch would ship the site and fight the review rule.
#
# TIME RATCHETS run in this job only (measurement.md §5). tools/ci/process-dashboard.mjs
# --check reads the JSON it just wrote. It does not re-run the suites. A thin
# sample (n < n_min) is skipped, not failed. test:guards never calls --check.
# ADVISORY since the 2026-10-26 audit (lane X3): the check was red 3 of 7 nights
# and nobody read it, and a red here blocked nothing but its own record. It is now
# continue-on-error with a ::warning:: and a summary line, so the metrics branch is
# still written on a breach night and the breach is visible in the run summary.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepscontinue-on-error
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: process-dashboard${{ vars.ACTIONS_COORDINATOR_MODE == 'active' && github.run_id || '' }}
  cancel-in-progress: ${{ (vars.ACTIONS_COORDINATOR_MODE != 'active' && vars.ACTIONS_COORDINATOR_MODE != 'paused') && (false) }}

env:
  METRICS_BRANCH: metrics

jobs:
  publish:
    permissions:
      contents: write
      actions: read
    if: ${{ (vars.ACTIONS_COORDINATOR_MODE != 'active' && vars.ACTIONS_COORDINATOR_MODE != 'paused') }}
    name: Publish process-dashboard.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1   # zizmor: ignore[artipacked] this job pushes the metrics branch with the persisted checkout credentials
        with:
          ref: claude/f1-game-project-26h3ng
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Reduce the last 60 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node tools/ci/process-dashboard.mjs --runs 60 \
            --out "$RUNNER_TEMP/process-dashboard.json" \
            --md "$RUNNER_TEMP/process-dashboard.md" \
            --baseline
          cat "$RUNNER_TEMP/process-dashboard.md" >> "$GITHUB_STEP_SUMMARY"

      # BEFORE the metrics checkout: that checkout replaces this tree, and the
      # tool's imports live on the deploy branch, not on `metrics`.
      - name: Time ratchets (this job only; advisory)
        id: ratchets
        continue-on-error: true
        run: node tools/ci/process-dashboard.mjs --check "$RUNNER_TEMP/process-dashboard.json"

      - name: Time-ratchet breach is a warning, not a red
        if: ${{ steps.ratchets.outcome == 'failure' }}
        run: |
          echo "::warning title=time ratchets::process-dashboard.mjs --check found a breach; see the Time ratchets step log"
          echo "**Time ratchets: breach (advisory)** — see the Time ratchets step log." >> "$GITHUB_STEP_SUMMARY"

      - name: Push the record to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$METRICS_BRANCH" in
            claude/f1-game-project-26h3ng|""|*[!a-z0-9._/-]*)
              echo "::error::unsafe metrics branch"; exit 2 ;;
          esac
          cp "$RUNNER_TEMP/process-dashboard.json" /tmp/process-dashboard.json
          cp "$RUNNER_TEMP/process-dashboard.md" /tmp/process-dashboard.md
          git config user.name "apex-metrics-bot"
          git config user.email "noreply@users.noreply.github.com"
          if git fetch -q origin "$METRICS_BRANCH" 2>/dev/null; then
            git checkout -B "$METRICS_BRANCH" "origin/$METRICS_BRANCH"
          else
            git checkout --orphan "$METRICS_BRANCH"
            git rm -rfq . >/dev/null 2>&1 || true
          fi
          cp /tmp/process-dashboard.json process-dashboard.json
          cp /tmp/process-dashboard.md process-dashboard.md
          git add process-dashboard.json process-dashboard.md
          if git diff --cached --quiet; then
            echo "metrics already matches this window"
          else
            git commit -m "chore(metrics): process dashboard ${{ github.run_id }}"
            git push origin "HEAD:$METRICS_BRANCH"
          fi
          echo "pushed $METRICS_BRANCH" >> "$GITHUB_STEP_SUMMARY"

  request-admission:
    concurrency:
      group: actions-claim
      queue: max
    name: Record request for bounded Actions admission
    if: ${{ vars.ACTIONS_COORDINATOR_MODE == 'active' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Trusted request adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/f1-game-project-26h3ng
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve the request without starting its expensive work
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_WORKFLOW: process-dashboard.yml
        run: node tools/ci/actions/cli.mjs request --workflow "$REQUEST_WORKFLOW" --event-file "$GITHUB_EVENT_PATH"
