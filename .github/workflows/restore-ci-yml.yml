name: restore-ci-yml
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/f1-game-project-26h3ng
          fetch-depth: 5
      - name: Wire select-specs to HEAD~1 helper
        run: |
          set -eu
          git config user.email "brycejmurrin@users.noreply.github.com"
          git config user.name "Bryce Murrin"
          bash tools/apply-ci-wire.sh
          chmod +x tools/ci-resolve-before.sh tools/ci-select-specs-step.sh tools/apply-ci-wire.sh
          git add .github/workflows/ci.yml tools/ci-resolve-before.sh tools/ci-select-specs-step.sh tools/apply-ci-wire.sh
          if git diff --cached --quiet; then
            echo "already wired; nothing to commit"
            exit 0
          fi
          git commit -m "fix(ci): wire selected-specs to HEAD~1 helper (ci-select-specs-step.sh)"
          git push origin HEAD:claude/f1-game-project-26h3ng
