name: Land

# GITHUB LANDS PRS; AGENTS NEVER MERGE (docs/plans/2026-10-27-orchestration-redesign.md §3 and §4.3; the worker
# page is docs/WORKERS.md). A worker asks for landing by flipping its PR ready and adding the `land` label. This
# workflow runs `tools/ci/merge-gate.mjs --pr <n> --check`, posts the verdict as the check run `gate`, and on a pass
# calls `gh pr merge --auto --merge --match-head-commit <gated head>` for ONE PR. That call MERGES AT ONCE when the
# PR is already mergeable (CLEAN / UNSTABLE / HAS_HOOKS: cli/cli pkg/cmd/pr/merge/merge.go, `autoMerge =
# AutoMergeEnable && !isImmediatelyMergeable(...)`); only a PR GitHub still reports BLOCKED gets a real auto-merge.
# Since `arm` runs after `CI` and `gate` are green, assume it merges: every veto is re-read right before the call.
#
# JOBS AND TRUST. resolve (read-only, seconds, no checkout) decides which PRs this event concerns. land-gate (one
# matrix leg per PR, a fresh runner each, token READ-ONLY: contents/pull-requests/checks read) checks out the deploy
# branch and runs merge-gate, which executes the merge result's own scripts (gen:check, the ratchet tests); its
# verdict leaves the leg only as an artifact. post (checks: write, NO checkout, no repo code: gh and jq only) writes
# `gate`, re-reading the head, the labels and the Actions-app `CI` check itself before it posts a pass. arm
# (contents/pull-requests write, no checkout) re-reads every veto and the deploy tip, then arms.
#
# TRIGGERS. `pull_request` carries the draft flag and labels, so a land/hold label flip, a ready or draft flip, a push
# or a reopen re-evaluates at once. Re-evaluation after CI finishes is `workflow_run`, not `check_suite`: "To prevent
# recursive workflows, [check_suite] does not trigger workflows if the check suite was created by GitHub Actions"
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#check_suite, read
# 2026-10-27). A CI run that ends red re-gates too, so a `gate` posted while CI ran never stays in_progress. A Pages
# train finishing re-gates the open `land` PRs because the deploy tip moved (the gen, ratchets and distance rows are
# measured against the tip); it arms at most one of them (`priority` first, then oldest), and the next train arms the
# next. Both `workflow_run` and `check_suite` "only trigger a workflow run if the workflow file exists on the default
# branch" (the deploy branch). Their `pull_requests` arrays are the Pull Request Minimal shape (empty for forks,
# https://docs.github.com/en/rest/checks/suites), so `resolve` reads each PR's state itself.
#
# NOISE. Job-level `if:` on `resolve` (no runner at all): a label other than `land`/`hold`, an event on a PR without
# `land`, a ci.yml `CI ignored: …` run (label/edit noise; ci.yml run-name) and a cancelled or skipped run exit at once.
#
# THE CHECK NAMED `gate`. Exactly ONE check run named `gate` per PR head, written through the Checks API
# (https://docs.github.com/en/rest/checks/runs; `checks: write`), tagged `external_id: land-gate`, and updated in
# place. No job is named `gate` (a skipped or red job named `gate` would be a second `gate` check: #3902,
# 2026-10-27). Its `output.text` carries `evaluated-at: <time resolve read the PR>`; a write whose evaluation is
# OLDER than the stored one is dropped, so a slow stale run never replaces a newer verdict.
#   merge-gate exit 0 → completed/success (in_progress "paused" while `dispatch:merge-pause` is set on Dispatch)
#   exit 3 (CI still running) → in_progress    exit 2 → completed/failure    exit 1 or no verdict → in_progress
#   "error, will retry" (an API or git hiccup is not a refusal)    `hold`, `land` removed, back to draft →
#   completed/failure "not asked", and an armed auto-merge is disabled.
#
# MERGE-PAUSE. `dispatch:merge-pause` on the open issue titled `Dispatch` arms nothing and disarms what this event
# touches. Removing the label re-gates nothing by itself: the next push, label flip, CI or train run does.
#
# TOKEN. "events triggered by the GITHUB_TOKEN will not create a new workflow run"
# (https://docs.github.com/en/actions/concepts/security/github_token), so a merge made with it starts no pages.yml
# train. `LAND_TOKEN` (fine-grained PAT or GitHub App token: contents, pull requests and workflows write on this
# repository) arms when set; the fallback to `GITHUB_TOKEN` still lands the PR but warns, and the 6-hourly Pages cron
# (or a manual dispatch) ships it.

on:
  pull_request:
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, synchronize, reopened]
    branches: [claude/f1-game-project-26h3ng]
  check_suite:
    types: [completed]
  # workflow_run re-gates after ci.yml (check_suite skips Actions-made suites, see the header). No job checks out
  # the PR: land-gate checks out the deploy branch with a read-only token, merge-gate runs the merge result's scripts
  # under untrustedEnv, and the jobs that write (post, arm) run no repo code.
  workflow_run:   # zizmor: ignore[dangerous-triggers] see the three lines above: no PR checkout, PR scripts get no write token
    workflows: ["CI", "Deploy to GitHub Pages"]
    types: [completed]

env:
  DEPLOY_BRANCH: claude/f1-game-project-26h3ng

# ONE group per PR for every event type (a CI or check-suite run on a PR head carries the PR number; the train and
# fork runs share `land-tip`). A pull_request event (label, draft flip, push) cancels the PR's in-flight evaluation, so
# a `hold` stops a gate already running; a CI or train re-gate never cancels, it queues. The train run and a PR run
# can still overlap: `evaluated-at` and arm's re-read of every veto cover that.
concurrency:
  group: land-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || 'tip' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Which PRs does this event concern, and are they asking to land? Seconds, no checkout.
  resolve:
    name: resolve
    if: >-
      (github.event_name == 'pull_request' && (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name == 'land' || github.event.label.name == 'hold'))
        || github.event.action == 'converted_to_draft'
        || (github.event.action != 'labeled' && github.event.action != 'unlabeled' && contains(github.event.pull_request.labels.*.name, 'land'))))
      || (github.event_name == 'workflow_run' && !startsWith(github.event.workflow_run.display_title, 'CI ignored')
        && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped')
      || (github.event_name == 'check_suite' && github.event.check_suite.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      issues: read
    outputs:
      landable: ${{ steps.pick.outputs.landable }}
      prs: ${{ steps.pick.outputs.prs }}
      notasked: ${{ steps.pick.outputs.notasked }}
      disarm: ${{ steps.pick.outputs.disarm }}
      paused: ${{ steps.pick.outputs.paused }}
      at: ${{ steps.pick.outputs.at }}
    steps:
      - name: Resolve the PRs and their state
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || github.event.check_suite.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.check_suite.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
          CANDIDATES: ${{ toJSON(github.event.workflow_run.pull_requests || github.event.check_suite.pull_requests) }}
        run: |
          set -euo pipefail
          # Every verdict this run writes is stamped with the moment the PR state was read (see `evaluated-at`).
          at=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          paused=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
            --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not))] | length > 0')
          numbers=()
          if [ "$EVENT" = pull_request ]; then
            numbers=("$PR_NUMBER")
          elif [ "$RUN_BRANCH" = "$DEPLOY_BRANCH" ] && [ "$RUN_REPO" = "$GITHUB_REPOSITORY" ]; then
            if [ "$RUN_CONCLUSION" = success ]; then
              # The train (or the tip's own suite) finished: the tip moved, so every open `land` PR is re-gated.
              mapfile -t numbers < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$DEPLOY_BRANCH" --label land --limit 50 --json number --jq '.[].number')
            else
              echo "::notice::deploy-branch $EVENT concluded '$RUN_CONCLUSION' — nothing to re-gate"
            fi
          else
            # A PR's CI finished, green or red: re-gate it so a `gate` posted while CI ran is settled either way.
            mapfile -t numbers < <(jq -r --arg base "$DEPLOY_BRANCH" '(. // [])[] | select(.base.ref == $base) | .number' <<<"$CANDIDATES")
            if [ "${#numbers[@]}" -eq 0 ] && [ -n "$RUN_SHA" ]; then
              mapfile -t numbers < <(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/pulls" --jq ".[] | select(.base.ref == \"$DEPLOY_BRANCH\") | .number")
            fi
          fi
          rows='[]'
          notasked='[]'
          disarm='[]'
          for n in "${numbers[@]}"; do
            [ -n "$n" ] || continue
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n")
            state=$(jq -r .state <<<"$pr"); draft=$(jq -r .draft <<<"$pr"); base=$(jq -r .base.ref <<<"$pr")
            head=$(jq -r .head.sha <<<"$pr"); armed=$(jq -r '.auto_merge != null' <<<"$pr")
            created=$(jq -r .created_at <<<"$pr")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")
            has() { [[ " $labels " == *" $1 "* ]]; }
            echo "PR #$n: state=$state draft=$draft base=$base head=${head:0:12} armed=$armed labels=[$labels]"
            if [ "$state" != open ] || [ "$base" != "$DEPLOY_BRANCH" ]; then continue; fi
            why=""
            if has hold; then why="the \`hold\` label is set"
            elif [ "$draft" = true ]; then why="the PR is a draft"
            elif ! has land; then why="no \`land\` label"
            fi
            if [ -z "$why" ]; then
              prio=1; has priority && prio=0
              rows=$(jq -c --argjson n "$n" --arg h "$head" --argjson p "$prio" --arg c "$created" '. + [{number: $n, head: $h, prio: $p, created: $c}]' <<<"$rows")
              if [ "$paused" = true ] && [ "$armed" = true ]; then disarm=$(jq -c --argjson n "$n" '. + [$n]' <<<"$disarm"); fi
            else
              notasked=$(jq -c --argjson n "$n" --arg h "$head" --arg w "$why" '. + [{number: $n, head: $h, why: $w}]' <<<"$notasked")
              if [ "$armed" = true ]; then disarm=$(jq -c --argjson n "$n" '. + [$n]' <<<"$disarm"); fi
            fi
          done
          # `priority` first, then oldest; at most 4 gates per run (the rest wait for the next train).
          prs=$(jq -c 'sort_by(.prio, .created, .number) | .[:4] | map({number, head})' <<<"$rows")
          landable=false; [ "$prs" != '[]' ] && landable=true
          {
            echo "landable=$landable"
            echo "prs=$prs"
            echo "notasked=$notasked"
            echo "disarm=$disarm"
            echo "paused=$paused"
            echo "at=$at"
          } >> "$GITHUB_OUTPUT"
          echo "landable=$landable prs=$prs notasked=$notasked disarm=$disarm paused=$paused at=$at"

  # THE GATE: merge-gate.mjs --check, one fresh runner per PR. The merge result's own scripts run here, so the token
  # is read-only and the verdict leaves only as an artifact that `post` cross-checks. No receipt, no bus.
  land-gate:
    name: land-gate (#${{ matrix.pr.number }})
    needs: resolve
    if: needs.resolve.outputs.landable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: merge-gate --check
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head }}
        run: |
          set -uo pipefail
          mkdir -p verdict
          # Actions runs `bash -e`: a bare `out=$(…); code=$?` aborts on a refused/waiting gate (exit 2/3) before the verdict is written.
          code=0; out=$(node tools/ci/merge-gate.mjs --pr "$N" --sha "$HEAD_SHA" --check 2>&1) || code=$?
          echo "$out"
          line=$(grep -E '^= merge-gate ' <<<"$out" | tail -n 1)
          tip=$(sed -n 's/.* tip=\([0-9a-f]*\).*/\1/p' <<<"$line")
          jq -n --argjson n "$N" --arg h "$HEAD_SHA" --argjson code "$code" --arg line "$line" --arg tip "$tip" \
            --arg out "$(tail -c 60000 <<<"$out")" '{number: $n, head: $h, code: $code, line: $line, tip: $tip, out: $out}' > "verdict/$N.json"
          # shellcheck disable=SC2016 # the backticks are Markdown for the job summary, not a command substitution
          printf '### gate PR #%s\n\n`%s`\n\n```\n%s\n```\n' "$N" "${line:-= merge-gate exit $code}" "$out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: land-verdict-${{ matrix.pr.number }}
          path: verdict/
          retention-days: 1
          if-no-files-found: ignore

  # POST: the only job that writes `gate`. No checkout and no repo code. Also turns `gate` red for a PR that no longer
  # asks to land, disarms, and picks the ONE PR `arm` may merge.
  post:
    name: post
    needs: [resolve, land-gate]
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && (needs.resolve.outputs.landable == 'true' || needs.resolve.outputs.notasked != '[]' || needs.resolve.outputs.disarm != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: write
      pull-requests: write
      actions: read
    outputs:
      arm: ${{ steps.post.outputs.arm }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.resolve.outputs.landable == 'true'
        continue-on-error: true
        with:
          pattern: land-verdict-*
          path: verdicts
          merge-multiple: true
      - name: Post `gate`, disarm, pick one PR to arm
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          DISARM_TOKEN: ${{ secrets.LAND_TOKEN || github.token }}
          PRS: ${{ needs.resolve.outputs.prs }}
          NOTASKED: ${{ needs.resolve.outputs.notasked }}
          DISARM: ${{ needs.resolve.outputs.disarm }}
          PAUSED: ${{ needs.resolve.outputs.paused }}
          AT: ${{ needs.resolve.outputs.at }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          # write_gate <head> <status> <conclusion|""> <title> <summary>: update the head's land-gate check in place,
          # unless it carries a NEWER evaluated-at than this run's (compare-and-set; ISO-8601 sorts as text).
          write_gate() {
            local head=$1 st=$2 c=$3 title=$4 summary=$5 cur id seen body
            cur=$(gh api "repos/$R/commits/$head/check-runs?check_name=gate&per_page=100" --jq \
              '[.check_runs[] | select(.external_id == "land-gate")] | sort_by(.id) | last
               | if . == null then "" else "\(.id) \(((.output.text // "") | capture("evaluated-at: (?<t>[^ \n]+)") | .t) // "-")" end') || return 1
            id=${cur%% *}; seen=${cur#* }
            if [ -n "$cur" ] && [ "$seen" != "-" ] && [[ "$seen" > "$AT" ]]; then
              echo "gate on ${head:0:12}: kept the newer verdict (evaluated-at $seen > $AT)"; return 0
            fi
            body=$(jq -n --arg h "$head" --arg st "$st" --arg c "$c" --arg t "$title" --arg s "$summary" --arg at "$AT" \
              '{name: "gate", head_sha: $h, external_id: "land-gate", status: $st, output: {title: $t, summary: $s, text: "evaluated-at: \($at)"}}
               + (if $c == "" then {} else {conclusion: $c} end)')
            if [ -n "$cur" ]; then
              gh api --method PATCH "repos/$R/check-runs/$id" --input - --jq '.html_url' <<<"$body"
            else
              gh api --method POST "repos/$R/check-runs" --input - --jq '.html_url' <<<"$body"
            fi
          }
          # A PR that no longer asks to land: an existing land-gate check turns red ("not asked" is not a pass).
          while IFS= read -r row <&3; do
            n=$(jq -r .number <<<"$row"); head=$(jq -r .head <<<"$row"); why=$(jq -r .why <<<"$row")
            if gh api "repos/$R/commits/$head/check-runs?check_name=gate&per_page=100" --jq '[.check_runs[] | select(.external_id == "land-gate")] | length > 0' | grep -qx true; then
              write_gate "$head" completed failure "= merge-gate not asked — $why" "PR #$n does not ask to land: $why." || echo "::warning::PR #$n: could not update gate"
            fi
          done 3< <(jq -c '.[]' <<<"$NOTASKED")
          for n in $(jq -r '.[]' <<<"$DISARM"); do
            if GH_TOKEN="$DISARM_TOKEN" gh pr merge "$n" --repo "$R" --disable-auto; then
              echo "disarmed #$n" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::PR #$n: --disable-auto failed"
            fi
          done
          arm=""
          while IFS= read -r row <&3; do
            n=$(jq -r .number <<<"$row"); head=$(jq -r .head <<<"$row"); f="verdicts/$n.json"
            if [ -f "$f" ]; then
              code=$(jq -r .code "$f"); line=$(jq -r .line "$f"); tip=$(jq -r .tip "$f"); out=$(jq -r .out "$f")
              [ "$(jq -r .head "$f")" = "$head" ] || { code=1; line="verdict for another head"; }
            else
              code=1; line=""; tip=""; out="no verdict artifact: the land-gate leg for #$n failed before merge-gate finished"
            fi
            if [ "$code" = 0 ]; then
              # The verdict came from a job that ran PR code: re-read what GitHub itself can say before posting a pass.
              pr=$(gh api "repos/$R/pulls/$n") || pr='{}'
              ci=$(gh api "repos/$R/commits/$head/check-runs?check_name=CI&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last | .conclusion // ""') || ci=""
              if [ "$(jq -r .head.sha <<<"$pr")" != "$head" ] || [ "$(jq -r .draft <<<"$pr")" != false ] || [ "$ci" != success ] \
                 || ! jq -e '[.labels[].name] | index("land") and (index("hold") | not)' <<<"$pr" >/dev/null; then
                echo "::warning::PR #$n: the land-gate verdict disagrees with GitHub now (head, draft, labels or CI=$ci); not posted, the next event re-gates"
                continue
              fi
            fi
            ok=true
            case "$code" in
              0) if [ "$PAUSED" = true ]; then
                   write_gate "$head" in_progress "" "= merge-gate paused — dispatch:merge-pause is set on the Dispatch issue" "$line"$'\n\n'"$out" || ok=false
                 elif write_gate "$head" completed success "$line" "$out"; then
                   # ONE arm per run, in resolve's order: the first pass wins; the merge it makes moves the tip.
                   [ -n "$arm" ] || arm=$(jq -c -n --argjson n "$n" --arg h "$head" --arg t "$tip" '{number: $n, head: $h, tip: $t}')
                 else ok=false
                 fi ;;
              3) write_gate "$head" in_progress "" "$line" "$out" || ok=false ;;
              2) write_gate "$head" completed failure "$line" "$out" || ok=false ;;
              *) echo "::error::PR #$n: merge-gate error (exit $code): ${line:-no verdict}"
                 write_gate "$head" in_progress "" "= merge-gate error, will retry — ${line:-exit $code}" "$out" || ok=false ;;
            esac
            [ "$ok" = true ] || echo "::warning::PR #$n: could not write gate"
          done 3< <(jq -c '.[]' <<<"$PRS")
          echo "arm=$arm" >> "$GITHUB_OUTPUT"
          echo "arm=${arm:-none}"

  # ARM one PR. gh merges at once when the PR is mergeable (see the header), so every veto is re-read first.
  arm:
    name: arm
    needs: post
    if: needs.post.outputs.arm != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Re-check the vetoes and the tip, then arm pinned to the gated head
        env:
          LAND_TOKEN: ${{ secrets.LAND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ARM: ${{ needs.post.outputs.arm }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          n=$(jq -r .number <<<"$ARM"); head=$(jq -r .head <<<"$ARM"); tip=$(jq -r .tip <<<"$ARM")
          paused=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
            --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not))] | length > 0')
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n")
          now=$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEPLOY_BRANCH" --jq .commit.sha)
          skip=""
          [ "$paused" = true ] && skip="dispatch:merge-pause is set"
          [ "$(jq -r .state <<<"$pr")" = open ] || skip="PR is $(jq -r .state <<<"$pr")"
          [ "$(jq -r .draft <<<"$pr")" = false ] || skip="PR is a draft"
          [ "$(jq -r .head.sha <<<"$pr")" = "$head" ] || skip="head moved past ${head:0:12}"
          jq -e '[.labels[].name] | index("land") and (index("hold") | not)' <<<"$pr" >/dev/null || skip="\`land\` gone or \`hold\` set"
          # The gate measured gen:check and the ratchets on a merge onto `tip`; a moved tip is an ungated combination.
          if [ -z "$tip" ] || [ "$now" != "$tip" ]; then skip="deploy tip moved ${tip:0:12} -> ${now:0:12}; the next train re-gates"; fi
          if [ -n "$skip" ]; then
            echo "::notice::not arming #$n: $skip" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          who=GITHUB_TOKEN
          if [ -n "$LAND_TOKEN" ]; then
            export GH_TOKEN="$LAND_TOKEN"; who=LAND_TOKEN
          else
            msg="a merge made by GITHUB_TOKEN will not start pages.yml; set LAND_TOKEN, see docs/WORKERS.md"
            echo "::warning::$msg"
            printf '> **%s**\n\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$head"
          echo "armed (or merged) #$n @ ${head:0:12} onto ${tip:0:12} with $who" | tee -a "$GITHUB_STEP_SUMMARY"
