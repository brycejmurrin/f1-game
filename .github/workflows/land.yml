name: Land
# Dispatch identity is present on the run even when resolve, gate publication or arm never starts.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.stale == 'true' && 'Land stale sweep' ||
       format('Land retry pr={0} head={1} attempt={2}', github.event.inputs.pr, github.event.inputs.head || '-', github.event.inputs.attempt || '0')) || '' }}

# GITHUB LANDS PRS; AGENTS NEVER MERGE (docs/plans/2026-10-27-orchestration-redesign.md §3 and §4.3; the worker's
# side is skill `steward` §Land). A worker asks for landing by flipping its PR ready and adding the `land` label. This
# workflow runs `tools/ci/merge-gate.mjs --pr <n> --check`, posts the verdict as the commit status `gate`, and on a pass
# calls `gh pr merge --auto --merge --match-head-commit <gated head>` for ONE PR when gh still reads BLOCKED.
# gh chooses auto-merge vs merge-now from mergeStateStatus immediately before the call; that read can be stale
# seconds after `gate` is posted while GitHub already computes CLEAN, so enablePullRequestAutoMerge may refuse with
# "Pull request is in clean status" — the arm step then re-reads vetoes and the tip and runs one direct
# `--merge --match-head-commit` (no squash, rebase, or admin). UNSTABLE / HAS_HOOKS still merge at once when gh
# reads them as immediately mergeable (cli/cli pkg/cmd/pr/merge/merge.go).
# Since `arm` runs after `CI` and `gate` are green, assume it merges: every veto is re-read right before the call.
#
# JOBS AND TRUST. Every trigger runs THIS file as it is on the deploy branch (the default branch), never a PR's copy:
# a PR that edits land.yml or merge-gate.mjs cannot change how its own gate is posted (WP-L1, r2 landing-design).
# resolve (read-only, seconds, no checkout) decides which PRs this event concerns. trusted-rows (read-only token,
# checks out the deploy branch, runs no PR code: it only FETCHES the head's objects for the merge-base) evaluates the
# rows GitHub state decides: open, hold, plan, ci, config (`merge-gate --trusted`). land-gate (one matrix leg per PR,
# a fresh runner each, token READ-ONLY, no secret, no dependency cache) checks out the deploy branch and runs
# merge-gate, which executes the merge result's own scripts (gen:check, the ratchet tests); its verdict leaves the leg
# only as an artifact, and "artifacts resulting from untrusted PR data are themselves untrusted"
# (https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/, read 2026-10-27), so post takes
# only gen, ratchets and retest from it and a pass needs trusted-rows to pass on the same tip. post (statuses: write, NO
# checkout, trusted inline shell only) writes `gate`, re-reading the head, the labels and ci.yml's `CI` check
# before it posts a pass. The next step in that same no-checkout job re-reads every veto and the deploy tip, then
# arms, without a second runner queue. Its LAND_TOKEN remains scoped to that step. No job that holds a write
# permission or a secret checks out or runs code from the PR.
#
# TRIGGERS. `pull_request_target`, not `pull_request`: `pull_request` runs the workflow file of the PR's merge commit,
# so a same-repo PR editing this file got `statuses: write` and LAND_TOKEN; `pull_request_target` "runs in the context
# of the default branch of the base repository" (https://docs.github.com/en/actions/reference/workflows-and-actions/
# events-that-trigger-workflows#pull_request_target, read 2026-10-27), whose own warning is "Avoid using this event if
# you need to build or run code from the pull request": only land-gate does, read-only. Its payload carries the draft
# flag and labels, so a land/hold label flip, a ready or draft flip, a push or a reopen re-evaluates at once.
# Re-evaluation after CI finishes is `workflow_run` (`check_suite` is not used: "To prevent recursive workflows,
# [check_suite] does not trigger workflows if the check suite was created by GitHub Actions", same page; it ran 0
# times in 14 days, r2 workflows.md). A CI run that ends red re-gates too, so a `gate` posted while CI ran never stays
# pending. A successful Pages completion for the live tip picks one eligible open train, priority PR, or oldest PR.
# The trusted checks consider candidates in order; only the first pass starts a merge evaluation. Direct events still
# invalidate a PR on a new head, body or label, even when a previous queue pass skipped the PR.
# `workflow_run` "only triggers a workflow run if the workflow file exists on the default branch" (the deploy
# branch). Its `pull_requests` array is the Pull Request Minimal shape (empty for forks,
# https://docs.github.com/en/rest/checks/suites), so `resolve` reads each PR's state itself.
#
# NOISE. Job-level `if:` on `resolve` (no runner at all): a label other than `land`/`hold`, an event on a PR without
# `land`, and a cancelled or skipped run exit at once.
# Such a label event also gets its own concurrency group, so it never cancels or replaces a PR's re-gate.
# CONFIG-OK. Bryce's `config-ok` click (added or removed) on a PR that carries `land` is not noise: it re-gates that PR
# in its own `land-<n>` group like a land/hold flip, so a stale `config=FAIL` does not wait for the next push, CI or
# train (#5432: #5282 sat 216 min, #5265 about 97). The click is only a trigger: the config row still reads who added
# the label (merge-gate configVerdict), so an agent's `config-ok` re-gates to the same refusal. Without `land` it is noise.
# `ratchet-raise` (Bryce's other per-head approval, #5405) is treated the same way.
#
# THE STATUS NAMED `gate`. A commit status, context `gate`, on the PR head (https://docs.github.com/en/rest/commits/statuses;
# `statuses: write`); the newest status per context is the one GitHub reads. NOT a check run: a Checks API run created
# for a PR head from another event (a CI workflow_run re-gate) joins an arbitrary existing Actions suite, and a newer run
# of that suite's workflow hides it, so the ruleset reads `gate` as Expected forever (#3914, 2026-10-27). No job is
# named `gate` either (a skipped job reports success under its name: #3902). A write is dropped when a `gate` status
# newer than this run's resolve read (AT, whole seconds, compared as epoch seconds) exists, so a slow stale run never
# replaces a newer verdict. The full
# merge-gate output is the run's step summary; the status links to the run.
#   merge-gate exit 0 → success (pending "paused" while `dispatch:merge-pause` is set on Dispatch; pending
#   "re-gating" when the deploy tip is no longer the verdict's `tip=`, STALE TIP below)
#   exit 3 (CI still running) → pending    exit 2 → failure    exit 1 or no verdict → pending
#   "error, will retry" (an API or git hiccup is not a refusal)    `hold`, `land` removed, back to draft →
#   failure "not asked", and an armed auto-merge is disabled. post disarms too whenever it writes anything but
#   success on a PR whose auto-merge is armed.
#
# IMMEDIATE RE-GATE (`retry` job). A gated, green PR whose arm found the deploy tip moved (another PR merged in
# between), or whose post read "the deploy tip moved between trusted-rows and land-gate" (or, since STALE TIP below,
# found the tip moved since the gate measured it), used to wait for the next
# train or its own next CI run: 60–90 min on a busy day (#3957, #3942, #3940, 2026-10-27). `retry` (actions: write
# only, no checkout, no repo code, GITHUB_TOKEN) now dispatches this workflow again for that ONE PR. "events
# triggered by the GITHUB_TOKEN will not create a new workflow run, with the following exceptions: workflow_dispatch
# and repository_dispatch events always create workflow runs" (https://docs.github.com/en/actions/how-tos/
# write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow, read
# 2026-10-27). The dispatch is the REST call (POST …/actions/workflows/land.yml/dispatches, `ref` + `inputs`,
# https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event; the Actions permission
# "write" per https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens),
# with `ref` = the deploy branch, so the run uses the deploy branch's copy of this file ("GITHUB_REF: the branch or
# tag that received the dispatch"; the file must exist on the default branch, https://docs.github.com/en/actions/
# reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch). resolve refuses a dispatch on
# any other ref. A dispatched run is resolved like a land/hold label event: one PR, re-gated, armed on a pass. It is
# BOUNDED per head: inputs carry `head` and `attempt`; resolve resets the count to 0 when the PR's head is no longer
# `head` (a push re-gates on its own), and `retry` stops at RETRY_MAX dispatches per head ("retry budget spent; the
# next train re-gates"), so a tip that keeps moving cannot loop. Nothing is counted in repo files. Still ONE arm per
# run; a train arming one PR and the next train arming the next is unchanged. Anyone with write access may dispatch
# it by hand too (`gh workflow run land.yml --ref claude/f1-game-project-26h3ng -f pr=<n>`): a re-gate now.
#
# LATE WAIT (#6045, 2026-11-21). A run that read CI as running can post `ci=WAIT` minutes after CI finished (#6040:
# read 00:11, CI green 00:20:25, posted 00:23:05). post then re-reads ci.yml's `CI` check-run, and when it has
# concluded hands the PR to `retry`. And arm re-reads the head's `gate` up to three times before it gives up on "the
# newest gate status is not this run's success" (#6042: a read 2 s after the write listed the older pending first),
# then hands that mismatch to `retry` too instead of stopping. Both stay inside RETRY_MAX per head.
#
# STALE TIP. A `gate` success is only as good as the tip it measured. post writes success only after re-reading the
# deploy tip (GET …/branches/<deploy>) and finding the verdict's `tip=` still there; a moved tip writes pending
# "re-gating" instead and hands the PR to `retry` (same RETRY_MAX budget per head). arm's own tip check is not
# enough: an auto-merge armed earlier fires on the next success GitHub sees, with no arm run in between. #3982
# (armed 23:04Z) got a success at 23:12:37Z measured on bfd8f509 although #4020 had moved the tip to 834754fa at
# 23:10:07Z; GitHub merged it at 23:13:38Z and the two left docs/agent-index.json stale on the tip (gen:check red,
# 2026-10-27). So any non-success `gate` this run writes also disarms an armed PR, and the next pass re-arms it
# through arm's checks. A tip that moves between post's read and GitHub's merge is still a seconds-wide window.
#
# NO AUTO-SYNC (retired 2026-11-03 with merge-gate's `distance` row, docs/plans/2026-11-03-agent-surface-reset.md §6).
# A `sync` job used to update-branch the `land` PRs whose `gate` refused on distance alone. gen and ratchets run on
# the real merge result, so a merely-behind PR needs no sync; this workflow never calls update-branch, and a
# conflict stays the owner's `sync-pr.mjs` job.
#
# EDITED BODY. `pull_request_target` also fires on `edited` ("The title or body of a pull request was edited, or the base
# branch of a pull request was changed", https://docs.github.com/en/webhooks/webhook-events-and-payloads#pull_request;
# the payload's `changes` object names what changed, so `changes.body` is set only for a body edit; the workflow-trigger
# page lists `edited` among the types, https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target,
# read 2026-10-30). Ticking or striking a Plan item re-gates a `land` PR at once (#3981 sat on "plan=FAIL" for 5 h after
# its Plan closed). resolve acts only on an edit whose payload has `changes.body`; a title or base edit runs alone in a
# noise group like a stray label. Trust is unchanged: the payload is read, no PR code runs, and the gate still reads the body
# through the API.
#
# STALE GATE (`sweep` job). A `gate` older than the PR's last green `CI` run, or `pending` 15 min after CI finished, left
# #3970 stuck (a label flip or a push was the only cure). On a schedule (`schedule` runs on the default branch, same page
# as above) `sweep` re-gates up to STALE_MAX such `land` PRs per run through the existing dispatch path, at most
# RETRY_MAX times per head since its CI finished. Removing and re-adding `land` does the same by hand, and so does a
# dispatch on the deploy branch with `stale=true` (`gh workflow run land.yml --ref claude/f1-game-project-26h3ng -f stale=true`).
# GitHub delays scheduled runs under load (this repo's other cron workflows fire hours apart), so the dispatch is also
# how the sweep is proven live. A push to the deploy branch also sweeps (rate-capped to one per SWEEP_GAP_MIN), and the
# sweep re-gates a green, unarmed PR whose `gate` predates the tip commit: pages.yml's paths-ignore starts no Pages
# train on a docs-only merge, so that train re-gate never comes (audit 2026-11-21, finding 2). The sweep does NOT ride
# CI/Pages `workflow_run` (that path from #6029 burned installation quota; class of #4666).
#
# DRAFT + `land`. A draft that carries `land` gets `gate` failure "draft: flip ready first …" and, once per head, a
# comment with the route (ready-gate, `update_pull_request` draft:false, `land`); `ready_for_review` re-gates it.
#
# MERGE-PAUSE. `dispatch:merge-pause` on the open issue titled `Dispatch` arms nothing, syncs nothing and disarms
# what this event touches. It counts only when the label's newest `labeled` event is the repository owner's own click
# with no app (`merge_paused`, the same provenance dispatch.mjs reads); an agent's pause is ignored. Removing the label re-gates nothing by itself: the next push, label flip, CI or train
# run does.
#
# TOKEN. "events triggered by the GITHUB_TOKEN will not create a new workflow run"
# (https://docs.github.com/en/actions/concepts/security/github_token), so a merge made with it starts no pages.yml
# train. `LAND_TOKEN` (fine-grained PAT or GitHub App token: contents, pull requests and workflows write on this
# repository) arms when set; the fallback to `GITHUB_TOKEN` still lands the PR but warns, and the 6-hourly Pages cron
# (or a manual dispatch) ships it.

on:
  # Both privileged triggers run the deploy branch's file. No job checks out the PR: land-gate checks out the deploy
  # branch with a read-only token and no secret, merge-gate runs the merge result's scripts under untrustedEnv, and
  # the jobs that write run no repo code. tests/unit/merge-gate.test.mjs pins all of this.
  pull_request_target:   # zizmor: ignore[dangerous-triggers] see the three lines above: no PR checkout, PR scripts get no write token or secret
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, synchronize, reopened, edited]
    branches: [claude/f1-game-project-26h3ng]
  # The stale-gate sweep (`sweep` job, STALE GATE in the header): reads `gate` and CI, dispatches re-gates, runs no PR code.
  # A push to the deploy branch sweeps too: pages.yml ignores docs-only pushes (paths-ignore), so after a docs merge no
  # Pages workflow_run re-gates the land PRs a moved tip just made stale (audit 2026-11-21, finding 2).
  push:
    branches: [claude/f1-game-project-26h3ng]
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:   # zizmor: ignore[dangerous-triggers] same as pull_request_target above
    workflows: ["CI", "Deploy to GitHub Pages"]
    types: [completed]
  # The immediate re-gate (`retry` below; IMMEDIATE RE-GATE above), or the stale-gate sweep with stale=true.
  # Runs the dispatched ref's file: resolve accepts only the deploy branch. Inputs are read through env and
  # validated, never interpolated into a script.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-gate (and arm on a pass); leave empty with stale=true
        required: false
        default: ""
        type: string
      head:
        description: the head sha the retry budget counts against (empty = the PR's current head)
        required: false
        default: ""
        type: string
      attempt:
        description: immediate re-gates already spent on that head (retry adds 1; stops at RETRY_MAX)
        required: false
        default: "0"
        type: string
      stale:
        description: "true = run the stale-gate sweep now (the `sweep` job; pr, head and attempt are ignored)"
        required: false
        default: "false"
        type: string

env:
  DEPLOY_BRANCH: claude/f1-game-project-26h3ng
  RETRY_MAX: 3
  # STALE GATE: at most 4 re-gate dispatches per sweep run; the per-head budget is RETRY_MAX (see `sweep`).
  STALE_MAX: 4

# ONE group per PR (a CI run on a PR head carries the PR number); the deploy branch's train runs share `land-tip`; a
# CI run that names no PR (a fork) gets `land-sha-<head>`, never the train's group (GitHub keeps one pending run per
# group, so a shared group drops one PR's re-gate for another's). A relevant PR event (land/hold label, draft flip,
# push) cancels the PR's in-flight evaluation, so a `hold` stops a gate already running, and re-evaluates everything
# itself; a CI or train re-gate never cancels, it queues. A label that is not land/hold (nor config-ok / ratchet-raise /
# deploy:red / priority on a `land` PR: the gate's rows or resolve's order read them) is noise and runs alone in `land-noise-<run id>` (its resolve is skipped): before, it cancelled an
# in-flight CI re-gate and left `gate` pending
# on a green PR (WP-L3a). The train run and a PR run can still overlap: AT and arm's re-read of every veto cover that.
# A dispatched re-gate joins its PR's `land-<n>` group and never cancels (cancel-in-progress is true only for
# pull_request_target): it queues behind the run that dispatched it. "At most one … workflow run can be pending in the
# concurrency group … any existing pending … run in the same group is canceled and replaced"
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency, read 2026-10-27):
# a pending CI re-gate and a pending dispatch of one PR do the same work, since resolve reads the PR's live state.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'claude/f1-game-project-26h3ng'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && (github.event.workflow_run.name != 'Deploy to GitHub Pages' || github.event.workflow_run.conclusion != 'success')
        && format('land-noise-{0}', github.run_id))
    || (github.event_name == 'pull_request_target' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'land' && github.event.label.name != 'hold'
        && !((github.event.label.name == 'config-ok' || github.event.label.name == 'ratchet-raise' || github.event.label.name == 'deploy:red' || github.event.label.name == 'priority') && contains(github.event.pull_request.labels.*.name, 'land')))
    || (github.event.action == 'edited' && !github.event.changes.body)))
    && format('land-noise-{0}', github.run_id)
    || format('land-{0}', github.event.pull_request.number || ((github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.stale == 'true') && 'stale-sweep') || github.event.inputs.pr || github.event.workflow_run.pull_requests[0].number || (github.event.workflow_run.head_branch == 'claude/f1-game-project-26h3ng' && 'tip') || format('sha-{0}', github.event.workflow_run.head_sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions: {}

jobs:
  # Which PRs does this event concern, and are they asking to land? Seconds, no checkout.
  resolve:
    name: resolve
    if: >-
      (github.event_name == 'pull_request_target' && (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name == 'land' || github.event.label.name == 'hold'))
        || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name == 'config-ok' || github.event.label.name == 'ratchet-raise' || github.event.label.name == 'deploy:red' || github.event.label.name == 'priority') && contains(github.event.pull_request.labels.*.name, 'land'))
        || github.event.action == 'converted_to_draft'
        || (github.event.action != 'labeled' && github.event.action != 'unlabeled' && contains(github.event.pull_request.labels.*.name, 'land')
            && (github.event.action != 'edited' || github.event.changes.body))))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
        && (github.event.workflow_run.head_branch != 'claude/f1-game-project-26h3ng' || github.event.workflow_run.head_repository.full_name != github.repository
          || (github.event.workflow_run.name == 'Deploy to GitHub Pages' && github.event.workflow_run.conclusion == 'success')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/f1-game-project-26h3ng' && github.event.inputs.stale != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      issues: read
      statuses: read
    outputs:
      attempt: ${{ steps.pick.outputs.attempt }}
      landable: ${{ steps.pick.outputs.landable }}
      validated_tip: ${{ steps.pick.outputs.validated_tip }}
      prs: ${{ steps.pick.outputs.prs }}
      notasked: ${{ steps.pick.outputs.notasked }}
      disarm: ${{ steps.pick.outputs.disarm }}
      paused: ${{ steps.pick.outputs.paused }}
      at: ${{ steps.pick.outputs.at }}
    steps:
      - name: Resolve the PRs and their state
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATES: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          IN_PR: ${{ github.event.inputs.pr }}
          IN_HEAD: ${{ github.event.inputs.head }}
          IN_ATTEMPT: ${{ github.event.inputs.attempt }}
        run: |
          set -euo pipefail
          # The moment the PR state was read, in WHOLE seconds like a status's `created_at`; post compares the two
          # as epoch seconds (a string compare of `…:05Z` against `…:05.123Z` read a same-second older status as newer).
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # merge_paused (finding 7, 2026-11-21): true only while the open `Dispatch` issue carries dispatch:merge-pause AND
          # that label's newest `labeled` event is the repository owner's own click (no app), as dispatch.mjs counts it; an
          # agent's pause is ignored. Prints true|false; fails, printing nothing, when a read fails.
          merge_paused() {
            local n
            n=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
              --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not)) | .number] | first // 0') || return 1
            [[ "$n" =~ ^[0-9]+$ ]] || return 1
            [ "$n" != 0 ] || { echo false; return 0; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "dispatch:merge-pause") | {login: .actor.login, app: .performed_via_github_app}' \
              | jq -s -r --arg o "$GITHUB_REPOSITORY_OWNER" 'last | if . != null and .login == $o and .app == null then "true" else "false" end'
          }
          paused=$(merge_paused)
          numbers=""
          queue_pulls='[]'
          train=false   # a validated deploy tip advances one eligible entry
          attempt=0
          if [ "$EVENT" = pull_request_target ]; then
            numbers=$PR_NUMBER
          elif [ "$EVENT" = workflow_dispatch ]; then
            # An immediate re-gate (the `retry` job, or a person): one PR, resolved like a land/hold label event.
            if ! [[ "$IN_PR" =~ ^[0-9]{1,7}$ ]]; then echo "::error::workflow_dispatch input pr='$IN_PR' is not a PR number"; exit 1; fi
            numbers=$IN_PR
            # The budget counts per head: a head that moved since the retry was asked for starts again at 0.
            [[ "$IN_ATTEMPT" =~ ^[0-9]{1,3}$ ]] && attempt=$IN_ATTEMPT
          elif [ "$RUN_BRANCH" = "$DEPLOY_BRANCH" ] && [ "$RUN_REPO" = "$GITHUB_REPOSITORY" ]; then
            if [ "$RUN_NAME" = "Deploy to GitHub Pages" ] && [ "$RUN_CONCLUSION" = success ] && [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              # The completed publication triggers one queue pass; the nested CI is a duplicate signal.
              train=true
              # The single queue listing supplies the same fields as the per-PR REST read used on direct events.
              queue_pulls=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$DEPLOY_BRANCH" --label land --limit 50 \
                --json number,state,isDraft,baseRefName,headRefName,headRefOid,mergeable,autoMergeRequest,labels,createdAt,body \
                --jq '[.[] | {number, state:(.state|ascii_downcase), draft:.isDraft, base:{ref:.baseRefName},
                  head:{sha:.headRefOid,ref:.headRefName}, mergeable:(.mergeable != "CONFLICTING"),
                  auto_merge:.autoMergeRequest, labels, created_at:.createdAt, body}]')
              numbers=$(jq -r '.[].number' <<<"$queue_pulls")
            else
              echo "::notice::deploy-branch $EVENT concluded '$RUN_CONCLUSION' — nothing to re-gate"
            fi
          else
            # A PR's CI finished, green or red: re-gate it so a `gate` posted while CI ran is settled either way.
            numbers=$(jq -r --arg base "$DEPLOY_BRANCH" '(. // [])[] | select(.base.ref == $base) | .number' <<<"$CANDIDATES")
            if [ -z "$numbers" ] && [ -n "$RUN_SHA" ]; then
              numbers=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/pulls" --jq ".[] | select(.base.ref == \"$DEPLOY_BRANCH\") | .number")
            fi
          fi
          rows='[]'
          notasked='[]'
          disarm='[]'
          # #6055: reuse the pulls resolve already fetches (no extra `gh pr list --label train`). Pass 1 stores each
          # open land PR; train_cars come from those with `train` + `train/` ref. Pass 2 classifies (resolveLandable).
          # Sweep job untouched. Quota follow-ups own other land.yml surfaces.
          gate_state() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$1/statuses?per_page=100" \
              --jq '[.[] | select(.context == "gate")] | first | .state // ""'
          }
          fetched='[]'
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            if [ "$train" = true ]; then
              pr=$(jq -c --argjson n "$n" '.[] | select(.number == $n)' <<<"$queue_pulls")
            else
              pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n")
            fi
            state=$(jq -r .state <<<"$pr"); base=$(jq -r .base.ref <<<"$pr")
            head=$(jq -r .head.sha <<<"$pr")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")
            echo "PR #$n: state=$state draft=$(jq -r .draft <<<"$pr") base=$base head=${head:0:12} armed=$(jq -r '.auto_merge != null' <<<"$pr") labels=[$labels]"
            if [ "$state" != open ] || [ "$base" != "$DEPLOY_BRANCH" ]; then continue; fi
            # On a tip pass inspect the wrapper gate before using its manifest. Its normal status read moves
            # here; parked cars still cost no status read. A refused or conflicting wrapper cannot claim cars.
            if [ "$train" = true ] && jq -e '.draft == false and .mergeable != false and (.head.ref // "" | startswith("train/")) and
                ([.labels[].name] | index("train") != null and index("land") != null and index("hold") == null)' <<<"$pr" >/dev/null; then
              wrapper_gate=$(gate_state "$head")
              if [ "$wrapper_gate" = failure ]; then
                pr=$(jq -c '.unavailableTrain = true' <<<"$pr")
              else
                pr=$(jq -c '.trainGateChecked = true' <<<"$pr")
              fi
            fi
            fetched=$(jq -c --argjson p "$pr" '. + [$p]' <<<"$fetched")
          done <<<"$numbers"
          # A pushed car invalidates the whole fold. Release its unchanged siblings as well, and let
          # train cleanup rebuild the wrapper. A direct PR event does not contain the rest of the board.
          fetched=$(jq -c '
            (map({key:(.number|tostring), value:.head.sha}) | from_entries) as $heads |
            map(if .unavailableTrain != true and .draft == false and .mergeable != false and (.head.ref // "" | startswith("train/"))
                   and ((.labels // [] | map(.name)) | index("train") != null and index("land") != null and index("hold") == null)
                then ([.body // "" | capture("<!-- merge-train (?<j>\\{[^\\n]*\\}) -->")? | .j | fromjson? | .cars[]?
                        | select((.pr | type) == "number" and (.head | strings | test("^[0-9a-f]{40}$"))) | {pr,head}]) as $cars |
                     . + {trainCars:$cars, staleTrain:any($cars[]; ($heads[.pr|tostring] // .head) != .head)}
                else . end)' <<<"$fetched")
          train_cars=$(jq -c '[.[] | select(.staleTrain != true) | .trainCars[]?] | unique' <<<"$fetched")
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            n=$(jq -r .number <<<"$pr")
            draft=$(jq -r .draft <<<"$pr")
            head=$(jq -r .head.sha <<<"$pr"); armed=$(jq -r '.auto_merge != null' <<<"$pr")
            if [ "$EVENT" = workflow_dispatch ]; then
              [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PR #$n: no verifiable head"; exit 1; }
              if [ -n "$IN_HEAD" ] && [ "$head" != "$IN_HEAD" ]; then attempt=0; fi
              echo "dispatched re-gate of #$n (attempt $attempt of $RETRY_MAX on ${head:0:12})"
            fi
            created=$(jq -r .created_at <<<"$pr")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")
            has() { [[ " $labels " == *" $1 "* ]]; }
            why=""
            if has hold; then why="the \`hold\` label is set"
            elif [ "$draft" = true ]; then why="the PR is a draft"
            elif ! has land; then why="no \`land\` label"
            elif [ "$train" = true ] && jq -e '.unavailableTrain or .mergeable == false or .mergeable_state == "dirty"' <<<"$pr" >/dev/null; then
              why="conflicting PR or refused train"
            elif jq -e .staleTrain <<<"$pr" >/dev/null; then why="a boarded head moved; waiting for train cleanup"
            elif ! has train && jq -e --argjson n "$n" --arg h "$head" 'any(.[]; .pr == $n and .head == $h)' <<<"$train_cars" >/dev/null; then
              why="car of an open train"
            fi
            # `land` on a DRAFT does nothing until the flip: post (below) says so on `gate` and once per head in a comment.
            dl=false; [ "$draft" = true ] && has land && ! has hold && dl=true
            if [ -z "$why" ]; then
              if [ "$paused" = true ] && [ "$armed" = true ]; then disarm=$(jq -c --argjson n "$n" '. + [$n]' <<<"$disarm"); fi
              if [ "$train" = true ] && [ "$paused" = true ]; then continue; fi
              # train label first (prio -1), then priority (0), then oldest (1). Matches resolveLandable.
              prio=1; has priority && prio=0; has train && prio=-1
              if [ "$train" = true ] && ! jq -e .trainGateChecked <<<"$pr" >/dev/null; then
                # A train re-gate skips a head whose `gate` is already failure: a PR refused on every train would
                # otherwise consume the next tip pass too (WP-L3d). A push or a label flip re-gates it.
                latest_gate=$(gate_state "$head")
                if [ "$latest_gate" = failure ]; then
                  if [ "$armed" = true ]; then disarm=$(jq -c --argjson n "$n" '. + [$n]' <<<"$disarm"); fi
                  echo "PR #$n: gate is already failure on ${head:0:12}; not re-gated by the train"
                  continue
                fi
              fi
              rows=$(jq -c --argjson n "$n" --arg h "$head" --argjson p "$prio" --arg c "$created" '. + [{number: $n, head: $h, prio: $p, created: $c}]' <<<"$rows")
            else
              # A direct event publishes its invalidation. A tip pass only needs to invalidate an armed PR here.
              if [ "$train" = true ] && [ "$armed" != true ]; then continue; fi
              notasked=$(jq -c --argjson n "$n" --arg h "$head" --arg w "$why" --argjson d "$dl" '. + [{number: $n, head: $h, why: $w, draft: $d}]' <<<"$notasked")
              if [ "$armed" = true ]; then disarm=$(jq -c --argjson n "$n" '. + [$n]' <<<"$disarm"); fi
            fi
          done < <(jq -c '.[]' <<<"$fetched")
          # The trusted checks below walk the sorted tip queue until the first eligible PR, including past the old four-PR window.
          prs=$(jq -c --argjson train "$train" 'sort_by(.prio, .created, .number) | if $train then . else .[:4] end | map({number, head})' <<<"$rows")
          validated_tip=""
          if [ "$train" = true ]; then validated_tip=$RUN_SHA; fi
          landable=false; [ "$prs" != '[]' ] && landable=true
          {
            echo "validated_tip=$validated_tip"
            echo "landable=$landable"
            echo "prs=$prs"
            echo "notasked=$notasked"
            echo "disarm=$disarm"
            echo "paused=$paused"
            echo "at=$at"
            echo "attempt=$attempt"
          } >> "$GITHUB_OUTPUT"
          echo "landable=$landable prs=$prs notasked=$notasked disarm=$disarm paused=$paused at=$at attempt=$attempt"

  # THE TRUSTED ROWS: merge-gate.mjs --trusted (open, hold, plan, ci, config) from the deploy branch's own code. It
  # fetches each head's objects for the merge-base and never checks them out or runs them, so `post` can believe it
  # where it cannot believe the land-gate artifact (WP-L2). Read-only token, no secret, no install, no cache.
  trusted-rows:
    name: trusted-rows
    needs: resolve
    if: needs.resolve.outputs.landable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
      selected: ${{ steps.rows.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: merge-gate --trusted
        id: rows
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ needs.resolve.outputs.prs }}
          VALIDATED_TIP: ${{ needs.resolve.outputs.validated_tip }}
        run: |
          set -uo pipefail
          rows='[]'
          if [ -n "$VALIDATED_TIP" ] && [ "$(git rev-parse HEAD)" != "$VALIDATED_TIP" ]; then
            echo "The completed Pages run belongs to a superseded tip."
            PRS='[]'
          fi
          flags=(--trusted)
          if [ -n "$VALIDATED_TIP" ]; then flags+=(--queue-candidate); fi
          while IFS= read -r pr <&3; do
            n=$(jq -r .number <<<"$pr"); h=$(jq -r .head <<<"$pr")
            code=0; out=$(node tools/ci/merge-gate.mjs --pr "$n" --sha "$h" "${flags[@]}" 2>&1) || code=$?
            echo "$out"
            line=$(grep -E '^= merge-gate ' <<<"$out" | tail -n 1)
            tip=$(sed -n 's/.* tip=\([0-9a-f]*\).*/\1/p' <<<"$line")
            if [ -n "$VALIDATED_TIP" ]; then
              # Read errors and a moving tip end this pass. A real refusal/wait can yield to the next candidate.
              if [ "$code" = 5 ]; then continue; fi
              if [ "$tip" != "$VALIDATED_TIP" ]; then break; fi
              case "$code" in 0) ;; 2|3) continue ;; *) break ;; esac
            fi
            rows=$(jq -c --argjson n "$n" --arg h "$h" --argjson c "$code" --arg l "$line" --arg t "$tip" \
              '. + [{number: $n, head: $h, code: $c, line: $l, tip: $t}]' <<<"$rows")
            [ "$code" != 4 ] || break   # trusted transport observed quota; leave later heads for the sweep
            if [ -n "$VALIDATED_TIP" ]; then break; fi
          done 3< <(jq -c '.[]' <<<"$PRS")
          echo "selected=$(jq -c 'map({number,head})' <<<"$rows")" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

  # THE GATE: merge-gate.mjs --check, one fresh runner per PR. The merge result's own scripts run here, so the token
  # is read-only, no secret is referenced, and the verdict leaves only as an artifact that `post` cross-checks. No
  # dependency cache either: this run's cache scope is the deploy branch's, so a PR script that wrote a cache entry
  # would poison ci.yml and pages.yml (r2 landing-design, cache poisoning). No receipt, no bus.
  land-gate:
    name: land-gate (#${{ matrix.pr.number }})
    needs: [resolve, trusted-rows]
    if: needs.trusted-rows.outputs.selected != '' && needs.trusted-rows.outputs.selected != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.trusted-rows.outputs.selected) }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: merge-gate --check
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head }}
        run: |
          set -uo pipefail
          mkdir -p verdict
          # Actions runs `bash -e`: a bare `out=$(…); code=$?` aborts on a refused/waiting gate (exit 2/3) before the verdict is written.
          code=0; out=$(node tools/ci/merge-gate.mjs --pr "$N" --sha "$HEAD_SHA" --check 2>&1) || code=$?
          echo "$out"
          line=$(grep -E '^= merge-gate ' <<<"$out" | tail -n 1)
          tip=$(sed -n 's/.* tip=\([0-9a-f]*\).*/\1/p' <<<"$line")
          jq -n --argjson n "$N" --arg h "$HEAD_SHA" --argjson code "$code" --arg line "$line" --arg tip "$tip" \
            --arg out "$(tail -c 60000 <<<"$out")" '{number: $n, head: $h, code: $code, line: $line, tip: $tip, out: $out}' > "verdict/$N.json"
          # shellcheck disable=SC2016 # the backticks are Markdown for the job summary, not a command substitution
          printf '### gate PR #%s\n\n`%s`\n\n```\n%s\n```\n' "$N" "${line:-= merge-gate exit $code}" "$out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: land-verdict-${{ matrix.pr.number }}
          path: verdict/
          retention-days: 1
          if-no-files-found: ignore

  # POST: the only job that writes `gate`. No checkout and no repo code. Also turns `gate` red for a PR that no longer
  # asks to land, disarms, and picks the ONE PR `arm` may merge. A success is written only onto the tip it measured.
  post:
    name: post
    needs: [resolve, trusted-rows, land-gate]
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && ((needs.resolve.outputs.validated_tip == '' && needs.resolve.outputs.landable == 'true')
        || (needs.trusted-rows.outputs.selected != '' && needs.trusted-rows.outputs.selected != '[]')
        || needs.resolve.outputs.notasked != '[]' || needs.resolve.outputs.disarm != '[]')
    runs-on: ubuntu-latest
    # The 10-minute post phase plus runner and download margin; arm is its own queued job (finding 3).
    timeout-minutes: 13
    # LAND_TOKEN can live in this environment, restricted to the deploy branch (every trigger of this file runs on
    # it). Until it is moved there the repository secret serves. `deployment: false`: no deployment record per run.
    environment:
      name: land
      deployment: false
    permissions:
      statuses: write
      checks: read
      contents: write
      pull-requests: write
      actions: read
      issues: read
    outputs:
      arm: ${{ steps.post.outputs.arm }}
      retry: ${{ steps.post.outputs.retry }}
    steps:
      # Start one shared post-phase clock before download. Runner setup is outside this
      # clock, but remains covered by the combined 13-minute job cap.
      - name: Bound artifact download and posting to one ten-minute phase
        id: post_budget
        timeout-minutes: 1
        run: echo "deadline=$(( $(date -u +%s) + 600 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.land-gate.result != 'skipped'
        timeout-minutes: 10
        continue-on-error: true
        with:
          pattern: land-verdict-*
          path: verdicts
          merge-multiple: true
      - name: Post `gate`, disarm, pick one PR to arm
        id: post
        timeout-minutes: 10
        env:
          POST_DEADLINE: ${{ steps.post_budget.outputs.deadline }}
          GH_TOKEN: ${{ github.token }}
          DISARM_TOKEN: ${{ secrets.LAND_TOKEN || github.token }}
          PRS: ${{ needs.resolve.outputs.validated_tip && (needs.trusted-rows.outputs.selected || '[]') || needs.resolve.outputs.prs }}
          NOTASKED: ${{ needs.resolve.outputs.notasked }}
          DISARM: ${{ needs.resolve.outputs.disarm }}
          PAUSED: ${{ needs.resolve.outputs.paused }}
          AT: ${{ needs.resolve.outputs.at }}
          TRUSTED: ${{ needs.trusted-rows.outputs.rows || '[]' }}
        run: |
          # Keep the original post phase's shared download+post budget. Reserve two
          # seconds for whole-second clock rounding and TERM-to-KILL cleanup.
          [[ "${POST_DEADLINE:-}" =~ ^[0-9]+$ ]] || { echo "::error::missing post-phase deadline"; exit 1; }
          remaining=$(( POST_DEADLINE - $(date -u +%s) - 2 ))
          [ "$remaining" -gt 0 ] || { echo "::error::post-phase deadline expired"; exit 124; }
          # Match the Actions Bash failure flags; do not source BASH_ENV a second time.
          timeout --kill-after=1s "${remaining}s" env -u BASH_ENV bash --noprofile --norc -e -o pipefail <<'LAND_POST'
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          AT_S=$(date -u -d "$AT" +%s) || AT_S=0
          # write_gate <head> <status> <conclusion|""> <title> <summary>: post the head's `gate` COMMIT STATUS (newest
          # per context wins), unless a newer one was posted after this run's resolve read (AT): compare-and-set by
          # time, in epoch seconds (`created_at` has whole seconds; AT is whole seconds too).
          # Not a check run: an API-made check run on a PR head joins an arbitrary Actions suite, and a newer run of that
          # suite's workflow then hides it from the ruleset ("Expected", #3914 2026-10-27).
          # WROTE is the state write_gate posted ("" when it posted nothing).
          # land_run <target_url>: true when the URL names a run of THIS workflow file (land.yml) on the deploy
          # branch. Every land.yml trigger but workflow_dispatch runs the default branch's copy; a dispatch must name
          # the deploy branch too. The status author must also be the Actions bot (checked by the caller).
          # It also sets LAND_RUN_T: that run's (latest attempt's) start, epoch seconds, 0 when it names none.
          land_run() {
            local id run
            LAND_RUN_T=0
            [[ "$1" =~ ^"${GITHUB_SERVER_URL}/${R}/actions/runs/"([0-9]+)$ ]] || return 1
            id=${BASH_REMATCH[1]}
            run=$(gh api "repos/$R/actions/runs/$id" 2>"$gate_errors") || return 2
            LAND_RUN_T=$(jq -r '.run_started_at // empty | fromdateiso8601 | floor' <<<"$run" 2>/dev/null) || LAND_RUN_T=0
            [[ "$LAND_RUN_T" =~ ^[0-9]+$ ]] || LAND_RUN_T=0
            jq -e --arg b "$DEPLOY_BRANCH" \
              '((.path // "") | sub("@.*$"; "")) == ".github/workflows/land.yml" and (.event != "workflow_dispatch" or .head_branch == $b)' <<<"$run" >/dev/null
          }
          write_gate() {
            local head=$1 st=$2 c=$3 title=$4 summary=$5 seen seen_t seen_u seen_c state body
            WROTE=""
            # A newer status from THIS run (an earlier attempt: a re-run reuses resolve's AT) is not a newer verdict;
            # run 40740152111 kept its own attempt-1 error over its attempt-2 pass on #4110 (2026-10-28).
            seen=$(gh api "repos/$R/commits/$head/statuses?per_page=100" --jq \
              '[.[] | select(.context == "gate")] | first | if . == null then "" else "\(.created_at | fromdateiso8601 | floor) \(.target_url // "-") \(.creator.login // "-")" end' 2>"$gate_errors") || return 1
            read -r seen_t seen_u seen_c <<<"$seen"
            if [ -n "$seen" ] && [ "$seen_t" -gt "$AT_S" ] && [ "$seen_u" != "$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID" ]; then
              # A newer verdict is kept only when another land.yml run on the deploy branch posted it, as the Actions
              # bot, AND that run started after this run read the PR (finding 4, 2026-11-21): an older run's late write
              # (a ci=WAIT read before CI finished) measured an older state. Any other `gate` status is replaced.
              if [ "$seen_c" = "github-actions[bot]" ]; then
                if land_run "$seen_u"; then
                  if [ "$LAND_RUN_T" -gt "$AT_S" ]; then
                    echo "gate on ${head:0:12}: kept the newer verdict (posted at epoch $seen_t by $seen_u, a run started at $LAND_RUN_T > $AT_S = $AT)"; return 0
                  fi
                elif [ "$?" = 2 ]; then
                  return 1   # an unreadable run is not proof that its newer verdict may be replaced
                fi
              fi
              echo "::warning::gate on ${head:0:12}: a newer status ($seen_c, $seen_u) was not posted by a land.yml run on $DEPLOY_BRANCH; posting this run's verdict over it"
            fi
            case "$st/$c" in completed/success) state=success ;; completed/*) state=failure ;; *) state=pending ;; esac
            body=$(jq -n --arg st "$state" --arg t "$title" --arg u "$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID" \
              '{state: $st, context: "gate", description: ($t | .[0:140]), target_url: $u}')
            gh api --method POST "repos/$R/statuses/$head" --input - --jq '.url' 2>"$gate_errors" <<<"$body" || return 1
            # shellcheck disable=SC2016 # the backticks are Markdown for the step summary, not a command substitution
            printf '### gate %s → %s\n\n%s\n\n```\n%s\n```\n' "${head:0:12}" "$state" "$title" "$summary" >> "$GITHUB_STEP_SUMMARY"
            WROTE=$state
          }
          # An auto-merge armed earlier merges on the NEXT success GitHub sees, and arm's tip re-check never runs for
          # it: so a `gate` this run wrote as anything but success disarms the PR (STALE TIP in the header).
          disarm_if_armed() {
            [ "$(gh api "repos/$R/pulls/$1" --jq '.auto_merge != null')" = true ] || return 0
            if GH_TOKEN="$DISARM_TOKEN" gh pr merge "$1" --repo "$R" --disable-auto; then
              echo "disarmed #$1: $2" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::PR #$1: --disable-auto failed"
            fi
          }
          # want_retry <n> <head>: hand the PR to the `retry` job (an immediate re-gate, RETRY_MAX per head).
          want_retry() { retry=$(jq -c --argjson n "$1" --arg h "$2" '(. + [{number: $n, head: $h}]) | unique_by(.number)' <<<"$retry"); }
          gate_errors=$(mktemp)
          trap 'rm -f "$gate_errors"' EXIT
          retry='[]'
          post_failed=false
          backoff=false
          record_write_failure() {
            post_failed=true
            cat "$gate_errors" >&2
            echo "::error::PR #$1: could not complete gate evaluation and publication" | tee -a "$GITHUB_STEP_SUMMARY"
            if grep -Eiq 'HTTP 429|rate[ -]limit.*HTTP 403|HTTP 403.*rate[ -]limit' "$gate_errors"; then
              backoff=true
              echo "GitHub rate limited this run; deferring immediate re-gates to the next sweep." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              want_retry "$1" "$2"
            fi
          }
          # ci_now <head> <ref>: the PR's newest ci.yml CI check conclusion ("" while running or unreadable).
          # Match prCiRun: pull_request runs, plus a bot/* fold's dispatch on its own branch.
          ci_now() {
            local suites
            suites=$(gh api "repos/$R/actions/workflows/ci.yml/runs?head_sha=$1&per_page=100" | jq -c --arg ref "$2" \
              '[.workflow_runs[] | select(((.path // "") | sub("@.*$"; "")) == ".github/workflows/ci.yml")
                | select(.event == "pull_request" or (.event == "workflow_dispatch" and ($ref | startswith("bot/")) and .head_branch == $ref))
                | .check_suite_id]') || return 1
            gh api "repos/$R/commits/$1/check-runs?check_name=CI&per_page=100" | jq -r --argjson s "$suites" \
              '[.check_runs[] | select(.app.slug == "github-actions" and (.check_suite.id as $id | $s | index($id) != null))] | sort_by(.id) | last | .conclusion // ""'
          }
          # A PR that no longer asks to land: an existing `gate` status turns red ("not asked" is not a pass).
          while IFS= read -r row <&3; do
            [ "$backoff" = false ] || break
            n=$(jq -r .number <<<"$row"); head=$(jq -r .head <<<"$row"); why=$(jq -r .why <<<"$row")
            if [ "$(jq -r '.draft // false' <<<"$row")" = true ]; then
              # `land` on a draft: always say so (an agent waited 108 min believing GitHub would merge it), even with no
              # `gate` yet, and comment once per head.
              write_gate "$head" completed failure "= merge-gate not asked — draft: flip ready first — ready-gate, then update_pull_request draft:false" \
                "PR #$n carries \`land\` but is a draft: nothing lands until it is ready." || record_write_failure "$n" "$head"
              [ "$backoff" = false ] || break
              marker="<!-- land-draft:$head -->"
              if [ "$(gh api "repos/$R/issues/$n/comments?per_page=100" 2>/dev/null | jq -r --arg m "$marker" '[.[].body | contains($m)] | any' 2>/dev/null || echo error)" = false ]; then
                # shellcheck disable=SC2016 # the backticks are Markdown in the comment text, not a command substitution
                msg=$(printf '%s\n`land` is on this **draft**, so nothing will land. Flip it ready first: `node tools/ci/ready-gate.mjs --pr %s`, then `update_pull_request` with `draft:false`, then add `land` again (removing and re-adding it re-gates).' "$marker" "$n")
                gh api --method POST "repos/$R/issues/$n/comments" --input - >/dev/null <<<"$(jq -n --arg b "$msg" '{body: $b}')" || echo "::warning::PR #$n: could not comment"
              fi
            else
              if ! has_gate=$(gh api "repos/$R/commits/$head/statuses?per_page=100" --jq '[.[] | select(.context == "gate")] | length > 0' 2>"$gate_errors"); then
                record_write_failure "$n" "$head"
              elif [ "$has_gate" = true ]; then
                write_gate "$head" completed failure "= merge-gate not asked — $why" "PR #$n does not ask to land: $why." || record_write_failure "$n" "$head"
              fi
            fi
          done 3< <(jq -c '.[]' <<<"$NOTASKED")
          for n in $(jq -r '.[]' <<<"$DISARM"); do
            if GH_TOKEN="$DISARM_TOKEN" gh pr merge "$n" --repo "$R" --disable-auto; then
              echo "disarmed #$n" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::PR #$n: --disable-auto failed"
            fi
          done
          arm=""
          while IFS= read -r row <&3; do
            [ "$backoff" = false ] || break
            n=$(jq -r .number <<<"$row"); head=$(jq -r .head <<<"$row"); f="verdicts/$n.json"
            if [ -f "$f" ]; then
              code=$(jq -r .code "$f"); line=$(jq -r .line "$f"); tip=$(jq -r .tip "$f"); out=$(jq -r .out "$f")
              [ "$(jq -r .head "$f")" = "$head" ] || { code=1; line="verdict for another head"; }
            else
              code=1; line=""; tip=""; out="no verdict artifact: the land-gate leg for #$n failed before merge-gate finished"
            fi
            # The artifact came from the leg that ran PR code, so only its gen, ratchets and retest rows count: open, hold,
            # plan, ci and config come from trusted-rows (no PR code), and a pass needs both on the same tip.
            t=$(jq -c --argjson n "$n" '[.[] | select(.number == $n)] | first // {}' <<<"$TRUSTED")
            tcode=$(jq -r '.code // 1' <<<"$t"); tline=$(jq -r '.line // ""' <<<"$t"); ttip=$(jq -r '.tip // ""' <<<"$t")
            [ "$(jq -r '.head // ""' <<<"$t")" = "$head" ] || { tcode=1; tline="no trusted rows for this head"; }
            if [ "$tcode" = 4 ]; then
              # Only the trusted process can signal installation quota. PR artifacts and titles never set backoff.
              backoff=true
              post_failed=true
              echo "::error::PR #$n: trusted GitHub reads are rate limited; deferring re-gates to the next sweep." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$tcode" = 2 ]; then
              code=2; line="$tline"; out="trusted rows (no PR code): $tline"$'\n\n'"land-gate leg: $out"
            elif [ "$code" = 2 ]; then
              :   # the land-gate leg refused (gen, ratchets, retest): a refusal is never a way in
            elif [ "$tcode" != 0 ] && [ "$tcode" != 3 ]; then
              code=1; line="trusted rows: ${tline:-exit $tcode}"
              # No row for this head (trusted-rows timed out or failed): make "will retry" true (`retry`, RETRY_MAX per head).
              if [ "$tline" = "no trusted rows for this head" ]; then
                want_retry "$n" "$head"
              fi
            elif [ "$tcode" = 3 ]; then
              code=3; line="$tline"
            elif [ "$code" = 0 ] && { [ -z "$ttip" ] || [ -z "$tip" ]; }; then
              # An empty tip on either leg is no measurement: "" = "" must never pass as "the same tip" (#4625).
              code=1; line="a gate leg returned no deploy tip (trusted-rows '${ttip:0:12}', land-gate '${tip:0:12}')"
              want_retry "$n" "$head"
            elif [ "$code" = 0 ] && [ "$ttip" != "$tip" ]; then
              code=1; line="the deploy tip moved between trusted-rows (${ttip:0:12}) and land-gate (${tip:0:12})"
              # Both halves passed on different tips: re-gate this PR at once (the `retry` job), not on the next train.
              want_retry "$n" "$head"
            elif [ "$code" = 0 ]; then
              line="$tline (gen, ratchets, retest: land-gate)"
            fi
            if [ "$code" = 0 ]; then
              # The verdict came from a job that ran PR code: re-read what GitHub itself can say before posting a pass.
              if ! pr=$(gh api "repos/$R/pulls/$n" 2>"$gate_errors"); then record_write_failure "$n" "$head"; continue; fi
              # D-045: a ci row the trusted rows CREDITED across a clean tip-sync names the prior head (`credited=<sha>`);
              # its CI is the one re-read. The trusted rows ran the deploy branch's own code, so the sha is believed.
              cisha=$(sed -n 's/.* credited=\([0-9a-f]\{40\}\) .*/\1/p' <<<"$tline"); cisha=${cisha:-$head}
              ref=$(jq -r '.head.ref // ""' <<<"$pr")
              if ! ci=$(ci_now "$cisha" "$ref" 2>"$gate_errors"); then record_write_failure "$n" "$head"; continue; fi
              if [ "$(jq -r .head.sha <<<"$pr")" != "$head" ] || [ "$(jq -r .draft <<<"$pr")" != false ] || [ "$ci" != success ] \
                 || ! jq -e '[.labels[].name] | index("land") and (index("hold") | not)' <<<"$pr" >/dev/null; then
                echo "::warning::PR #$n: the land-gate verdict disagrees with GitHub now (head, draft, labels or CI=$ci); not posted, the next event re-gates"
                continue
              fi
            fi
            ok=true
            WROTE=""
            case "$code" in
              0) # The verdict measured the merge onto `tip`; success is written only while `tip` is still the deploy
                 # tip (STALE TIP in the header: #3982 merged on a success measured before #4020 moved the tip).
                 if ! now=$(gh api "repos/$R/branches/$DEPLOY_BRANCH" --jq .commit.sha 2>"$gate_errors"); then record_write_failure "$n" "$head"; continue; fi
                 if [ "$PAUSED" = true ]; then
                   write_gate "$head" in_progress "" "= merge-gate paused — dispatch:merge-pause is set on the Dispatch issue" "$line"$'\n\n'"$out" || ok=false
                 elif [ -z "$now" ]; then
                   write_gate "$head" in_progress "" "= merge-gate error, will retry — could not read the deploy tip" "$line"$'\n\n'"$out" || ok=false
                   want_retry "$n" "$head"
                 elif [ "$now" != "$tip" ]; then
                   write_gate "$head" in_progress "" "= merge-gate waiting — the deploy tip moved since the gate measured ${tip:0:12} (now ${now:0:12}): re-gating" "$line"$'\n\n'"$out" || ok=false
                   want_retry "$n" "$head"
                 elif write_gate "$head" completed success "$line" "$out"; then
                   # ONE arm per run, in resolve's order: the first pass wins; the merge it makes moves the tip.
                   [ -n "$arm" ] || [ "$WROTE" != success ] || arm=$(jq -c -n --argjson n "$n" --arg h "$head" --arg t "$tip" '{number: $n, head: $h, tip: $t}')
                 else ok=false
                 fi ;;
              3) write_gate "$head" in_progress "" "$line" "$out" || ok=false
                 # #6045 (#6040, #6017 on 2026-11-21): this run read CI as running minutes ago and posts `ci=WAIT`
                 # after CI already finished. The CI-completion re-gate may have run first (its newer verdict is then
                 # kept above) or still be queued; hand the PR to `retry` too so the WAIT never outlives CI.
                 if [ "$ok" = true ] && [[ " $line " == *" ci=WAIT "* ]]; then
                   if ! pr=$(gh api "repos/$R/pulls/$n" 2>"$gate_errors") || ! cnow=$(ci_now "$head" "$(jq -r '.head.ref // ""' <<<"$pr")" 2>"$gate_errors"); then
                     record_write_failure "$n" "$head"
                   elif [ -n "$cnow" ]; then
                     echo "PR #$n: posted ci=WAIT but CI is now $cnow on ${head:0:12}; re-gating" | tee -a "$GITHUB_STEP_SUMMARY"
                     want_retry "$n" "$head"
                   fi
                 fi ;;
              2) write_gate "$head" completed failure "$line" "$out" || ok=false ;;
              *) echo "::error::PR #$n: merge-gate error (exit $code): ${line:-no verdict}"
                 # "will retry" is made true here (finding 8): the `retry` job re-gates it, RETRY_MAX per head.
                 disposition="will retry"; if [ "$backoff" = true ]; then disposition="quota backoff"; fi
                 write_gate "$head" in_progress "" "= merge-gate error, $disposition — ${line:-exit $code}" "$out" || ok=false
                 want_retry "$n" "$head" ;;
            esac
            [ "$ok" = true ] || record_write_failure "$n" "$head"
            if [ -n "$WROTE" ] && [ "$WROTE" != success ]; then disarm_if_armed "$n" "gate is now $WROTE on ${head:0:12}"; fi
          done 3< <(jq -c '.[]' <<<"$PRS")
          if [ "$post_failed" = true ]; then
            # A failed job cannot arm even an earlier, successful row. Re-evaluate that head too.
            if [ -n "$arm" ]; then want_retry "$(jq -r .number <<<"$arm")" "$(jq -r .head <<<"$arm")"; fi
            arm=""
          fi
          if [ "$backoff" = true ]; then retry='[]'; fi
          { echo "arm=$arm"; echo "retry=$retry"; } >> "$GITHUB_OUTPUT"
          echo "arm=${arm:-none} retry=$retry"
          [ "$post_failed" = false ]
          LAND_POST

  # ARM (finding 3, 2026-11-21): its own job so every PR's arm runs in ONE queue (`land-arm`, queue: max; GitHub keeps
  # each queued job, unlike the default single pending slot). The step re-reads the deploy tip and every veto inside the
  # queue, so the arm that waited behind a merge sees the moved tip and hands the PR to `retry`. The ruleset does not
  # require an up-to-date branch (strict_required_status_checks_policy false), which is why the order matters.
  arm:
    name: arm
    needs: [resolve, post]
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.post.result == 'success' && needs.post.outputs.arm != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: land-arm
      queue: max
    environment:
      name: land
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      issues: read
    outputs:
      retry: ${{ steps.arm.outputs.retry }}
      backoff: ${{ steps.arm.outputs.backoff }}
    steps:
      - name: Re-check the vetoes and the tip, then arm pinned to the gated head
        id: arm
        env:
          LAND_TOKEN: ${{ secrets.LAND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ARM: ${{ needs.post.outputs.arm }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          # merge_paused (finding 7, 2026-11-21): true only while the open `Dispatch` issue carries dispatch:merge-pause AND
          # that label's newest `labeled` event is the repository owner's own click (no app), as dispatch.mjs counts it; an
          # agent's pause is ignored. Prints true|false; fails, printing nothing, when a read fails.
          merge_paused() {
            local n
            n=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
              --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not)) | .number] | first // 0') || return 1
            [[ "$n" =~ ^[0-9]+$ ]] || return 1
            [ "$n" != 0 ] || { echo false; return 0; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "dispatch:merge-pause") | {login: .actor.login, app: .performed_via_github_app}' \
              | jq -s -r --arg o "$GITHUB_REPOSITORY_OWNER" 'last | if . != null and .login == $o and .app == null then "true" else "false" end'
          }
          n=$(jq -r .number <<<"$ARM"); head=$(jq -r .head <<<"$ARM"); tip=$(jq -r .tip <<<"$ARM")
          read_error=$(mktemp)
          trap 'rm -f "$read_error"' EXIT
          # T2 (train #6382, job 138837647849, 2026-11-24): one of the three reads below got `503 Service Unavailable
          # "no healthy upstream"` and the step exited 1, so `retry` had no outputs and the green head was stranded.
          # read_5xx <cmd…>: run a read; on a GitHub 5xx re-read it once after GATE_REREAD_S. Returns 75 when the 5xx
          # outlasts the re-read, else the read's own status. on_read_fail: the rate limit defers as before (exit 1,
          # backoff); a 5xx hands the PR to `retry` (RETRY_MAX per head) and exits 0; any other failure stays a failure.
          read_5xx() {
            local rc
            "$@" 2>"$read_error" && return 0 || rc=$?
            grep -Eiq 'HTTP 5[0-9][0-9]|status code: 5[0-9][0-9]' "$read_error" || return "$rc"
            cat "$read_error" >&2
            sleep "${GATE_REREAD_S:-5}"
            "$@" 2>"$read_error" && return 0 || rc=$?
            if grep -Eiq 'HTTP 5[0-9][0-9]|status code: 5[0-9][0-9]' "$read_error"; then return 75; fi
            return "$rc"
          }
          on_read_fail() {
            local rc=$1
            defer_if_limited
            [ "$rc" = 75 ] || { cat "$read_error" >&2; exit "$rc"; }
            echo "::notice::not arming #$n: GitHub answered 5xx twice on the arm's first reads; re-gating within the existing retry budget" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "retry=$(jq -c -n --argjson n "$n" --arg h "$head" '{number: $n, head: $h}')" >> "$GITHUB_OUTPUT"
            exit 0
          }
          defer_if_limited() {
            cat "$read_error" >&2
            if grep -Eiq 'HTTP 429|rate[ -]limit.*HTTP 403|HTTP 403.*rate[ -]limit' "$read_error"; then
              echo 'backoff=true' >> "$GITHUB_OUTPUT"
              echo "::error::GitHub rate limited the arm check for #$n; deferring retries to the next sweep." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          }
          paused=$(read_5xx merge_paused) || on_read_fail "$?"
          pr=$(read_5xx gh api "repos/$GITHUB_REPOSITORY/pulls/$n") || on_read_fail "$?"
          now=$(read_5xx gh api "repos/$GITHUB_REPOSITORY/branches/$DEPLOY_BRANCH" --jq .commit.sha) || on_read_fail "$?"
          skip=""
          [ "$paused" = true ] && skip="dispatch:merge-pause is set"
          [ "$(jq -r .state <<<"$pr")" = open ] || skip="PR is $(jq -r .state <<<"$pr")"
          [ "$(jq -r .draft <<<"$pr")" = false ] || skip="PR is a draft"
          [ "$(jq -r .head.sha <<<"$pr")" = "$head" ] || skip="head moved past ${head:0:12}"
          jq -e '[.labels[].name] | index("land") and (index("hold") | not)' <<<"$pr" >/dev/null || skip="\`land\` gone or \`hold\` set"
          [ -n "$tip" ] || skip="the verdict names no deploy tip"
          # THE `gate` THIS RUN POSTED IS THE ONE ON THE HEAD (2026-11-10). The ruleset requires a `gate` status, and any
          # token with statuses: write can post one. Arm only when this run is the deploy branch's land.yml and the
          # newest `gate` on the head is the success this run's post step just wrote, as the Actions bot.
          self="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/land.yml@refs/heads/$DEPLOY_BRANCH" ] \
            || skip="this run is not the deploy branch's land.yml ($GITHUB_WORKFLOW_REF)"
          # #6045 (#6042, run 44847006825, 2026-11-21): post wrote its success at 00:59:08 and this read, two seconds
          # later, still listed the older pending first. Read up to three times, GATE_REREAD_S apart; a mismatch that
          # outlasts them is handed to `retry` (RETRY_MAX per head) instead of stopping, so the PR is not left green
          # and unarmed until a person dispatches it. Every other skip above stays final.
          regate=false
          if [ -z "$skip" ]; then
            for try in 1 2 3; do
              gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/statuses?per_page=100" \
                --jq '[.[] | select(.context == "gate")] | first | "\(.state) \(.creator.login // "-") \(.target_url // "-")"' 2>"$read_error") || { defer_if_limited; gate="unreadable"; }
              [ "$gate" != "success github-actions[bot] $self" ] || break
              [ "$try" = 3 ] || sleep "${GATE_REREAD_S:-5}"
            done
            if [ "$gate" != "success github-actions[bot] $self" ]; then
              skip="the newest gate status on ${head:0:12} is not this run's success ($gate)"; regate=true
            fi
          fi
          if [ -n "$skip" ]; then
            if [ "$regate" = true ]; then
              echo "::notice::not arming #$n: $skip; re-gating within the existing retry budget" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "retry=$(jq -c -n --argjson n "$n" --arg h "$head" '{number: $n, head: $h}')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::not arming #$n: $skip" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # The gate measured gen:check and the ratchets on a merge onto `tip`; a moved tip is an ungated combination.
          # Skipped ONLY for that reason: hand the PR to `retry`, which re-gates it at once (bounded per head).
          if [ "$now" != "$tip" ]; then
            echo "::notice::not arming #$n: deploy tip moved ${tip:0:12} -> ${now:0:12}; re-gating at once" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "retry=$(jq -c -n --argjson n "$n" --arg h "$head" '{number: $n, head: $h}')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Reuse the one-armed-PR inventory to also catch direct CI/dispatch events for boarded cars.
          # Complete all pages before deciding: a failed later page must not look like a short, clear queue.
          queue_blocker() {
            local inventory wrappers wrapper wrapper_head base missing sibling pull detail state ci relation rows
            inventory=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base="$DEPLOY_BRANCH" \
              -f sort=created -f direction=asc -F per_page=100 | jq -ces '
                if length > 0 and all(.[]; type == "array") then add else error("incomplete inventory") end') || return 1
            wrappers=$(jq -cer --argjson n "$n" --arg head "$head" --arg repo "$GITHUB_REPOSITORY" '
              def landable: .draft == false and ([.labels[].name] | index("land") != null and index("hold") == null);
              (map({key:(.number|tostring), value:.}) | from_entries) as $pulls |
              if any(.[]; .number != $n and .auto_merge != null) then {armed:true}
              else {trains: [.[] | select(.number != $n and landable and .head.repo.full_name == $repo
                       and (.head.ref | startswith("train/")) and any(.labels[]; .name == "train")) as $train |
                $train.body // "" | capture("<!-- merge-train (?<json>\\{[^\\n]*\\}) -->")? | .json | fromjson? |
                select((.base | strings | test("^[0-9a-f]{40}$")) and (.cars | type == "array") and any(.cars[]; .pr == $n and .head == $head)
                  and (.cars | map(.pr) | unique | length) == (.cars | length)
                  and all(.cars[]; (.pr | type == "number" and . > 0 and floor == .) and (.head | strings | test("^[0-9a-f]{40}$")))
                  and all(.cars[]; . as $car | $pulls[$car.pr|tostring] | . == null or (landable and .head.sha == $car.head and (.head.ref | startswith("train/") | not))))
                | {number:$train.number,head:$train.head.sha,base,missing:[.cars[] | select($pulls[.pr|tostring] == null)]}]} end' <<<"$inventory") || return 1
            if [ "$(jq -r .armed <<<"$wrappers")" = true ]; then echo "another PR is armed"; return; fi
            rows=$(jq -r '.trains[] | [.number,.head,.base,(.missing|tojson)] | @tsv' <<<"$wrappers") || return 1
            while read -r wrapper wrapper_head base missing; do
              [ -n "$wrapper" ] || continue
              if [ "$base" != "$tip" ]; then
                relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$tip" --jq .status) || return 1
                case "$relation" in ahead|identical) ;; behind|diverged) continue ;; *) return 1 ;; esac
              fi
              # An absent sibling can still be valid: trainRow accepts an already merged car at its exact head.
              for sibling in $(jq -r '.[].pr' <<<"$missing"); do
                pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$sibling") || return 1
                # If it is open again, the listing changed under us. Defer for a consistent re-read.
                state=$(jq -er --argjson cars "$missing" --argjson n "$sibling" --arg branch "$DEPLOY_BRANCH" '
                  select(.number == $n and .state == "closed" and has("merged_at")) |
                  if .merged_at != null and .base.ref == $branch and .head.sha == ($cars[] | select(.pr==$n).head)
                  then "merged" else "stale" end' <<<"$pull") || return 1
                [ "$state" = merged ] || continue 2
              done
              # GraphQL binds these variables through gh, independently of shell expansion.
              # shellcheck disable=SC2016
              detail=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$wrapper" \
                -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){headRefOid mergeable commits(last:1){nodes{commit{oid status{context(name:"gate"){state}}}}}}}}') || return 1
              state=$(jq -er --arg h "$wrapper_head" '
                select(.errors == null) | .data.repository.pullRequest |
                select(.headRefOid == $h and .commits.nodes[-1].commit.oid == $h) |
                if .mergeable == "CONFLICTING" then "FAILURE"
                else .commits.nodes[-1].commit | select(has("status")) | .status.context.state // "PENDING" end' <<<"$detail") || return 1
              case "$state" in FAILURE|ERROR) continue ;; PENDING|EXPECTED|SUCCESS) ;; *) return 1 ;; esac
              # Use the CI check that trainDisposition reads. Optional red checks do not release boarded cars.
              ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$wrapper_head/check-runs?check_name=CI&per_page=20" \
                --jq '.check_runs | map(select(.app.slug == "github-actions" and .name == "CI")) | first |
                      if .status == "completed" then .conclusion else "pending" end') || return 1
              if [ "$ci" = pending ]; then
                # A terminal workflow can leave no completed CI check (the #5814 cancelled-train case).
                ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$wrapper_head&per_page=20" \
                  --jq '.workflow_runs | max_by(.id) | if .status == "completed" and
                         (.conclusion // "" | test("^(cancelled|failure|timed_out|startup_failure)$")) then .conclusion else "pending" end') || return 1
              fi
              case "$ci" in
                failure|cancelled|timed_out|startup_failure|action_required|skipped|neutral|stale) continue ;;
                success|pending) echo "car of open train #$wrapper"; return ;;
                *) return 1 ;;
              esac
            done <<<"$rows"
          }
          queue_allows_arm() {
            local reason
            reason=$(GH_TOKEN="$GITHUB_TOKEN" queue_blocker 2>"$read_error") || { defer_if_limited; reason="open PR inventory unreadable"; }
            [ -n "$reason" ] || return 0
            echo "::notice::not arming #$n: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            # A healthy train owns this car until its next lifecycle event; immediate retries waste quota.
            if [[ "$reason" != "car of open train #"* ]]; then
              echo "retry=$(jq -cn --argjson n "$n" --arg h "$head" '{number:$n,head:$h}')" >> "$GITHUB_OUTPUT"
            fi
            return 1
          }
          queue_allows_arm || exit 0
          who=GITHUB_TOKEN
          if [ -n "$LAND_TOKEN" ]; then
            export GH_TOKEN="$LAND_TOKEN"; who=LAND_TOKEN
          else
            msg="a merge made by GITHUB_TOKEN will not start pages.yml; set LAND_TOKEN, see .claude/skills/steward/references/vendors.md"
            echo "::warning::$msg"
            printf '> **%s**\n\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          if merge_out=$(gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$head" 2>&1); then
            printf '%s\n' "$merge_out"
            echo "armed (or merged) #$n @ ${head:0:12} onto ${tip:0:12} with $who" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            merge_rc=$?
            printf '%s\n' "$merge_out" >&2
          fi
          # gh picks auto-merge vs merge-now from mergeStateStatus read just before the call; seconds after `gate` is
          # posted (or the tip moves) that read can be stale (UNKNOWN/BLOCKED) while GitHub already computes CLEAN, and
          # enablePullRequestAutoMerge then refuses "Pull request is in clean status" (#4498, runs 41420214975 and
          # 41421861494, 2026-11-02). Same call minus --auto: a merge commit pinned to the gated head, after the same
          # veto and tip re-read. Any failure (incl. "Base branch was modified") falls through to the handling below.
          case "$merge_out" in
            *"is in clean status (enablePullRequestAutoMerge)"*)
              now=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/branches/$DEPLOY_BRANCH" --jq .commit.sha) || exit "$merge_rc"
              pr=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$n") || exit "$merge_rc"
              paused=$(GH_TOKEN="$GITHUB_TOKEN" merge_paused) || exit "$merge_rc"
              [ "$paused" = false ] || { echo "::notice::not merging #$n: dispatch:merge-pause is set" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
              jq -e --arg head "$head" --arg base "$DEPLOY_BRANCH" '.state == "open" and .draft == false and .head.sha == $head and .base.ref == $base
                and ([.labels[].name] | index("land") != null and index("hold") == null)' <<<"$pr" >/dev/null \
                || { echo "::notice::not merging #$n: state, head, \`land\` or \`hold\` changed since the gate" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
              if [ "$now" != "$tip" ]; then
                echo "::notice::not merging #$n: deploy tip moved ${tip:0:12} -> ${now:0:12}; re-gating at once" | tee -a "$GITHUB_STEP_SUMMARY"
                echo "retry=$(jq -c -n --argjson n "$n" --arg h "$head" '{number: $n, head: $h}')" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              queue_allows_arm || exit 0
              if merge_out=$(gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$head" 2>&1); then
                printf '%s\n' "$merge_out"
                echo "merged #$n @ ${head:0:12} onto ${tip:0:12} with $who (PR was already CLEAN; auto-merge refused)" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                merge_rc=$?
                printf '%s\n' "$merge_out" >&2
              fi ;;
          esac
          # The tip can move after the read above but before GitHub accepts the arm. Only this known race may
          # use the existing bounded re-gate: never repeat the merge command or reuse the stale gate result.
          case "$merge_out" in
            *"GraphQL: Base branch was modified. Review and try the merge again. (mergePullRequest)"*) ;;
            *) exit "$merge_rc" ;;
          esac
          now=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/branches/$DEPLOY_BRANCH" --jq .commit.sha) || exit "$merge_rc"
          pr=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$n") || exit "$merge_rc"
          paused=$(GH_TOKEN="$GITHUB_TOKEN" merge_paused) || exit "$merge_rc"
          [ "$paused" = false ] || exit "$merge_rc"
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] && [ "$now" != "$tip" ] || exit "$merge_rc"
          jq -e --arg head "$head" --arg base "$DEPLOY_BRANCH" '.state == "open" and .draft == false and .head.sha == $head and .base.ref == $base
            and ([.labels[].name] | index("land") != null and index("hold") == null)' <<<"$pr" >/dev/null || exit "$merge_rc"
          echo "::notice::not armed #$n: deploy tip moved during arm ${tip:0:12} -> ${now:0:12}; re-gating within the existing retry budget" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "retry=$(jq -c -n --argjson n "$n" --arg h "$head" '{number: $n, head: $h}')" >> "$GITHUB_OUTPUT"

  # RETRY: the immediate re-gate (IMMEDIATE RE-GATE in the header). Dispatches this workflow on the deploy branch for
  # each PR that post or arm handed over for another gate measurement. actions: write and nothing else, no
  # checkout, no repo code, no secret: GITHUB_TOKEN's workflow_dispatch is one of the two events it may start.
  retry:
    name: retry
    needs: [resolve, post, arm]
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && needs.arm.outputs.backoff != 'true'
      && ((needs.post.outputs.retry != '' && needs.post.outputs.retry != '[]') || needs.arm.outputs.retry != '')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      pull-requests: read
      statuses: read
    steps:
      - name: Dispatch a fresh gate for each requested retry
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ needs.resolve.outputs.attempt }}
          POST_RETRY: ${{ needs.post.outputs.retry }}
          ARM_RETRY: ${{ needs.arm.outputs.retry }}
        run: |
          set -euo pipefail
          a=0; [[ "${ATTEMPT:-}" =~ ^[0-9]{1,3}$ ]] && a=$ATTEMPT
          list=$(jq -c -n --arg p "${POST_RETRY:-}" --arg a "${ARM_RETRY:-}" \
            '((if $p == "" then [] else ($p | fromjson) end) + (if $a == "" then [] else [$a | fromjson] end)) | unique_by(.number)')
          # P1 (#6379, the land-trigger churn note: 33 of 105 land-gate runs were this chain). Only one PR can
          # merge per tip, so re-gate only the HEAD of the land queue, in resolve's order: train, then priority, then
          # oldest. The queue is the ready, unarmed `land` PRs without `hold` whose `gate` is a success or a "tip moved"
          # pending posted in the last 15 min, plus the PRs handed over here. An older one is the sweep's (and T1's),
          # so a stuck PR never holds the queue. The rest keep their pending "re-gating" for the next train or sweep.
          # An unreadable queue dispatches every handed-over PR, as before.
          first=""
          # shellcheck disable=SC2016 # GraphQL variables, bound by gh
          [ "$a" -ge "$RETRY_MAX" ] || first=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -f base="$DEPLOY_BRANCH" \
            -f query='query($owner:String!,$repo:String!,$base:String!){repository(owner:$owner,name:$repo){pullRequests(states:OPEN,baseRefName:$base,labels:["land"],first:100){nodes{number isDraft createdAt autoMergeRequest{enabledAt} labels(first:50){nodes{name}} commits(last:1){nodes{commit{status{context(name:"gate"){state description createdAt}}}}}}}}}}' \
            | jq -er --argjson asked "$list" --argjson now "$(date -u +%s)" '
              select(.errors == null) | .data.repository.pullRequests.nodes | arrays
              | map((.labels.nodes | map(.name)) as $l | (.commits.nodes[-1].commit.status.context // {}) as $g
                  | select(.isDraft == false and .autoMergeRequest == null and ($l | index("hold") | not))
                  | select(.number as $n | ($asked | any(.number == $n))
                      or ((($g.state == "SUCCESS") or ($g.state == "PENDING" and ($g.description // "" | test("tip moved"))))
                          and ($now - ($g.createdAt | fromdateiso8601)) <= 900))
                  | {number, created: .createdAt, prio: (if ($l | index("train")) then -1 elif ($l | index("priority")) then 0 else 1 end)})
              | sort_by(.prio, .created, .number) | first | .number') || first=""
          [ "$a" -ge "$RETRY_MAX" ] || [[ "$first" =~ ^[0-9]+$ ]] || { first=""; echo "::notice::land queue unreadable: dispatching every requested re-gate" | tee -a "$GITHUB_STEP_SUMMARY"; }
          while IFS= read -r row <&3; do
            n=$(jq -r .number <<<"$row"); head=$(jq -r .head <<<"$row")
            if [ "$a" -ge "$RETRY_MAX" ]; then
              echo "::notice::#$n: retry budget spent ($a of $RETRY_MAX immediate re-gates on ${head:0:12}); the next train re-gates" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ -n "$first" ] && [ "$n" != "$first" ]; then
              echo "::notice::#$n: not the head of the land queue (#$first is); its pending re-gate waits for the next train or sweep" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches: `ref` + `inputs` (strings).
            if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/land.yml/dispatches" \
                 -f ref="$DEPLOY_BRANCH" -f "inputs[pr]=$n" -f "inputs[head]=$head" -f "inputs[attempt]=$((a + 1))" >/dev/null; then
              echo "re-gate of #$n dispatched (attempt $((a + 1)) of $RETRY_MAX on ${head:0:12})" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::#$n: could not dispatch the re-gate; the next train or CI run re-gates"
            fi
          done 3< <(jq -c '.[]' <<<"$list")

  # SWEEP: STALE GATE in the header. On the schedule, re-gates (through the existing dispatch path) each open, ready
  # `land` PR whose newest `gate` status is older than its newest successful ci.yml run, or has sat `pending` for over
  # 15 min with CI finished. No checkout, no repo code, no secret: gh and jq with a token that may only dispatch.
  # Bounded: STALE_MAX dispatches per run, and per head at most RETRY_MAX re-gates since CI finished (counted as the
  # workflow_dispatch runs created after CI finished, whether or not the run published a gate).
  # ALSO ON A DEPLOY-BRANCH PUSH (finding 2, 2026-11-21): pages.yml's paths-ignore starts no Pages train on a docs-only
  # merge, so the push sweeps too — at most once per SWEEP_GAP_MIN (the `rate` step). The cron and a stale=true
  # dispatch are never rate-limited. A green CI/Pages `workflow_run` does NOT start the sweep (removed after #6029
  # burned installation quota when unreadable history swept anyway; class of #4666).
  sweep:
    name: sweep
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/claude/f1-game-project-26h3ng')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/f1-game-project-26h3ng' && github.event.inputs.stale == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
      issues: read
      statuses: read
    steps:
      # RATE LIMIT: a sweep whose RE-GATE STEP ran (or is running) in another land.yml run in the last SWEEP_GAP_MIN
      # minutes answers for this one. Matched on that step, never the job: a sweep that skipped here also concludes
      # success, and counting it would make every later sweep skip forever. Unreadable history (403, rate limit, error)
      # SKIPS the sweep — never sweep anyway (class of #4666 / #6029).
      - name: Rate limit (one push-driven sweep per SWEEP_GAP_MIN)
        id: rate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_GAP_MIN: "20"
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          since=$(date -u -d "-${SWEEP_GAP_MIN} min" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api "repos/$R/actions/workflows/land.yml/runs?created=>=$since&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | .id] | .[]") \
            || { echo "recent sweeps unreadable: skipping" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          for id in $ids; do
            hit=$(gh api "repos/$R/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "sweep") | .steps[]? | select(.name == "Re-gate the land PRs whose gate is older than their last green CI" and (.conclusion == "success" or .status == "in_progress"))] | length > 0') \
              || { echo "recent sweeps unreadable: skipping (jobs of run $id)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
            if [ "$hit" = true ]; then
              echo "stale-gate sweep skipped: land.yml run $id swept within ${SWEEP_GAP_MIN} min" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Re-gate the land PRs whose gate is older than their last green CI
        if: steps.rate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          # merge_paused (finding 7, 2026-11-21): true only while the open `Dispatch` issue carries dispatch:merge-pause AND
          # that label's newest `labeled` event is the repository owner's own click (no app), as dispatch.mjs counts it; an
          # agent's pause is ignored. Prints true|false; fails, printing nothing, when a read fails.
          merge_paused() {
            local n
            n=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
              --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not)) | .number] | first // 0') || return 1
            [[ "$n" =~ ^[0-9]+$ ]] || return 1
            [ "$n" != 0 ] || { echo false; return 0; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "dispatch:merge-pause") | {login: .actor.login, app: .performed_via_github_app}' \
              | jq -s -r --arg o "$GITHUB_REPOSITORY_OWNER" 'last | if . != null and .login == $o and .app == null then "true" else "false" end'
          }
          paused=$(merge_paused) || paused=unreadable
          if [ "$paused" != false ]; then say "stale-gate sweep skipped: dispatch:merge-pause is set (or unreadable: $paused)"; exit 0; fi
          now=$(date -u +%s)
          lands=$(gh pr list --repo "$R" --state open --base "$DEPLOY_BRANCH" --label land --limit 100 --json number,headRefOid,headRefName,isDraft,labels,autoMergeRequest \
            --jq '.[] | select(.isDraft | not) | select([.labels[].name] | index("hold") | not) | {number, head: .headRefOid, armed: (.autoMergeRequest != null), train: ((.headRefName // "") | startswith("train/"))} | @json') \
            || { say "stale-gate sweep skipped: could not list the land PRs"; exit 0; }
          [ -n "$lands" ] || exit 0
          # One immutable dispatch-history snapshot for all candidates. GitHub lists runs newest first.
          # Unknown (older) titles might target any candidate; count each conservatively. A partial
          # page proves coverage only for CI that finished strictly after its oldest returned run.
          history=$(gh api "repos/$R/actions/workflows/land.yml/runs?event=workflow_dispatch&branch=$DEPLOY_BRANCH&per_page=100" | jq -ce '
            if (.workflow_runs|type) != "array" or (.total_count|type) != "number" or .total_count < (.workflow_runs|length)
            then error("invalid dispatch history") else . end
            | [.workflow_runs[] | {at:(.created_at|fromdateiso8601), title:.display_title}] as $runs
            | {partial:(.total_count > ($runs|length)), oldest:([$runs[].at]|min), runs:$runs}') \
            || { say "stale-gate sweep skipped: unreadable dispatch history"; exit 0; }
          # The deploy tip's commit time: a success `gate` posted before it measured an older tip (finding 2). Unreadable = 0
          # (that case is then never swept; the others still are).
          tip_t=$(gh api "repos/$R/branches/$DEPLOY_BRANCH" --jq '.commit.commit.committer.date' 2>/dev/null | xargs -r -I{} date -u -d {} +%s 2>/dev/null) || tip_t=0
          [[ "${tip_t:-}" =~ ^[0-9]+$ ]] || tip_t=0
          sweep_error=$(mktemp)
          trap 'rm -f "$sweep_error"' EXIT
          quota_exhausted() {
            cat "$sweep_error" >&2
            grep -Eiq 'HTTP 429|rate[ -]limit.*HTTP 403|HTTP 403.*rate[ -]limit' "$sweep_error" || return 1
            say "GitHub installation quota exhausted; deferring remaining PRs to the next sweep"
          }
          sent=0
          while IFS= read -r c <&3; do
            [ -n "$c" ] || continue
            if [ "$sent" -ge "$STALE_MAX" ]; then say "stale-gate sweep: cap of $STALE_MAX re-gates reached; the rest wait for the next sweep"; break; fi
            n=$(jq -r .number <<<"$c"); head=$(jq -r .head <<<"$c"); armed=$(jq -r '.armed // false' <<<"$c"); train=$(jq -r '.train // false' <<<"$c")
            runs=$(gh api "repos/$R/actions/workflows/ci.yml/runs?head_sha=$head&per_page=100" --jq '.workflow_runs' 2>"$sweep_error") || { quota_exhausted && break; say "#$n: could not read the CI runs"; continue; }
            if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then echo "#$n: CI still running"; continue; fi
            ci_done=$(jq -r 'sort_by(.created_at) | last // {} | if .conclusion == "success" then (.updated_at | fromdateiso8601) else 0 end' <<<"$runs")
            [ "${ci_done:-0}" -gt 0 ] || { echo "#$n: no successful CI on ${head:0:12}"; continue; }
            g=$(gh api "repos/$R/commits/$head/statuses?per_page=100" \
              --jq '[.[] | select(.context == "gate") | {s: .state, t: (.created_at | fromdateiso8601)}]' 2>"$sweep_error") || { quota_exhausted && break; say "#$n: could not read the gate status"; continue; }
            newest_t=$(jq -r '.[0].t // 0' <<<"$g"); newest_s=$(jq -r '.[0].s // ""' <<<"$g")
            if [ "$newest_t" -lt "$ci_done" ]; then why="gate (${newest_s:-none}) is older than the last green CI"
            elif [ "$newest_s" = pending ] && [ $((now - newest_t)) -gt 900 ]; then why="gate has been pending for $(((now - newest_t) / 60)) min with CI finished"
            elif [ "$newest_s" = success ] && [ "$armed" != true ] && [ "$tip_t" -gt "$newest_t" ]; then
              # Green but never armed, and the tip moved since: the pass measured an older tip, and no Pages run (a
              # docs-only merge) re-gates it. Re-gating writes a gate newer than the tip, so this fires once per tip.
              why="gate success is older than the deploy tip and the PR is not armed"
            elif [ "$newest_s" = success ] && [ "$armed" != true ] && [ $((now - newest_t)) -gt 900 ]; then
              # Publication may have succeeded before another row or the serialized arm encountered quota.
              # A normal bounded re-gate retries the handoff even when no other PR moved the tip.
              why="gate has been green for over 15 minutes without arming"
            else echo "#$n: gate is current"; continue
            fi
            # Count even failed or cancelled runs that never posted a status. Respect a chain's
            # highest known attempt as well as the number of distinct dispatches in this CI window.
            spent=$(jq -er --arg n "$n" --arg head "$head" --argjson ci "$ci_done" '
              if .partial and (.oldest == null or .oldest >= $ci) then error("incomplete CI window") else . end
              | [.runs[] | select(.at >= $ci and .title != "Land stale sweep")
                 | (((.title // "") | capture("^Land retry pr=(?<pr>[0-9]+) head=(?<h>[0-9a-f]{40}|-) attempt=(?<a>[0-9]{1,3})$")) // {})
                 | select(.pr == null or (.pr == $n and (.h == $head or .h == "-"))) | (.a // "0" | tonumber)]
              | [length, (max // 0)] | max' <<<"$history") \
              || { say "#$n: dispatch history does not cover this CI window; skipping"; continue; }
            if [ "$spent" -ge "$RETRY_MAX" ]; then
              # T3 (#6382): no next train opens while this one is open, so a spent train PR is the merge-train
              # build's to close `stale` (T1: unarmed past its gate, or tip moved with the budget spent).
              if [ "$train" = true ]; then say "#$n: $why, but $spent re-gates since CI finished spent the budget of $RETRY_MAX; a train: the merge-train build closes it stale (T1) and rebuilds from its cars"
              else say "#$n: $why, but $spent re-gates since CI finished spent the budget of $RETRY_MAX; a push, a label flip or the next train re-gates"; fi
              continue
            fi
            if gh api --method POST "repos/$R/actions/workflows/land.yml/dispatches" \
                 -f ref="$DEPLOY_BRANCH" -f "inputs[pr]=$n" -f "inputs[head]=$head" -f "inputs[attempt]=$((spent + 1))" >/dev/null 2>"$sweep_error"; then
              sent=$((sent + 1)); say "#$n: $why; re-gate dispatched ($((spent + 1)) of $RETRY_MAX on ${head:0:12})"
            else
              quota_exhausted && break
              say "::warning::#$n: could not dispatch the re-gate"
            fi
          done 3< <(printf '%s\n' "$lands")

  # MERGE TRAIN (tools/ci/merge-train.mjs; decision and design: docs/notes/MERGE-TRAIN-2026-11-18.md). Up to 10 (TRAIN_MAX) green `land` PRs whose own trusted rows pass (open, hold,
  # plan, ci, config, raise) are merged onto the deploy tip with merge commits on a `train/*` branch, opened as an
  # ordinary PR with `land` + `train`; that PR then lands through the same CI → `gate` → arm route as any other, and
  # each car's head reaching the deploy branch marks the car merged. merge-gate reads a train's config and raise rows
  # from its cars after proving the head is exactly the clean fold of their heads onto a deploy-branch commit. One
  # train is open at a time; a red train is closed and the next one takes half its cars (bisect). Runs with the sweep
  # (schedule, or a dispatch with stale=true) and after each Pages train on the deploy branch (a train just landed).
  # TRUST: checks out the deploy branch only; car heads are FETCHED as git objects and combined with merge-tree /
  # commit-tree (no worktree, no hooks, no npm, no PR code), so LAND_TOKEN never meets PR code; the per-car
  # ratchets that need PR code ran in `train-screen` above, and only its verdict file (data) reaches this job. LAND_TOKEN pushes the
  # train branch and opens the PR, so `pull_request` CI runs on it ("events triggered by the GITHUB_TOKEN will not
  # create a new workflow run", header TOKEN); without it the job does nothing. `dispatch:merge-pause` pauses it.
  # TRAIN SCREEN (#5864): trains #5840 and #5862 closed red on their gate because cars that were each red ALONE on the
  # tip (ratchets the tip had snapped down after the cars' own gates ran) boarded on their trusted rows. This job folds
  # the next train's candidates onto the tip and runs merge-gate's ratchetsOnMerge on each cumulative fold, which runs
  # the merge result's own scripts: so, like land-gate, a read-only token, no secret, no cache. Its verdict file leaves
  # as an artifact the build reads as DATA (merge-train.mjs readScreen): a forged file can only keep a car out or let
  # one ride that the train's own gate then measures, as before. A train still open: the file says skip.
  train-screen:
    name: merge train screen
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/f1-game-project-26h3ng' && github.event.inputs.stale == 'true')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy to GitHub Pages'
          && github.event.workflow_run.head_branch == 'claude/f1-game-project-26h3ng' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: land-train-screen
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: merge-train --screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          code=0; out=$(node tools/ci/merge-train.mjs --screen --out screen/screen.json 2>&1) || code=$?
          echo "$out"
          # shellcheck disable=SC2016 # the backticks are Markdown for the step summary, not a command substitution
          printf '### merge train screen\n\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: train-screen
          path: screen/
          retention-days: 1
          if-no-files-found: ignore

  train:
    name: merge train
    needs: train-screen
    # always(): a failed screen still lets the build close a finished train; with no verdict file it opens none.
    if: >-
      always() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/f1-game-project-26h3ng' && github.event.inputs.stale == 'true')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy to GitHub Pages'
          && github.event.workflow_run.head_branch == 'claude/f1-game-project-26h3ng' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: land-train
      cancel-in-progress: false
    environment:
      name: land
      deployment: false
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # no artifact: --build refuses to open a train (no valid screen verdict)
        with:
          name: train-screen
          path: screen/
      - name: merge-train --build
        env:
          LAND_TOKEN: ${{ secrets.LAND_TOKEN }}
        run: |
          set -uo pipefail
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ -z "$LAND_TOKEN" ]; then say "::warning::merge train skipped: LAND_TOKEN is not set (a GITHUB_TOKEN PR starts no CI)"; exit 0; fi
          export GH_TOKEN="$LAND_TOKEN"
          paused=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=dispatch:merge-pause -f per_page=50 \
            --jq '[.[] | select(.title == "Dispatch" and (.pull_request | not))] | length > 0') || paused=unreadable
          if [ "$paused" != false ]; then say "merge train skipped: dispatch:merge-pause is set (or unreadable: $paused)"; exit 0; fi
          # The push credential rides in git's environment config, never argv or .git/config.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LAND_TOKEN" | base64 -w0)"; export GIT_CONFIG_VALUE_0
          echo "::add-mask::$GIT_CONFIG_VALUE_0"
          code=0; out=$(node tools/ci/merge-train.mjs --build --screen-file screen/screen.json 2>&1) || code=$?
          echo "$out"
          # shellcheck disable=SC2016 # the backticks are Markdown for the step summary, not a command substitution
          printf '### merge train\n\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
