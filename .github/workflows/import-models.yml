name: Import CC0 models

# Bake a CC0 model pack into the game's own vertex format, ON GITHUB'S RUNNER.
#
# The point of running here rather than in a browser or the authoring sandbox:
# a GitHub Actions runner has UNRESTRICTED outbound network. CORS is a
# browser-only policy and does not exist server-side, and this runner is not
# behind the sandbox proxy that 403s the asset CDNs — so it can fetch itch.io,
# Kenney, Quaternius or a signed download URL that nothing else in this project
# can reach. It downloads the pack, runs tools/gen/import-models.mjs, and both
# commits the baked models to a bot branch AND uploads them as an artifact.
#
# Dispatch from the Actions tab (or via the API). The baked models land on the
# `commit_branch`; merge that into the deploy branch to ship them.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct download URL (.zip, .glb or .gltf). itch/Kenney signed URLs work here."
        required: true
      mat:
        description: "Surface material id for every imported model (CONCRETE, METAL, WOOD, ROOF, FOLIAGE…)"
        required: false
        default: "CONCRETE"
      height:
        description: "Normalise each model to this many metres tall (0 = keep source scale, or use scale)"
        required: false
        default: "12"
      scale:
        description: "Uniform metres per source unit for a KIT whose pieces keep their relative sizes (used when height is 0)"
        required: false
        default: "0"
      prefix:
        description: "Prefix for the baked model ids"
        required: false
        default: "q_"
      author:
        description: "Attribution recorded in CREDITS.md"
        required: false
        default: "Quaternius"
      commit_branch:
        description: "Branch to commit the baked models to"
        required: false
        default: "bot/model-import"

permissions:
  contents: write

# One import per branch at a time, and never cancelled: this job PUSHES a bot
# branch, and two runs racing on the same `commit_branch` would each try to
# fast-forward over the other. A later dispatch queues behind the running one.
concurrency:
  # Serialize by the bot branch being written, not by the source ref. Two
  # dispatches from different refs may target the same commit_branch; keyed by
  # github.ref they can race and each replace the other's baked pack.
  group: import-models-${{ github.repository }}-${{ inputs.commit_branch || 'bot/model-import' }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Every job carries a cap (tests/unit/ci-coverage.test.mjs); generous, it
    # bounds a hang rather than the work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download the pack
        env:
          MODEL_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          case "$MODEL_URL" in
            https://*) ;;
            *) echo "::error::model URL must use HTTPS"; exit 2 ;;
          esac
          mkdir -p _dl _extract
          MODEL_SOURCE="$(node -e 'const u = new URL(process.env.MODEL_URL); process.stdout.write(u.origin + u.pathname)' )"
          echo "fetching $MODEL_SOURCE"
          # -L follows redirects (itch/Kenney bounce through several); fail loudly.
          curl -fL --retry 3 -o _dl/pack.bin -- "$MODEL_URL"
          ls -la _dl
          # Sniff the magic bytes: PK -> zip, glTF -> glb, { -> gltf json.
          head -c 4 _dl/pack.bin | xxd
          if head -c 2 _dl/pack.bin | grep -q "PK"; then
            python3 - <<'PY'
            import stat
            import zipfile
            from pathlib import PurePosixPath

            with zipfile.ZipFile("_dl/pack.bin") as zf:
                for info in zf.infolist():
                    name = info.filename.replace("\\", "/")
                    parts = PurePosixPath(name).parts
                    mode = (info.external_attr >> 16) & 0o170000
                    if name.startswith("/") or ".." in parts or stat.S_ISLNK(mode):
                        raise SystemExit(f"unsafe archive entry: {info.filename!r}")
            PY
            unzip -q _dl/pack.bin -d _extract
          else
            # A single model file; keep its extension so the importer routes it.
            EXT=glb
            head -c 1 _dl/pack.bin | grep -q "{" && EXT=gltf
            cp _dl/pack.bin _extract/model.$EXT
          fi
          # List a sample of what landed. sed, not `head -50`: under pipefail a
          # pack with more than 50 files made head close the pipe early, find took
          # SIGPIPE and the step failed on the LISTING (Kenney Racing Kit, 2026-10-01,
          # 5 formats x 112 models). sed reads the whole stream.
          echo "extracted: $(find _extract -type f | wc -l) files"; find _extract -maxdepth 3 -type f | sed -n '1,50p'

      - name: Bake models
        env:
          MODEL_URL: ${{ inputs.url }}
          MODEL_MAT: ${{ inputs.mat }}
          MODEL_HEIGHT: ${{ inputs.height }}
          MODEL_SCALE: ${{ inputs.scale }}
          MODEL_PREFIX: ${{ inputs.prefix }}
          MODEL_AUTHOR: ${{ inputs.author }}
        run: |
          MODEL_SOURCE="$(node -e 'const u = new URL(process.env.MODEL_URL); process.stdout.write(u.origin + u.pathname)' )"
          node tools/gen/import-models.mjs _extract \
            --mat "$MODEL_MAT" \
            --height "$MODEL_HEIGHT" \
            --scale "$MODEL_SCALE" \
            --prefix "$MODEL_PREFIX" \
            --author "$MODEL_AUTHOR" \
            --source "$MODEL_SOURCE"
          node tools/gen/assets.mjs credits || true
          node tools/gen/assets.mjs verify || echo "::warning::verify reported issues (often the budget — review the size report above)"

      - name: Upload baked models as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apex-models
          path: |
            assets/pack/models/
            assets/pack/manifest.json
            assets/pack/CREDITS.md

      - name: Commit to the bot branch
        env:
          MODEL_URL: ${{ inputs.url }}
          MODEL_MAT: ${{ inputs.mat }}
          MODEL_HEIGHT: ${{ inputs.height }}
          MODEL_SCALE: ${{ inputs.scale }}
          COMMIT_BRANCH: ${{ inputs.commit_branch }}
        run: |
          set -euo pipefail
          MODEL_SOURCE="$(node -e 'const u = new URL(process.env.MODEL_URL); process.stdout.write(u.origin + u.pathname)' )"
          case "$COMMIT_BRANCH" in
            claude/f1-game-project-26h3ng|""|[!a-z0-9]*|*[!a-z0-9._/-]*)
              echo "::error::unsafe commit branch"; exit 2 ;;
          esac
          if ! git check-ref-format --branch "$COMMIT_BRANCH" >/dev/null 2>&1; then
            echo "::error::invalid commit branch"; exit 2
          fi
          git config user.name "apex-model-bot"
          git config user.email "noreply@anthropic.com"
          # BEGIN force-push guard (15-F9, 2026-10-10)
          # A branch this workflow did not create is never overwritten: a typo, or a
          # chosen name that is another session's live head, an open PR head or
          # gh-pages, used to be force-pushed over with a contents:write token. A NEW
          # branch is pushed plainly; an existing one only when its tip is the bot's
          # own commit, and then with a lease on exactly that tip.
          PUSH_LEASE=""
          if git ls-remote --exit-code --heads origin "$COMMIT_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$COMMIT_BRANCH"
            if [ "$(git log -1 --format=%an FETCH_HEAD)" != "apex-model-bot" ]; then
              echo "::error::origin/$COMMIT_BRANCH exists and its tip is not an apex-model-bot commit; refusing to overwrite it. Pick a new commit_branch (default bot/model-import)."
              exit 2
            fi
            PUSH_LEASE="--force-with-lease=$COMMIT_BRANCH:$(git rev-parse FETCH_HEAD)"
          fi
          # END force-push guard
          git checkout -B "$COMMIT_BRANCH"
          git add assets/pack/models assets/pack/manifest.json assets/pack/CREDITS.md
          if git diff --cached --quiet; then
            echo "no model changes to commit"; exit 0
          fi
          # Model paths are mutable and served cache-first, but every deploy
          # stamps a new shell/SW generation (pages.yml: 2000 + commit count),
          # so existing installs drop the old cache on the next deploy without a
          # committed bump. The shell is generated; just confirm it is in step.
          node tools/gen/gen-shell.mjs --check
          git commit -m "chore(assets): import CC0 models from $MODEL_SOURCE

          Baked on the runner by tools/gen/import-models.mjs — mat=$MODEL_MAT,
          height=${MODEL_HEIGHT}m scale=${MODEL_SCALE}. Merge this branch into the deploy branch
          to ship; nothing places these until a circuit calls api.bakedModel()."
          git push ${PUSH_LEASE:+"$PUSH_LEASE"} origin "$COMMIT_BRANCH"
          echo "pushed to $COMMIT_BRANCH — merge it into the deploy branch to ship"
