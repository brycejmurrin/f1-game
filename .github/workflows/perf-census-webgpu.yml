name: Perf census (TLX WebGPU)

# Advisory: runs the pass, render-scale and GPU-memory censuses on three's WebGPU backend (Bryce's iPhone path) on
# SOFTWARE WebGPU, which the other censuses pin away from (apex26.tlxForceGL=1). The launch asks for Mesa lavapipe, but
# Dawn hands it the google/swiftshader fallback adapter (#5450, run 42979924558); every tool records the adapter and
# exits 1 on any other (adapterMismatch in tools/lib/webgpu-chrome-args.cjs). Dispatch only: it never runs on a
# push except a PR touching the census tools, so it costs no CI minutes otherwise. Counts are exact for the deterministic jump scenario;
# software skips batches, so they are NOT hardware numbers. Issue #4783.
on:
  # A new workflow file cannot be dispatched until it is on the default branch, so the PR that adds it runs it
  # too, only when the census tools or this file change.
  pull_request:
    branches:
      - claude/f1-game-project-26h3ng
    paths:
      - ".github/workflows/perf-census-webgpu.yml"
      - "tools/gfx/pass-census.mjs"
      - "tools/gfx/pass-census-lib.mjs"
      - "tools/gfx/res-scale-census.mjs"
      - "tools/gfx/gpu-mem-census.mjs"
      - "tools/gfx/gpu-mem-webgpu.mjs"
      - "tests/data/pass-census-park.json"
  workflow_dispatch:
    inputs:
      track:
        description: "Circuit"
        required: false
        default: "monaco"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - uses: ./.github/actions/playwright-chromium
      - name: Install the Mesa Vulkan drivers (the launch asks for lavapipe; WebGPU runs on SwiftShader, #5450)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - name: Pass census, chase and helmet
        env:
          TRACK: ${{ inputs.track || 'monaco' }}
        run: |
          mkdir -p artifacts/census
          for cam in chase helmet; do
            node tools/gfx/pass-census.mjs "$TRACK" --webgpu --camera $cam --frames 60 --warm 60 --json artifacts/census/pass-$cam.json
          done
      - name: Render-scale settle
        env:
          TRACK: ${{ inputs.track || 'monaco' }}
        run: node tools/gfx/res-scale-census.mjs --track "$TRACK" --webgpu --json artifacts/census/res-scale.json
      # #4783 row 1: the EXACT cells. A parked, frozen frame per circuit x camera x tier, compared with no tolerance
      # against tests/data/pass-census-park.json (a cell the file lacks fails; a missing file is reported). Each leg
      # also fails when three's uniform buffers grow over the parked window (row 4). Every leg runs; the step fails
      # if any did.
      - name: Parked baselines, circuit x camera x tier
        if: ${{ !cancelled() }}
        run: |
          fail=0
          for track in monaco monza; do for cam in chase helmet; do for tier in desktop mobile; do
            tier_flag=(); if [ "$tier" = mobile ]; then tier_flag=(--mobile); fi
            node tools/gfx/pass-census.mjs "$track" --webgpu --park --camera "$cam" "${tier_flag[@]}" --frames 60 --warm 60 \
              --baseline tests/data/pass-census-park.json --json "artifacts/census/park-$track-$cam-$tier.json" || fail=1
          done; done; done
          exit $fail
      # #4783 row 3: requested WebGPU bytes by format (createTexture / createBuffer minus destroy), desktop and phone tier.
      - name: GPU memory census (WebGPU)
        if: ${{ !cancelled() }}
        env:
          TRACK: ${{ inputs.track || 'monaco' }}
        run: |
          fail=0
          node tools/gfx/gpu-mem-census.mjs "$TRACK" --webgpu --json artifacts/census/gpu-mem-desktop.json || fail=1
          node tools/gfx/gpu-mem-census.mjs "$TRACK" --webgpu --mobile --json artifacts/census/gpu-mem-mobile.json || fail=1
          exit $fail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-census-webgpu
          path: artifacts/census/
