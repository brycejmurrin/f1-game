name: Perf census (TLX WebGPU)

# Advisory: runs the pass and render-scale censuses on three's WebGPU backend (Bryce's iPhone path) under
# Mesa lavapipe, which the other censuses pin away from (apex26.tlxForceGL=1). Dispatch only: it never runs on a
# push except a PR touching the census tools, so it costs no CI minutes otherwise. Counts are exact for the deterministic jump scenario;
# software skips batches, so they are NOT hardware numbers. Issue #4783.
on:
  # A new workflow file cannot be dispatched until it is on the default branch, so the PR that adds it runs it
  # too, only when the census tools or this file change.
  pull_request:
    branches:
      - claude/f1-game-project-26h3ng
    paths:
      - ".github/workflows/perf-census-webgpu.yml"
      - "tools/gfx/pass-census.mjs"
      - "tools/gfx/res-scale-census.mjs"
  workflow_dispatch:
    inputs:
      track:
        description: "Circuit"
        required: false
        default: "monaco"

permissions:
  contents: read

jobs:
  census:
    if: ${{ (vars.ACTIONS_COORDINATOR_MODE != 'active' && vars.ACTIONS_COORDINATOR_MODE != 'paused') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - uses: ./.github/actions/playwright-chromium
      - name: Install the lavapipe Vulkan driver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - name: Pass census, chase and helmet
        env:
          TRACK: ${{ inputs.track || 'monaco' }}
        run: |
          mkdir -p artifacts/census
          for cam in chase helmet; do
            node tools/gfx/pass-census.mjs "$TRACK" --webgpu --camera $cam --frames 60 --warm 60 --json artifacts/census/pass-$cam.json
          done
      - name: Render-scale settle
        env:
          TRACK: ${{ inputs.track || 'monaco' }}
        run: node tools/gfx/res-scale-census.mjs --track "$TRACK" --webgpu --json artifacts/census/res-scale.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-census-webgpu
          path: artifacts/census/

  request-admission:
    concurrency:
      group: actions-claim
      queue: max
    name: Record request for bounded Actions admission
    if: ${{ vars.ACTIONS_COORDINATOR_MODE == 'active' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Trusted request adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/f1-game-project-26h3ng
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve the request without starting its expensive work
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_WORKFLOW: perf-census-webgpu.yml
        run: node tools/ci/actions/cli.mjs request --workflow "$REQUEST_WORKFLOW" --event-file "$GITHUB_EVENT_PATH"
