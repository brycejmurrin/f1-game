name: Merge attribution

# Reports merges to the deploy branch that carry no `Merged-by:` trailer (tools/ci/merge-attribution.mjs;
# docs/notes/FLEET-ADAPTIVE-COORDINATION-2026-10-22.md §8). merge-gate.mjs prints the trailer for agents; a merge
# without one is presumed to be a Bryce UI merge. It only reports: nothing is paused or frozen.
#
# JOB SUMMARY ONLY, NO PR COMMENTS (audit 2026-10-26, lane X3): the comment form posted 60 "who merged this?" comments
# in 7 days and none was answered, so it was noise on merged PRs. The rows now go to the run's job summary plus one
# ::notice annotation per run that found an unattributed merge; a session that wants the bus line runs
# `node tools/ci/merge-attribution.mjs --no-comment` (the bus needs a session identity this job does not have).
# Job summaries: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#adding-a-job-summary
#
# Why a push workflow and not a session prompt: a push trigger reacts within seconds of the merge, costs no session
# tokens, and needs no session alive. Node built-ins only: no npm install, seconds of runner time.
# The merge API's commit_message (the trailer's carrier): https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request

on:
  push:
    branches: [claude/f1-game-project-26h3ng]

permissions: {}

concurrency:
  group: merge-attribution
  cancel-in-progress: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # fetch-only; the repo is public
          fetch-depth: 0
          filter: blob:none
      - name: Report unattributed merges
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$BEFORE" in 0000000000000000000000000000000000000000|"") RANGE="${AFTER}~1..${AFTER}" ;; *) RANGE="${BEFORE}..${AFTER}" ;; esac
          node tools/ci/merge-attribution.mjs --range "$RANGE" --no-bus --no-comment | tee "$RUNNER_TEMP/attr.txt"
          {
            echo "### Merge attribution ($RANGE)"
            echo '```'
            cat "$RUNNER_TEMP/attr.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(grep -c '^UNATTRIBUTED' "$RUNNER_TEMP/attr.txt" || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=merge-attribution::$n merge(s) without a Merged-by: trailer (presumed Bryce UI merges); rows in the job summary"
          fi
