name: Hardware WebGPU urban screenshots
run-name: Hardware WebGPU city screenshots on ${{ github.ref_name }}

# Small, explicit art capture. The adapter census is a hard gate: a WebGPU API
# label alone does not prove a physical GPU rendered the following images.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-urban-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - name: Install full Chromium
        run: npx playwright install chromium
      - name: Require a real WebGPU adapter
        run: |
          mkdir -p artifacts/webgpu-urban-gallery
          node tools/gfx/gpu-census.mjs --json artifacts/webgpu-urban-gallery/gpu-census.json
          node -e 'const c=require("./artifacts/webgpu-urban-gallery/gpu-census.json"); if(c.anyHardware!==true) throw new Error("GPU census did not identify a hardware WebGPU adapter: "+JSON.stringify(c.runs.map(x=>({flags:x.flags,verdict:x.verdict,adapter:x.adapter}))));'
      - name: Capture city traffic scenes at 4K
        run: node tools/shot/webgpu-urban-gallery.mjs
      - name: Upload full-resolution images and capture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-urban-gallery-${{ github.sha }}
          path: artifacts/webgpu-urban-gallery/
          if-no-files-found: warn
          retention-days: 14
