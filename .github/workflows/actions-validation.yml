name: Actions validation
on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/labels.json'
      - 'tools/ci/actions/**'
      - 'tests/unit/actions-*.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/labels.json'
      - 'tools/ci/actions/**'
      - 'tests/unit/actions-*.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actions-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Actions validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Behavioral Actions tests
        run: node --test tests/unit/actions-*.test.mjs
      - name: Install the pinned workflow validator
        env:
          GOBIN: ${{ runner.temp }}/actions-validation-bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate every workflow
        env:
          ACTIONLINT: ${{ runner.temp }}/actions-validation-bin/actionlint
        run: '"$ACTIONLINT" -shellcheck="" -pyflakes="" .github/workflows/*.yml'
      - name: Write evidence only after behavioral tests and workflow validation pass
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = ref => execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          fs.mkdirSync('artifacts/actions-validation', { recursive: true });
          fs.writeFileSync('artifacts/actions-validation/evidence.json', JSON.stringify({
            policyVersion: 'actions-v1', sourceSha: git('HEAD'), treeSha: git('HEAD^{tree}'), passed: true,
          }, null, 2) + '\n');
          JS
      - name: Upload candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actions-validation-${{ github.run_attempt }}
          path: artifacts/actions-validation/evidence.json
          if-no-files-found: error
          retention-days: 30
