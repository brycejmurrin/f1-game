name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/f1-game-project-26h3ng]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages serves ONE deployment at a time per environment — that is a
# constraint on the DEPLOY step, not on CI. This workflow used to put
# `concurrency:` at the WORKFLOW level, which serialized the entire ci+deploy
# pipeline behind one lock and produced two failure modes, tried and reverted
# in turn on 2026-08-12 under the heavy multi-agent push volume this branch
# sees:
#
#   cancel-in-progress: true  — a burst of pushes cancels each other's deploys
#     before any of them reaches deploy-pages, so the live site can go a long
#     way (build 971 vs a 1145+ tip, measured) without ever landing a build.
#   cancel-in-progress: false — a push's WHOLE pipeline (five ci.yml reusable
#     jobs, easily 10+ minutes) blocks every later push's CI from even
#     STARTING, so a slow or runner-starved run wedges the queue just as
#     badly (live stuck at 1126 while the tip was already 1141+).
#
# Both symptoms trace to the same mistake: locking CI, which needs no
# serialization at all (GitHub happily runs many CI jobs in parallel), for a
# constraint that only actually applies to the Pages upload. Moving
# `concurrency` onto the `deploy` job alone fixes it structurally rather than
# picking a lesser evil: every push's `ci` job now runs immediately and in
# parallel with no queue, so CI feedback stays fast regardless of push volume,
# and only the short deploy-pages step at the tail end waits its turn — a
# wait measured in the tens of seconds a Pages upload takes, not the whole CI
# pipeline. cancel-in-progress: false there is now safe (it is what the
# official Pages starter workflow ships) because there is nothing left
# upstream of it to wedge.
jobs:
  # The deploy gate. This workflow used to ship whatever was pushed, without
  # running a single test — so a red suite reached the live site silently. The
  # deploy job now `needs:` this, which means a failing guard blocks the deploy
  # instead of merely being available to a human who might run it. Unlocked
  # (no concurrency group) on purpose — see the comment above.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Forward the push's before SHA so the sweeps filter can skip when this
      # deploy touch cannot move circuit geometry. Without it, workflow_call
      # always fail-safed into a full 15-minute sweep on every Pages push.
      before_sha: ${{ github.event.before }}
      # Reusable-workflow concurrency otherwise groups every Pages call by this
      # branch and GitHub cancels the older pending gate when another push lands.
      concurrency_key: pages-${{ github.run_id }}

  # Keep runs that CANNOT truthfully publish out of the environment entirely. An
  # environment job is itself a GitHub deployment: letting such a run enter it
  # and then skip deploy-pages records a misleading successful deployment for
  # bytes that were never published. This early check is an
  # optimisation/truthfulness guard; deploy repeats it under the Pages lock.
  #
  # SUPERSEDED IS NOT OBSOLETE (2026-09-02). This gate used to demand
  # `TIP == GITHUB_SHA` and drop everything else, which STARVED the site under
  # this branch's real push rate: ci is ~13 minutes and pushes land every ~6, so
  # almost every run was superseded halfway through its own gate. Measured: runs
  # 1892, 1893, 1894 and 1896 all went GREEN and all skipped deploy, and the live
  # site sat on build 7320 (a8d5afed, run 1891) for over an hour while four
  # gated commits waited behind it. The guard was not wrong about the hazard —
  # publishing an older tree over a newer one is a real regression — it was
  # wrong that discarding the run is the only way to avoid it.
  #
  # A run whose commit is an ANCESTOR of the tip is not stale, it is early: the
  # tip contains everything this run gated plus more. So publish the TIP rather
  # than this SHA and the hazard cannot arise — every deploy moves the site
  # forward, whichever run reaches the Pages slot first. What still fails hard is
  # a SHA that is not an ancestor at all (a force-push or a rewritten history),
  # because publishing then really could move the site backwards.
  #
  # The cost, stated plainly: the published tip can include a commit whose own ci
  # run has not finished. That is acceptable HERE and only here — every push to
  # this branch goes through `tools/deploy.mjs`, which runs the Pages gate's node
  # suites before it pushes — and it is strictly better than the status quo,
  # which published nothing at all.
  current-tip:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # merge-base needs the history, not just the tip
      - name: Can this run still publish?
        id: tip
        run: |
          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          TIP=$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "this run IS the tip; publishing $GITHUB_SHA"
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$TIP"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "SUPERSEDED but publishable: $GITHUB_SHA is an ancestor of $TIP — deploy will publish the TIP"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING DEPLOY: $GITHUB_SHA is not an ancestor of the branch tip $TIP (history was rewritten)"
          fi

  deploy:
    needs: current-tip
    if: needs.current-tip.outputs.deploy == 'true'
    # The ONLY step that actually touches GitHub's single-slot Pages queue.
    # See the top-of-file comment for why this moved off the workflow level.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      build: ${{ steps.stamp.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The generation is 2000 + the commit count (see "Stamp the shell
          # generation"); a depth-1 checkout would count 1.
          fetch-depth: 0
      # A newer push can land after current-tip passes or while this job waits
      # for the serialized Pages slot, so the tip is re-read HERE, inside the
      # lock, and it is the tip — not GITHUB_SHA — that gets published (see the
      # current-tip comment: superseded is early, not stale). Checking out the
      # tip here also means every later step — Stage site, the commit-count
      # generation, apex-sha — describes the bytes actually going out.
      # Failure is deliberate and still absolute: once an environment job exists
      # it must not report success unless deploy-pages really publishes.
      - name: Resolve and check out the branch tip inside the Pages lock
        id: tipsha
        run: |
          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          TIP=$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$TIP"; then
            echo "::error::REFUSING DEPLOY: $GITHUB_SHA is not an ancestor of the branch tip $TIP — history was rewritten and publishing could move the site backwards"
            exit 1
          fi
          git checkout --detach "$TIP"
          echo "sha=$TIP" >> "$GITHUB_OUTPUT"
          if [ "$TIP" = "$GITHUB_SHA" ]; then echo "publishing this run's own commit $TIP";
          else echo "publishing the TIP $TIP (this run gated the ancestor $GITHUB_SHA)"; fi
      - uses: actions/configure-pages@v5
      # Stage ONLY the runtime files. Uploading the repo root shipped a ~174 MB
      # artifact (142 MB of tests/ visual-regression snapshots + node_modules)
      # for a ~14 MB site — slow enough to hit the 10-minute Pages deployment
      # timeout.
      #
      # vendor/ IS a runtime directory and was missing here until build 893.
      # Everything reached by dynamic import lives in it — trystero (room
      # codes), rapier (debris), jsQR (invite scanning), three.js — so each of
      # those 404'd on the deployed site while working perfectly in every local
      # run, because a local run serves the repo root. The room-code path was
      # the one that reported it, as "could not load the room service".
      #
      # tests/unit/deploy-staging.test.mjs asserts this list covers every top-level
      # directory the shipped code can fetch: an allow-list that has to be
      # edited by hand fails silently and late, so it is pinned by a test
      # rather than by this comment.
      #
      # .nojekyll goes up too — Pages otherwise runs the tree through Jekyll,
      # which has its own opinions about which files deserve to exist.
      - name: Stage site
        run: |
          mkdir -p _site
          # bench.html is a ROOT page like index.html, not something js/ or css/
          # sweeps up, so it needs naming here or it 404s on the live site — which
          # is exactly what happened on build 7377, the first deploy that carried
          # it. Anything else added at the repo root needs the same line.
          cp index.html bench.html version.json manifest.json sw.js _site/
          cp .nojekyll _site/
          cp -r js css icons assets vendor _site/
      # THE SHELL GENERATION IS STAMPED HERE, NOT COMMITTED (2026-09-01).
      # 2000 + `git rev-list --count HEAD` on a fast-forward-only branch is an
      # integer, monotonic and unique per tip, so two sessions can never land
      # the same build and no deploy conflicts on version.json or the
      # index.html hashes again (before: 34 of 105 builds were introduced by
      # 2-3 commits; 144 of the last 200 commits touched version.json). The
      # 2000 offset keeps every stamped build above the last COMMITTED one
      # (1689) so no client is told a lower number and refuses to reload
      # (index.html: `v.build <= loaded` -> stay). `--root _site` rehashes the
      # staged tags too, so the committed placeholder only has to be
      # consistent, never current. <meta name="apex-sha"> records provenance,
      # because the deployed shell no longer equals the committed bytes.
      - name: Stamp the shell generation
        id: stamp
        run: |
          set -eu
          # HEAD is the TIP (checked out above), not GITHUB_SHA — so the count,
          # the staged bytes and apex-sha all describe one commit: the one being
          # published. Still monotonic: the tip's count only ever grows.
          PUBLISH_SHA="${{ steps.tipsha.outputs.sha }}"
          BUILD=$(( 2000 + $(git rev-list --count HEAD) ))
          node tools/bump-cache.mjs --apply --at "$BUILD" --root _site
          sed -i "s|<meta name=\"apex-build\" content=\"$BUILD\">|<meta name=\"apex-build\" content=\"$BUILD\">\n<meta name=\"apex-sha\" content=\"$PUBLISH_SHA\">|" _site/index.html
          grep -q 'name="apex-sha"' _site/index.html
          node tools/bump-cache.mjs --check --json --root _site
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "stamped build $BUILD for $PUBLISH_SHA"
      # Artifact name is scoped to the RUN ATTEMPT: artifacts survive across
      # re-run attempts of the same run, so a re-run after a failed deploy left
      # multiple artifacts named "github-pages" in the run and deploy-pages@v4
      # aborted with "Multiple artifacts named github-pages were unexpectedly
      # found". A per-attempt name keeps every attempt's upload unique.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
  # The live check the container cannot do: this runner reaches github.io. A
  # deploy is not done until the Pages CDN serves the build just stamped.
  verify-live:
    name: Live version.json equals the stamped build
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll the live version.json
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD: ${{ needs.deploy.outputs.build }}
        run: |
          set -u
          for i in $(seq 1 24); do
            LIVE=$(curl -fsS "${PAGE_URL%/}/version.json?_=${GITHUB_RUN_ID}-$i" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).build))}catch(_){}})' || true)
            echo "attempt $i: live=${LIVE:-?} expected=$BUILD"
            if [ "${LIVE:-}" = "$BUILD" ]; then
              curl -fsS "${PAGE_URL%/}/index.html?_=${GITHUB_RUN_ID}" | grep -q "name=\"apex-build\" content=\"$BUILD\"" && echo "live shell carries build $BUILD" && exit 0
            fi
            sleep 10
          done
          echo "::error::live version.json never reached build $BUILD within 4 minutes"
          exit 1
