name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/f1-game-project-26h3ng]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# THE CONTRACT (2026-09-10): a run tests ONE commit, stages THAT commit, and
# publishes THAT artifact — never the branch tip, never anything its own gate
# did not see. Two rules make that livable under this branch's push rate
# (ci is ~13 minutes; pushes have landed every ~6):
#
#   1. NEWEST WINS. The `ci` job carries a per-branch concurrency group with
#      cancel-in-progress, so a newer push cancels an older run's gate instead
#      of leaving it to go green and then either publish stale bytes or skip.
#      Under a burst the site moves to the newest commit once that commit
#      alone passes; nothing ever ships untested.
#   2. MONOTONIC. Before entering the environment, and again under the Pages
#      lock, `tools/ci/pages-publishable.sh` reads the live shell's apex-sha
#      and publishes only if it is an ancestor of this run's commit. An older
#      run that reaches the lock after a newer one has published stops there.
#
# What this replaces, and why (kept short; the runs are in the history):
#   - 2026-08-12: workflow-level concurrency. cancel-in-progress: true starved
#     the site (build 971 vs a 1145+ tip); false wedged every later push behind
#     one slow pipeline. Fix: lock only the deploy job.
#   - 2026-09-02: an exact-SHA gate ("TIP == GITHUB_SHA or skip") left the site
#     on build 7320 for an hour while four green runs each skipped. Fix at the
#     time: publish the branch TIP from any green ancestor run — which meant a
#     commit could ship while its own gate was unfinished or failing. That was
#     justified by "every push goes through deploy.mjs, which runs the node
#     suites first"; PRs merged through GitHub do not, so the premise expired.
#     This file's contract closes that path.
jobs:
  # The deploy gate: every job in ci.yml, aggregated by `needs: ci` below.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Forward the push's before SHA so the sweeps filter can skip when this
      # deploy touch cannot move circuit geometry. Without it, workflow_call
      # always fail-safed into a full 15-minute sweep on every Pages push.
      before_sha: ${{ github.event.before }}
      # A unique key keeps ci.yml's OWN concurrency group out of the way; the
      # group that matters is the one on this job.
      concurrency_key: pages-${{ github.run_id }}
    # NEWEST WINS (rule 1 above). One group per branch; a newer push cancels
    # this gate. A dispatched redeploy shares the group on purpose: a push that
    # lands during it is newer, and newer is what gets published.
    concurrency:
      group: pages-gate-${{ github.ref }}
      cancel-in-progress: true

  # Keep runs that CANNOT publish out of the environment entirely. An
  # environment job is itself a GitHub deployment: letting such a run enter it
  # and then skip deploy-pages records a misleading successful deployment for
  # bytes that were never published. The deploy job repeats this check under
  # the Pages lock, because the answer can change while a run waits for it.
  publishable:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pub.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # merge-base needs the history, not just the tip
      - name: Is this commit still worth publishing?
        id: pub
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: echo "publish=$(bash tools/ci/pages-publishable.sh "$GITHUB_SHA" "$SITE_URL")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publishable
    if: needs.publishable.outputs.deploy == 'true'
    # The ONLY step that actually touches GitHub's single-slot Pages queue.
    # cancel-in-progress stays false: a publish in flight is never interrupted,
    # and a newer run simply queues behind it and publishes next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      build: ${{ steps.stamp.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      # GITHUB_SHA, checked out as-is: the commit the gate above tested is the
      # commit that gets staged, stamped and published. Nothing here re-reads
      # the branch tip.
      - uses: actions/checkout@v4
        with:
          # The generation is 2000 + the commit count (see "Stamp the shell
          # generation"); a depth-1 checkout would count 1.
          fetch-depth: 0
      # Rule 2, repeated inside the lock: a newer commit may have published
      # while this run waited. Failure is deliberate and absolute — once an
      # environment job exists it must not report success unless deploy-pages
      # really publishes, and it must never publish an older tree over a newer.
      - name: Confirm this commit may still be published (under the Pages lock)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "$(bash tools/ci/pages-publishable.sh "$GITHUB_SHA" "$SITE_URL")" != "true" ]; then
            echo "::error::REFUSING DEPLOY: a newer build went live while this run waited for the Pages lock (or history diverged); $GITHUB_SHA is not published"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      # Stage ONLY the runtime files. Uploading the repo root shipped a ~174 MB
      # artifact (142 MB of tests/ visual-regression snapshots + node_modules)
      # for a ~14 MB site — slow enough to hit the 10-minute Pages deployment
      # timeout.
      #
      # vendor/ IS a runtime directory and was missing here until build 893.
      # Everything reached by dynamic import lives in it — trystero (room
      # codes), rapier (debris), jsQR (invite scanning), three.js — so each of
      # those 404'd on the deployed site while working perfectly in every local
      # run, because a local run serves the repo root. The room-code path was
      # the one that reported it, as "could not load the room service".
      #
      # tests/unit/deploy-staging.test.mjs asserts this list covers every top-level
      # directory the shipped code can fetch: an allow-list that has to be
      # edited by hand fails silently and late, so it is pinned by a test
      # rather than by this comment.
      #
      # .nojekyll goes up too — Pages otherwise runs the tree through Jekyll,
      # which has its own opinions about which files deserve to exist.
      - name: Stage site
        run: |
          mkdir -p _site
          # bench.html is a ROOT page like index.html, not something js/ or css/
          # sweeps up, so it needs naming here or it 404s on the live site — which
          # is exactly what happened on build 7377, the first deploy that carried
          # it. Anything else added at the repo root needs the same line.
          cp index.html bench.html version.json manifest.json sw.js _site/
          cp .nojekyll _site/
          cp -r js css icons assets vendor _site/
      # THE SHELL GENERATION IS STAMPED HERE, NOT COMMITTED (2026-09-01).
      # 2000 + `git rev-list --count HEAD` on a fast-forward-only branch is an
      # integer, monotonic and unique per tip, so two sessions can never land
      # the same build and no deploy conflicts on version.json or the
      # index.html hashes again (before: 34 of 105 builds were introduced by
      # 2-3 commits; 144 of the last 200 commits touched version.json). The
      # 2000 offset keeps every stamped build above the last COMMITTED one
      # (1689) so no client is told a lower number and refuses to reload
      # (index.html: `v.build <= loaded` -> stay). `--root _site` rehashes the
      # staged tags too, so the committed placeholder only has to be
      # consistent, never current. <meta name="apex-sha"> records provenance —
      # and is what pages-publishable.sh reads back to keep deploys monotonic.
      - name: Stamp the shell generation
        id: stamp
        run: |
          set -eu
          # HEAD is GITHUB_SHA: the count, the staged bytes and apex-sha all
          # describe the one commit this run tested and is publishing.
          PUBLISH_SHA="$GITHUB_SHA"
          BUILD=$(( 2000 + $(git rev-list --count HEAD) ))
          node tools/ci/bump-cache.mjs --apply --at "$BUILD" --root _site
          sed -i "s|<meta name=\"apex-build\" content=\"$BUILD\">|<meta name=\"apex-build\" content=\"$BUILD\">\n<meta name=\"apex-sha\" content=\"$PUBLISH_SHA\">|" _site/index.html
          grep -q 'name="apex-sha"' _site/index.html
          node tools/ci/bump-cache.mjs --check --json --root _site
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "stamped build $BUILD for $PUBLISH_SHA"
      # Artifact name is scoped to the RUN ATTEMPT: artifacts survive across
      # re-run attempts of the same run, so a re-run after a failed deploy left
      # multiple artifacts named "github-pages" in the run and deploy-pages@v4
      # aborted with "Multiple artifacts named github-pages were unexpectedly
      # found". A per-attempt name keeps every attempt's upload unique.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
  # The live check the container cannot do: this runner reaches github.io. A
  # deploy is not done until the Pages CDN serves the build just stamped.
  verify-live:
    name: Live version.json equals the stamped build
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll the live version.json
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD: ${{ needs.deploy.outputs.build }}
        run: |
          set -u
          for i in $(seq 1 24); do
            LIVE=$(curl -fsS "${PAGE_URL%/}/version.json?_=${GITHUB_RUN_ID}-$i" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).build))}catch(_){}})' || true)
            echo "attempt $i: live=${LIVE:-?} expected=$BUILD"
            if [ "${LIVE:-}" = "$BUILD" ]; then
              curl -fsS "${PAGE_URL%/}/index.html?_=${GITHUB_RUN_ID}" | grep -q "name=\"apex-build\" content=\"$BUILD\"" && echo "live shell carries build $BUILD" && exit 0
            fi
            sleep 10
          done
          echo "::error::live version.json never reached build $BUILD within 4 minutes"
          exit 1
