name: Deploy to GitHub Pages

on:
  # THE RELEASE TRAIN (2026-09-10). Not on push. This branch takes 140-300
  # commits a day from several agents; a deploy per push meant a 14-job gate
  # and a Pages deployment per commit, gates cancelling each other in bursts,
  # and the account's 20 job slots spent on re-testing trees that were one
  # commit apart. The train takes the tip three times an hour, gates it once,
  # and publishes exactly that commit. A dispatch is "deploy now". Pushes to
  # the deploy branch still get ci.yml's FAST tier (guards, node suites,
  # census, change-aware selection) within minutes — that is the verdict an
  # agent waits for; the full gate is the train's. Off the hour on purpose:
  # GitHub's cron is slowest at :00.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

env:
  # The ONE declaration of the deploy branch. A schedule runs on the default
  # branch, which is this one; the verdict job refuses anything else, so a
  # dispatch from another branch cannot publish it.
  DEPLOY_BRANCH: claude/f1-game-project-26h3ng

permissions:
  contents: read
  pages: write
  id-token: write

# THE CONTRACT (2026-09-10): a run tests ONE commit, stages THAT commit, and
# publishes THAT artifact — never the branch tip, never anything its own gate
# did not see. Three rules make that livable under this branch's push rate
# (ci is ~13 minutes; pushes have landed every ~6):
#
#   1. ONE TRAIN AT A TIME. The `ci` job carries a per-branch concurrency
#      group WITHOUT cancel-in-progress: a running gate finishes, the next
#      tick waits as the one pending run, and a further tick replaces that
#      pending one. Bounded lag (a tick plus one gate), no starvation, no
#      gate ever killed a spec from green. `verdict` runs outside the group
#      and answers first whether there is anything new to publish at all.
#   2. MONOTONIC. Before entering the environment, and again under the Pages
#      lock, `tools/ci/pages-publishable.sh` reads the live shell's apex-sha
#      and publishes only if it is an ancestor of this run's commit. An older
#      run that reaches the lock after a newer one has published stops there.
#   3. REUSE, NEVER RE-RUN THE SAME TREE. A merge made through GitHub is a
#      new commit, so every PR merge paid the full gate a second time even
#      when the PR run had tested the very same files. `verdict` compares
#      tree hashes: when this commit's tree equals a parent's, and that
#      parent has a completed successful ci.yml or pages.yml run, the gate is
#      skipped and the run goes straight to `publishable`. The tree is the
#      proof — same files means same workflow, same tests, same result. A
#      merge whose base moved has a different tree and gets its own gate.
#
# What this replaces, and why (kept short; the runs are in the history):
#   - 2026-08-12: workflow-level concurrency. cancel-in-progress: true starved
#     the site (build 971 vs a 1145+ tip); false wedged every later push behind
#     one slow pipeline. Fix: lock only the deploy job.
#   - 2026-09-02: an exact-SHA gate ("TIP == GITHUB_SHA or skip") left the site
#     on build 7320 for an hour while four green runs each skipped. Fix at the
#     time: publish the branch TIP from any green ancestor run — which meant a
#     commit could ship while its own gate was unfinished or failing. That was
#     justified by "every push goes through deploy.mjs, which runs the node
#     suites first"; PRs merged through GitHub do not, so the premise expired.
#     This file's contract closes that path.
jobs:
  # Rule 3. Cheap (one checkout, one API call) and never cancelled: it does
  # not share the gate's concurrency group. Any lookup failure is reuse=false,
  # which costs exactly the gate run every commit paid before this existed.
  verdict:
    name: Anything new, and was this exact tree already gated?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      nothing_new: ${{ steps.live.outputs.nothing_new }}
      since: ${{ steps.live.outputs.since }}
      reuse: ${{ steps.v.outputs.reuse }}
      source: ${{ steps.v.outputs.source }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the parents' trees and the live commit are the whole question
      - name: Refuse to run off the deploy branch
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEPLOY_BRANCH" ]; then
            echo "::error::pages.yml publishes $DEPLOY_BRANCH only; this run is on $GITHUB_REF_NAME"
            exit 1
          fi
      # A train tick with nothing new stops here: one slot for thirty seconds
      # instead of a 14-job gate that would end in "already live". `since` is
      # the live commit when it is an ancestor of this one — the exact base
      # for the sweeps and selection filters ("what changed since what is
      # live?") — and empty otherwise, which those filters read as "run all".
      - name: What is live, and is this tip newer?
        id: live
        run: |
          set -u
          # Built from the default env, not github.event.repository — the
          # schedule payload is not a push payload.
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          LIVE="$(bash tools/ci/pages-live-sha.sh "$SITE_URL")"
          if [ -z "$LIVE" ]; then
            echo "::warning::live apex-sha unreadable; gating the whole tip"
            echo "nothing_new=false" >> "$GITHUB_OUTPUT"; echo "since=" >> "$GITHUB_OUTPUT"
          elif [ "$LIVE" = "$GITHUB_SHA" ]; then
            echo "live is already $GITHUB_SHA — nothing to publish"
            echo "nothing_new=true" >> "$GITHUB_OUTPUT"; echo "since=$LIVE" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${LIVE}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$LIVE" "$GITHUB_SHA"; then
            echo "live $LIVE is an ancestor; gating the diff since it"
            echo "nothing_new=false" >> "$GITHUB_OUTPUT"; echo "since=$LIVE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::live $LIVE is not an ancestor of $GITHUB_SHA; gating the whole tip (publishable decides later)"
            echo "nothing_new=false" >> "$GITHUB_OUTPUT"; echo "since=" >> "$GITHUB_OUTPUT"
          fi
      - name: Look for a completed successful gate on this tree
        id: v
        if: steps.live.outputs.nothing_new != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/pages-reuse-verdict.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Say so in the run summary
        env:
          NOTHING_NEW: ${{ steps.live.outputs.nothing_new }}
          REUSE: ${{ steps.v.outputs.reuse }}
          SOURCE: ${{ steps.v.outputs.source }}
          RUN: ${{ steps.v.outputs.run }}
        run: |
          if [ "$NOTHING_NEW" = "true" ]; then
            echo "**Nothing new**: the live site already serves \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REUSE" = "true" ]; then
            echo "**Gate reused**: \`$GITHUB_SHA\` has the same tree as \`$SOURCE\`, which already passed $RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Gate runs**: no completed successful run found for this tree" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The deploy gate: every job in ci.yml, aggregated by `needs: ci` below.
  # Skipped when nothing is new, or when rule 3 found the same tree gated.
  ci:
    needs: verdict
    if: needs.verdict.outputs.nothing_new != 'true' && needs.verdict.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      # The live commit, when it is an ancestor of this tip: the sweeps and
      # selection filters diff against exactly what is live. Empty means
      # unknown, and every filter in ci.yml reads empty as "run everything".
      before_sha: ${{ needs.verdict.outputs.since }}
      # A unique key keeps ci.yml's OWN concurrency group out of the way; the
      # group that matters is the one on this job. It also tells ci.yml this
      # is the deploy gate (full tier, never the fast one).
      concurrency_key: pages-${{ github.run_id }}
    # ONE TRAIN AT A TIME (rule 1 above). One group per branch, no cancel: a
    # running gate finishes, the next tick waits, a later tick replaces the
    # waiting one. A dispatch shares the group and queues the same way.
    concurrency:
      group: pages-gate-${{ github.ref }}
      cancel-in-progress: false

  # Keep runs that CANNOT publish out of the environment entirely. An
  # environment job is itself a GitHub deployment: letting such a run enter it
  # and then skip deploy-pages records a misleading successful deployment for
  # bytes that were never published. The deploy job repeats this check under
  # the Pages lock, because the answer can change while a run waits for it.
  publishable:
    needs: [verdict, ci]
    # A skipped `needs` job skips its dependents unless the condition says
    # otherwise, so this spells out the two ways in: the gate passed, or the
    # gate was skipped BECAUSE the verdict reused an earlier pass. A failed or
    # cancelled gate matches neither and the run stops here.
    if: ${{ !cancelled() && needs.verdict.result == 'success' && needs.verdict.outputs.nothing_new != 'true' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.verdict.outputs.reuse == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pub.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # merge-base needs the history, not just the tip
      - name: Is this commit still worth publishing?
        id: pub
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "publish=$(bash tools/ci/pages-publishable.sh "$GITHUB_SHA" "$SITE_URL")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publishable
    # `!cancelled()` is load-bearing, not decoration: a job's implicit
    # success() looks at every job upstream of it, TRANSITIVELY, so when the
    # gate was skipped (nothing new, or a reused pass) this job was skipped too
    # even though publishable ran and said yes (run 2237, 2026-09-10). The
    # explicit result check keeps the failure semantics: a failed or skipped
    # publishable still stops here.
    if: ${{ !cancelled() && needs.publishable.result == 'success' && needs.publishable.outputs.deploy == 'true' }}
    # The ONLY step that actually touches GitHub's single-slot Pages queue.
    # cancel-in-progress stays false: a publish in flight is never interrupted,
    # and a newer run simply queues behind it and publishes next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      build: ${{ steps.stamp.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      # GITHUB_SHA, checked out as-is: the commit the gate above tested is the
      # commit that gets staged, stamped and published. Nothing here re-reads
      # the branch tip.
      - uses: actions/checkout@v4
        with:
          # The generation is 2000 + the commit count (see "Stamp the shell
          # generation"); a depth-1 checkout would count 1.
          fetch-depth: 0
      # Rule 2, repeated inside the lock: a newer commit may have published
      # while this run waited. Failure is deliberate and absolute — once an
      # environment job exists it must not report success unless deploy-pages
      # really publishes, and it must never publish an older tree over a newer.
      - name: Confirm this commit may still be published (under the Pages lock)
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          if [ "$(bash tools/ci/pages-publishable.sh "$GITHUB_SHA" "$SITE_URL")" != "true" ]; then
            echo "::error::REFUSING DEPLOY: a newer build went live while this run waited for the Pages lock (or history diverged); $GITHUB_SHA is not published"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      # Stage ONLY the runtime files. Uploading the repo root shipped a ~174 MB
      # artifact (142 MB of tests/ visual-regression snapshots + node_modules)
      # for a ~14 MB site — slow enough to hit the 10-minute Pages deployment
      # timeout.
      #
      # vendor/ IS a runtime directory and was missing here until build 893.
      # Everything reached by dynamic import lives in it — trystero (room
      # codes), rapier (debris), jsQR (invite scanning), three.js — so each of
      # those 404'd on the deployed site while working perfectly in every local
      # run, because a local run serves the repo root. The room-code path was
      # the one that reported it, as "could not load the room service".
      #
      # tests/unit/deploy-staging.test.mjs asserts this list covers every top-level
      # directory the shipped code can fetch: an allow-list that has to be
      # edited by hand fails silently and late, so it is pinned by a test
      # rather than by this comment.
      #
      # .nojekyll goes up too — Pages otherwise runs the tree through Jekyll,
      # which has its own opinions about which files deserve to exist.
      - name: Stage site
        run: |
          mkdir -p _site
          # bench.html is a ROOT page like index.html, not something js/ or css/
          # sweeps up, so it needs naming here or it 404s on the live site — which
          # is exactly what happened on build 7377, the first deploy that carried
          # it. Anything else added at the repo root needs the same line.
          cp index.html bench.html version.json manifest.json sw.js _site/
          cp .nojekyll _site/
          cp -r js css icons assets vendor _site/
      # THE SHELL GENERATION IS STAMPED HERE, NOT COMMITTED (2026-09-01).
      # 2000 + `git rev-list --count HEAD` on a fast-forward-only branch is an
      # integer, monotonic and unique per tip, so two sessions can never land
      # the same build and no deploy conflicts on version.json or the
      # index.html hashes again (before: 34 of 105 builds were introduced by
      # 2-3 commits; 144 of the last 200 commits touched version.json). The
      # 2000 offset keeps every stamped build above the last COMMITTED one
      # (1689) so no client is told a lower number and refuses to reload
      # (index.html: `v.build <= loaded` -> stay). `--root _site` rehashes the
      # staged tags too, so the committed placeholder only has to be
      # consistent, never current. <meta name="apex-sha"> records provenance —
      # and is what pages-publishable.sh reads back to keep deploys monotonic.
      - name: Stamp the shell generation
        id: stamp
        run: |
          set -eu
          # HEAD is GITHUB_SHA: the count, the staged bytes and apex-sha all
          # describe the one commit this run tested and is publishing.
          PUBLISH_SHA="$GITHUB_SHA"
          BUILD=$(( 2000 + $(git rev-list --count HEAD) ))
          node tools/ci/bump-cache.mjs --apply --at "$BUILD" --root _site
          sed -i "s|<meta name=\"apex-build\" content=\"$BUILD\">|<meta name=\"apex-build\" content=\"$BUILD\">\n<meta name=\"apex-sha\" content=\"$PUBLISH_SHA\">|" _site/index.html
          grep -q 'name="apex-sha"' _site/index.html
          node tools/ci/bump-cache.mjs --check --json --root _site
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "stamped build $BUILD for $PUBLISH_SHA"
      # Artifact name is scoped to the RUN ATTEMPT: artifacts survive across
      # re-run attempts of the same run, so a re-run after a failed deploy left
      # multiple artifacts named "github-pages" in the run and deploy-pages@v4
      # aborted with "Multiple artifacts named github-pages were unexpectedly
      # found". A per-attempt name keeps every attempt's upload unique.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
  # The live check the container cannot do: this runner reaches github.io. A
  # deploy is not done until the Pages CDN serves the build just stamped.
  verify-live:
    name: Live version.json equals the stamped build
    needs: deploy
    # Same transitive-skip rule as deploy: run exactly when deploy succeeded.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll the live version.json
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD: ${{ needs.deploy.outputs.build }}
        run: |
          set -u
          for i in $(seq 1 24); do
            LIVE=$(curl -fsS "${PAGE_URL%/}/version.json?_=${GITHUB_RUN_ID}-$i" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).build))}catch(_){}})' || true)
            echo "attempt $i: live=${LIVE:-?} expected=$BUILD"
            if [ "${LIVE:-}" = "$BUILD" ]; then
              curl -fsS "${PAGE_URL%/}/index.html?_=${GITHUB_RUN_ID}" | grep -q "name=\"apex-build\" content=\"$BUILD\"" && echo "live shell carries build $BUILD" && exit 0
            fi
            sleep 10
          done
          echo "::error::live version.json never reached build $BUILD within 4 minutes"
          exit 1
