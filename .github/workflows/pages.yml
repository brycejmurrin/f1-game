name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/f1-game-project-26h3ng]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages serves ONE deployment at a time per environment, and the deploy
# request lives on GitHub's backend independently of this Actions job. The
# official starter ships `cancel-in-progress: false` so a new push WAITS for the
# in-flight deploy instead of killing deploy-pages mid-upload (which can wedge
# the single-slot Pages queue until the 10-min timeout).
#
# THAT SETTING ALSO QUEUES FOREVER when the in-flight run never acquires a
# runner. Measured 2026-08-12: a burst of feature-branch CI left the deploy's
# five reusable-workflow jobs `pending` for >15 minutes while later pushes
# stacked behind them under `false` — live version.json stayed at 1126 while
# the tip was 1141+. Prefer cancelling a run that has not reached deploy-pages
# over an unbounded wait; the CI slim (skip advisory selected on workflow_call,
# forward before_sha so sweeps can no-op) cuts how long a deploy holds runners.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The deploy gate. This workflow used to ship whatever was pushed, without
  # running a single test — so a red suite reached the live site silently. The
  # deploy job now `needs:` this, which means a failing guard blocks the deploy
  # instead of merely being available to a human who might run it.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Forward the push's before SHA so the sweeps filter can skip when this
      # deploy touch cannot move circuit geometry. Without it, workflow_call
      # always fail-safed into a full 15-minute sweep on every Pages push.
      before_sha: ${{ github.event.before }}

  deploy:
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stage ONLY the runtime files. Uploading the repo root shipped a ~174 MB
      # artifact (142 MB of tests/ visual-regression snapshots + node_modules)
      # for a ~14 MB site — slow enough to hit the 10-minute Pages deployment
      # timeout.
      #
      # vendor/ IS a runtime directory and was missing here until build 893.
      # Everything reached by dynamic import lives in it — trystero (room
      # codes), rapier (debris), jsQR (invite scanning), three.js — so each of
      # those 404'd on the deployed site while working perfectly in every local
      # run, because a local run serves the repo root. The room-code path was
      # the one that reported it, as "could not load the room service".
      #
      # tests/unit/deploy-staging.test.mjs asserts this list covers every top-level
      # directory the shipped code can fetch: an allow-list that has to be
      # edited by hand fails silently and late, so it is pinned by a test
      # rather than by this comment.
      #
      # .nojekyll goes up too — Pages otherwise runs the tree through Jekyll,
      # which has its own opinions about which files deserve to exist.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html version.json manifest.json sw.js _site/
          cp .nojekyll _site/
          cp -r js css icons assets vendor _site/
      # Artifact name is scoped to the RUN ATTEMPT: artifacts survive across
      # re-run attempts of the same run, so a re-run after a failed deploy left
      # multiple artifacts named "github-pages" in the run and deploy-pages@v4
      # aborted with "Multiple artifacts named github-pages were unexpectedly
      # found". A per-attempt name keeps every attempt's upload unique.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
