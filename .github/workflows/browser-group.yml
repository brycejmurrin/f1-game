name: Browser group

# ONE browser group, sharded, and nothing else. Started by
# `node tools/ci/remote-group.mjs <group>` (or by hand) to get a verdict on a
# test:* group in minutes instead of the 30-45 a local SwiftShader run takes in
# a cloud container (no /dev/dri, so no llvmpipe there — playwright.config.js).
#
# WHY NOT `ci.yml` WITH `group:`. That dispatch works, but it is the whole CI
# workflow: on 2026-09-30 a `group: ui` dispatch started 25 jobs (unit slices,
# geometry sweeps, parts census, VR, driving model, structural guards …) to get
# the 4 Smoke shards that ran the group — ~20 of the account's 40 concurrent
# slots spent re-proving what the PR run had already proved. This workflow is
# those four shards and their setup, the same composite actions, the same env.
#
# SHARDS ARE PACKED BY TIME, NOT COUNT, AND THERE IS NO PLAN JOB (2026-10-14).
# The CLI computes the plan (tools/ci/remote-group.mjs shardPlan: the group's
# spec files longest-first onto the least-loaded shard by measured seconds, a
# fat spec cut into native `--shard=j/k` pieces) and sends it as the `plan`
# input; the matrix is read straight from it. Count shards drew the mega-sweep
# plus the 6-minute visual spec onto one runner (gfx 15.3 / 2.7 / 1.8 / 2.7
# min, run 38478672714; median run 14 min against ~5 min of test work), and the
# plan job was a second runner-queue wait in series (p90 15.8 min)
# (docs/notes/ACTIONS-AUDIT-2026-10-14.md). The plan is text from whoever
# dispatched: the shard step re-validates every path against package.json
# before anything is spawned, and no input is ever interpolated into a shell
# line. A hand dispatch with the default plan runs 4 count shards.
#
# NOT A GATE. Nothing requires it and nothing reads its timings (spec-timings.yml
# learns from the Pages train only); a PR's own ci.yml run still decides merge.
# It is a fast answer to "is this group green on my branch?".
#
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
#       https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event
#       https://docs.github.com/en/actions/reference/workflows-and-actions/contexts (inputs is available in jobs.<id>.strategy)

on:
  workflow_dispatch:
    inputs:
      group:
        description: "browser group from package.json (the part after test:), e.g. ui, input, hooks, tiny"
        required: true
        type: string
      plan:
        description: "shard plan JSON from `remote-group.mjs --plan` ({matrix:[{shard,total}…], shards?:[[spec|{file,shard}]…]}); the default is 4 count shards"
        required: false
        default: '{"matrix":[{"shard":1,"total":4},{"shard":2,"total":4},{"shard":3,"total":4},{"shard":4,"total":4}]}'
        type: string
      gl:
        description: "llvmpipe (Mesa, 8-12x faster) or swiftshader (the local renderer, to reproduce a local-only red)"
        required: false
        default: llvmpipe
        type: choice
        options: [llvmpipe, swiftshader]
      workers:
        description: "Playwright workers per shard; empty = plan default (1 for render-heavy groups, 2 for headless-ish on llvmpipe)"
        required: false
        default: ""
        type: string

# The group and branch are in the run's name, so the CLI (and a human in the
# Actions tab) can tell dispatches apart.
run-name: "browser group ${{ inputs.group }} on ${{ github.ref_name }} (${{ inputs.gl }})"

permissions:
  contents: read

# A second dispatch of the same group on the same branch supersedes the first.
# (remote-group.mjs reuses a live or green run of the same sha instead.)
concurrency:
  group: browser-group-${{ github.ref_name }}-${{ inputs.group }}
  cancel-in-progress: true

jobs:
  group:
    name: "${{ inputs.group }} (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan).matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      # Cached Chromium (not the Playwright Docker image): restore ≈ install on
      # Linux, and Mesa/Xvfb still need the host runner — see
      # docs/notes/SCREENSHOT-TOOL-SPEED-2026-10-10.md §Docker.
      - name: Playwright Chromium (cached)
        uses: ./.github/actions/playwright-chromium
      - name: Mesa llvmpipe + Xvfb
        if: inputs.gl != 'swiftshader'
        uses: ./.github/actions/mesa-xvfb
      # The same env ci.yml's dispatched-group step runs with. The step reads
      # every input through env; remote-group.mjs validates the group against
      # package.json, resolves empty workers (1 render-heavy / 2 headless-ish),
      # and runs this shard's units (or `--shard=i/n` for a count plan).
      - name: Run the group's shard (llvmpipe)
        if: inputs.gl != 'swiftshader'
        env:
          APEX_FAIL_ON_FLAKY: 1
          APEX_WITH_TWINNED: 1
          APEX_GL: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
          GL: llvmpipe
          GROUP: ${{ inputs.group }}
          PLAN: ${{ inputs.plan }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          WORKERS: ${{ inputs.workers }}
        run: node tools/ci/remote-group.mjs --run-shard
      - name: Run the group's shard (SwiftShader)
        if: inputs.gl == 'swiftshader'
        env:
          APEX_FAIL_ON_FLAKY: 1
          APEX_WITH_TWINNED: 1
          GL: swiftshader
          GROUP: ${{ inputs.group }}
          PLAN: ${{ inputs.plan }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          WORKERS: ${{ inputs.workers }}
        run: node tools/ci/remote-group.mjs --run-shard
      - name: Failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ inputs.group }}-${{ matrix.shard }}
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore
