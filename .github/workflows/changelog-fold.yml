name: Changelog fold

# THE OWNER OF THE CHANGELOG FOLD (audit 2026-10-26, lane X3). Every player-facing PR adds one
# docs/changelog.d/<slug>.md fragment and never edits CHANGELOG.md (docs/changelog.d/README.md), but nothing
# folded them: 507 fragments had piled up, the README named an `npm run fold` that did not exist, and a fold
# keyed to version.json would have filed them all under the frozen placeholder build 1695.
#
# Weekly (and on dispatch) this job runs `npm run fold` (tools/gen/gen-changelog.mjs --fold) on the deploy tip.
# The heading is that tip's STAMPED build, 2000 + `git rev-list --count HEAD` (tools/desktop/stage.mjs
# pagesBuild, the formula pages.yml stamps with), so it needs full history (fetch-depth 0). The entries are the
# ones landed by that build; a later deploy ships them too, never an earlier one. The result goes to
# bot/changelog-fold and a PR into the deploy branch, never a direct push (the branch is protected).
#
# A run is a no-op while an earlier fold PR is open or no fragment exists. A fold PR conflicts with no open
# PR: no PR edits CHANGELOG.md, and the fold deletes only fragments already on the deploy tip.
#
# CI FOR THE FOLD PR: a PR opened with GITHUB_TOKEN starts no `pull_request` run, but `workflow_dispatch`
# always does ("events triggered by the GITHUB_TOKEN will not create a new workflow run ... workflow_dispatch
# and repository_dispatch events always create workflow runs":
# https://docs.github.com/en/actions/concepts/security/github_token). The PR opens with LAND_TOKEN, so its own
# `pull_request` run starts; without LAND_TOKEN the job dispatches ci.yml on bot/changelog-fold instead
# (.github/actions/open-bot-pr, shared with ratchets-fold.yml and knowledge-gc.yml).
# Schedules fire hours late under load (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule);
# nothing here depends on the exact time, and the minute is off the hour.

on:
  schedule:
    - cron: "37 6 * * 1"   # Mondays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write    # the "fold PR needs a hand" issue when gh pr create is refused

concurrency:
  group: changelog-fold
  cancel-in-progress: false

jobs:
  fold:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # workflow_dispatch of ci.yml on bot/changelog-fold (the fold PR's CI)
    runs-on: ubuntu-latest
    # LAND_TOKEN can be scoped to the deploy branch in this environment; until then the repo secret serves.
    environment:
      name: land
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1   # zizmor: ignore[artipacked] this job commits and pushes bot/changelog-fold
        with:
          ref: claude/f1-game-project-26h3ng
          fetch-depth: 0   # pagesBuild refuses a shallow clone (its count would be the depth)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Skip while a fold PR is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/changelog-fold --state open --json number --jq length)"
          echo "open fold PRs: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Fold
        id: fold
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/gen/gen-changelog.mjs --check
          npm run -s fold | tee fold.log
          if git diff --quiet -- CHANGELOG.md docs/changelog.d; then
            echo "nothing to fold"; exit 0
          fi
          node tools/gen/gen-changelog.mjs --check
          cat fold.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name "apex-changelog-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -B bot/changelog-fold
          git add -A CHANGELOG.md docs/changelog.d
          git commit -m "chore(changelog): fold docs/changelog.d fragments

          $(cat fold.log)"
          git push --force-with-lease origin bot/changelog-fold
          PR_BODY="Scheduled fold: $(cat fold.log). Opened by .github/workflows/changelog-fold.yml. CHANGELOG: no player-facing change (this PR moves existing entries)."
          { echo "branch=bot/changelog-fold"; echo "body<<APEX_PR_BODY_EOF"; echo "$PR_BODY"; echo "APEX_PR_BODY_EOF"; } >> "$GITHUB_OUTPUT"

      # The PR opens with LAND_TOKEN, the token land.yml uses for its PR operations: this repository does not let
      # the default token create PRs (issue #5177). Without LAND_TOKEN the default token tries, and a refusal
      # fails the job and opens (or, after a day, re-pings) one issue: .github/actions/open-bot-pr.
      - name: Open the PR
        if: steps.fold.outputs.branch != ''
        uses: ./.github/actions/open-bot-pr
        with:
          branch: ${{ steps.fold.outputs.branch }}
          title: "chore(changelog): fold docs/changelog.d fragments"
          body: ${{ steps.fold.outputs.body }}
          issue-title: "fold PR needs a hand (bot/changelog-fold)"
          what: changelog fold
          pr-token: ${{ secrets.LAND_TOKEN }}
          github-token: ${{ github.token }}
