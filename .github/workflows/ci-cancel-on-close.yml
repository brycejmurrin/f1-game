name: Cancel CI of a closed PR

# Cleanup never joins ci.yml's concurrency group. GitHub admits a replay of an
# old close before any runner can check whether the PR has since reopened.
# Use the base workflow for fork closes too. The job runs only inline shell,
# does no checkout, and only cancels PR runs created before this closure.
on:
  pull_request_target:   # zizmor: ignore[dangerous-triggers] no checkout or execution of PR code
    types: [closed]

permissions: {}

jobs:
  cancel-stragglers:
    permissions:
      pull-requests: read
      actions: write
    name: Cancel the closed PR's other runs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel queued / running pull_request runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e '.state == "closed" and .closed_at == env.CLOSED_AT and (.closed_at | type == "string")' <<<"$pr" >/dev/null; then
            echo "PR #$PR reopened or closed again since this event"
            exit 0
          fi
          for st in queued in_progress pending waiting requested; do
            ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f branch="$BRANCH" -f event=pull_request -f status="$st" -f per_page=100 |
              jq -r '.workflow_runs[] | select(.head_repository.full_name == env.HEAD_REPO)
                | select((.created_at | type == "string") and .created_at < env.CLOSED_AT)
                | select(.run_attempt == 1 or ((.run_started_at | type == "string") and .run_started_at < env.CLOSED_AT))
                | select(if (.pull_requests | length) == 0 then .head_sha == env.HEAD_SHA
                         else all(.pull_requests[]; .number == (env.PR | tonumber)) end)
                | .id')
            while read -r id; do
              [ -n "$id" ] || continue
              echo "cancel $id"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || echo "  (already finishing)"
            done <<<"$ids"
          done
