name: Cancel CI of a closed PR

# Cleanup never joins ci.yml's concurrency group. GitHub admits a replay of an
# old close before any runner can check whether the PR has since reopened.
# Use the base workflow for fork closes too. The job runs only inline shell,
# does no checkout. Event-driven cleanup only cancels PR runs created before
# this closure. Scheduled cleanup checks for old empty queued attempts.
on:
  pull_request_target:   # zizmor: ignore[dangerous-triggers] no checkout or execution of PR code
    types: [closed]
  schedule:
    - cron: "22 */4 * * *"

permissions: {}

jobs:
  cancel-stragglers:
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: read
      actions: write
    name: Cancel the closed PR's other runs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel queued / running pull_request runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e '.state == "closed" and .closed_at == env.CLOSED_AT and (.closed_at | type == "string")' <<<"$pr" >/dev/null; then
            echo "PR #$PR reopened or closed again since this event"
            exit 0
          fi
          for st in queued in_progress pending waiting requested; do
            ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f branch="$BRANCH" -f event=pull_request -f status="$st" -f per_page=100 |
              jq -r '.workflow_runs[] | select(.head_repository.full_name == env.HEAD_REPO)
                | select((.created_at | type == "string") and .created_at < env.CLOSED_AT)
                | select(.run_attempt == 1 or ((.run_started_at | type == "string") and .run_started_at < env.CLOSED_AT))
                | select(if (.pull_requests | length) == 0 then .head_sha == env.HEAD_SHA
                         else all(.pull_requests[]; .number == (env.PR | tonumber)) end)
                | .id')
            while read -r id; do
              [ -n "$id" ] || continue
              echo "cancel $id"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || echo "  (already finishing)"
            done <<<"$ids"
          done

  cancel-empty:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    name: Cancel runs queued for two hours without jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck and cancel old empty attempts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          runs=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f status=queued -f "created=<$cutoff" -f per_page=100 |
            jq -r '.workflow_runs[] | [.id, .run_attempt] | @tsv')
          eligible() {
            local id=$1 attempt=$2 current jobs
            current=$(gh api "repos/$REPO/actions/runs/$id") || return 1
            jq -e --arg cutoff "$cutoff" --argjson attempt "$attempt" '
              .status == "queued" and .run_attempt == $attempt
              and ((.run_started_at // .created_at) | type == "string" and . < $cutoff)
            ' <<<"$current" >/dev/null || return 1
            jobs=$(gh api "repos/$REPO/actions/runs/$id/attempts/$attempt/jobs?per_page=1") || return 1
            jq -e '.total_count == 0' <<<"$jobs" >/dev/null
          }
          while read -r id attempt; do
            [[ "$id" =~ ^[0-9]+$ && "$attempt" =~ ^[1-9][0-9]*$ ]] || continue
            eligible "$id" "$attempt" || continue
            echo "cancel queued run $id, attempt $attempt, with no jobs"
            if response=$(gh api --include -X POST "repos/$REPO/actions/runs/$id/cancel" 2>&1); then continue; fi
            # GitHub has returned 409 for stuck runs (#5848). Re-read eligibility
            # so a normal conflict with a starting or completed run cannot escalate.
            if [[ "$response" == HTTP/*" 409 "* || "$response" == HTTP/*" 409"$'\n'* ]] && eligible "$id" "$attempt"; then
              gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null ||
                echo "::warning::GitHub did not accept force-cancel for run $id"
            else
              echo "::warning::GitHub did not accept cancel for run $id"
            fi
          done <<<"$runs"
