name: CI

on:
  push:
    branches-ignore: [claude/f1-game-project-26h3ng]
  pull_request:
  workflow_call:      # pages.yml gates its deploy on this
    inputs:
      before_sha:
        description: "github.event.before from the calling push (empty = run sweeps)"
        type: string
        required: false
        default: ""
      smoke:
        description: "run the Playwright smoke gate (page boots, __apex responds)"
        type: boolean
        required: false
        default: true
      concurrency_key:
        description: "unique caller run key; empty keeps direct push/PR branch concurrency"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.concurrency_key || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Structural guards + unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Structural guards
        run: npm run test:tooling-fast
      - name: Every test file belongs to a topical group
        run: npm run test:audit
      - name: What does this gate cover?
        run: node tools/ci-coverage.mjs
      - name: Pure-node unit suites
        run: |
          npm run test:net-unit
          npm run test:service-worker
          npm run test:lifecycle-unit
          npm run test:state-unit
          npm run test:webgpu-lifecycle
          npm run test:agent-contract

  sweeps:
    name: Per-circuit geometry sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Does this diff touch the geometry?
        id: filter
        env:
          BEFORE: ${{ inputs.before_sha != '' && inputs.before_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          run_all() { echo "geometry=true" >> "$GITHUB_OUTPUT"; echo "RUNNING SWEEPS: $1"; exit 0; }
          case "$EVENT" in
            push|workflow_call) ;;
            *) run_all "event is '$EVENT', not a push/workflow_call" ;;
          esac
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push, or caller omitted input)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable (force push?)"
          git diff --name-only "$BEFORE" HEAD | grep -qE '^(js/track/|js/circuits/|tools/|tests/.*sweep)' && run_all "diff touches geometry paths" || echo "geometry=false" >> "$GITHUB_OUTPUT"
      - name: Per-circuit geometry sweeps
        if: steps.filter.outputs.geometry == 'true'
        run: npm run test:sweeps

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.smoke != false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        env:
          APEX_WORKERS: 1
        run: npm run test:smoke
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-smoke
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  selected:
    name: Selected specs for this change
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Restore last run's failing specs
        uses: actions/cache/restore@v4
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            selected-failed-${{ github.ref_name }}-
      - name: Select specs for this change
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash tools/ci-select-specs-step.sh
      - name: Install browser
        if: steps.sel.outputs.specs != ''
        run: npx playwright install --with-deps chromium
      - name: Run the selection
        if: steps.sel.outputs.specs != ''
        env:
          APEX_WORKERS: 1
        run: npm test -- ${{ steps.sel.outputs.specs }} --retries=0 --timeout=120000
      - name: Record failing specs for the next run
        if: always() && steps.sel.outputs.specs != ''
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const out = new Set();
            for (const d of fs.readdirSync("artifacts").filter((d) => d.startsWith("test-results-"))) {
              const f = path.join("artifacts", d, "junit.xml");
              if (!fs.existsSync(f)) continue;
              const xml = fs.readFileSync(f, "utf8");
              for (const m of xml.matchAll(/<testcase[^>]*\bclassname="([^"]+)"[^>]*>\s*<(?:failure|error)\b/g))
                out.add(m[1].split(" ")[0]);
            }
            fs.writeFileSync(".selected-failed.txt", [...out].join("\n"));
            console.log(out.size ? `carrying ${out.size} failing spec(s) forward` : "no failures to carry");
          ' || true
      - name: Save failing specs
        if: always() && steps.sel.outputs.specs != ''
        uses: actions/cache/save@v4
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-selected
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore
