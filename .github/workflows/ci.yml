name: CI
# A label-noise run (#2184, see `on.pull_request`) is NAMED so tools can drop
# it: ci-watch.mjs's labelNoiseRun() reads this prefix. Empty = GitHub's own
# default title ("omitted or only whitespace": the run-name docs,
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name).
run-name: "${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name != 'run-ci' || !github.event.pull_request.draft)) && format('CI ignored: label {0}', github.event.label.name) || '' }}"

# The test gate. Until this existed, .github/workflows/pages.yml deployed on
# every push and ran NOTHING — 141 test files gated only by whether a human
# remembered. Two of the repo's own structural guards were found red in the
# working tree that way, from the same day's work.
#
# The jobs are split by what they cost, so the common case stays fast:
#
#   guards   ~8 min wall (461 s median 2026-10-05), two parallel tooling-fast
#                                  shards then ratchet/audit on the aggregator
#                                  still named `Structural guards`. Split because
#                                  the old single job's header still said ~2m20s.
#                                  This is the job that must never be red;
#                                  everything it asserts is a property a
#                                  compiler would enforce in a language that had
#                                  one.
#   node-     ~5m05s, no browser — the pure-node unit suites: net, service
#   suites                         worker, lifecycle, state, agent contract,
#                                  audio, mcp, node-slow and the game VM.
#                                  MEASURED 2026-09-03 warm: 12/4/0/1/0/0/12/
#                                  115/161 s = 305 s. Its OWN job since that
#                                  date: as a step inside guards it shared a
#                                  10-minute cap with npm ci and tooling-fast,
#                                  timed out on Pages #1959 and #1961, and
#                                  reported `cancelled` with zero failures —
#                                  blocking two deploys. Splitting it also puts
#                                  it in PARALLEL with guards, so the gate got
#                                  faster, not slower.
#   sweeps   ~4-7 min wall, no   — the per-circuit geometry sweeps as a FOUR-
#             browser              shard matrix (1of4..4of4) over package.json's
#                                  test:sweeps list, plus sweeps-roll-up which
#                                  keeps the un-suffixed check name. CONDITIONAL
#                                  steps: the fleet runs only when the diff
#                                  touches what the fleet build executes
#                                  (tools/ci/geometry-paths.mjs derives that
#                                  from the manifest: js/track/, js/circuits/,
#                                  tools/track|lib, the TRACK_VM modules) or a
#                                  sweep suite; a lighting, car, debris-world
#                                  or driving-line edit runs only the suite
#                                  that reads it (the TARGETED tier, under a
#                                  minute). The planner allocates shards only
#                                  when work applies; the rollup also reports
#                                  a proven empty plan. Suites stay
#                                  --test-concurrency=1 per shard (four at once
#                                  in one process reached 5.4 GB and was
#                                  OOM-killed); parallelism is across VMs. See
#                                  the NODE_OPTIONS note on the job.
#   smoke    ~3 min, Chromium    — the page actually boots and __apex answers.
#                                  If this is red nothing else is worth running.
#                                  ONE shard of smoke.spec.js on llvmpipe for a
#                                  ready PR and the Pages call (p50 2.9 / p90
#                                  3.1 / max 3.2 min over 35 jobs, 2026-10-14);
#                                  the nightly / dispatched wide run keeps FOUR
#                                  shards. ONE WORKER PER MACHINE (two
#                                  concurrent SwiftShader contexts exceed the
#                                  per-test timeout on a shared runner). The
#                                  history below is SwiftShader-era: RE-TIMED 2026-08-14, as the note below
#                                  demands: it was 14m24s serial, then measured
#                                  17m58s / 18m56s at two shards on a degraded
#                                  runner pool (run 1415), and the specs
#                                  themselves then got ~70 % cheaper — 14 min ->
#                                  4m17s locally — by quieting the render loop
#                                  across the menus and booting the rendering
#                                  specs straight into a race. The four-way
#                                  split puts the modelled pole at ~190 s of
#                                  test work; CI adds its own multiple on top.
#                                  RE-TIMED AGAIN 2026-08-30 after six straight
#                                  deploys died here (Pages #1848-#1854, three
#                                  authors, every failure a timeout and not one
#                                  assertion): the runner pool has degraded far
#                                  past the 2026-08-14 figures. Same shard, same
#                                  commit, consecutive attempts on #1854 booted
#                                  37-55x apart — `[car] build mercedes` 3,956 ms
#                                  then 147,612 ms, `[assets] pack loaded`
#                                  5,008 ms then 276,476 ms. Worst spec observed
#                                  640.6 s against a 420 s cap, and one shard was
#                                  CANCELLED at 29.5 min against a 30 min job.
#                                  Caps raised to 900 s per test / 50 min per job
#                                  to fit that tail; the specs themselves are
#                                  unchanged and still ~4m17s locally.
#                                  It is also SKIPPED ENTIRELY when the diff
#                                  cannot reach _site/ (see the job's filter).
#   driving-  ~1 min, Chromium   — the characterization traces. ONE spec, and
#   model                          its own job rather than a step in smoke,
#                                  because a step inherits its job's fate: it
#                                  would run only after smoke's twelve minutes
#                                  (so a red smoke means it never runs at all)
#                                  and it would report under smoke's NAME, since
#                                  the checks list shows jobs and not steps. It
#                                  ran as a step exactly once; see the job.
#   renderer- UNMEASURED, macOS   — the `gfx` group (test:gfx: instanced-draw,
#   macos     real GPU (Metal)     webgl-probes, lighting-ab, image-grade-
#                                  visual, lighting-tuner-grade, tlx-probes)
#                                  on macos-latest, the ONE runner image with a
#                                  hardware adapter. Runs when a READY PR's
#                                  diff touches the renderer (js/render/**, the
#                                  lighting modules), nightly, and on dispatch;
#                                  NOT on drafts, topic pushes, or the Pages
#                                  deploy call — see the job for why. Added
#                                  2026-09-01, so the budget is a guess until
#                                  the first run lands; re-time it and replace
#                                  this line.
#
# Both figures above are MEASURED on run 31023778264 — the first run that ever
# completed end to end — not estimated: sweeps 15m12s, smoke 14m24s, guards 25s.
# That guards figure is HISTORICAL and was true when the job ran only the
# structural guards. It kept being quoted after the ten-group node-suite step
# was added, which is how the job came to sit at a 10-minute cap it could not
# meet. Current figures are on the two entries above, measured 2026-09-03.
# driving-model is measured on 31197770813: 42 s of test.
#
# THE NUMBERS ABOVE ARE THE BUDGET, AND `timeout-minutes` MUST STAY ABOVE THEM.
# They are a comment, so nothing enforces them: this header read "~3 min" for
# weeks while the step it described ran 71 specs and needed ~53. Every run hit
# the cap, and a timed-out job reports `cancelled` rather than `failed`, so the
# deploy silently stopped happening behind a summary that showed zero failures.
# If you change what a step RUNS, re-time it and change the number here too.
#
# Deliberately NOT here: the full Playwright suite is ~40 minutes of SwiftShader.
# Run it locally with tools/ci/test-bg.mjs against the groups tools/ci/pick-tests.mjs
# names. This gate is for what breaks silently, not for everything. (The
# renderer group is the exception, and it is in this FILE without being in the
# GATE — see renderer-macos.)
#
# THE ONE GROUP THAT ARGUABLY BELONGS HERE AND IS NOT: `test:baseline`, the six
# golden menu PNGs. The 2026-08 pass found one of them stale — the garage
# baseline was re-blessed on a branch that did not yet have the garage BACK
# button, and the two lines merged afterwards. index.html and a .png are
# different files, so git merged both cleanly and reported no conflict; they
# conflicted only in meaning, and nothing was running the suite that would have
# said so. That is exactly the silent class this gate exists for.
#
# It is now blocking on scheduled and manual runs. The runner and dev container
# were measured as portable; a mismatch must fail the verdict so stale UI
# goldens cannot remain green indefinitely. It remains excluded from Pages calls
# because the release train uses live browser checks rather than dev-captured PNGs.

on:
  # NO PUSH TRIGGER (2026-10-16, the CI/CD review #2333 finding 3). A topic
  # branch gets CI through its PR (2026-09-24, decision 1c: every branch push
  # used to start a run its own PR event cancelled seconds later). The deploy
  # branch got a FAST tier here from 2026-09-10 to 2026-10-16 (guards, node
  # suites, census, driving-model, selection in the no-cancel `ship-fast`
  # group) whose green poked the Pages train; measured on 2026-10-15/16 it
  # reached 38 % of merges (184 pushes, 112 replaced while pending, 70
  # completed) and cost 5,587 job-minutes a day for verdicts the train
  # repeated. pages.yml now runs on push itself and calls this workflow for
  # the full gate (the `workflow_call` below, with `concurrency_key` set), so
  # a merge's verdict is the train's `ci / …` rows: `ci-watch.mjs --sha
  # <merge sha>` lists that run, or `= ci superseded` when a newer push
  # replaced its pending train.
  pull_request:
    # A DRAFT PR with the `run-ci` label is the FAST tier too (the same
    # expression, below): guards, the selection plan, parts census and
    # driving-model — the verdict a work-in-progress push needs,
    # minutes after it lands. NOT the `selected` browser legs: that job skips
    # every draft, run-ci or not (#2184), so a draft's browser verdict comes
    # at ready. A draft without run-ci runs nothing but the skip notice. Marking
    # it ready (`ready_for_review`) starts the FULL tier (smoke shards and
    # geometry sweeps) on the same head, and the train gates the tip again.
    # `ready_for_review` is not a default type; the other three are.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    #
    # LABELS (#2184, 2026-10-15). `labeled` is here for ONE label: run-ci on a
    # DRAFT opts it into the fast tier. `on:` cannot filter a label by name
    # (only types, branches and paths), so every other label event — `bug`,
    # `area:*`, `claimed` from fleet.yml, or run-ci on a PR already ready —
    # used to start a run in this PR's group and CANCEL its live fast or full
    # tier. Such an event now lands in its own `label-<run_id>` group (the
    # concurrency block), every job skips on the shared label gate
    #   (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft))
    # and the verdict job is renamed, because a skipped job reports success and
    # must never sit on the head as the required `CI`. No runner is taken.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # THE DEPLOY BRANCH AS BASE ONLY (#2179, 2026-10-15). `branches` on
    # pull_request matches the PR's BASE branch. PRs into track-survey-assets
    # (images and reports, never merged here: docs/notes/SURVEY-ASSETS-BRANCH.md)
    # started the full ready tier seconds before they merged — 130 CI runs in
    # 24 h, 536 jobs queued for already-merged PRs at 15:10Z. That branch has no
    # required check, so it needs no run.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#running-your-pull_request-workflow-based-on-the-base-and-head-branch-of-a-pull-request
    branches:
      - claude/f1-game-project-26h3ng
    # NO paths-ignore HERE (2026-09-30). Branch protection on the deploy
    # branch requires this workflow's fast-tier jobs, and a required check
    # that never reports blocks the merge for good — so a prose-only PR,
    # which the old filter kept out of this workflow entirely, could never
    # merge. Every PR runs the fast tier now; the per-PR node plan
    # (tools/ci/node-plan.mjs) skips the multi-minute scripts on a diff that
    # reaches none of them, so a docs PR costs guards plus seconds. The push
    # filter above stays: a docs push to the deploy branch buys no gate.
  # NO merge_group (removed 2026-10-14): merge queues need an organisation-owned
  # repo and this one is user-owned (docs/notes/CI-MERGE-BURST-2026-10-03.md).
  # NIGHTLY (2026-09-01): the wide browser run — the boot group (73 tests)
  # across 4 shards — moved here from every push. Its whole recorded failure
  # history in this file's header is timeouts on starved runners, never an
  # assertion, so it was blocking deploys without adding evidence; on a ready
  # PR and the deploy gate (the pages.yml train) the smoke job runs
  # smoke.spec.js in ONE shard (~3 min); a deploy-branch push and a draft PR
  # are the fast tier and do not run it.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      # Any browser group from package.json on the 4-shard matrix (default =
      # the boot group the nightly runs). A desktop-viewport spec that times
      # out on the SwiftShader dev box measures the box (docs/TESTING.md
      # §Field notes 2026-09-02); this is the runner-side verification.
      group:
        description: "browser group to run on the 4-shard matrix (tiny = boot group; ui, input, driving, ...)"
        type: string
        required: false
        default: "tiny"
      # The macOS renderer job is the scarcest runner in this file (the repo
      # is public, so minutes are free; the cost is one of the account's five
      # concurrent macOS slots). Ready PRs that touch js/render/
      # already allocate it via renderer-filter; pass true here to force the
      # gfx specs on Metal from a dispatch (nightly also runs them).
      renderer_macos:
        description: "also run the gfx specs on the macOS (Metal) runner"
        type: boolean
        required: false
        default: false
      # THE OPT-OUT, NOT THE OPT-IN (2026-09-16, second pass). Mesa llvmpipe
      # replaced SwiftShader on the smoke gate after run 35062479811 measured
      # it 8-12x faster with every frame assertion holding; the browser jobs
      # (smoke, the wide run, `selected`) now install Mesa + Xvfb and launch
      # with APEX_GL=llvmpipe (playwright.config.js swaps the ANGLE flags) by
      # default. `gl: swiftshader` skips the Mesa step and the env, so a spec
      # can still be measured on both — read the shard times and the
      # WEBGL_debug_renderer_info string in the log. It is dead in the dev
      # container (no /dev/dri — docs/notes/CI-RENDERING-PERFORMANCE.md
      # §llvmpipe), alive on GitHub's runners. driving-model is deliberately
      # NOT on it: it is the parity anchor for the VM twins.
      gl:
        description: "software GL for the browser jobs: llvmpipe (default) or swiftshader (opt-out)"
        type: string
        required: false
        default: "llvmpipe"
  workflow_call:      # pages.yml gates its deploy on this
    inputs:
      # Caller's push `before` SHA, forwarded EXPLICITLY. github.event in a
      # called workflow is the caller's payload, so the sweeps filter could read
      # github.event.before itself; the input keeps the contract visible in
      # pages.yml (and the filter's fallback reads github.event.before anyway).
      before_sha:
        description: "github.event.before from the calling push (empty = run sweeps)"
        type: string
        required: false
        default: ""
      # There is no `smoke` input any more (2026-09-10). The smoke job's guard
      # was `github.event_name != 'workflow_call' || inputs.smoke`, and in a
      # CALLED workflow `github.event_name` is the CALLER's event (`push`), never
      # `workflow_call` — so the first operand was always true and the input
      # could never skip anything. pages.yml had stopped passing it on
      # 2026-08-12 anyway; the smoke gate runs on every push, PR and deploy.
      concurrency_key:
        description: "unique caller run key; empty keeps direct push/PR branch concurrency"
        type: string
        required: false
        default: ""
      # REUSE THE FAST TIER'S TREE-ONLY JOBS (2026-09-16). A deploy-branch push
      # runs guards, node-suites, sweeps-parts and driving-model (the fast
      # tier), pokes the train, and the train's gate ran all four AGAIN on the
      # same tree — measured: ~12 min of fast tier, then ~14 min of full tier,
      # serially, sharing nothing. Those four depend on the TREE only (no diff
      # base, no selection), so the same bytes give the same answer. pages.yml's
      # verdict passes the id of a completed, successful fast-tier ci.yml run
      # on this exact tree; the four jobs skip and the gate is smoke + sweeps +
      # selection (the change-aware `selected` always re-runs: its base is the
      # LIVE commit here, which can be older than the push's `before`). Empty
      # on every direct run, and on a train whose tip has no green fast tier.
      fast_tier_run:
        description: "id of a green fast-tier ci.yml run on this exact tree; its tree-only jobs are skipped"
        type: string
        required: false
        default: ""
      # NO SMOKE-ONLY INPUT (removed 2026-10-14). pages.yml fed it from the
      # verdict's ship-only output, always false since 2026-10-07
      # (tools/ci/pages-reuse-verdict.sh), so every job guard testing it
      # (`!= true`) was always true; dropping them changes no job's `if:`.

permissions:
  contents: read

# ONE GATE PER PR BRANCH HEAD, NEWEST WINS (2026-09-10; ship carve-out 2026-10).
# A push to a topic branch with an open PR used to start TWO full runs of
# identical work — the `push` event on refs/heads/<branch> and the
# `pull_request` event on refs/pull/N/merge landed in different groups, so
# neither cancelled the other (58.5 + 47.4 job-minutes for one commit). Topic
# branches no longer get push CI (deploy branch only); PR runs still key on
# pull_request.head.ref, and a later synchronize/ready_for_review cancels the
# older PR run on that same branch (cancel-in-progress true for pull_request).
#
# SHIP PUSHES start no run here since 2026-10-16 (pages.yml runs on push); the
# `ship-fast` group that coalesced them (2026-10-03) is gone. The deploy path
# is unchanged: a Pages caller supplies its run id (unique concurrency_key), so
# every deploy gate has its own group and is cancelled only by pages.yml's own
# per-branch rule.
concurrency:
  # A dispatched run gets its own group: it shares the ref with every push,
  # and cancellation killed the first dispatched `ui` group 30 s in when the
  # next docs commit landed (run 2211, 2026-09-02).
  #
  # THE NIGHTLY NEEDED THE SAME AND DID NOT HAVE IT. `schedule` fell through to
  # `github.ref`, so it shared a group with every push to the deploy branch —
  # and cancel-in-progress being false does not save it: GitHub keeps only ONE
  # pending run per group and silently cancels the older one when the next
  # arrives. On a branch that takes a push every few minutes the 08:00 nightly
  # is queued behind exactly that. Run 2758 (2026-09-08) ended `cancelled` at
  # 20 min with no job over its cap and nothing failing, which is the shape
  # this produces.
  # Dispatch and schedule get a unique run_id group. The run that is
  # DEPLOYING is not in this group: pages.yml always passes a unique
  # concurrency_key, and its own `pages-gate-*` group has cancel-in-progress
  # false. (The deploy branch's `ship-fast` push group, 2026-10-03 to
  # 2026-10-16, is gone with the push trigger.)
  group: ci-${{ inputs.concurrency_key || ((github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name != 'run-ci' || !github.event.pull_request.draft)) && format('label-{0}', github.run_id)) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id) || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  draft-ci-skipped:
    name: Draft push (CI skipped — add run-ci label)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    steps:
      - run: echo "No CI on a draft without the run-ci label. Add run-ci for the fast tier (guards, parts census, driving-model; no node suites or selected browser specs until ready), or mark it ready for the full tier."
  guards-a:
    name: Structural guards (tooling A)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.fast_tier_run == '') }}
    permissions:
      contents: read
      actions: read
    steps:
      # BLOB-LESS FULL HISTORY (2026-10-14, Actions audit C6: 25 s -> 9 s).
      # Every history read in guards-a/-b/guards, unit-plan and xr-filter is a
      # tree question (diff --name-only, rev-list, cat-file -e, merge-base) or
      # a handful of single blobs — ratchets.mjs's `git show <base>:<file>`,
      # select-specs' base copy of a changed spec, evaluate-scope-lint's one
      # fixture — which a partial clone fetches on demand from the public
      # origin (https://git-scm.com/docs/partial-clone). Nothing here runs
      # `log -p` or `blame`, the per-object fetch pattern that would be slow.
      # sweeps, sweeps-parts, ship-filter, select and node-suites already ran
      # this way. https://github.com/actions/checkout#usage (`filter`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # READY-FOR-REVIEW ON A GREEN DRAFT HEAD REUSES THE DRAFT (2026-10-15):
      # this was a job of its own (`reuse-draft`) that every fast-tier job
      # waited on — one queue hop (p50 13 min on 2026-10-15) and a runner for
      # 6 s of API. Each job asks the question itself now; the script answers
      # `reuse=false` without an API call on every event but ready_for_review.
      - name: Was this head already green as a draft?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/ci/reuse-draft-fast.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-apex
        if: steps.reuse.outputs.reuse != 'true'
      - name: Tooling-fast shard 1/2
        if: steps.reuse.outputs.reuse != 'true'
        env:
          APEX_DOCS_FIGURES_ADVISORY: ${{ github.event_name != 'pull_request' && '1' || '' }}
        # --bail (2026-10-16 CI jobs review): stop STARTING files after the first
        # failure. A red shard ran a mean 5.9 min after its first failure; files
        # already in flight finish and the log names each. The local
        # `npm run test:tooling-fast` stays without it so an author sees every red.
        run: node tools/ci/tooling-fast.mjs --jobs=4 --shard=1/2 --bail
      - name: Reused draft
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "SKIPPED tooling A — draft fast-tier already green on this head SHA"

  guards-b:
    name: Structural guards (tooling B)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.fast_tier_run == '') }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # The same reuse question as guards-a (2026-10-15): a step, not a job hop.
      - name: Was this head already green as a draft?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/ci/reuse-draft-fast.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-apex
        if: steps.reuse.outputs.reuse != 'true'
      - name: Tooling-fast shard 2/2
        if: steps.reuse.outputs.reuse != 'true'
        env:
          APEX_DOCS_FIGURES_ADVISORY: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: node tools/ci/tooling-fast.mjs --jobs=4 --shard=2/2 --bail
      # RATCHETS, AUDIT, COVERAGE AND BEHIND-SHIP (moved from the `Structural
      # guards` aggregator 2026-10-15): the same tree and node_modules, no
      # second checkout + npm ci, and the aggregator needs no runner time.
      - name: Ratchet ceilings vs the base
        if: steps.reuse.outputs.reuse != 'true'
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref_name == 'claude/f1-game-project-26h3ng' && github.event.before) || (inputs.concurrency_key != '' && github.sha) || 'origin/claude/f1-game-project-26h3ng' }}
          RATCHET_MODE: ${{ (github.event_name == 'push' || inputs.concurrency_key != '') && '--advisory' || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          base="$RATCHET_BASE"
          # The event base can lag the base that this PR merge was built on;
          # count only this PR's ceiling changes, not intervening ship raises.
          [ "$EVENT" = pull_request ] && base="$(bash tools/ci/ci-pr-base.sh "$base")"
          case "$base" in 0000000000000000000000000000000000000000|"") base=origin/claude/f1-game-project-26h3ng ;; esac
          git cat-file -e "$base^{commit}" 2>/dev/null || base=origin/claude/f1-game-project-26h3ng
          echo "ratchet base: $base ${RATCHET_MODE:+(advisory)}"
          node tools/check/ratchets.mjs --base "$base" $RATCHET_MODE
      # A PR that loosens a test tolerance next to production changes fails (#1685; AGENTS.md rule 9). Rows that
      # are genuinely right go in tests/data/tolerance-exceptions.json with a reason.
      - name: Test tolerances are not loosened
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'pull_request'
        env:
          TOL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(bash tools/ci/ci-pr-base.sh "$TOL_BASE")"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=origin/claude/f1-game-project-26h3ng
          node tools/check/tolerance-diff.mjs --base "$base"
      - name: Every test file belongs to a topical group
        if: steps.reuse.outputs.reuse != 'true'
        run: npm run test:audit
      - name: What does this gate cover?
        if: steps.reuse.outputs.reuse != 'true'
        run: node tools/ci/ci-coverage.mjs
      - name: How far behind ship?
        if: github.event_name == 'pull_request' && steps.reuse.outputs.reuse != 'true'
        env:
          BEHIND_SHIP_HEAD: ${{ github.event.pull_request.head.sha }}
          BEHIND_SHIP_SHIP: origin/claude/f1-game-project-26h3ng
        run: |
          git fetch --no-tags --depth=1 origin claude/f1-game-project-26h3ng 2>/dev/null || true
          node tools/ci/behind-ship.mjs
      - name: Reused draft
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "SKIPPED tooling B — draft fast-tier already green on this head SHA"

  guards:
    name: Structural guards
    needs: [guards-a, guards-b]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!cancelled() && inputs.fast_tier_run == '') }}
    timeout-minutes: 5
    # NO CHECKOUT, NO npm ci (2026-10-15): the ratchet / audit / coverage /
    # behind-ship steps run at the end of tooling B, where the tree and the
    # dependencies already are. This job only joins the halves under the
    # required check name (ready-gate.mjs reads it; the halves are its fallback).
    steps:
      - name: Tooling halves must be green
        env:
          A: ${{ needs.guards-a.result }}
          B: ${{ needs.guards-b.result }}
        run: |
          set -u
          echo "guards-a=$A guards-b=$B"
          [ "$A" = success ] && [ "$B" = success ]

  lints:
    name: Workflow and shader lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.fast_tier_run == '') }}
    permissions:
      contents: read
    env:
      # An absent binary is a FAILURE here, never the loud local SKIP: this job exists to run them.
      APEX_REQUIRE_LINT_BINS: "1"
    # actionlint + zizmor over .github/workflows, glslang over the GLX GLSL, naga (advisory) over the
    # WGX WGSL (tools/check/workflow-lint.mjs, shader-validate.mjs). Binaries are pinned and checksummed
    # by tools/env/install-lint-bins.sh; artifacts/bin is cached on a hash of that script, so a warm run installs nothing (a cold run compiles naga-cli, ~4 min).
    # The two unit tests run here too, with the binaries, so a planted-defect fixture that stopped
    # failing is red; in tooling-fast shards they skip loudly because the shards install nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - name: Lint binaries cache
        id: bins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/bin
          key: lint-bins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/env/install-lint-bins.sh') }}
      - name: Install lint binaries
        run: bash tools/env/install-lint-bins.sh
      - name: Workflow lint (actionlint + zizmor)
        run: node tools/check/workflow-lint.mjs
      - name: Shader validation (glslang + naga)
        run: node tools/check/shader-validate.mjs
      - name: Planted-defect fixtures
        run: node --test tests/unit/workflow-lint.test.mjs tests/unit/shader-validate.test.mjs

  node-suites:
    # Name `Pure-node unit suites (<slice>)`: the six strings WERE the deploy
    # branch's required checks until 2026-10-15, when Bryce made `CI` the one
    # required check (docs/notes/CI-CLOG-SURVEY-2026-10-15.md §4 C). They are
    # still what ready-gate.mjs and the tests read, so keep
    # them stable; a rename is a tool edit now, not a settings round. Do not
    # interpolate matrix.needed (or any other matrix key) into the name
    # (#454 a9a805839: the expected check never appeared).
    name: Pure-node unit suites (${{ matrix.slice }})
    needs: [select]
    runs-on: ubuntu-latest
    # Tree-only: skipped when the train reuses a green fast tier (`fast_tier_run`).
    # NEVER skipped for any_node=false (2026-09-30, PR #522): a job skipped at
    # the job level never expands its matrix, so the one check it reports is
    # "Pure-node unit suites (${{ matrix.slice }})" and the six REQUIRED names
    # never appear — the PR sat BLOCKED with every check green. The job always
    # runs; an unneeded row (matrix.needed=false) skips checkout / npm ci /
    # plan below and reports green in seconds.
    # A PULL REQUEST emits only the needed rows (select's --needed-only), and
    # when none is needed the job skips here (2026-10-15: `CI` is the deploy
    # branch's one required check, so the six names no longer have to report
    # on a ready PR either).
    #
    # READY PRs, THE NIGHTLY AND DISPATCH ONLY (2026-10-16, Bryce's decisions
    # D1 and D2 in the CI selection plan, PR #2560 §6). Measured
    # over 40 h: on drafts these slices cost ~5,660 job-min/day and caught 5
    # reds, all also run by the PR's first ready run (0 unique); on the train
    # they caught 0 in 5,297 job-min. So a draft (run-ci or not) and the
    # Pages call (`concurrency_key` set) skip the job; a merge interaction in
    # a node slice surfaces at the nightly. With no draft run to reuse, this
    # job no longer asks the ready_for_review reuse question.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (inputs.fast_tier_run == '' && inputs.concurrency_key == '' && (needs.select.outputs.any_node == 'true' || github.event_name != 'pull_request')) }}
    # actions:read for base-green.sh (the plan step asks whether the previous
    # tip was gated green). A job that names permissions gets ONLY what it
    # names, hence contents too.
    permissions:
      contents: read
      actions: read
    # THREE RUNNERS, NOT ONE (2026-09-16). This job ran its scripts one after
    # another and measured 11.3 min on 40 of 40 runs — the floor of the fast
    # tier, hence of every deploy push, and never shortened by anything. The
    # pieces are independent: game-vm ~3 min, node-slow ~2.5 min, the rest
    # seconds. One slice per runner, wall ≈ the slowest slice. The step below
    # keeps its name and one `npm run test:*` per line because deploy.mjs
    # (gateNodeSuites) and tools/ci/twinned-specs.mjs DERIVE the node half of
    # the gate from that text.
    strategy:
      fail-fast: false
      matrix:
        # vm-a / vm-b: test:game-vm measured 9.2-9.4 min as ONE slice on the
        # first matrix run (2026-09-16) — the whole job's wall. vm-a is
        # elevation-tracks-vm ALONE (40 circuit builds, 399 s on the dev box,
        # 7.6 min with twelve siblings beside it on a runner); vm-b is every
        # other file (~2 min). tests/groups.json partitions of one list;
        # test:game-vm is still the full set for local use.
        # vm-page (2026-09-22): the browser specs that run AS THEMSELVES under
        # tests/helpers/vm-page.js (tools/ci/twinned-specs.mjs ADAPTED), one
        # child process per spec. Its own slice because a spec that builds a
        # circuit costs seconds to minutes each and the `fast` slice is seconds.
        # SIX SLICES (2026-09-30, #508). Pro plan (40 slots) made wall the cost
        # again: vm-a was last to finish in 42 of 56 runs. It now runs as two
        # shards (APEX_CIRCUIT_SHARD=i/2), game-vm-b is two time-balanced
        # partitions, and vm-page-a / vm-page-b / node-slow stand alone. The ≈ 3 min wall that
        # split promised no longer holds: vm-b1 and page are the floor now.
        # The slice names ("Pure-node unit suites (<slice>)") were the deploy
        # branch's REQUIRED CHECKS until 2026-10-15; `CI` alone is required
        # now, so a rename is a tooling change (pick-unit-slices SLICES,
        # pages-train, ready-gate, the tests), not a settings round.
        # Job wall, MEDIAN of 12 green ship pushes (38522092373..38580219820,
        # 2026-10-14; setup included; a skipped row's ~0.1 min is in the sample):
        #   vm-a1  game-vm-a, circuits 1,3,5,…      2.4 min
        #   vm-a2  game-vm-a, circuits 2,4,6,…      2.4 min
        #   vm-b1  game-vm-b1 + the fast scripts    12.3 min
        #   vm-b2  game-vm-b2                       4.0 min
        #   page   vm-page                          9.1 min
        #   slow   node-slow                        3.3 min
        # RE-BALANCED 2026-10-15 from per-script log timings of three green ship
        # pushes (docs/notes/CI-CLOG-SURVEY-2026-10-15.md §7): game-vm-b1 alone
        # was 437 s against game-vm-b2's 220 s, and the ten "seconds each" riders
        # had grown to 180 s (garage-unit 94, net-unit 33, audio-unit 33). The
        # riders moved to vm-a1 / vm-a2 / slow and game-vm-b1/b2 were re-cut by
        # per-file medians. Projected job wall (setup ~16 s included):
        #   vm-a1 ~200 s, vm-a2 ~220 s, vm-b1 ~320 s, vm-b2 ~320 s, slow ~200 s,
        #   page ~520 s — vm-page is the floor now (one TAP test, no per-spec
        #   breakdown in the log); runner-minutes per push unchanged.
        # Matrix rows come from select's plan step / pick-unit-slices. On a
        # deploy push and the train every NODE_SLICE name is present (needed
        # true|false) for the Pages reuse check; a pull request lists
        # only the needed rows (2026-10-15: `CI` is the one required check —
        # until then a subset left vm-a1/vm-a2 unreported on #454, BLOCKED
        # with an otherwise green CI). Unneeded rows exit 0.
        # node-plan.mjs (step below) still skips scripts INSIDE a needed runner.
        include: ${{ fromJSON(needs.select.outputs.slices) }}
    # MEASURED locally 2026-09-03, warm: net 12s, service-worker 4s, lifecycle
    # 0s, state 1s, agent-contract 0s, audio 0s, mcp 12s, node-slow 115s,
    # game-vm 161s = 305s total (+ garage-unit 39s, steering-unit 1s, 2026-09-10). Plus npm ci, which cost 3m32s and 5m02s on the
    # two runs that died. 25 = roughly 2x the measured work on top of the worst
    # npm ci seen, the same 2x convention sweeps-parts uses below.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.needed != 'false'   # an unneeded row reports green with no setup (the job's `if:`)
        with:
          persist-credentials: false
          # The plan step below diffs a pull request against its base sha,
          # which a depth-1 clone cannot show. Same trade as sweeps-parts.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
        if: matrix.needed != 'false'
      # WHICH SCRIPTS DOES THIS PR NEED? (2026-09-30) On a pull request the
      # four multi-minute scripts (game-vm-a, game-vm-b, vm-page, node-slow)
      # run only when tools/ci/pick-tests.mjs routes the PR's diff to a group
      # they replay, and a circuit-only diff narrows elevation-tracks-vm to the
      # circuits that moved (APEX_CIRCUITS). The seconds-long scripts always
      # run. A deploy-branch push, a Pages call, a dispatch or the nightly run
      # EVERYTHING, exactly as before: a merge is gated whole before the train
      # ships it, so the `fast_tier_run` reuse contract is unchanged. Anything
      # the planner cannot route runs everything (tools/ci/node-plan.mjs).
      # THE DELTA GATE ON A DEPLOY PUSH AND THE TRAIN (2026-09-30). The push
      # that merges a circuit-only PR rebuilt the whole fleet the PR had just
      # scoped. The tip is gated whole INDUCTIVELY: the previous tip passed
      # its gate (tools/ci/base-green.sh asks GitHub — `green` only, never
      # `unknown`) and this push's diff against it is gated for what it
      # touched. A Pages call's before_sha is the LIVE commit, which passed
      # the full gate by definition, so the train needs no lookup. A red or
      # unknown previous tip, a first push, a force push or a nightly run
      # everything, as before.
      - name: Plan the slices for this diff
        if: matrix.needed != 'false'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CALLED: ${{ inputs.concurrency_key != '' }}
          LIVE_BEFORE: ${{ inputs.before_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PLAN="${RUNNER_TEMP:-.}/node-plan.sh"
          BASE=""; WHY=""
          if [ "$CALLED" = "true" ]; then
            BASE="${LIVE_BEFORE:-}"; WHY="a Pages call: the live commit is the base"
          elif [ "$EVENT" = "pull_request" ]; then
            # The test commit's first parent, not the event's base.sha, which
            # lags one sync behind it (tools/ci/ci-pr-base.sh).
            BASE="$(bash tools/ci/ci-pr-base.sh "${PR_BASE:-}")"; WHY="a pull request (event base.sha ${PR_BASE:-none})"
          elif [ "$EVENT" = "push" ]; then
            if [ "$(bash tools/ci/base-green.sh "${PUSH_BEFORE:-}")" = green ]; then
              BASE="${PUSH_BEFORE:-}"; WHY="a deploy push whose previous tip was gated green"
            else
              echo "the previous tip ${PUSH_BEFORE:-?} is not known green: every script runs"
            fi
          fi
          if [ -n "${BASE:-}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "plan base: $BASE ($WHY)"
            node tools/ci/node-plan.mjs --since "$BASE" --sh > "$PLAN"
            node tools/ci/node-plan.mjs --since "$BASE"
          else
            node tools/ci/node-plan.mjs --all --sh > "$PLAN"
            echo "no gated base for this $EVENT: every script runs"
          fi
      - name: Pure-node unit suites
        run: |
          # ONE SLICE PER RUNNER (matrix.slice). Every script stays on its own
          # line: deploy.mjs and twinned-specs.mjs read this step's text.
          # `planned <script>` is the plan step's predicate (true on every
          # non-PR event); a skip prints SKIPPED <script> and the reason.
          # matrix.needed=false (deploy push / train rows): the name still
          # reports for the Pages reuse check, but no work runs for a
          # slice this diff does not select.
          if [ "${{ matrix.needed }}" = "false" ]; then
            echo "SKIPPED slice ${{ matrix.slice }} — not selected for this diff (needed=false)"
            exit 0
          fi
          . "${RUNNER_TEMP:-.}/node-plan.sh"
          case "${{ matrix.slice }}" in
            vm-a1)
              # The Node VM harness: js/game.js headless, exact parity with the
              # physics baseline (tests/unit/physics-characterization-vm.test.mjs).
              # elevation-tracks-vm builds 40 circuits; each arm builds every
              # other one (APEX_CIRCUIT_SHARD, tools/lib/circuit-scope.cjs), on
              # top of the plan's APEX_CIRCUITS when the diff is circuit-only.
              export APEX_CIRCUIT_SHARD=1/2
              if planned test:game-vm-a; then
              npm run test:game-vm-a
              fi
              unset APEX_CIRCUIT_SHARD   # the shard scopes the elevation twin only; riders see the whole roster
              # RIDERS (2026-10-15): the ten former `fast`-slice scripts used to
              # ride vm-b1, "the shorter half" of 2026-09-30. Measured on three
              # green ship pushes 2026-10-15 (docs/notes/CI-CLOG-SURVEY-2026-10-15.md
              # §7) they were 180 s on top of a game-vm-b1 that alone is 437 s, so
              # vm-b1 set the wall at 10–12 min. They now sit on the three light
              # rows, greedy by median: here net-unit 33 s, audio-unit 33 s,
              # state-unit 5 s, desktop-unit 0.5 s beside a 112 s shard. Still
              # always-on (never guarded by planned()); on a matched PR plan
              # NODE_PLAN_SKIP_TF=1 thins tooling-fast overlap via run-group;
              # the `npm run` else-branch stays for gateNodeSuites / deploy.
              # onlyHere files never drop (docs/notes/CI-CAPACITY-2026-09-29.md).
              # tools/ci/pick-unit-slices.mjs SLICE_SCRIPTS mirrors these arms and
              # its test pins the two in step.
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:net-unit --skip-tf; else
              npm run test:net-unit
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:audio-unit --skip-tf; else
              npm run test:audio-unit
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:state-unit --skip-tf; else
              npm run test:state-unit
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:desktop-unit --skip-tf; else
              npm run test:desktop-unit
              fi
              ;;
            vm-a2)
              export APEX_CIRCUIT_SHARD=2/2
              if planned test:game-vm-a; then
              npm run test:game-vm-a
              fi
              unset APEX_CIRCUIT_SHARD   # as in vm-a1
              # GATE GAP closed 2026-09-10: five garage files (livery-decal-surfaces,
              # livery-contrast, body-split, cover-legibility, helmets) and three
              # steering files (digital-steer, key-binds, settings-export) were in
              # their groups and in NO gate — not tooling-fast, not this step, so
              # deploy.mjs (which derives its node list from here) never ran them
              # either. garage-unit is the heaviest rider (94 s median on a runner,
              # 2026-10-15: the livery rasters), so it rides the 110 s shard alone;
              # steering-unit (6 s) rides `slow`.
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:garage-unit --skip-tf; else
              npm run test:garage-unit
              fi
              ;;
            page-a)
              if planned test:vm-page-a; then
              npm run test:vm-page-a
              fi
              ;;
            page-b)
              if planned test:vm-page-b; then
              npm run test:vm-page-b
              fi
              ;;
            slow)
              # The three raster/spawn-heavy car files, out of the edit loop
              # (152 s of the old 315 s tooling-fast; 2026-09-01) and into the gate.
              if planned test:node-slow; then
              npm run test:node-slow
              fi
              # Riders (see vm-a1): steering-unit 6 s, mcp 5 s, service-worker 4 s,
              # lifecycle-unit and agent-contract < 1 s, beside 168 s of node-slow.
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:steering-unit --skip-tf; else
              npm run test:steering-unit
              fi
              # The CLI-only MCP wrappers were here as test:mcp until 2026-09-10;
              # those suites (tinyfish-mcp, probe-mcp) moved to tests/manual/ and
              # their fast-gate half is mcp-cli. environment-json stays gated here.
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:mcp --skip-tf; else
              npm run test:mcp
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:service-worker --skip-tf; else
              npm run test:service-worker
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:lifecycle-unit --skip-tf; else
              npm run test:lifecycle-unit
              fi
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:agent-contract --skip-tf; else
              npm run test:agent-contract
              fi
              ;;
            vm-b1)
              # First of two time-balanced partitions of test:game-vm-b
              # (tests/groups.json; test:game-vm-b is still the whole list locally).
              # Re-cut 2026-10-15 by per-file runner medians (LPT over 59 files,
              # ~850 s of serial test time each; survey note §7): the 2026-09-30
              # cut measured 437 s vs 220 s on a runner. NODE_PLAN_SKIP_TF=1 drops
              # the VM files Structural guards already runs (tooling-fast:
              # real-replay-vm 98 s, game-vm, red-flag-fuel-vm here;
              # physics-characterization-vm, session-entry-vm on b2) — both jobs
              # share one `if:`, so a matched plan ran them twice (test audit T5,
              # 2026-10-05). --all / fail-safe keep npm run.
              if planned test:game-vm-b1; then
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:game-vm-b1 --skip-tf; else
              npm run test:game-vm-b1
              fi
              fi
              ;;
            vm-b2)
              if planned test:game-vm-b2; then
              if [ -n "${NODE_PLAN_SKIP_TF:-}" ]; then node tools/ci/run-group.mjs test:game-vm-b2 --skip-tf; else
              npm run test:game-vm-b2
              fi
              fi
              ;;
          esac

  sweeps-parts:
    name: Parts option-resolution census
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) }}
    permissions:
      contents: read
      actions: read
    # NOT tree-only, so NOT skipped by `fast_tier_run` (2026-09-24). Its filter
    # diffs a BASE (the push's `before`, or the train's live `before_sha`), so a
    # green fast tier only proves the census for the LAST push's diff: push A
    # edits js/car/ and its census goes red, push B (tests only) skips the
    # census and goes green, and the train that reused B's run shipped A's car
    # change never censused against what is live. On the train the filter diffs
    # live..tip and skips cheaply when no parts path moved.
    # ready_for_review on an unchanged head SHA reuses the draft census.
    # Drafts without run-ci opt out, like the other fast-tier jobs. Ready
    # PRs, deploy pushes and the Pages train still apply the live-diff filter.
    # One subtest of parts-visual-distinctness ("every option resolves to
    # itself") measured 559 s of the 999 s sweeps run on 2026-09-01. Its own
    # runner, unconditional and in parallel, so the geometry sweeps finish in
    # ~7 min and this never blocks them. The census now runs its categories
    # across worker threads over an integer-keyed grid: 71 s on four cores
    # (2026-09-10, byte-identical rows). 10 = well over 2x that, plus setup.
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # fetch-depth: 0 — the filter below diffs against the previous head or the
      # Pages caller's before_sha, neither of which is in a depth-1 clone. Same
      # trade as the sweeps job: a few seconds against the 106 s it decides.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # The same reuse question as guards-a (2026-10-15): a step, not a job hop.
      - name: Was this head already green as a draft?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/ci/reuse-draft-fast.sh >> "$GITHUB_OUTPUT"
      # DOES THIS DIFF TOUCH THE CAR THE CENSUS PHOTOGRAPHS?
      #
      # This census builds the CAR and never a circuit, so it has nothing to do
      # with the geometry planner in select — and until 2026-09-22 it had no
      # filter at all: 106 s of runner on every push, PR and train, including
      # docs-only ones. A coverage audit found it as one of two unconditional
      # costs paid before any path was examined.
      #
      # STEP-LEVEL, not a job `if:`, for the reason spelled out on the sweeps
      # job below: pages.yml has `deploy: needs: ci`, poke-train has
      # `needs: sweeps-parts`, and both consume the AGGREGATE of the jobs that
      # ran. A skipped job changes those semantics; a job that runs and skips
      # its expensive step does not.
      #
      # The pattern is DERIVED from tools/car/parts-sweep.mjs's own VM load
      # list, via tools/ci/geometry-paths.mjs --parts-ere. FAIL SAFE: every
      # path that cannot resolve a diff — not a push, no before-sha, a force
      # push, an unreadable pattern, a git error — RUNS the census.
      - name: Does this diff touch the car parts?
        id: filter
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BEFORE: ${{ inputs.concurrency_key != '' && inputs.before_sha || (inputs.concurrency_key == '' && github.event.before) || '' }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CALLED: ${{ inputs.concurrency_key != '' }}
        run: |
          set -u
          run_all() { echo "parts=true" >> "$GITHUB_OUTPUT"; echo "RUNNING THE PARTS CENSUS: $1"; exit 0; }
          # A pull_request has a base and always had one. The sweeps filter
          # below went without it long enough to run the whole fleet on every
          # PR (fixed the same day this one was written); the mistake is not
          # repeated here.
          case "$EVENT" in
            push) ;;
            pull_request) BEFORE="${PR_BASE:-}" ;;
            *) [ "$CALLED" = "true" ] || run_all "event is '$EVENT', not a push, a PR or a Pages call" ;;
          esac
          # A PR diffs against the test commit's first parent (ci-pr-base.sh):
          # the event's base.sha lags one sync behind it.
          [ "$EVENT" = pull_request ] && BEFORE="$(bash tools/ci/ci-pr-base.sh "${BEFORE:-}")"
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no comparison base (new branch, first push, or caller omitted input)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "base $BEFORE unreachable (force push?)"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          PARTS_ERE="$(node tools/ci/geometry-paths.mjs --parts-ere)" \
            || run_all "could not read the parts path pattern out of tools/ci/geometry-paths.mjs"
          [ -n "$PARTS_ERE" ] || run_all "tools/ci/geometry-paths.mjs printed an EMPTY parts pattern"
          echo "--- parts paths --- $PARTS_ERE"
          if printf '%s\n' "$CHANGED" | grep -qE "$PARTS_ERE"; then
            echo "parts=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING THE PARTS CENSUS: the diff touches a module tools/car/parts-sweep.mjs loads"
          else
            echo "parts=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING THE PARTS CENSUS: nothing in this diff reaches the car the sweep photographs"
          fi
      # The filter needs only git, bash and the checked-out geometry-paths
      # module. Delay Node/npm setup until the census is actually applicable;
      # the job still runs and reports success on an unrelated diff so Pages
      # and the aggregate verdict retain their existing semantics.
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
        if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.parts == 'true'
      - if: steps.reuse.outputs.reuse != 'true' && steps.filter.outputs.parts == 'true'
        run: npm run test:sweeps-parts
      - name: Reused draft
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "SKIPPED parts census — draft fast-tier already green on this head SHA"

  sweeps:
    name: Per-circuit geometry sweeps (${{ matrix.shard }}of4)
    runs-on: ubuntu-latest
    needs: [select]
    # Not in a draft PR's FAST tier; the train (a Pages call) runs it.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!(inputs.concurrency_key == '' && ((github.event_name == 'push' && github.ref_name == 'claude/f1-game-project-26h3ng') || (github.event_name == 'pull_request' && github.event.pull_request.draft)))) && (needs.select.outputs.geometry != 'false' || needs.select.outputs.geometry_targeted != '') }}
    # FOUR suite shards (2026-10-14). Pages train 38500310338 spent 1118 s in
    # the single-runner Geometry sweeps step (1218 s job) while every browser
    # spec shard was done by ~529 s — ~11 min of train idle on this job alone.
    # Suites stay --test-concurrency=1 inside each shard (the 5.4 GB peak that
    # forced serialisation is per process); the matrix is separate VMs, so the
    # peak is not reintroduced. Contiguous slices of package.json's test:sweeps
    # (same list the filter derives), fail-fast: false, like oversize-*-1of3.
    # sweeps-roll-up below keeps the un-suffixed check name Pages reuse wants.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 35, not 20. MEASURED, not estimated: unsharded `test:sweeps` took 14m20s
    # on a 4-core box with the heap ceiling below, plus verify-track --all
    # (~42 s). A shard owns ~1/4 of the suites; 35 still covers a lumpy slice
    # on a shared runner without reading a timeout as a silent cancel.
    #
    # THE HEAP CEILING IS NOT THE SAME HERE AS ON A DEVELOPER'S BOX, and that is
    # why this job failed for days while the identical command passed locally.
    # V8 sizes its default old-space from the machine, so the runner allowed
    # ~4 GB where the dev box allowed 8 GB — a suite peaking at 4.1 GB is green
    # in one place and OOM-dead in the other, with nothing in the diff to
    # suggest it. Measured on run 31016070670: road-under-floor.test.mjs died
    # SIGABRT at 4088 MB after 197 s of "Ineffective mark-compacts near heap
    # limit", and clip-audit.cjs (spawned by prop-clipping.test.mjs) died the
    # same way. Both surfaced as a cancelled job, never as a test failure.
    #
    # Set on the JOB, not the step, so it also reaches the child that
    # prop-clipping.test.mjs spawns with execFileSync — that child was one of
    # the two casualties and a step-level flag would not have covered it.
    #
    # This buys headroom; it does not make the suites frugal. Rebuilding 52
    # circuits in one process and peaking above 4 GB is its own defect (each
    # build's meshes stay reachable for the length of the loop), and the ceiling
    # is what makes that survivable rather than what fixes it.
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # fetch-depth: 0 because the filter below diffs against the PREVIOUS head,
      # and a depth-1 clone does not contain it. It costs a few seconds against
      # the 15 minutes it decides whether to spend.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      # STATIC SUITE SLICE. Deterministic measured-time packing keeps expensive
      # fleet checks off the same runner. Rewrites package.json's
      # script ON THE RUNNER ONLY so the pinned `run: npm run test:sweeps`
      # line (circuit-scope.test.mjs) still holds while each matrix leg owns
      # a disjoint slice. Union of the four slices == the committed list.
      - name: Suite shard assignment
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: |
          set -u
          node <<'NODE'
          const fs = require("fs");
          const shard = +process.env.SHARD;
          const shards = +process.env.SHARDS;
          const pkgPath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          const all = String(pkg.scripts["test:sweeps"] || "").match(/tests\/unit\/[^\s]+/g) || [];
          if (!all.length) {
            console.error("package.json test:sweeps names ZERO suites");
            process.exit(1);
          }
          const { execFileSync } = require("child_process");
          const plan = JSON.parse(execFileSync(process.execPath, [
            "tools/ci/sweep-shards.mjs", "--shard", String(shard), "--shards", String(shards), "--json",
          ], { encoding: "utf8" }));
          const slice = plan.files;
          const temp = process.env.RUNNER_TEMP || ".";
          fs.writeFileSync(`${temp}/sweep-shard-slice.txt`, slice.length ? `${slice.join("\n")}\n` : "");
          console.log(`--- suite shard ${shard}of${shards}: ${slice.length}/${all.length} suites (~${plan.seconds}s measured) ---`);
          for (const s of slice) console.log(s);
          console.log("--------------------");
          pkg.scripts["test:sweeps"] = "node --test --test-concurrency=1" + (slice.length ? ` ${slice.join(" ")}` : "");
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${slice.length}\n`);
          NODE
      - name: Geometry sweeps (rebuilds every circuit, per suite)
        if: needs.select.outputs.geometry != 'false'
        env:
          # Empty = every circuit; a circuit-only PR's ids otherwise (the planner).
          APEX_CIRCUITS: ${{ needs.select.outputs.geometry_circuits }}
        run: npm run test:sweeps
      # The cheap tier: only the suites that read this diff, from the same
      # table deploy.mjs uses locally. Never runs alongside the fleet (the
      # fleet already includes them). Each shard runs the intersection of
      # TARGETED with its suite slice so every suite still runs exactly once.
      - name: Targeted sweeps (the suites that read this diff, no fleet rebuild)
        if: needs.select.outputs.geometry == 'false' && needs.select.outputs.geometry_targeted != ''
        env:
          TARGETED: ${{ needs.select.outputs.geometry_targeted }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          SLICE_FILE="${RUNNER_TEMP:-.}/sweep-shard-slice.txt"
          MINE=""
          for t in $TARGETED; do
            if [ -f "$SLICE_FILE" ] && grep -qxF "$t" "$SLICE_FILE"; then
              MINE="${MINE} ${t}"
            fi
          done
          MINE="${MINE# }"
          echo "targeted shard ${SHARD}of4: ${MINE:-"(none on this shard)"}"
          [ -z "$MINE" ] && exit 0
          node --test --test-concurrency=1 $MINE
      # Once per matrix, not once per shard — shard 1 only (same work as the
      # old single job's trailing step).
      - name: Every circuit still builds headlessly
        if: needs.select.outputs.geometry != 'false' && matrix.shard == 1
        run: node tools/track/verify-track.cjs --all

  # Un-suffixed check name for pages-reuse-verdict.sh (exact match on
  # "Per-circuit geometry sweeps"). Needs the matrix so every suite shard
  # must be green; ci-verdict needs this job too.
  sweeps-roll-up:
    name: Per-circuit geometry sweeps
    needs: [select, sweeps]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (always() && !cancelled() && needs.select.result == 'success' && (needs.sweeps.result != 'skipped' || (needs.select.outputs.geometry == 'false' && needs.select.outputs.geometry_targeted == ''))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every sweep shard succeeded or the planner proved no sweep applies
        env:
          SWEEPS_RESULT: ${{ needs.sweeps.result }}
          GEOMETRY: ${{ needs.select.outputs.geometry }}
          TARGETED: ${{ needs.select.outputs.geometry_targeted }}
        run: |
          test "$SWEEPS_RESULT" = success || {
            test "$SWEEPS_RESULT" = skipped && test "$GEOMETRY" = false && test -z "$TARGETED"
          }

  smoke:
    name: Smoke (page boots, __apex responds)
    runs-on: ubuntu-latest
    # Not in a draft PR's FAST tier; the train (a Pages call) runs it.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!(inputs.concurrency_key == '' && ((github.event_name == 'push' && github.ref_name == 'claude/f1-game-project-26h3ng') || (github.event_name == 'pull_request' && github.event.pull_request.draft)))) }}
    # NO job-level `if` (2026-09-10). Two guards lived here and both were wrong
    # in opposite directions. `inputs.smoke != false` skipped this job on EVERY
    # branch and PR push: `inputs` is empty on a plain push, null coerces like
    # false, and `null != false` is FALSE (measured 2026-08-14, runs 31765883905
    # and 31766287790 — smoke and selected both `skipped` with completed_at
    # before started_at). Its replacement, `github.event_name != 'workflow_call'
    # || inputs.smoke`, could never skip: in a called workflow `github.event_name`
    # is the CALLER's event (`push`), so the first operand was always true and
    # the input was inert. A guard that either always or never fires is not a
    # switch — the smoke gate simply runs on every push, PR and deploy.
    # TWO SHARDS, TWO RUNNER VMs — NOT two workers on one VM. The measured rule
    # below (two concurrent SwiftShader contexts on one shared runner blow the
    # per-test timeout) still binds: each shard keeps APEX_WORKERS=1 and runs
    # its half of the spec list alone on its own machine. Sharding exists to
    # shrink WALL-CLOCK, because this job's ~14-18 min serial length is the
    # window in which a run gets superseded and cancelled by the next push —
    # measured 2026-08-14: run 1407 was cancelled at 29 min, ONE spec from
    # green, after two 240 s runner-starvation timeouts stretched the serial
    # pass. Half the specs per VM ≈ half the window.
    # FOUR shards, not two (SwiftShader era; since 2026-09-29 only the wide
    # nightly / dispatch run keeps four — see the matrix). MEASURED per-spec on 2026-08-14 after the render-loop
    # and direct-boot changes (509.5 s of serial work across the 9 specs), against
    # how `--shard` actually divides them — contiguous chunks in declaration order:
    #     2 shards   232 / 277 s          pole 277 s
    #     3 shards   123 / 165 / 222 s    pole 222 s
    #     4 shards   123 / 110 / 87 / 190 pole 190 s
    # Beyond four the pole stops moving, because `--shard` balances COUNT and the
    # cost is lumpy: the two HUD specs at the end (speed readout 109 s, minimap
    # 81 s) are the pole on their own, and no count-based split separates them
    # from each other without reordering the file. Runners are free on a public
    # repo and the per-job overhead is ~38 s (less now that Chromium is cached),
    # so four is where this stops paying.
    strategy:
      fail-fast: false
      matrix:
        # FOUR, SwiftShader era. smoke.spec.js unsharded measured 30-37 min on a shared
        # runner (Pages runs 1873/1876, 2026-09-01/02) — at this job's 30-minute
        # cap. The 2026-09-01 slimming collapsed the push gate to ONE shard by
        # mistake; the nightly's four shards are the boot group, the push gate's
        # four are smoke.spec.js (~8 min wall). Shards are separate runners.
        #
        # ONE SHARD FOR smoke.spec.js ON LLVMPIPE (2026-09-29). The 30-37 min
        # above was SwiftShader. On llvmpipe (2026-09-16) the four shards
        # measured 0.3-0.9 min of test work each against ~0.5 min of setup
        # apiece, and smoke.spec.js as a whole medians 67 s for 10 tests
        # (tests/data/spec-timings.json) — four runners for about a minute of
        # work, each holding one of the account's 20 concurrent slots
        # (docs/notes/CI-CAPACITY-2026-09-29.md). PRs and the Pages call now run
        # it as one shard (`--shard=1/1`); the nightly and dispatched WIDE run
        # — a whole browser group, 70-150 tests — keeps four.
        shard: ${{ fromJSON((inputs.concurrency_key == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && '[1, 2, 3, 4]' || '[1]') }}
    # 30, not 20. MEASURED on run 31023778264, the first green one: 14m24s.
    # That fit the old cap, but with 5.5 minutes to spare on a SHARED runner
    # whose per-test cost is the very thing that varies — and the last time a
    # margin here was thin it produced a `cancelled` nobody read as a failure.
    # The serial single-worker run below is slower per pass by design, so the
    # budget has to reflect that rather than the 2-worker figure it replaced.
    # The cap stays at the whole-suite figure even though a shard runs half the
    # specs: the starvation tail this job has actually measured (334 s for one
    # spec) is per-runner luck, not per-spec arithmetic.
    #
    # 30 -> 50. SIX consecutive deploys failed here (Pages #1848-#1854, three
    # authors), every one a wall-clock timeout and not one assertion mismatch.
    # In-page timestamps on run #1854 show the same shard, same commit, booting
    # 37-55x slower between two attempts: `[car] build mercedes` 3,956 ms then
    # 147,612 ms; `[assets] pack loaded` 5,008 ms then 276,476 ms. Shard 4 was
    # not even failing — it was CANCELLED at 29.5 min still running, so this cap
    # was the binding constraint as much as the per-test one below, and a
    # cancelled job is exactly the silent-failure mode the header warns about.
    # 50 covers a shard whose every spec lands in the starvation tail, with the
    # per-test cap below as the real hang detector.
    #
    # …but 50 was measured for what a PUSH runs here: smoke.spec.js sharded four
    # ways. The same job also runs the WIDE step — the boot group nightly, or on
    # dispatch whichever group `group` names — and that is a different size of
    # job wearing the same cap. Measured 2026-09-08 on the `ui` dispatch (run
    # 34279958405): the group is 150 tests, --shard splits them 38/38/37/37 by
    # COUNT, and APEX_WORKERS is 1. Shard 2 drew the cheap specs and finished
    # its group in 11.5 min; shards 1, 3 and 4 drew the race-building ones and
    # were still running at exactly 50:00 when the cap killed them. At the ~94 s
    # race boot this file already records for a starved runner, 37 race-shaped
    # tests is ~58 min of BOOT before a single assertion — the cap could not be
    # met, and it is the fourth `ui` dispatch to die this way.
    #
    # A TIMED-OUT JOB REPORTS `cancelled`, which is why this kept being read as
    # someone clicking cancel (docs/notes/TESTING-FIELD-NOTES.md, and the plan
    # file recorded the wrong cause three times). The dispatch and the nightly
    # get their own number; the per-test cap below is still the hang detector,
    # so a genuinely stuck spec goes red at 15 min rather than burning the 120.
    # A Pages call reports the CALLER's event — `schedule` for a train tick,
    # `workflow_dispatch` for "deploy now" — and runs smoke.spec.js, so it
    # takes the smoke cap, never the wide run's 120. concurrency_key is the tell.
    #
    # 50 -> 20 for the ONE-shard smoke.spec.js run (2026-10-14). The 50 above
    # was the SwiftShader starvation tail; on llvmpipe a ready PR's or the
    # Pages call's single shard measured p50 2.9 / p90 3.1 / max 3.2 min over
    # 35 jobs (pages.yml + pull_request runs, 2026-10-14), and the slowest
    # llvmpipe smoke.spec.js in tests/data/spec-timings.json is 153 s. 20 is
    # >6x that job wall. A spec that hangs to its 900 s per-test timeout AND
    # its retry now meets this cap first: the job reads `cancelled`, which
    # ci-verdict.mjs fails exactly like `failure` — red either way, never green.
    timeout-minutes: ${{ (inputs.concurrency_key == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && 120 || 20 }}
    # NO JOB-LEVEL CONCURRENCY (2026-10-16, the 2026-10-16 CI/CD review
    # note (#2333) finding 6). From 2026-10-15 to 10-16 every ready PR's single smoke shard
    # shared ONE fleet-wide lane group, so a 2.6-minute job that
    # never failed (0 of 452) waited p50 4.7 / p90 17.5 min behind other PRs'
    # smoke and ended the critical path of 40 of 210 green ready runs. The
    # selected legs keep their lanes (they are many per run); this is one job
    # per run and the runner queue is the only wait it should pay. The
    # workflow-level per-PR group still replaces a superseded run.
    # The ship filter is ONE job now, not one copy per shard. `needs:` alone does
    # not skip this job — it must still RUN and report, because pages.yml's
    # `deploy: needs: ci` reads the aggregate of the jobs that ran and a skipped
    # smoke is not the same thing as a passed one. So every step below carries
    # the condition instead, checkout and the dependency install included: on a
    # diff that ships nothing this job starts, does nothing, and reports success
    # in seconds, exactly as it did when the filter was its first step.
    needs: [select]
    steps:
      # fetch-depth: 1 is enough now. The full history was here for the filter,
      # which diffed against an arbitrarily old live SHA; that work moved to the
      # ship-filter job, and the specs themselves only need the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.select.outputs.ships != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
        if: needs.select.outputs.ships != 'false'
      # Chromium only — the suite never targets firefox/webkit, and installing
      # all three triples the step for nothing. The cache-then-install-on-miss
      # contract (apt only on a cold cache) lives in the composite action, once
      # for the five browser jobs (2026-09-22); ci-coverage.test.mjs pins it there.
      - name: Playwright Chromium (cached)
        if: needs.select.outputs.ships != 'false'
        uses: ./.github/actions/playwright-chromium
      # MESA LLVMPIPE, NOT SWIFTSHADER, FOR THE SMOKE GATE (2026-09-16): the
      # measurements and the why are on the composite action. Shard walls
      # 1.1-1.6 min against 1.8-4.8 min on the SwiftShader push run of the same
      # commit. The dispatched wide run is llvmpipe too since 2026-09-16;
      # `gl: swiftshader` is the opt-OUT that skips this step and the env
      # below, so a spec can still be measured on both.
      - name: Mesa llvmpipe + Xvfb
        if: needs.select.outputs.ships != 'false' && inputs.gl != 'swiftshader'
        uses: ./.github/actions/mesa-xvfb
      # test:smoke, NOT test:tiny. This step said `test:tiny` against a
      # 20-minute cap and a "~3 min" estimate, and the arithmetic never worked:
      # test:tiny is smoke + dev-tools + logging = 71 tests, CI pins
      # `workers: 2` (playwright.config.js), and a SwiftShader test on a shared
      # runner measured 90-115 s. That is ~53 minutes of work in a 20-minute
      # box. Run 31016070670 got to 30/71 before the timeout killed it — dead on
      # that trajectory, and with `0 failed` the whole way, so the job was never
      # telling us anything about the code.
      #
      # A gate that is always killed provides no coverage, so this is not a
      # reduction in what CI checks — it is the difference between nine specs
      # that report and seventy-one that never finish. dev-tools and logging
      # belong in a local `tools/ci/test-bg.mjs` run, which is where the workflow
      # header already says the full suite lives.
      # ONE WORKER, AND A PER-TEST TIMEOUT THAT FITS THE RUNNER. With the spec
      # count fixed, run 31019857052 still failed — but as `failure` rather than
      # `cancelled`, which is the first time this gate reported anything real.
      # Both failures were `Test timeout of 120000ms exceeded`, neither was an
      # assertion, and both were the two SwiftShader RENDERING specs (grid start
      # 175.7 s, corner approach 150.6 s).
      #
      # The log contains its own controlled experiment. `speed readout updates
      # after jump()` timed out at 125.2 s while a second worker was busy, then
      # PASSED on retry at 110.6 s in the window where the status line shows w8
      # running alone. Same test, same commit, same machine: two concurrent
      # SwiftShader contexts blow the limit and one does not. That is the
      # oversubscription signature CLAUDE.md describes — every failure a timeout,
      # not one of them an expectation that did not hold — and it is measuring
      # the runner, not the game.
      #
      # `workers: 2` is right for a 4-core dev box and wrong here, so APEX_WORKERS
      # (playwright.config.js's documented override) pins it to 1. The timeout
      # goes to 240 s because even uncontended the runner needed 110.6 s against
      # a 120 s limit — margin that thin is a coin flip, and a coin flip in a
      # deploy gate is what this whole exercise has been about.
      #
      # Serial and slower per pass is still far cheaper than the retries and the
      # false red: 9 specs, no contention, well inside the 20-minute cap.
      #
      # 240 -> 420 s, SAME ARGUMENT AS THE 120 -> 240 RAISE ABOVE, RE-MEASURED.
      # The reasoning that set 240 ("even uncontended the runner needed 110.6 s
      # against a 120 s limit") held until the runner pool got slower than the
      # pool it was measured on. MEASURED 2026-08-14, three separate runs, one
      # worker, no contention from our side:
      #   run 1407  grid start renders a non-blank frame   334 s (retry passed)
      #   run 1407  the select screen is a circuit picker  240 s (retry passed)
      #   run 1412  corner approach renders a non-blank    309 s, RETRY ALSO
      #             timed out -> terminal FAIL, deploy blocked
      # The third one is the reason this is not "just flakiness to retry past":
      # both attempts exceeded the cap, so the gate reported failure for a suite
      # that passes 9/9 locally on the same commit.
      #
      # The cap is now measured against the RUNNER, not the test: the same log
      # records `race bahrain` taking 94.3 s to boot where a dev box takes ~4 s,
      # so the spec was doing correct work ~20x slower than it costs anywhere
      # else. 420 s clears tonight's worst observed pass (334 s) with the same
      # ~25 % margin the 240 s figure was chosen to give over its own 110.6 s
      # worst case. If a spec ever genuinely hangs, the job's own
      # job's `timeout-minutes` is the real backstop — a per-test cap set below
      # the machine's noise floor only converts slow into red.
      #
      # 420000 -> 900000, for the reason the job cap moved: measured on Pages
      # #1854, `minimap canvas has content` needed 640.6 s and `grid start
      # renders a non-blank frame` 488.0 s on a starved runner, both against a
      # 420 s cap, while the SAME specs pass in seconds locally. 900 s clears
      # the 640.6 s worst observed with ~40 % margin — the same kind of margin
      # 420 was chosen to give over its own 334 s worst case, re-measured
      # against a runner that has since got slower. This raises a BUDGET, not a
      # tolerance: no assertion changed, and a spec that genuinely hangs still
      # goes red, just later.
      - name: Smoke
        # A Pages call (concurrency_key set) is ALWAYS this step, whatever the
        # caller's event: the train ticks on `schedule` and "deploy now" is a
        # `workflow_dispatch`, and neither means the wide run below.
        if: needs.select.outputs.ships != 'false' && (inputs.concurrency_key != '' || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'))
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
          # llvmpipe (the step above): ~10x on the rendering tests, measured.
          APEX_GL: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        # --shard splits smoke.spec.js's tests across the matrix VMs (four in
        # the SwiftShader era, when unsharded this step took 30-37 min); the
        # flag passes through tools/ci/run-playwright.mjs verbatim (it forwards
        # argv to `playwright test`).
        # --shard=1/1 on PRs and the Pages call (one runner, see the matrix);
        # the flag stays so a return to more shards is one number.
        run: npm run test:smoke -- --timeout=900000 --shard=${{ matrix.shard }}/1   # zizmor: ignore[template-injection] matrix.shard is a workflow-literal integer (ci-coverage.test.mjs pins this exact form)
      # The wide run: the whole boot group, 4 shards, nightly — or, on dispatch,
      # whichever browser group the `group` input names (default tiny). On
      # llvmpipe since 2026-09-16, for the smoke numbers measured above (corner
      # approach 17.8 s vs 214, grid start 21.4 vs 138, shard walls 1.1-1.6 min
      # vs 1.8-4.8); `gl: swiftshader` is the opt-OUT below.
      # TONIGHT'S GROUP ROTATES. Pinning the nightly to `tiny` gave 4 of 118
      # browser specs any scheduled coverage at all — the gate runs `smoke`
      # unconditionally and everything else only when a change SELECTS it, so a
      # spec could sit red indefinitely with nothing to notice. One did
      # (docs/notes/DEFECT-LEDGER.md, 2026-09-16: physics-fixes was red on the
      # deploy branch and a benchmarking run found it, not a gate). Rotating one
      # group a night covers them all in ~11 nights for the minutes the nightly
      # already spent. Deterministic by UTC day so a red night reproduces from
      # its date; tests/unit/nightly-group.test.mjs proves the cycle covers
      # every group and that a new browser group cannot silently skip it.
      - name: Pick tonight's rotating group
        id: rota
        # The ship-filter clause is not decoration: without it this runs on a
        # ships-nothing nightly, where the checkout step above was skipped and
        # the script it calls is not on disk.
        if: needs.select.outputs.ships != 'false' && github.event_name == 'schedule'
        run: node tools/ci/nightly-group.mjs >> "$GITHUB_OUTPUT"
      - name: Boot group (nightly) / dispatched group
        if: needs.select.outputs.ships != 'false' && inputs.concurrency_key == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.gl != 'swiftshader'
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
          GROUP: ${{ (github.event_name == 'workflow_dispatch' && inputs.group) || steps.rota.outputs.GROUP || 'tiny' }}
          # A dispatched group runs its browser copies of the VM-twinned specs
          # too (locally run-playwright skips them; this is where they still run).
          APEX_WITH_TWINNED: 1
          # Mesa llvmpipe + Xvfb, installed by the step above (it is skipped
          # with `gl: swiftshader`, and so is this step).
          APEX_GL: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: npm run "test:${GROUP:-tiny}" -- --timeout=900000 --shard=${{ matrix.shard }}/4   # zizmor: ignore[template-injection] matrix.shard is a workflow-literal integer (ci-coverage.test.mjs pins this exact form)
      # The same run on ANGLE's SwiftShader (dispatch input `gl: swiftshader`):
      # the opt-out, for measuring a spec on both rasterisers or for a renderer
      # verdict that must match the pre-2026-09-16 history. Its own step so the
      # step above keeps the exact command line tests/unit/ci-coverage.test.mjs
      # pins; read the shard times and the WEBGL_debug_renderer_info string in
      # the log against an llvmpipe run.
      - name: Dispatched group on SwiftShader (opt-out)
        if: needs.select.outputs.ships != 'false' && github.event_name == 'workflow_dispatch' && inputs.gl == 'swiftshader'
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
          APEX_WITH_TWINNED: 1
          GROUP: ${{ inputs.group || 'tiny' }}
        run: npm run "test:${GROUP:-tiny}" -- --timeout=900000 --shard=${{ matrix.shard }}/4   # zizmor: ignore[template-injection] matrix.shard is a workflow-literal integer (ci-coverage.test.mjs pins this exact form)
      # THE TIMINGS OF A GREEN RUN ARE THE DATA, and they were being thrown away.
      # Every per-test duration this job measures is written to junit.xml by
      # playwright.config.js, and the only step that uploaded it ran
      # `if: failure()` — so a PASSING run, which is the run whose timings you
      # actually want, discarded them. tools/ci/spec-timings.mjs has existed to
      # merge exactly this and had nothing to merge: 0 of 119 specs carry three
      # samples, and select-budget.mjs still bills the whole tree from one
      # 2026-08-07 measurement of one spec.
      #
      # Its own upload, not a widened failure one: junit.xml is a few KB, while
      # the failure artifacts beside it are traces and screenshots worth tens of
      # MB. `always()` so a timed-out or failed run still contributes the tests
      # that did finish. `if-no-files-found: ignore` because a job whose steps
      # were all skipped (the ship filter) legitimately produces none.
      # `always()` AND the ship filter: always() is here to catch a run that
      # timed out or failed partway, which still measured the tests that did
      # finish. A ships-nothing diff is the other thing entirely — every step
      # above was skipped, so there is no junit and nothing to say.
      - name: Spec timings (junit — a green run's durations are the point)
        if: always() && needs.select.outputs.ships != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-timings-junit-smoke-${{ matrix.shard }}
          path: artifacts/test-results-*/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Shard-scoped name: same-named artifacts from parallel matrix jobs
          # collide on upload-artifact@v4 (it hard-fails on duplicates).
          name: playwright-artifacts-smoke-${{ matrix.shard }}
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  driving-model:
    name: Driving model (characterization traces)
    needs: [select]
    runs-on: ubuntu-latest
    # Tree-only: skipped when the train reuses a green fast tier (`fast_tier_run`).
    # Also skipped when unit-plan says this diff does not need the characterization
    # (ci-verdict treats that skip as a pass). Not on the Pages call
    # (`concurrency_key` set; decision D2 in the CI selection plan,
    # PR #2560 §6): 0 train catches in 40 h; PRs and the nightly keep it.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.fast_tier_run == '' && inputs.concurrency_key == '' && needs.select.outputs.driving == 'true') }}
    # 42 s measured in CI (run 31197770813, step 7). The old 10-minute cap was
    # consumed entirely by an uncached Chromium install on run 32083395969, so
    # the characterization never started and Pages was blocked. Keep the same
    # lockfile-keyed browser cache as smoke and leave enough room for a genuine
    # cold install on a slow shared runner.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same reuse question as guards-a (2026-10-15): a step, not a job hop.
      - name: Was this head already green as a draft?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/ci/reuse-draft-fast.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
        if: steps.reuse.outputs.reuse != 'true'
      - name: Playwright Chromium (cached)
        if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/playwright-chromium
      # THE DRIVING MODEL'S OWN GATE, which nothing was running.
      #
      # tests/specs/physics-characterization.spec.js pins six-sample traces of four
      # scenarios and fails if the driving model's numbers move. It is not in
      # guards (browser spec, not node), not in sweeps (geometry only), and not
      # in smoke's spec list — so it had never run in CI, and locally it had
      # never passed either. The result: 175 commits of deliberate physics work
      # (geometric RACE PACE, the PACE regrid, the SPEED STEER taper, the
      # wheelbase recentre) drifted past it with nothing to say so, and the
      # baseline was ~9 % stale before anyone looked. A gate nobody runs is not
      # a gate.
      #
      # ITS OWN JOB, NOT A STEP IN SMOKE — and it landed as a step first, which
      # is the mistake worth recording. Appending it to smoke was the cheap
      # move: smoke is the only job that installs the browser binaries, so it
      # cost nothing extra. But a step inherits its job's fate in both
      # directions. It ran only AFTER smoke's twelve minutes, so a red smoke
      # meant the driving-model gate never executed at all — a gate that
      # silently does not run is the exact failure class the header above
      # documents. And GitHub's checks list reports JOBS, not steps, so a
      # failure surfaced as "Smoke (page boots, __apex responds)" — defeating
      # the stated reason for making it a separate step in the first place.
      #
      # The cost argument was also weaker than it looked. The gate's critical
      # path is sweeps (~15 min) and smoke (13m21s measured); a job that takes
      # ~40 s of setup plus 42 s of test runs alongside them and adds ZERO
      # wall-clock. One runner is the whole price of an independent verdict.
      #
      # No `needs:` — this is orthogonal to whether the page boots. It answers
      # one question, in its own name: did the driving model's numbers move?
      - name: Characterization traces
        if: steps.reuse.outputs.reuse != 'true'
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
        run: npm test -- tests/specs/physics-characterization.spec.js --timeout=240000
      - name: Reused draft
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "SKIPPED driving-model — draft fast-tier already green on this head SHA"
      # THE TIMINGS OF A GREEN RUN ARE THE DATA, and they were being thrown away.
      # Every per-test duration this job measures is written to junit.xml by
      # playwright.config.js, and the only step that uploaded it ran
      # `if: failure()` — so a PASSING run, which is the run whose timings you
      # actually want, discarded them. tools/ci/spec-timings.mjs has existed to
      # merge exactly this and had nothing to merge: 0 of 119 specs carry three
      # samples, and select-budget.mjs still bills the whole tree from one
      # 2026-08-07 measurement of one spec.
      #
      # Its own upload, not a widened failure one: junit.xml is a few KB, while
      # the failure artifacts beside it are traces and screenshots worth tens of
      # MB. `always()` so a timed-out or failed run still contributes the tests
      # that did finish. `if-no-files-found: ignore` because a job whose steps
      # were all skipped (the ship filter) legitimately produces none.
      - name: Spec timings (junit — a green run's durations are the point)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-timings-junit-driving-model
          path: artifacts/test-results-*/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-driving-model
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  # RENDERER SPECS ON A REAL GPU. Every other browser job in this file runs on
  # ubuntu-latest, whose only WebGPU/WebGL adapter is SwiftShader, and the
  # renderer group (`gfx`: 240-480 s budgets under software rasterisation) has
  # never been in CI at all — the header's "deliberately NOT here" clause.
  # docs/research/CI-RENDERING-PERFORMANCE.md §"There IS a real GPU" measured
  # the runner images: macos-latest (Apple silicon) reports a HARDWARE Metal
  # adapter on STOCK flags, and the two defects that real GPU has found so far
  # were invisible to every software test. So the renderer specs get their own
  # macOS job (PROCESS-SPEEDUP-2026-09 §1.4 / §4.5).
  #
  # THE FILTER IS A STEP OF `select` (2026-10-15; a job of its own before).
  # A macOS runner is one of the account's FIVE macOS slots
  # (the repo is public, so minutes are free; the slot is the cost), so the "does this diff touch
  # the renderer?" question is answered on a ubuntu runner first (seconds, no
  # npm ci) and the macOS runner is only ever allocated when the answer is
  # yes. A step-level skip inside the macOS job — the sweeps pattern — would
  # still pay for the macOS checkout and npm ci on every push.
  renderer-macos:
    name: Renderer specs on a real GPU (macos-latest, Metal)
    needs: select
    # A job-level `if:` on a `needs:` output is fine HERE, where the sweeps
    # comment forbids it, because the selector owns the path decision.
    # Pages calls now run the filter against the live commit, so a release that
    # changes renderer bytes also gets the Metal check before publication. The
    # "skipped reads as passed" hazard the sweeps avoid is about a job whose
    # verdict the deploy consumes; nothing consumes this one but the checks list.
    # Nightly, a dispatch that asked for it (`renderer_macos: true`), or a
    # ready PR whose filter said the diff touches the renderer. Never a
    # draft PR or a bare topic-branch push — see the filter's header.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (needs.select.outputs.renderer == 'true' && (inputs.concurrency_key != '' || github.event_name == 'schedule' || inputs.renderer_macos == true || (github.event_name == 'pull_request' && !github.event.pull_request.draft))) }}
    runs-on: macos-latest
    # 30 is a GUESS, and the header says what to do about that: the six specs
    # declare 240-480 s budgets measured under SwiftShader, where a boot is
    # 11-33 s; the census measured a ~4 s boot on this image's Metal adapter.
    # Re-time on the first green run and replace this number and the header's.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      # Same lockfile-keyed cache as smoke / driving-model, at macOS's browser
      # path (~/Library/Caches, not ~/.cache). The key already carries
      # runner.os, so it never collides with the Linux entries.
      # The FULL browser, the way gpu-census.yml installs it — not the headless
      # shell, which ships without navigator.gpu. `install chromium` fetches
      # both; playwright.gpu.config.js selects the full one. No `--with-deps`:
      # that is apt, and this is not Linux.
      - name: Playwright Chromium (cached)
        uses: ./.github/actions/playwright-chromium
        with:
          browsers-path: ~/Library/Caches/ms-playwright
          with-deps: "false"
      # PROVE THE GPU BEFORE TRUSTING THE RUN. The whole point of this job is
      # the hardware adapter; if the image ever loses it (a runner-image
      # change, a Chromium that stops seeing Metal) the specs would silently
      # run on SwiftShader and this job would become a slower ubuntu job that
      # still says "macOS". AGENTS.md: a software run is not evidence about a
      # player's machine. The tri-state census (tools/gfx/gpu-census.mjs) is the
      # same one gpu-census.yml gates on; `=== true` on purpose, so a census
      # that measured nothing (null) fails rather than passing vacuously.
      - name: Adapter census — is the Metal adapter still there?
        run: |
          node tools/gfx/gpu-census.mjs --json census-macos.json
          node -e '
            const r = require("./census-macos.json");
            if (r.anyHardware !== true) {
              console.error("::error::renderer-macos: the census found NO hardware adapter (anyHardware=" + r.anyHardware + ") — this run would measure SwiftShader on a Mac, not the GPU");
              process.exit(1);
            }
          '
      # playwright.gpu.config.js is playwright.config.js with ONE difference:
      # the launch drops the `--use-angle=swiftshader` pin every other run
      # carries and selects the full Chromium (`channel: "chromium"`). The
      # shared config is untouched — it is a protected contract file — and the
      # --config flag passes through tools/ci/run-playwright.mjs verbatim. NEVER
      # add --use-angle=vulkan anywhere on this job: on macOS that one flag
      # forces ANGLE onto SwiftShader and requestAdapter() returns null
      # (CI-RENDERING-PERFORMANCE.md §There IS a real GPU, trap 1). Two
      # workers: a real GPU does not have SwiftShader's ~1.9x second-worker
      # penalty (docs/TESTING.md), and the budget is the image's to measure.
      # --timeout=600000 is a CEILING for the first runs, not a tolerance: the
      # specs keep their own budgets, and the job cap is the real backstop.
      - name: Renderer specs (test:gfx)
        # ONE worker on the Metal box. Two Chromium instances on one shared GPU
        # wedged Playwright's "Create context" twice in four runs (3500, 3509),
        # both times while the other worker was inside M9's env probe, and each
        # sat 27 min on the 30 min per-test budget until a hand cancel. One
        # worker costs ~8 min of wall time; a wedge costs the run.
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
        run: npm run test:gfx -- --config=playwright.gpu.config.js --timeout=600000
      # ALWAYS, not failure(): a spec that fails its first attempt and passes
      # the retry leaves the job green and its report — the attached frames
      # image-grade "shadows" compares, the retry's diag — unretrievable. Run
      # 3495 (2026-09-10) was exactly that; the pictures are the whole point.
      - name: Run artifacts (report, traces, attached frames)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-renderer-macos
          path: |
            census-macos.json
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  # EMULATED-VR (IWER) — path-gated. The xr-emulated Playwright project and
  # `npm run test:xr` existed but sat in no CI job; a js/xr/ change only ran
  # the Node xr-phase0 suite under steering-unit. Two jobs like renderer-*:
  # a cheap ubuntu filter, then the IWER suite only when the diff reaches XR
  # (or on dispatch). Skipped on the Pages call and on the nightly schedule
  # (the rotation excludes test:xr for the same reason gfx is excluded).
  xr:
    name: Emulated VR (IWER / xr-emulated)
    needs: select
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!inputs.concurrency_key && needs.select.outputs.xr == 'true') }}
    runs-on: ubuntu-latest
    # Unmeasured on CI; local IWER suite is minutes. Cap generously.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - name: Playwright Chromium (cached)
        uses: ./.github/actions/playwright-chromium
      - name: Emulated VR (test:xr)
        env:
          APEX_WORKERS: 1
          APEX_FAIL_ON_FLAKY: 1
        run: npm run test:xr -- --timeout=600000
      - name: Failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-xr
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  # THE CHANGE-AWARE GATE, in two jobs (2026-09-10): `select` plans, `selected`
  # runs the plan as a matrix. It used to be one job that ran on branch pushes
  # and PRs only. Three things about it were wrong, all fixed here:
  #
  #   1. It could drop the spec you edited. The cut was smallest-first with the
  #      priority applied AFTER it, so a changed 10-test spec lost to smaller
  #      routed ones. tools/ci/select-specs.mjs now fills the budget affected-
  #      first, and an affected spec that still does not fit runs in its own
  #      matrix shard (bounded at MAX_OVERSIZE_SHARDS; the rest named as skipped).
  #   2. A tracked-path change (the shell, package.json, a fixture every spec
  #      imports) EMPTIED the selection. It now narrows it to the edited and
  #      imported specs and says so; the fixed gates own the rest.
  #   3. It was skipped on the deploy gate (`inputs.concurrency_key == ''`).
  #      pages.yml now publishes exactly the commit it tested, which makes
  #      "did we test what this commit changed?" a deploy question too, so the
  #      job runs on the Pages call as well. Pages run 2215 (2026-09-10) once
  #      went red on this job's newContext() hang while deploying an unrelated
  #      change; if that shape recurs the answer is a fix or an exclusion by
  #      name in the selector, never skipping the gate again.
  #
  # A PR's event.before is not its comparison base, so the selector uses
  # pull_request.base.sha; pushes (direct or via the Pages call, whose github
  # context is the caller's push) use event.before, with HEAD~1 as the fallback.
  select:
    name: Select specs for this change
    runs-on: ubuntu-latest
    # A Pages call (the train) is a gate too: it carries a concurrency_key and
    # its before_sha is the live commit, so the plan reads "what changed since
    # what is live". The caller's event is `schedule` there, hence the third
    # clause rather than an event test.
    # `schedule` is the nightly's CHANGE-AWARE lane (tools/ci/ci-resolve-before.sh):
    # every spec the last day of merges routed, with room for more overflow
    # shards than one change gets — so a spec a 15-minute per-change budget
    # squeezes out runs within a day, not on its group's night in 11.
    # THE PLAN JOB (2026-10-15). Also plans the node slices (was `unit-plan`),
    # answers the ship / renderer / xr path questions (were three filter jobs)
    # and asks nothing a draft fast tier does not need. One runner, one
    # checkout, one npm ci, one queue hop in front of node rows, selected legs,
    # smoke, renderer-macos and xr alike — five job starts and a hop fewer per
    # run (docs/notes/CI-CLOG-SURVEY-2026-10-15.md). The slice plan runs
    # whenever the node matrix does (`fast_tier_run == ''`), so a dispatch
    # without a diff still gets its --all plan; the spec selection keeps its
    # own event test on the step.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.fast_tier_run == '' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.concurrency_key != '') }}
    # actions:read on top of the workflow default — the base-verdict step at the
    # end lists this workflow's runs on the deploy branch. A job that names
    # permissions gets ONLY what it names, hence contents too.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.sel.outputs.shards }}
      any: ${{ steps.sel.outputs.any }}
      # How many routed specs the plan could NOT run, and why the plan exists at
      # all. poke-train needs both to tell an empty plan from an unaffordable one.
      dropped: ${{ steps.sel.outputs.dropped }}
      reason: ${{ steps.sel.outputs.reason }}
      # The node-slice plan (was unit-plan's).
      slices: ${{ steps.plan.outputs.slices }}
      any_node: ${{ steps.plan.outputs.any_node }}
      driving: ${{ steps.plan.outputs.driving }}
      plan_reason: ${{ steps.plan.outputs.reason }}
      # The three path filters (were ship-filter / renderer-filter / xr-filter).
      # Empty when the step did not run; every consumer reads empty as its
      # own job `if:` decides (smoke runs on != 'false'; renderer/xr on == 'true').
      ships: ${{ steps.shipfilter.outputs.ships }}
      renderer: ${{ steps.renderer.outputs.renderer }}
      xr: ${{ steps.xrfilter.outputs.xr }}
      geometry: ${{ steps.geometry.outputs.geometry }}
      geometry_targeted: ${{ steps.geometry.outputs.targeted }}
      geometry_circuits: ${{ steps.geometry.outputs.circuits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      # Plan geometry once before allocating four sweep runners. An unknown
      # diff still requests the full fleet; Pages and direct dispatch retain
      # their existing base and fail-safe rules. Job outputs documentation:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/pass-job-outputs
      - name: Does this diff touch the geometry?
        id: geometry
        env:
          # Prefer the caller's before_sha on a Pages workflow_call; then a pull
          # request's own base; then the push event's before on direct pushes.
          #
          # THE PR BASE WAS MISSING HERE UNTIL 2026-09-22, and the `case` below
          # fail-safed every pull_request into the full fleet before a single
          # path was examined — a CSS-only or tools-only PR paid ~8m30s of
          # sweeps plus verify-track on a runner, every push to it. The filter
          # 500 lines down (renderer-filter) diffs `pull_request.base.sha` for
          # exactly this reason, and its comment asserted this filter "has
          # none": it always had one. Fail-safe is preserved, not weakened —
          # an unresolvable or unreachable base still runs everything.
          BEFORE: >-
            ${{ inputs.concurrency_key != '' && inputs.before_sha
                || (inputs.concurrency_key == '' && github.event_name == 'pull_request' && github.event.pull_request.base.sha
                    || (inputs.concurrency_key == '' && github.event.before) || '') }}
          EVENT: ${{ github.event_name }}
          # A Pages call (the train) always carries a concurrency_key; its
          # before_sha is the LIVE commit, the exact base to diff against.
          CALLED: ${{ inputs.concurrency_key != '' }}
        run: |
          set -u
          run_all() { echo "geometry=true" >> "$GITHUB_OUTPUT"; echo "RUNNING SWEEPS: $1"; exit 0; }
          # A workflow_call from pages.yml reports the CALLER's event here
          # (`schedule` for a train tick, `workflow_dispatch` for "deploy now"):
          # in a called workflow github.event_name and github.event are the
          # caller's, never `workflow_call`. So a push passes, a Pages call
          # passes on its before_sha, a pull request passes on its base, and
          # everything else (nightly, direct dispatch) fail-safes into RUNNING.
          #
          # A Pages call's event_name is the CALLER's, so `pull_request` here
          # can only mean a real PR — and $CALLED is checked first regardless.
          case "$EVENT" in
            push|pull_request) ;;
            *) [ "$CALLED" = "true" ] || run_all "event is '$EVENT', not a push, a pull request or a Pages call" ;;
          esac
          # A PR diffs against the test commit's first parent (ci-pr-base.sh):
          # the event's base.sha lags one sync behind it, and the fleet was
          # rebuilding on any PR whose base had merged a circuit since its sync.
          [ "$EVENT" = pull_request ] && BEFORE="$(bash tools/ci/ci-pr-base.sh "${BEFORE:-}")"
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push, or caller omitted input)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable (force push?)"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          # The suite half of the filter is DERIVED from package.json's
          # test:sweeps, not retyped here. The hand-written alternation had
          # already drifted: scenery-grounding is one of the five suites this
          # job runs and was missing from it, so a diff touching only that
          # suite's own file skipped the very sweep it belongs to — a fail-open
          # in the one filter whose comment above forbids exactly that. A list
          # that must be edited in two places to stay true will drift again;
          # reading it from the script that defines it cannot.
          SUITES_FILE="${RUNNER_TEMP:-.}/sweep-suites.txt"
          node -e 'const s=require("./package.json").scripts["test:sweeps"]||"";const m=s.match(/tests\/unit\/[^\s]+/g)||[];if(!m.length)process.exit(1);process.stdout.write(m.join("\n")+"\n")' > "$SUITES_FILE" \
            || run_all "could not read the sweep suite list out of package.json"
          echo "--- sweep suites ---"; cat "$SUITES_FILE"; echo "--------------------"
          # The path half is DERIVED too, from tools/ci/geometry-paths.mjs — the
          # same module tools/ci/deploy.mjs imports for its local sweeps gate.
          # It was hand-written on both sides until 2026-09-19, and deploy.mjs's
          # copy still matched debris-world at its PRE-RENAME path under
          # js/game/, so the LOCAL gate skipped the sweeps on the edit this job
          # runs them for. Why those entries are in the pattern (js/car,
          # js/game.js, debris-world: four sweep suites load them; tools/ is
          # narrowed to track|lib) is documented in that module.
          GEO_ERE="$(node tools/ci/geometry-paths.mjs --ere)" \
            || run_all "could not read the geometry path pattern out of tools/ci/geometry-paths.mjs"
          [ -n "$GEO_ERE" ] || run_all "tools/ci/geometry-paths.mjs printed an EMPTY pattern"
          echo "--- geometry paths --- $GEO_ERE"
          if printf '%s\n' "$CHANGED" | grep -qE "$GEO_ERE" \
            || printf '%s\n' "$CHANGED" | grep -qxF -f "$SUITES_FILE"; then
            echo "geometry=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING SWEEPS: the diff touches the fleet build's inputs (track engine, circuit data, tools/track|lib, a TRACK_VM module) or a sweep suite"
            # THE CIRCUIT LANE (2026-09-30): when every changed path is one
            # circuit's own files, the sweeps run for that circuit
            # (APEX_CIRCUITS, the contract the browser gate already uses) — 52
            # builds became one on the scenery waves. On a pull request, and on
            # the train (before_sha is the LIVE commit, which passed the full
            # gate, so live..tip is exactly the delta to gate — the same
            # argument the node plan makes with base-green.sh on a deploy
            # push; this job sits out that push, see `if:`). Never when the
            # scope cannot be read.
            SCOPE_OK=false
            if [ "$CALLED" = true ] || [ "$EVENT" = pull_request ]; then SCOPE_OK=true; fi
            if [ "$SCOPE_OK" = true ]; then
              SCOPE_FILE="${RUNNER_TEMP:-.}/changed-files.txt"
              printf '%s\n' "$CHANGED" > "$SCOPE_FILE"
              IDS="$(node -e 'import("./tools/ci/select-specs.mjs").then((m) => { const fs = require("fs"); const ch = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean); const c = m.circuitsTouched(ch, process.argv[2]); process.stdout.write(c.scoped ? c.ids.join(",") : ""); }).catch(() => process.stdout.write(""));' "$SCOPE_FILE" "$BEFORE")" || IDS=""
              echo "circuits=$IDS" >> "$GITHUB_OUTPUT"
              if [ -n "$IDS" ]; then echo "CIRCUIT-SCOPED SWEEPS: APEX_CIRCUITS=$IDS"; else echo "the whole fleet: this diff is not circuit-only"; fi
            fi
          else
            # THE TARGETED TIER (2026-09-22). The suites of test:sweeps whose
            # inputs are NOT the fleet build — lighting, car, debris-world, the
            # driving-line pair — still run when THEIR source changed, alone:
            # under a minute against ten fleet rebuilds. The table is
            # geometry-paths.mjs TARGETED, read here, never retyped. Computed
            # BEFORE geometry=false is written so a table that cannot be read
            # fail-safes into the fleet (run_all writes geometry=true).
            CHANGED_FILE="${RUNNER_TEMP:-.}/changed-files.txt"
            printf '%s\n' "$CHANGED" > "$CHANGED_FILE"
            TARGETED="$(node tools/ci/geometry-paths.mjs --targeted "$CHANGED_FILE")" \
              || run_all "could not read the targeted sweep table out of tools/ci/geometry-paths.mjs"
            echo "geometry=false" >> "$GITHUB_OUTPUT"
            echo "targeted=$TARGETED" >> "$GITHUB_OUTPUT"
            echo "SKIPPING THE FLEET SWEEPS: nothing in this diff can move circuit geometry"
            if [ -n "$TARGETED" ]; then echo "RUNNING TARGETED SWEEPS: $TARGETED"
            else echo "no targeted sweep reads this diff either"; fi
          fi
      # WHICH NODE SLICES DOES THIS DIFF NEED? (2026-09-29; a job of its own,
      # `unit-plan`, until 2026-10-15 — one more queue hop before any node
      # row could start, p50 11.7 min on 2026-10-15.) pick-unit-slices.mjs
      # maps paths → runners, FAIL-SAFE → all; schedule / dispatch run --all.
      # On a deploy push and the train every slice row is emitted (needed
      # true|false) so the train's reuse check sees expanded node rows; a PULL
      # REQUEST lists only the needed rows (--needed-only; `CI` is the one
      # required check since 2026-10-15) and node-suites skips at the job
      # level when none is (its `if:`).
      - name: Plan node unit slices
        id: plan
        if: ${{ inputs.fast_tier_run == '' }}
        env:
          NEEDED_ONLY: ${{ github.event_name == 'pull_request' }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CALLED: ${{ inputs.concurrency_key != '' }}
          LIVE_BEFORE: ${{ inputs.before_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          FLAG=""; [ "${NEEDED_ONLY:-}" = "true" ] && FLAG="--needed-only"
          # Schedule / dispatch: no meaningful diff — run every slice.
          case "$EVENT" in
            schedule|workflow_dispatch)
              node tools/ci/pick-unit-slices.mjs --all --github-output
              exit 0
              ;;
          esac
          # Same delta-gate base as node-suites' plan step (base-green.sh):
          # Pages call → live commit; PR → event base; push → before only when
          # that tip was gated green (else fail-safe --all).
          BASE=""
          if [ "$CALLED" = "true" ]; then
            BASE="${LIVE_BEFORE:-}"
          elif [ "$EVENT" = "pull_request" ]; then
            # The test commit's first parent, not the event's base.sha, which lags
            # one sync behind (tools/ci/ci-pr-base.sh; 15-F3, 2026-10-10).
            BASE="$(bash tools/ci/ci-pr-base.sh "${PR_BASE:-}")"
          elif [ "$EVENT" = "push" ]; then
            if [ "$(bash tools/ci/base-green.sh "${PUSH_BEFORE:-}")" = green ]; then
              BASE="${PUSH_BEFORE:-}"
            else
              echo "the previous tip ${PUSH_BEFORE:-?} is not known green: every slice runs" >&2
              node tools/ci/pick-unit-slices.mjs --all --github-output
              exit 0
            fi
          fi
          case "${BASE}" in
            ""|0000000000000000000000000000000000000000)
              echo "no base SHA — fail-safe --all" >&2
              node tools/ci/pick-unit-slices.mjs --all --github-output
              exit 0
              ;;
          esac
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base $BASE unreachable — fail-safe --all" >&2
            node tools/ci/pick-unit-slices.mjs --all --github-output
            exit 0
          fi
          node tools/ci/pick-unit-slices.mjs --since "$BASE" $FLAG --github-output

      # PREVIOUSLY-FAILING SPECS, carried across runs. Fowler's TIA survey
      # records Microsoft's TIA and Google's Testar both re-running the last
      # run's failures unconditionally — a test that just failed is the single
      # best predictor of failing again, and a fresh runner otherwise forgets.
      # restore-keys makes a miss harmless: the file is simply absent and the
      # selector proceeds without it.
      - name: Restore last run's failing specs
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.concurrency_key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}
          # A PR also inherits the DEPLOY BRANCH's last failures: only the train
          # used to promote a spec that just failed there to rank 1, so a PR
          # touching the same routes could skip it and merge onto the red.
          restore-keys: |
            selected-failed-${{ github.ref_name }}-
            selected-failed-claude/f1-game-project-26h3ng-
      # tools/ci/ci-select-specs-step.sh: base via ci-resolve-before.sh, then
      # select-specs.mjs --json; it fails closed on "unmatched" and writes the
      # `shards` matrix (one budgeted shard plus one per oversize affected spec,
      # each with its derived cap) and `any` to $GITHUB_OUTPUT.
      - name: Select specs for this change
        id: sel
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.concurrency_key != '' }}
        env:
          # On a Pages call the resolver is handed the train's base as a push:
          # EVENT=push with PUSH_BEFORE = the live commit. EMPTY when the live
          # site was unreadable — and CALLED makes that select EVERYTHING (the
          # empty tree), like the sweeps/parts/ship filters, never HEAD~1: a
          # one-commit slice of a tip carrying every unpublished commit.
          EVENT: ${{ inputs.concurrency_key != '' && 'push' || github.event_name }}
          PUSH_BEFORE: ${{ inputs.concurrency_key != '' && inputs.before_sha || (inputs.concurrency_key == '' && github.event.before) || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CALLED: ${{ inputs.concurrency_key != '' }}
          # The nightly lane (tools/ci/ci-resolve-before.sh): a day's union diff
          # routes ~70 specs, so 60-minute shards and 12 overflow shards, stale
          # first. Simulated on 2026-09-29's 85 merges: 19 shards, 606 tests,
          # no routed spec left skipped (menu-traversal, ui-redesign and
          # time-trial — the day's latent reds — all run). Once a night.
          BUDGET_MIN: ${{ github.event_name == 'schedule' && !inputs.concurrency_key && '60' || '' }}
          OVERFLOW_SHARDS: ${{ github.event_name == 'schedule' && !inputs.concurrency_key && '12' || '' }}
        run: bash tools/ci/ci-select-specs-step.sh
      # DOES THIS DIFF CHANGE ANYTHING THAT ACTUALLY SHIPS?
      #
      # pages.yml stages a fixed list of runtime paths into _site/. A commit that
      # touches none of them deploys BYTE-IDENTICAL content to what is already
      # live, so a browser gate on it re-proves a page that has not changed.
      # MEASURED 2026-08-14: runs 1416 and 1417 were both `tests/specs/*` only and
      # each spent ~13 minutes of smoke to ship an artifact identical to the one
      # already serving — 26 minutes, twice, for no information.
      #
      # DIFFED AGAINST WHAT IS LIVE, NOT AGAINST `before`. The obvious base is the
      # push's before-SHA, and it is wrong here in a way that fails OPEN: this
      # branch takes rapid pushes from several concurrent sessions and their runs
      # cancel each other constantly (eight cancellations on 2026-08-14 alone,
      # one of them a run that died a single spec from green). So a js/ push whose
      # run was cancelled, followed by a tests-only push, would diff clean against
      # `before` and deploy the UNVERIFIED js/ change with the gate skipped. The
      # github-pages deployment SHA is what is genuinely proven, so that is the
      # base — cancelled runs in between simply mean more of the diff is visible,
      # which is the safe direction.
      #
      # EVERY uncertainty runs the gate: no token, API error, unparseable reply,
      # no deployment yet, a SHA git cannot reach (force push), or a diff that
      # fails. Same fail-safe discipline as the sweeps filter above, for the same
      # reason — a filter that guesses "nothing changed" when it cannot tell is
      # how a gate stops gating without anyone noticing.
      #
      # A READY PULL REQUEST IS FILTERED TOO (2026-10-14). It used to answer
      # ships=true on every PR ("event is 'pull_request'"), so a tooling or docs
      # PR paid a smoke runner to re-prove bytes it could not change. A PR now
      # diffs against its test commit's first parent (ci-pr-base.sh, like the
      # sweeps/parts/renderer filters); a PR whose OWN diff touches a shipped
      # path runs smoke at once, without the API calls below. One that touches
      # none still diffs LIVE..merge before it may skip, because pages.yml can
      # REUSE a green PR run as the deploy gate for a tree-equal tip
      # (tools/ci/pages-reuse-verdict.sh counts its Smoke job): skipping on the
      # PR's own diff alone would let a base carrying an unpublished js/ change
      # ship on a run whose smoke never booted it. Unknown -> ships=true.
      - name: Does this diff change anything that ships?
        id: shipfilter
        if: ${{ !(inputs.concurrency_key == '' && ((github.event_name == 'push' && github.ref_name == 'claude/f1-game-project-26h3ng') || (github.event_name == 'pull_request' && github.event.pull_request.draft))) }}
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CALLED: ${{ inputs.concurrency_key != '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          run_all() { echo "ships=true" >> "$GITHUB_OUTPUT"; echo "RUNNING SMOKE: $1"; exit 0; }
          # `workflow_call` never appears here: a called workflow sees the
          # CALLER's event name (`schedule` or `workflow_dispatch` from the
          # pages.yml train), same as the sweeps filter — so a Pages call is
          # recognised by its concurrency_key, and it diffs against the live
          # deployment exactly like a push does.
          IS_PR=false
          case "$EVENT" in
            push) ;;
            pull_request) [ "$CALLED" = "true" ] || IS_PR=true ;;
            *) [ "$CALLED" = "true" ] || run_all "event is '$EVENT', not a push, a pull request or a Pages call" ;;
          esac
          # The staged list is DERIVED from tools/desktop/stage-files.mjs — the
          # same allow-list pages.yml stages via tools/desktop/stage.mjs. Parsing
          # `cp … _site/` out of pages.yml went empty when staging moved to the
          # shared script (ships=true on every train). An empty list is FATAL,
          # not "run all smoke".
          PATHS_FILE="${RUNNER_TEMP:-.}/staged-paths.txt"
          node --input-type=module -e '
            import { stagedNames } from "./tools/desktop/stage-files.mjs";
            const names = [...stagedNames()].sort();
            if (!names.length) {
              console.error("FATAL: tools/desktop/stage-files.mjs stagedNames() is empty");
              process.exit(1);
            }
            process.stdout.write(names.join("\n") + "\n");
          ' > "$PATHS_FILE" || { echo "FATAL: could not read staged path list from tools/desktop/stage-files.mjs"; exit 1; }
          if ! [ -s "$PATHS_FILE" ]; then
            echo "FATAL: staged path list is empty — refusing to mark ships=true"
            exit 1
          fi
          echo "--- staged paths ($(wc -l < "$PATHS_FILE") entries) ---"; cat "$PATHS_FILE"; echo "--------------------"
          # shipped_hit <changed-list>: prints the first staged entry the list
          # touches. A staged entry is either a file (index.html) or a
          # directory (js) — match the whole name or anything under it,
          # anchored so `jsfoo/x` cannot pass as `js`.
          shipped_hit() {
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              if printf '%s\n' "$1" | grep -qE "^${p}(/|$)"; then printf '%s' "$p"; return 0; fi
            done < "$PATHS_FILE"
            return 1
          }
          if [ "$IS_PR" = true ]; then
            PR_FROM="$(bash tools/ci/ci-pr-base.sh "${PR_BASE:-}")"
            case "${PR_FROM:-}" in
              ""|0000000000000000000000000000000000000000) run_all "pull request with no comparison base" ;;
            esac
            git cat-file -e "${PR_FROM}^{commit}" 2>/dev/null || run_all "PR base $PR_FROM unreachable in this checkout"
            PR_CHANGED=$(git diff --name-only "$PR_FROM" "$GITHUB_SHA") || run_all "git diff against the PR base $PR_FROM failed"
            echo "--- this PR's own diff (against $PR_FROM) ---"; echo "$PR_CHANGED"; echo "---------------------------------------------"
            if printf '%s\n' "$PR_CHANGED" | grep -qx 'tests/specs/smoke.spec.js'; then
              run_all "the PR edits the fixed smoke spec itself"
            fi
            if HIT="$(shipped_hit "$PR_CHANGED")"; then run_all "the PR touches a shipped path ($HIT)"; fi
            echo "the PR's own diff ships nothing; checking that its base ships what is live before skipping"
          fi
          API="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=20"
          RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "Accept: application/vnd.github+json" "$API") \
            || run_all "could not reach the deployments API"
          DEPLOYMENTS_FILE="${RUNNER_TEMP:-.}/pages-deployments.tsv"
          # The node program below is single-quoted on purpose; its ${} is JavaScript, not shell.
          # shellcheck disable=SC2016
          printf '%s' "$RESP" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              try {
                const j = JSON.parse(s);
                if (!Array.isArray(j)) process.exit(1);
                for (const d of j) {
                  if (!d || !d.sha || !d.statuses_url) process.exit(1);
                  process.stdout.write(`${d.sha}\t${d.statuses_url}\n`);
                }
              } catch (_) { process.exit(1); }
            });' > "$DEPLOYMENTS_FILE" || run_all "could not parse the deployments API reply"
          [ -s "$DEPLOYMENTS_FILE" ] || run_all "no github-pages deployment recorded yet"
          LIVE=""
          while IFS=$'\t' read -r SHA STATUSES_URL; do
            STATUS_RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                               -H "Accept: application/vnd.github+json" "${STATUSES_URL}?per_page=1") \
              || run_all "could not read deployment status for $SHA"
            STATE=$(printf '%s' "$STATUS_RESP" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try { const j = JSON.parse(s); if (Array.isArray(j) && j[0] && j[0].state) process.stdout.write(j[0].state); }
                catch (_) {}
              });') || run_all "could not parse deployment status for $SHA"
            case "$STATE" in
              success) LIVE="$SHA"; break ;;
              inactive|failure|error|queued|pending|in_progress) ;;
              *) run_all "deployment $SHA has no trustworthy status" ;;
            esac
          done < "$DEPLOYMENTS_FILE"
          case "${LIVE:-}" in "") run_all "no successful active github-pages deployment found" ;; esac
          git cat-file -e "${LIVE}^{commit}" 2>/dev/null || run_all "live SHA $LIVE unreachable in this checkout"
          CHANGED=$(git diff --name-only "$LIVE" "$GITHUB_SHA") || run_all "git diff against $LIVE failed"
          echo "--- changed since live ($LIVE) ---"; echo "$CHANGED"; echo "----------------------------------"
          # Content hashes cover only index.html tags. Deferred renderer code
          # uses ?v=<build>, and mutable assets/manifest/icons/vendor are served
          # cache-first at stable paths, so those bytes require a strictly newer
          # shell/service-worker generation than the active deployment.
          # (The "strictly newer build generation" check that stood here is
          # gone: pages.yml stamps the generation from the commit count at
          # deploy time, so it is newer by construction — 2026-09-01.)
          # smoke.spec.js is deliberately excluded from the generic selected
          # job, whose 120 s cap is too short for its measured render probes.
          # A test-only edit does not change _site, but must still exercise the
          # fixed 420 s smoke shards that own this spec's blocking coverage.
          if printf '%s\n' "$CHANGED" | grep -qx 'tests/specs/smoke.spec.js'; then
            run_all "the fixed smoke spec itself changed"
          fi
          if HIT="$(shipped_hit "$CHANGED")"; then run_all "the diff touches a shipped path ($HIT)"; fi
          echo "ships=false" >> "$GITHUB_OUTPUT"
          echo "SKIPPING SMOKE: nothing in this diff reaches _site/ — the deployed bytes are unchanged since $LIVE"
      # Same shape as the sweeps filter, same rule: FAIL SAFE, NEVER FAIL OPEN.
      # Any path that cannot resolve a diff RUNS the job. A pull request is
      # diffed against its own base (pull_request.base.sha) rather than
      # fail-safed, or every PR would pay for a macOS runner. This comment used
      # to claim the sweeps filter had no such base to diff; it always had one,
      # and on the strength of that claim the sweeps filter went on
      # fail-safing every PR into the full fleet until 2026-09-22.
      - name: Does this diff touch the renderer?
        id: renderer
        if: ${{ inputs.concurrency_key != '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        env:
          BEFORE: ${{ inputs.concurrency_key != '' && inputs.before_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          EVENT: ${{ github.event_name }}
          CALLED: ${{ inputs.concurrency_key != '' }}
        run: |
          set -u
          run_all() { echo "renderer=true" >> "$GITHUB_OUTPUT"; echo "RUNNING RENDERER SPECS: $1"; exit 0; }
          if [ "$CALLED" != true ]; then
            case "$EVENT" in
              push|pull_request) ;;
              *) run_all "event is '$EVENT', not a push/pull_request" ;;
            esac
          fi
          # A PR diffs against the test commit's first parent (ci-pr-base.sh):
          # the event's base.sha lags one sync behind it.
          [ "$EVENT" = pull_request ] && BEFORE="$(bash tools/ci/ci-pr-base.sh "${BEFORE:-}")"
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable (force push?)"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          # The spec half is DERIVED from package.json's test:gfx, as the sweeps
          # filter derives its suite list — a retyped list drifts.
          SPECS_FILE="${RUNNER_TEMP:-.}/gfx-specs.txt"
          node -e 'const s=require("./package.json").scripts["test:gfx"]||"";const m=s.match(/tests\/specs\/[^\s]+/g)||[];if(!m.length)process.exit(1);process.stdout.write(m.join("\n")+"\n")' > "$SPECS_FILE" \
            || run_all "could not read the gfx spec list out of package.json"
          echo "--- gfx specs ---"; cat "$SPECS_FILE"; echo "-----------------"
          # js/render/** is every backend (GLX, WGX, TLX, gltf, assets); the
          # js/lighting/ files are the lighting/atmosphere/tuner modules whose
          # numbers the lighting-ab / image-grade / tuner-grade specs pin.
          # The two playwright configs carry the launch flags this job depends
          # on, tests/helpers/ is what every spec boots through, and the
          # workflow file is here so an edit to THIS job runs it.
          # NOT .github/workflows/ci.yml (2026-09-30): every CI-tooling PR was
          # holding a macOS slot for 13-14 min (821 s measured on #499; one of
          # five such slots) to re-prove six gfx specs its diff could not touch. A
          # change to THIS job's steps is tested by `renderer_macos: true` on
          # a dispatch, or by the nightly.
          if printf '%s\n' "$CHANGED" | grep -qE '^(js/render/|js/lighting/|playwright(\.gpu)?\.config\.js$|tests/helpers/)' \
            || printf '%s\n' "$CHANGED" | grep -qxF -f "$SPECS_FILE"; then
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING RENDERER SPECS: the diff touches the renderer, its lighting modules, a gfx spec or the launch config"
          else
            echo "renderer=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING RENDERER SPECS: nothing in this diff reaches the renderer"
          fi

      - name: Does this diff touch WebXR?
        id: xrfilter
        if: ${{ !inputs.concurrency_key && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)) }}
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          run_all() { echo "xr=true" >> "$GITHUB_OUTPUT"; echo "RUNNING test:xr: $1"; exit 0; }
          case "$EVENT" in
            push|pull_request) ;;
            *) run_all "event is '$EVENT' (dispatch forces the suite)" ;;
          esac
          # A PR diffs against the test commit's first parent (ci-pr-base.sh): the
          # event's base.sha lags one sync behind it, and this filter's regex names
          # ci.yml, so a stale base re-ran the 25-minute VR job on every ready PR
          # whose base had taken a ci.yml merge since (15-F3, 2026-10-10).
          [ "$EVENT" = pull_request ] && BEFORE="$(bash tools/ci/ci-pr-base.sh "${BEFORE:-}")"
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          # These renderer entry points own XR boot, context compatibility and
          # stereo layer attach/present/detach; flat-renderer checks cannot prove
          # those paths. The manifest owns the lazy XR load order.
          if printf '%s\n' "$CHANGED" | grep -qE '^(js/xr/|js/render/renderer-boot\.js$|js/render/glx/glx\.js$|js/render/three/tlx\.js$|tools/manifest\.cjs$|tests/specs/(vr-emulated|xr-plan)\.spec\.js$|tests/helpers/iwer-install\.mjs$|tests/vendor/iwer-2\.5\.0\.min\.js$|playwright\.config\.js$|\.github/workflows/ci\.yml$)'; then
            echo "xr=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING test:xr: the diff touches WebXR, its renderer boundaries, lazy roster, IWER, or the xr-emulated project"
          else
            echo "xr=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING test:xr: nothing in this diff reaches WebXR"
          fi

      # WHOSE RED IS IT? A gate that goes red asks two different questions
      # depending on a fact nobody has to hand: was the base already red?
      # Train #2348 (2026-09-16) failed on the sweeps and on `selected` while
      # the change under it was a tooling edit that could touch neither, and
      # establishing that took several API calls and a log download. One line
      # in the summary answers it for every run, red or green.
      #
      # It lives here because this job already has what the lookup needs — a
      # fetch-depth: 0 checkout (ancestry is a git question) and npm ci — and
      # because `select` runs on every push, PR and Pages call. `if: always()`
      # plus continue-on-error, belt and braces: a report may never decide a
      # verdict, and the script itself exits 0 on every failure.
      - name: Was the base already red?
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: claude/f1-game-project-26h3ng
        run: bash tools/ci/base-verdict.sh "$GITHUB_SHA"

  selected:
    name: Selected specs (change-aware gate)
    # NOT `guards` (R3-CI-HEALTH-2, 2026-10-10). Waiting on the aggregator put
    # one more trip through the account's runner queue on the critical path:
    # ship run 38041862767 started its 30 legs at 11.3 min instead of ~2 (the
    # run took 20.3 min, ~9 of them that hop), and in the 07:59Z burst the
    # 30-second aggregator itself QUEUED 26-37 min before the legs could. A
    # guards red still fails the run: selected-verdict and ci-verdict both
    # need `guards` and red on it (tools/ci/selected-gate-verdict.mjs), and
    # poke-train needs it green. The price is ~70-95 job-min of browser legs
    # on the few runs whose guards are red (4 of 100 ship runs).
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    # — "If a job fails or is skipped, all jobs that need it are skipped".)
    needs: [select]
    # Drafts skip the matrix (required name is selected-verdict).
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (needs.select.outputs.any == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.shards) }}
    # The budget maths is tools/ci/select-budget.mjs (each spec at its own measured
    # llvmpipe rate, else a 7.5 s/test fallback since 2026-09-29 — it was a 79.7 s
    # SwiftShader figure; a TIMING-OUT test costs timeout x (1+retries)).
    # Hence retries 0 (bar a quarantined-only leg, matrix.retries — see the
    # run step) and --timeout=180000 here — the selector's settings, not
    # smoke's gate settings (420 s, one retry): a retry only doubles the cost
    # of the news this job exists to deliver. The fixed smoke and driving-model
    # specs are excluded here because their independent blocking jobs own their
    # measured timeout policies; duplicating smoke here caused run 32103664606
    # to turn four green 420 s shards into a false red at exactly 120 s.
    #
    # THE CAP IS DERIVED PER JOB by select-specs' shardCapMin: twice the job's
    # expected work (measured per spec in tests/data/spec-timings.json), plus
    # one per-test timeout at the slowest timeout it carries, plus setup and
    # wrap-up, under a ceiling (R3-CI-HEALTH-6: it had become ~1.6x, and two
    # passing legs died at 10 min). It was "every test at the per-test timeout" until
    # 2026-09-29, a worst case --max-failures makes unreachable, and it split
    # tracks-walls (~3.5 min measured) across three runners to stay under 90. Both 20 and 26 were once wrong
    # here, and this workflow's header records that a job killed by its cap
    # reads as "0 failures" and hid a dead deploy; a gate that dies of its own
    # cap teaches nothing. The cap is a ceiling for a case that essentially
    # never happens, not the spend: a passing test never reaches its timeout.
    #
    # 120 was too tight to be a timeout at all. It bounded the MEAN test (79.7 s)
    # but not the slowest: physics-fixes' Monaco test measures 124.2 s and
    # albert-park-foundation 110.1 s on an IDLE box (2026-09-04), so the first
    # failed every time the selector picked it and the second failed on any
    # contention. See tools/ci/select-specs.mjs SELECTED_GATE for the numbers.
    # LANES (2026-10-15): on a PULL REQUEST every leg joins one of LANES
    # (tools/ci/select-specs.mjs) fleet-wide concurrency groups with
    # `queue: max`, so at most that many selected legs run at once across every
    # ready PR and the rest wait FIFO without holding a runner or being
    # cancelled (the workflow-level per-PR cancel still replaces a superseded
    # run's queued legs). A run's own legs cycle through the lanes from a start
    # rotated by run number (laneBase), so they never queue behind each other
    # and runs spread over every lane. The train, the nightly and a dispatch get
    # a group of their own per leg (`run_id` + job index): a gate never waits
    # behind PR legs. `queue: max` cannot be combined with cancel-in-progress
    # in one block, and none is set here.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
    concurrency:
      group: ${{ (github.event_name == 'pull_request' && inputs.concurrency_key == '') && format('selected-lane-{0}', matrix.lane) || format('selected-run-{0}-{1}', github.run_id, strategy.job-index) }}
      queue: max
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      # The same lockfile-keyed cache smoke and driving-model restore in 2-5 s;
      # this job installed from scratch (17-33 s per shard, `--with-deps` entering
      # apt each time) until 2026-09-16.
      - name: Playwright Chromium (cached)
        uses: ./.github/actions/playwright-chromium
      # STOP AT THREE, don't grind to the cap. Pages #1967 selected 32 tests,
      # failed 6 of the first 7 at the per-test timeout, and kept going until
      # the job's cap killed it — so the run was CANCELLED, the whole cap was
      # spent re-learning news it had after the first failure, and
      # `junit-failed.mjs` logged "no failures to carry" because a killed job
      # writes no junit. The fail-fast memory two steps below was blind to
      # exactly the failures that killed the job it lives in.
      #
      # --max-failures stops GRACEFULLY, which is the whole point: the reporters
      # still finalise. Verified locally on a 4-test throwaway project at
      # --max-failures=2 — "2 did not run", and junit.xml carried
      # failures="2" with both failing test names. That is what the job cap
      # cannot do at any timeout value.
      #
      # Three, not one: one failure cannot distinguish "this spec is broken"
      # from "this change broke everything", and the budget is already modelled
      # on surviving a timeout. Three bounds the failure cost at 3 x 180 s =
      # 9 min (the --timeout below) inside the shard's cap while still showing
      # a pattern.
      #
      # MESA LLVMPIPE HERE TOO (2026-09-16). This job's oversize shards were the
      # gate's wall clock — agent-view 22-40 min, wake-lock 18.6, pit-signs and
      # race-control 1-12 — all of it SwiftShader, while the smoke shards next
      # door had already moved to llvmpipe and measured 8-12x on exactly these
      # rendering tests (run 35062479811: corner approach 17.8 s vs 214, grid
      # start 21.4 vs 138). Same action as smoke's: apt, an Xvfb on :99 for
      # ANGLE's GL backend to bind through, DISPLAY exported so the pinned
      # `npm test --` line below is unchanged. `gl: swiftshader` opts out.
      - name: Mesa llvmpipe + Xvfb
        if: inputs.gl != 'swiftshader'
        uses: ./.github/actions/mesa-xvfb
      # Marker and JUnit artifacts diagnose which planned shards ran. A failed
      # or cancelled shard remains red even when it failed before this marker.
      - name: Mark the run step reached
        run: mkdir -p .selected-started && echo "${{ matrix.name }}" > .selected-started/marker.txt
      - name: Upload the run-step marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-started-${{ matrix.name }}-${{ strategy.job-index }}
          path: .selected-started/marker.txt
          retention-days: 7
      - name: Run the selection (${{ matrix.name }}, ${{ matrix.tests }} tests)
        env:
          APEX_WORKERS: ${{ matrix.workers || 1 }}
          APEX_FAIL_ON_FLAKY: 1
          # llvmpipe (the step above). Empty on `gl: swiftshader`, where the
          # step is skipped and playwright.config.js keeps the ANGLE default.
          # ...except a shard carrying menu-baseline: its six goldens are
          # SwiftShader captures ("a baseline captured on a GPU will not match",
          # the spec's own platform note), so that shard keeps the ANGLE default.
          APEX_GL: ${{ (inputs.gl != 'swiftshader' && !contains(matrix.specs, 'menu-baseline')) && 'llvmpipe' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ (inputs.gl != 'swiftshader' && !contains(matrix.specs, 'menu-baseline')) && '1' || '' }}
          # THE CIRCUIT LANE: the plan sets this only when EVERY changed path
          # is one circuit's (tools/ci/select-specs.mjs circuitsTouched), and
          # the per-circuit loops (CIRCUIT_FILTERED_TESTS) then run just those.
          # Empty = the whole fleet, which is every other diff.
          APEX_CIRCUITS: ${{ matrix.circuits }}
        run: |
          # matrix.shard is set when shards() split a loop-expanded spec across
          # Playwright --shard=i/n jobs (tracks-walls ~63 tests). Empty for the
          # ordinary budgeted / single-file oversize rows.
          SHARD_FLAG=""
          if [ -n "${{ matrix.shard }}" ]; then SHARD_FLAG="--shard=${{ matrix.shard }}"; fi
          # RETRIES COME FROM THE PLAN (R3-CI-HEALTH-4, 2026-10-10): 0 for every
          # leg, except a leg select-specs built for QUARANTINED specs only
          # (tests/data/flaky-quarantine.json), which gets 1 — so the
          # quarantine's pass-on-retry path exists here at all, and
          # APEX_FAIL_ON_FLAKY above still reds any un-quarantined flake. A
          # quarantined spec never shares a leg, so nothing else is retried.
          npm test -- ${{ matrix.specs }} --retries=${{ matrix.retries || 0 }} --timeout=180000 --max-failures=3 $SHARD_FLAG
      # The failing-spec carry-forward is written ONCE, by selected-verdict,
      # from every shard's junit (below). Each shard used to save it under one
      # shared key: run 37198214523's three `selected` jobs raced for
      # `selected-failed-842/merge-37198214523`, one won, and the other two
      # shards' failures ("Unable to reserve cache") never reached the next run.
      # THE TIMINGS OF A GREEN RUN ARE THE DATA, and they were being thrown away.
      # Every per-test duration this job measures is written to junit.xml by
      # playwright.config.js, and the only step that uploaded it ran
      # `if: failure()` — so a PASSING run, which is the run whose timings you
      # actually want, discarded them. tools/ci/spec-timings.mjs has existed to
      # merge exactly this and had nothing to merge: 0 of 119 specs carry three
      # samples, and select-budget.mjs still bills the whole tree from one
      # 2026-08-07 measurement of one spec.
      #
      # Its own upload, not a widened failure one: junit.xml is a few KB, while
      # the failure artifacts beside it are traces and screenshots worth tens of
      # MB. `always()` so a timed-out or failed run still contributes the tests
      # that did finish. `if-no-files-found: ignore` because a job whose steps
      # were all skipped (the ship filter) legitimately produces none.
      - name: Spec timings (junit — a green run's durations are the point)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # matrix.name is unique per plan (select-specs shards()); the job
          # index makes a repeat impossible even if that ever regresses.
          name: spec-timings-junit-selected-${{ matrix.name }}-${{ strategy.job-index }}
          path: artifacts/test-results-*/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      # A CAP-KILLED LEG KEEPS ITS EVIDENCE TOO (R3-CI-HEALTH-6, 2026-10-10).
      # `failure()` alone skipped this on the two legs killed by their job cap
      # after `+ pass 101/104` / `+ pass 85/87` (ship 37996125261 selected-5,
      # 38020479662 selected-2): the job is `cancelled`, not failed, so the run
      # left no traces at all. The step above shows a status-function step
      # still runs after a timeout cancel (its `always()` step 7 ran in both
      # kills); `always() && !success()` reaches exactly failure + cancel.
      - name: Failure artifacts
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-selected-${{ matrix.name }}-${{ strategy.job-index }}
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # THE GOLDEN-MENU CHECK. Blocking on scheduled/manual runs: a mismatch is
  # evidence that the committed UI baseline is stale or the runner changed.
  #
  # The header above already names `test:baseline` as the group that arguably
  # belongs in the gate and is not in it, and gives the reason: the six goldens
  # were rendered in a dev container, so a font fallback or a different
  # SwiftShader build on GitHub's runner would make the gate permanently red.
  # It also prescribes the way in — "run it on a PR as a non-blocking step and
  # compare, not by putting it straight into `needs:`". This is that step.
  #
  # WHAT THIS JOB ALREADY ESTABLISHED (first run, 2026-09-10, run 3457):
  # the goldens are PORTABLE and STALE, which is the opposite of the assumption
  # above. The runner and the dev container agree with each other to within 1-17
  # pixels and BOTH disagree with the committed PNGs by 10k-49k against a 1%
  # tolerance (title-phone-landscape 49,499 on the runner vs 49,516 here;
  # garage-phone-landscape 10,318 vs 10,319). Three of the six have simply not
  # been re-blessed since the UI moved, and they fail in a fresh container too.
  # Its actual/diff artifact remains available for diagnosis when it fails.
  #
  # IT IS NOT A RENDERER GATE AND CANNOT BECOME ONE. The spec calls
  # __apex.headless(true) and hides #game before it shoots, so a dead render
  # pass is invisible to it — measured by re-breaking the shadow pass and
  # getting byte-identical failures (docs/notes/DEFECT-LEDGER.md). The renderer
  # coverage hole in docs/notes/TESTING-FIELD-NOTES.md (four source areas with
  # zero eligible specs, the shipped WebGL2 path among them) needs a canvas
  # instrument with a per-test budget under the gate's 180 s. Do not route
  # renderer or lighting paths here expecting cover they cannot give.
  # ONE CHECK THAT ALWAYS REPORTS FOR THE CHANGE-AWARE GATE (2026-09-30).
  # Branch protection can only require a check by name, and `selected`'s
  # names carry its matrix (`(selected, …)`, `(oversize-…)`), which change
  # per run — so it could not be required, and #491 merged with its
  # selected gate red on the merged tree, leaving the tip red and the train
  # unpoked. This job has ONE fixed name and runs on every push, pull request
  # and Pages call (`always()`, so a skipped `selected` is still judged):
  # green when `select` passed and `selected` passed, or was skipped because
  # the plan was empty for a genuine reason (`dropped == 0`); red otherwise.
  # The same reading poke-train makes — poke-train stays as it is. On the
  # train (a Pages call, its plan against LIVE) an unaffordable plan is a
  # warning, not a red: the train's answer is the fixed gates plus the
  # sweeps, and dropped specs there ran on the PRs that carried them.
  selected-verdict:
    name: Selected specs (verdict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [select, selected, guards]
    # `!cancelled()`, not `always()` (2026-09-30): a skipped `selected` is
    # still judged (that is the point of this job), but a CANCELLED run — the
    # designed one, a draft's fast run superseded by its ready_for_review run
    # on the same sha seconds in — reported `selected specs cancelled` as a
    # RED verdict on the superseded run (#510). A cancelled run has no verdict.
    #
    # A failed/cancelled selected matrix is red, including setup failures before
    # its marker. Clean sibling JUnit cannot prove every planned test ran.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.concurrency_key != '')) }}
    steps:
      # Collect JUnit before the verdict for diagnostics and carry-forward.
      # Missing execution evidence never authorizes a failed selected matrix.
      - name: Checkout the gate verdict scripts
        if: ${{ needs.selected.result != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      # Sparse checkout for an empty/skipped plan: still need the verdict script
      # (guards/select/dropped rules). Cheap; no junit download.
      - name: Checkout the gate verdict scripts (empty plan)
        if: ${{ needs.selected.result == 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      # https://github.com/actions/download-artifact (v8: pattern + merge-multiple)
      - name: Every shard's junit
        id: dl_junit
        if: ${{ needs.selected.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spec-timings-junit-selected-*
          path: junit-in
      # Which shards reached their run step (15-F2): a shard in this list with no
      # junit testcases in junit-in died mid-test, and the verdict reds on it.
      - name: Every shard's run-step marker
        id: dl_started
        if: ${{ needs.selected.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selected-started-*
          path: started-in
      - name: Stage junit for the verdict
        if: ${{ needs.selected.result != 'skipped' }}
        continue-on-error: true
        run: |
          mkdir -p carry
          i=0
          while IFS= read -r f; do
            i=$((i+1)); mkdir -p "carry/test-results-$i"; cp "$f" "carry/test-results-$i/junit.xml"
          done < <(find junit-in -name junit.xml 2>/dev/null)
      # A DROPPED SPEC IS A RED, WHATEVER ELSE RAN (2026-10-04). This used to
      # read `dropped` only when `selected` was skipped, so a plan that ran
      # one spec and named forty others as unaffordable was green. The
      # selector now runs routed declared-slow specs in their own pool and
      # carries a wider overflow (tools/ci/select-specs.mjs
      # MAX_OVER_BUDGET_SHARDS / MAX_OVERFLOW_SHARDS), so a name here means the
      # diff routed more than even those allowances carry: run the named
      # groups with tools/ci/remote-group.mjs, or split the change. The train
      # (a Pages call, its plan against LIVE) still warns: dropped specs there
      # ran on the PRs that carried them.
      - name: One answer for the change-aware gate
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.selected.result }}
          GUARDS: ${{ needs.guards.result }}
          DROPPED: ${{ needs.select.outputs.dropped }}
          CALLED: ${{ inputs.concurrency_key != '' }}
          DRAFT: ${{ github.event.pull_request.draft }}
          DOWNLOAD_FAILED: ${{ steps.dl_junit.outcome == 'failure' || steps.dl_started.outcome == 'failure' }}
        run: |
          set -u
          JUNIT_ROOT=carry
          if [ ! -d "$JUNIT_ROOT" ]; then JUNIT_ROOT=""; fi
          node tools/ci/selected-gate-verdict.mjs ${JUNIT_ROOT:+--junit-root "$JUNIT_ROOT"} --junit-in junit-in --started-in started-in
      # THE FAILING-SPEC CARRY-FORWARD, ONCE PER RUN (2026-10-04). Every
      # shard's junit (the timings artifacts above) is read here and saved
      # under one key, so a failure in ANY selected/overbudget/oversize job
      # reaches the next run's rank-1 hoist. Reporting only after the verdict
      # has already decided (a clean cancel must not be blocked by cache save).
      - name: Record failing specs for the next run
        if: ${{ always() && needs.selected.result != 'skipped' }}
        continue-on-error: true
        run: |
          mkdir -p carry
          if [ ! -d carry/test-results-1 ] && [ -d junit-in ]; then
            i=0
            while IFS= read -r f; do
              i=$((i+1)); mkdir -p "carry/test-results-$i"; cp "$f" "carry/test-results-$i/junit.xml"
            done < <(find junit-in -name junit.xml 2>/dev/null)
          fi
          node tools/ci/junit-failed.mjs carry > .selected-failed.txt || true
      - name: Save failing specs
        if: ${{ always() && needs.selected.result != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}

  baseline-trial:
    name: Golden menus on a runner (trial, non-blocking)
    # Nightly and dispatches only (PRs until 2026-09-29, below): never a push,
    # and never the Pages call, whose conclusion gates the deploy.
    #
    # THE COMMENT ABOVE WAS FALSE FOR SIX DAYS. A called workflow reports the
    # CALLER's event, so a "deploy now" train — pages.yml dispatched, calling
    # this workflow — reads as `workflow_dispatch` here and ran the trial in
    # train #2348 (run 35066895398, 45 s), against its own promise. Harmless to
    # the verdict (continue-on-error) but it took a runner slot on every poked
    # train, and a comment that is wrong about WHEN a job runs is how an
    # advisory job becomes a blocking one by accident. concurrency_key is the
    # only signal a Pages call always carries — the same tell the smoke, sweeps
    # and select jobs use — so it leads the condition here too.
    #
    # OFF PULL REQUESTS (2026-09-29). It ran on every PR push for three weeks
    # (237 runs in the two days measured) and answered its question on the
    # first: the goldens are portable and stale (above). What is left is
    # "re-bless, then confirm across a few runs", which a nightly and a
    # dispatch answer without a runner slot on every push while 200-290 jobs
    # queue (docs/notes/CI-CAPACITY-2026-09-29.md).
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (inputs.concurrency_key == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci
      - name: Playwright Chromium (cached)
        uses: ./.github/actions/playwright-chromium
      - name: Golden menus (test:baseline)
        id: goldens
        run: npm run test:baseline
      # ALWAYS, not `if: failure()`: a green run still has to hand over what it
      # rendered, because "it passed here once" is the evidence step (b) needs.
      - name: The rendered goldens, and any diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-menus-runner
          path: |
            tests/specs/menu-baseline.spec.js-snapshots/
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.goldens.outcome }}" = "success" ]; then
            echo "GOLDENS MATCH on ubuntu-latest. One data point for step (b);"
            echo "collect a few across PRs before routing renderer/lighting here."
          else
            echo "GOLDENS DIFFER on ubuntu-latest. This job is non-blocking and"
            echo "the workflow stays green. Download the golden-menus-runner"
            echo "artifact and compare -actual/-diff against the committed PNGs:"
            echo "the IMAGES are the problem to solve before any routing change."
          fi

  # ONE STABLE REQUIRED CHECK. A job skipped by its own `if:` reports
  # SUCCESS to branch protection; only a WORKFLOW skipped by a path, branch or
  # commit-message filter leaves its checks Pending and blocks the merge
  # (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks).
  # So a path-skipped job is not a blocker by name — it is a hole: a required
  # job that skipped itself passes. This job always runs when the workflow was
  # not cancelled and fails if any needed job failed or was cancelled; a
  # needed job skipped by its `if:` is a pass here too, so each needed job
  # owns the rule for when skipping is honest (selected-verdict owns the
  # selected gate's — an empty or dropped plan — which is why it is needed
  # here, not just `selected`). Branch protection requires `CI` and nothing
  # else (Bryce, 2026-10-15; it was twelve names): it is the only check that
  # also carries smoke, the sweeps, renderer-macos and xr.
  # tools/ci/ci-verdict.mjs.
  #
  # EVERY JOB (2026-10-16): poke-train, the train's dispatcher, is gone with
  # the deploy-branch fast tier — pages.yml runs on push now (CI/CD review
  # #2333 finding 3). draft-ci-skipped is the one job this does not need.
  ci-verdict:
    # A label-noise run (#2184, the `on:` note) skips every job, and a SKIPPED
    # job reports success: under the required name it would sit on the head
    # beside the real verdict. It gets another name, so it never counts as CI.
    # The DRAFT fast tier is named apart too (#2664): its success would otherwise sit on the head under the required
    # name `CI`, and when the PR goes ready that stale success satisfies the requirement while the full tier is still
    # running (retro finding 10: a merge landed with the full-tier run in progress). Only a non-draft run supplies `CI`.
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name != 'run-ci' || !github.event.pull_request.draft)) && 'CI label event (ignored)' || (github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'run-ci')) && 'CI draft (opted out)' || (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'CI (draft fast tier)' || 'CI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - guards-a
      - guards-b
      - guards
      - lints
      - node-suites
      - sweeps-parts
      - sweeps
      - sweeps-roll-up
      - smoke
      - driving-model
      - renderer-macos
      - xr
      - select
      - selected
      - selected-verdict
      - baseline-trial
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event.action != 'labeled' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft)) && (!cancelled()) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Full-tier PR runs: these must have run AND passed (a job skipped by `if:` reports success, so a hollow
          # run would otherwise read green). Measured on recent full-tier runs: they never skip there, unlike
          # driving-model / sweeps / the macOS leg, which the change-aware selection skips legitimately.
          REQUIRE_SUCCESS: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) && 'guards-a,guards-b,guards,select,smoke' || '' }}
        run: node tools/ci/ci-verdict.mjs
