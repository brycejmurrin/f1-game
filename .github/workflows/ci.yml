name: CI

# The test gate. Until this existed, .github/workflows/pages.yml deployed on
# every push and ran NOTHING — 141 test files gated only by whether a human
# remembered. Two of the repo's own structural guards were found red in the
# working tree that way, from the same day's work.
#
# The jobs are split by what they cost, so the common case stays fast:
#
#   guards   ~1 min, no browser  — the structural invariants (load order, docs
#                                  integrity, test taxonomy, scenery contract,
#                                  deploy allow-list) plus the pure-node unit
#                                  suites. This is the job that must never be
#                                  red; everything it asserts is a property a
#                                  compiler would enforce in a language that had
#                                  one.
#   sweeps   15 min, no browser  — the per-circuit geometry sweeps, and the one
#                                  job that is CONDITIONAL: the steps are
#                                  skipped unless the diff touches js/track/,
#                                  js/circuits/, tools/ or a sweep suite, since
#                                  nothing else can move circuit geometry. The
#                                  job itself always runs and always reports.
#                                  Separate because each suite rebuilds all 40
#                                  circuits and they run --test-concurrency=1 on
#                                  purpose (four at once reached 5.4 GB and was
#                                  OOM-killed, which presents as a SIGKILL with
#                                  no assertion, i.e. NOT as a test failure).
#                                  Serialising them was NOT enough on its own —
#                                  see the NODE_OPTIONS note on the job.
#   smoke    ~5 min, Chromium    — the page actually boots and __apex answers.
#                                  If this is red nothing else is worth running.
#                                  Nine specs, ONE WORKER PER MACHINE (two
#                                  concurrent SwiftShader contexts exceed the
#                                  per-test timeout on a shared runner) but
#                                  FOUR MACHINES via the shard matrix, so the
#                                  parallelism is across VMs rather than inside
#                                  one. RE-TIMED 2026-08-14, as the note below
#                                  demands: it was 14m24s serial, then measured
#                                  17m58s / 18m56s at two shards on a degraded
#                                  runner pool (run 1415), and the specs
#                                  themselves then got ~70 % cheaper — 14 min ->
#                                  4m17s locally — by quieting the render loop
#                                  across the menus and booting the rendering
#                                  specs straight into a race. The four-way
#                                  split puts the modelled pole at ~190 s of
#                                  test work; CI adds its own multiple on top.
#                                  RE-TIMED AGAIN 2026-08-30 after six straight
#                                  deploys died here (Pages #1848-#1854, three
#                                  authors, every failure a timeout and not one
#                                  assertion): the runner pool has degraded far
#                                  past the 2026-08-14 figures. Same shard, same
#                                  commit, consecutive attempts on #1854 booted
#                                  37-55x apart — `[car] build mercedes` 3,956 ms
#                                  then 147,612 ms, `[assets] pack loaded`
#                                  5,008 ms then 276,476 ms. Worst spec observed
#                                  640.6 s against a 420 s cap, and one shard was
#                                  CANCELLED at 29.5 min against a 30 min job.
#                                  Caps raised to 900 s per test / 50 min per job
#                                  to fit that tail; the specs themselves are
#                                  unchanged and still ~4m17s locally.
#                                  It is also SKIPPED ENTIRELY when the diff
#                                  cannot reach _site/ (see the job's filter).
#   driving-  ~1 min, Chromium   — the characterization traces. ONE spec, and
#   model                          its own job rather than a step in smoke,
#                                  because a step inherits its job's fate: it
#                                  would run only after smoke's twelve minutes
#                                  (so a red smoke means it never runs at all)
#                                  and it would report under smoke's NAME, since
#                                  the checks list shows jobs and not steps. It
#                                  ran as a step exactly once; see the job.
#   renderer- UNMEASURED, macOS   — the `gfx` group (test:gfx: instanced-draw,
#   macos     real GPU (Metal)     webgl-probes, lighting-ab, image-grade-
#                                  visual, lighting-tuner-grade, tlx-probes)
#                                  on macos-latest, the ONE runner image with a
#                                  hardware adapter. Runs when the diff touches
#                                  the renderer (js/render/**, the lighting and
#                                  atmosphere modules) and nightly / on
#                                  dispatch; NOT on the Pages deploy call — see
#                                  the job for why. Added 2026-09-01, so the
#                                  budget is a guess until the first run lands;
#                                  re-time it and replace this line.
#
# Both figures above are MEASURED on run 31023778264 — the first run that ever
# completed end to end — not estimated: sweeps 15m12s, smoke 14m24s, guards 25s.
# driving-model is measured on 31197770813: 42 s of test.
#
# THE NUMBERS ABOVE ARE THE BUDGET, AND `timeout-minutes` MUST STAY ABOVE THEM.
# They are a comment, so nothing enforces them: this header read "~3 min" for
# weeks while the step it described ran 71 specs and needed ~53. Every run hit
# the cap, and a timed-out job reports `cancelled` rather than `failed`, so the
# deploy silently stopped happening behind a summary that showed zero failures.
# If you change what a step RUNS, re-time it and change the number here too.
#
# Deliberately NOT here: the full Playwright suite is ~40 minutes of SwiftShader.
# Run it locally with tools/ci/test-bg.mjs against the groups tools/ci/pick-tests.mjs
# names. This gate is for what breaks silently, not for everything. (The
# renderer group is the exception, and it is in this FILE without being in the
# GATE — see renderer-macos.)
#
# THE ONE GROUP THAT ARGUABLY BELONGS HERE AND IS NOT: `test:baseline`, the six
# golden menu PNGs. The 2026-08 pass found one of them stale — the garage
# baseline was re-blessed on a branch that did not yet have the garage BACK
# button, and the two lines merged afterwards. index.html and a .png are
# different files, so git merged both cleanly and reported no conflict; they
# conflicted only in meaning, and nothing was running the suite that would have
# said so. That is exactly the silent class this gate exists for.
#
# It is not added yet for one reason: golden images are environment-sensitive,
# and those six were generated in a dev container. If GitHub's runner renders
# even slightly differently — a font fallback, a SwiftShader build — the gate
# goes permanently red and blocks every deploy, which is the failure this
# workflow already caused once by another route. Add it by first running it on a
# PR as a non-blocking step and comparing, not by putting it straight into
# `needs:`.

on:
  push:
    # Every branch EXCEPT the deploy branch — that one reaches this workflow
    # through pages.yml's `uses:` call instead, so it is gated exactly once
    # rather than running twice in parallel against itself.
    branches-ignore: [claude/f1-game-project-26h3ng]
    # ACTIONS MINUTES (2026-09-02): a docs / skills / rules-only commit ships
    # nothing, so it buys no gate. The guard suite that checks those trees
    # runs locally on every edit (test:tooling-fast); the deploy branch is
    # gated through pages.yml's call regardless of what the diff touched.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - ".cursor/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - ".cursor/**"
  # NIGHTLY (2026-09-01): the wide browser run — the boot group (73 tests)
  # across 4 shards — moved here from every push. Its whole recorded failure
  # history in this file's header is timeouts on starved runners, never an
  # assertion, so it was blocking deploys without adding evidence; on a push
  # and on the deploy gate the smoke job runs smoke.spec.js in FOUR shards (~8 min).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      # Any browser group from package.json on the 4-shard matrix (default =
      # the boot group the nightly runs). A desktop-viewport spec that times
      # out on the SwiftShader dev box measures the box (docs/TESTING.md
      # §Field notes 2026-09-02); this is the runner-side verification.
      group:
        description: "browser group to run on the 4-shard matrix (tiny = boot group; ui, input, driving, ...)"
        type: string
        required: false
        default: "tiny"
      # The macOS renderer job is the most expensive minute in this file
      # (a macOS runner bills at 10x Linux). It ran on every push that
      # touched js/render/ until 2026-09-02; gpu-census.yml already gives
      # every renderer commit its real-GPU verdict, so the gfx SPECS on
      # Metal are now nightly or opt-in here — pass true when a gfx spec or
      # its launch config changed.
      renderer_macos:
        description: "also run the gfx specs on the macOS (Metal) runner"
        type: boolean
        required: false
        default: false
  workflow_call:      # pages.yml gates its deploy on this
    inputs:
      # Caller's push `before` SHA. workflow_call replaces github.event with its
      # own payload, so without this the sweeps filter always sees a non-push
      # event and fail-safes into RUNNING the full 15-minute rebuild — every
      # Pages deploy paid for four fleet rebuilds even when the diff was CSS.
      before_sha:
        description: "github.event.before from the calling push (empty = run sweeps)"
        type: string
        required: false
        default: ""
      # pages.yml no longer overrides this (removed 2026-08-12 alongside moving
      # `concurrency` off the whole workflow and onto just the deploy job —
      # see pages.yml's top-of-file comment). That was the actual fix for the
      # symptom this override was papering over (rapid pushes cancelling
      # in-flight Pages runs mid-smoke, live version.json stuck at 1126); the
      # smoke gate stays on for every deploy via the default below.
      smoke:
        description: "run the Playwright smoke gate (page boots, __apex responds)"
        type: boolean
        required: false
        default: true
      concurrency_key:
        description: "unique caller run key; empty keeps direct push/PR branch concurrency"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# CANCEL ONLY PULL-REQUEST RUNS. This said `cancel-in-progress: true` for every
# event, and the result was that FIFTEEN CONSECUTIVE RUNS ENDED "cancelled" and
# the gate never once completed — a branch under active work gets a push every
# few minutes, and each one killed the run before it could report.
#
# It also broke the deploy, which is the part that matters. pages.yml calls this
# workflow and has `needs: ci`, so when a push cancelled the in-flight ci job the
# whole Pages run went down with it: the first gated deploy came back
# "cancelled" where the previous ungated one had been "success". A gate that
# blocks the thing it is meant to protect is worse than no gate.
#
# On a pull request, superseding an obsolete run is right — the new commit is
# what matters and the minutes are wasted. Direct pushes retain the branch group.
# A Pages caller supplies its run id, giving every deploy gate a unique group;
# otherwise GitHub's one-pending-job concurrency rule silently cancels an older
# queued deployment when the next push arrives.
concurrency:
  # A dispatched run gets its own group: it shares the ref with every push,
  # and the cancel-in-progress below killed the first dispatched `ui` group
  # 30 s in when the next docs commit landed (run 2211, 2026-09-02).
  group: ci-${{ inputs.concurrency_key || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Structural guards + unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm ci` installs the playwright PACKAGE (some tool modules require it at
      # import time even when they never launch a browser) but not the browser
      # binaries — those cost ~200 MB and only the smoke job needs them.
      - run: npm ci
      - name: Structural guards
        run: npm run test:tooling-fast
      - name: Every test file belongs to a topical group
        run: npm run test:audit
      # WHAT DOES THIS GATE ACTUALLY EXECUTE? A report, never a gate.
      #
      # This workflow's whole history is checks that were not checking: it
      # deployed on every push running NOTHING; its smoke step ran a suite three
      # times its budget and reported `cancelled`; physics-characterization
      # drifted through 175 commits of physics work in no job at all. Every one
      # of those was invisible because nothing said out loud how much of the
      # suite the gate covers. Today: 2 of 110 Playwright specs. That is a
      # deliberate choice — the full suite is ~40 minutes of SwiftShader and the
      # header above explains why it lives in tools/ci/test-bg.mjs instead — but it
      # should be a choice someone can SEE, not one only visible by reading four
      # job definitions and resolving every npm script by hand.
      #
      # NOT a gate, on purpose. The obvious version — run tools/ci/test-observed.mjs
      # here and fail on the never-observed count — is broken by construction:
      # artifacts/ is gitignored, so in CI every title is legitimately unobserved
      # and the check would be red on an environment fact. That is precisely the
      # trap that reddened this job once already (docs/archive/research/CAMPAIGN-2026-08
      # §"a guard that only runs on ONE MACHINE"). tests/unit/ci-coverage.test.mjs
      # guards the TOOL, which is where a guard belongs.
      - name: What does this gate cover?
        run: node tools/ci/ci-coverage.mjs
      - name: Pure-node unit suites
        run: |
          npm run test:net-unit
          npm run test:service-worker
          npm run test:lifecycle-unit
          npm run test:state-unit
          npm run test:webgpu-lifecycle
          npm run test:agent-contract
          npm run test:audio-unit
          # The CLI-only MCP wrappers (tinyfish proxy, probe bridge): spawn-heavy,
          # off the edit loop since 2026-09-03; their fast-gate half is mcp-cli.
          npm run test:mcp
          # The three raster/spawn-heavy car files, out of the edit loop
          # (152 s of the old 315 s tooling-fast; 2026-09-01) and into the gate.
          npm run test:node-slow
          # The Node VM harness: js/game.js headless, exact parity with the
          # physics baseline (tests/unit/physics-characterization-vm.test.mjs).
          npm run test:game-vm

  sweeps-parts:
    name: Parts option-resolution census
    runs-on: ubuntu-latest
    # One subtest of parts-visual-distinctness ("every option resolves to
    # itself") measured 559 s of the 999 s sweeps run on 2026-09-01. Its own
    # runner, unconditional and in parallel, so the geometry sweeps finish in
    # ~7 min and this never blocks them. 20 = 2x the measured 9.5 min.
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:sweeps-parts

  sweeps:
    name: Per-circuit geometry sweeps
    runs-on: ubuntu-latest
    # 35, not 20. MEASURED, not estimated: `test:sweeps` takes 14m20s on a
    # 4-core dev box with the heap ceiling below, and this job then runs
    # verify-track --all on top of it (~40 circuits at ~2 s each), so the local
    # job is ~16 min. A shared runner is slower than that box, which puts the
    # honest range at 20-30 min — i.e. the old cap was BELOW the work even
    # after the OOM was fixed, and would have kept failing for a second reason
    # once the first was gone.
    #
    # The five suites are serial by construction (--test-concurrency=1) and
    # each rebuilds all 40 circuits, so this is ~5 full fleet rebuilds:
    # coplanar-faces 250 s, prop-clipping 210 s, then scenery-grounding,
    # road-under-floor and the shared-foundation characterization. Nothing here
    # is parallelisable without reintroducing the 5.4 GB peak that forced the
    # serialisation.
    timeout-minutes: 35
    # THE HEAP CEILING IS NOT THE SAME HERE AS ON A DEVELOPER'S BOX, and that is
    # why this job failed for days while the identical command passed locally.
    # V8 sizes its default old-space from the machine, so the runner allowed
    # ~4 GB where the dev box allowed 8 GB — a suite peaking at 4.1 GB is green
    # in one place and OOM-dead in the other, with nothing in the diff to
    # suggest it. Measured on run 31016070670: road-under-floor.test.mjs died
    # SIGABRT at 4088 MB after 197 s of "Ineffective mark-compacts near heap
    # limit", and clip-audit.cjs (spawned by prop-clipping.test.mjs) died the
    # same way. Both surfaced as a cancelled job, never as a test failure.
    #
    # Set on the JOB, not the step, so it also reaches the child that
    # prop-clipping.test.mjs spawns with execFileSync — that child was one of
    # the two casualties and a step-level flag would not have covered it.
    #
    # This buys headroom; it does not make the suites frugal. Rebuilding 40
    # circuits in one process and peaking above 4 GB is its own defect (each
    # build's meshes stay reachable for the length of the loop), and the ceiling
    # is what makes that survivable rather than what fixes it.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # fetch-depth: 0 because the filter below diffs against the PREVIOUS head,
      # and a depth-1 clone does not contain it. It costs a few seconds against
      # the 15 minutes it decides whether to spend.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # SKIP THE SWEEPS WHEN THE DIFF CANNOT HAVE MOVED THE GEOMETRY.
      #
      # This is a STEP-level condition, not a job-level `if:` with a `needs:`
      # gate, and that is deliberate. pages.yml has `deploy: needs: ci`, so the
      # called workflow's conclusion decides whether the site ships — and the
      # entire outage this file documents was a deploy silently not happening.
      # Keeping the job unconditional means it always runs and always reports;
      # only the expensive steps inside it are skipped. The `needs:` semantics
      # that just started working are not touched at all.
      #
      # The paths come from tools/ci/pick-tests.mjs's RULES, which is the repo's
      # existing answer to "what does this diff need": `sweeps` is routed only
      # from js/track/scenery* and js/track/{tracks,mesh,spline,surface,geom,
      # graph}.js. js/circuits/ and the suites' own files are included here as
      # well, because a circuit def or a moved baseline can change what the
      # sweep measures even when the engine did not.
      #
      # FAIL SAFE, NEVER FAIL OPEN. Every path that cannot resolve a diff — not
      # a push, no before-sha, a force push, an unreachable commit, a git error
      # — RUNS the sweeps. A filter that guesses "nothing changed" when it does
      # not know is how a gate stops gating without anyone noticing, which is
      # the exact failure mode this workflow already had once.
      - name: Does this diff touch the geometry?
        id: filter
        env:
          # Prefer the caller's before_sha on a Pages workflow_call; fall back to
          # the push event's before on direct branch pushes.
          BEFORE: ${{ inputs.before_sha != '' && inputs.before_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          run_all() { echo "geometry=true" >> "$GITHUB_OUTPUT"; echo "RUNNING SWEEPS: $1"; exit 0; }
          # workflow_call from pages.yml is a deploy push in disguise — treat it
          # like a push when before_sha was forwarded, otherwise fail-safe RUN.
          case "$EVENT" in
            push|workflow_call) ;;
            *) run_all "event is '$EVENT', not a push/workflow_call" ;;
          esac
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push, or caller omitted input)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable (force push?)"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          # The suite half of the filter is DERIVED from package.json's
          # test:sweeps, not retyped here. The hand-written alternation had
          # already drifted: scenery-grounding is one of the five suites this
          # job runs and was missing from it, so a diff touching only that
          # suite's own file skipped the very sweep it belongs to — a fail-open
          # in the one filter whose comment above forbids exactly that. A list
          # that must be edited in two places to stay true will drift again;
          # reading it from the script that defines it cannot.
          SUITES_FILE="${RUNNER_TEMP:-.}/sweep-suites.txt"
          node -e 'const s=require("./package.json").scripts["test:sweeps"]||"";const m=s.match(/tests\/unit\/[^\s]+/g)||[];if(!m.length)process.exit(1);process.stdout.write(m.join("\n")+"\n")' > "$SUITES_FILE" \
            || run_all "could not read the sweep suite list out of package.json"
          echo "--- sweep suites ---"; cat "$SUITES_FILE"; echo "--------------------"
          # js/car, js/game.js and debrisworld are here because four sweep suites
          # load them (parts-visual-distinctness, car-front-wing-width, grid-boxes,
          # debris-hazard-hint) — a wing-width regression in car3d.js used to skip.
          if printf '%s\n' "$CHANGED" | grep -qE '^(js/track/|js/circuits/|tools/|js/car/|js/game\.js$|js/game/debrisworld\.js$)' \
            || printf '%s\n' "$CHANGED" | grep -qxF -f "$SUITES_FILE"; then
            echo "geometry=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING SWEEPS: the diff touches track engine, circuit data, tools or a sweep suite"
          else
            echo "geometry=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING SWEEPS: nothing in this diff can move circuit geometry"
          fi
      - name: Geometry sweeps (rebuilds all 40 circuits per suite)
        if: steps.filter.outputs.geometry == 'true'
        run: npm run test:sweeps
      - name: Every circuit still builds headlessly
        if: steps.filter.outputs.geometry == 'true'
        run: node tools/track/verify-track.cjs --all

  smoke:
    name: Smoke (page boots, __apex responds)
    runs-on: ubuntu-latest
    # TEMP: pages.yml can pass smoke:false to skip this job on deploy (see the
    # workflow_call input). Branch/PR pushes keep the default (true).
    #
    # `inputs.smoke != false` did NOT deliver that second sentence, and it was
    # silently skipping this job on EVERY branch and PR push. A workflow's
    # `inputs` defaults are applied only for workflow_call / workflow_dispatch;
    # on a plain push the `inputs` context is empty, so `inputs.smoke` is null,
    # and GitHub coerces null and false to the same value — making
    # `null != false` FALSE and the job skip. Measured 2026-08-14 on two
    # consecutive pushes to a branch (runs 31765883905 and 31766287790): smoke
    # and selected both `skipped`, each with completed_at BEFORE started_at,
    # which is the signature of a job-level `if` resolving false rather than of
    # a step-level filter deciding nothing shipped. The deploy path was
    # unaffected — pages.yml reaches this through workflow_call, where the
    # default DOES apply — so the whole CI run still reported green and the
    # hole stayed invisible.
    #
    # Test the EVENT, then the input: on push/pull_request the first operand is
    # already true and `inputs` is never consulted; under workflow_call it falls
    # through to the input, so pages.yml keeps its ability to pass smoke:false.
    if: ${{ github.event_name != 'workflow_call' || inputs.smoke }}
    # TWO SHARDS, TWO RUNNER VMs — NOT two workers on one VM. The measured rule
    # below (two concurrent SwiftShader contexts on one shared runner blow the
    # per-test timeout) still binds: each shard keeps APEX_WORKERS=1 and runs
    # its half of the spec list alone on its own machine. Sharding exists to
    # shrink WALL-CLOCK, because this job's ~14-18 min serial length is the
    # window in which a run gets superseded and cancelled by the next push —
    # measured 2026-08-14: run 1407 was cancelled at 29 min, ONE spec from
    # green, after two 240 s runner-starvation timeouts stretched the serial
    # pass. Half the specs per VM ≈ half the window.
    # FOUR shards, not two. MEASURED per-spec on 2026-08-14 after the render-loop
    # and direct-boot changes (509.5 s of serial work across the 9 specs), against
    # how `--shard` actually divides them — contiguous chunks in declaration order:
    #     2 shards   232 / 277 s          pole 277 s
    #     3 shards   123 / 165 / 222 s    pole 222 s
    #     4 shards   123 / 110 / 87 / 190 pole 190 s
    # Beyond four the pole stops moving, because `--shard` balances COUNT and the
    # cost is lumpy: the two HUD specs at the end (speed readout 109 s, minimap
    # 81 s) are the pole on their own, and no count-based split separates them
    # from each other without reordering the file. Runners are free on a public
    # repo and the per-job overhead is ~38 s (less now that Chromium is cached),
    # so four is where this stops paying.
    strategy:
      fail-fast: false
      matrix:
        # ALWAYS four. smoke.spec.js unsharded measured 30-37 min on a shared
        # runner (Pages runs 1873/1876, 2026-09-01/02) — at this job's 30-minute
        # cap. The 2026-09-01 slimming collapsed the push gate to ONE shard by
        # mistake; the nightly's four shards are the boot group, the push gate's
        # four are smoke.spec.js (~8 min wall). Shards are separate runners.
        shard: [1, 2, 3, 4]
    # 30, not 20. MEASURED on run 31023778264, the first green one: 14m24s.
    # That fit the old cap, but with 5.5 minutes to spare on a SHARED runner
    # whose per-test cost is the very thing that varies — and the last time a
    # margin here was thin it produced a `cancelled` nobody read as a failure.
    # The serial single-worker run below is slower per pass by design, so the
    # budget has to reflect that rather than the 2-worker figure it replaced.
    # The cap stays at the whole-suite figure even though a shard runs half the
    # specs: the starvation tail this job has actually measured (334 s for one
    # spec) is per-runner luck, not per-spec arithmetic.
    #
    # 30 -> 50. SIX consecutive deploys failed here (Pages #1848-#1854, three
    # authors), every one a wall-clock timeout and not one assertion mismatch.
    # In-page timestamps on run #1854 show the same shard, same commit, booting
    # 37-55x slower between two attempts: `[car] build mercedes` 3,956 ms then
    # 147,612 ms; `[assets] pack loaded` 5,008 ms then 276,476 ms. Shard 4 was
    # not even failing — it was CANCELLED at 29.5 min still running, so this cap
    # was the binding constraint as much as the per-test one below, and a
    # cancelled job is exactly the silent-failure mode the header warns about.
    # 50 covers a shard whose every spec lands in the starvation tail, with the
    # per-test cap below as the real hang detector.
    timeout-minutes: 50
    steps:
      # fetch-depth: 0 — the filter below diffs against the SHA that is currently
      # live on Pages, which is arbitrarily far back. Same reason the sweeps job
      # takes the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # DOES THIS DIFF CHANGE ANYTHING THAT ACTUALLY SHIPS?
      #
      # pages.yml stages a fixed list of runtime paths into _site/. A commit that
      # touches none of them deploys BYTE-IDENTICAL content to what is already
      # live, so a browser gate on it re-proves a page that has not changed.
      # MEASURED 2026-08-14: runs 1416 and 1417 were both `tests/specs/*` only and
      # each spent ~13 minutes of smoke to ship an artifact identical to the one
      # already serving — 26 minutes, twice, for no information.
      #
      # DIFFED AGAINST WHAT IS LIVE, NOT AGAINST `before`. The obvious base is the
      # push's before-SHA, and it is wrong here in a way that fails OPEN: this
      # branch takes rapid pushes from several concurrent sessions and their runs
      # cancel each other constantly (eight cancellations on 2026-08-14 alone,
      # one of them a run that died a single spec from green). So a js/ push whose
      # run was cancelled, followed by a tests-only push, would diff clean against
      # `before` and deploy the UNVERIFIED js/ change with the gate skipped. The
      # github-pages deployment SHA is what is genuinely proven, so that is the
      # base — cancelled runs in between simply mean more of the diff is visible,
      # which is the safe direction.
      #
      # EVERY uncertainty runs the gate: no token, API error, unparseable reply,
      # no deployment yet, a SHA git cannot reach (force push), or a diff that
      # fails. Same fail-safe discipline as the sweeps filter above, for the same
      # reason — a filter that guesses "nothing changed" when it cannot tell is
      # how a gate stops gating without anyone noticing.
      - name: Does this diff change anything that ships?
        id: shipfilter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_all() { echo "ships=true" >> "$GITHUB_OUTPUT"; echo "RUNNING SMOKE: $1"; exit 0; }
          case "$EVENT" in
            push|workflow_call) ;;
            *) run_all "event is '$EVENT', not a push/workflow_call" ;;
          esac
          # The staged list is DERIVED from pages.yml's own `Stage site` step, not
          # retyped — the two drifting apart is what would silently let a shipped
          # path escape the filter. (tests/unit/deploy-staging.test.mjs already
          # guards that this list covers everything the shell can fetch.)
          PATHS_FILE="${RUNNER_TEMP:-.}/staged-paths.txt"
          node -e '
            const fs = require("fs");
            const y = fs.readFileSync(".github/workflows/pages.yml", "utf8");
            const names = new Set();
            for (const m of y.matchAll(/^\s*cp\s+(?:-r\s+)?(.+?)\s+_site\/\s*$/gm)) {
              for (const t of m[1].trim().split(/\s+/)) names.add(t);
            }
            if (!names.size) process.exit(1);
            process.stdout.write([...names].join("\n") + "\n");
          ' > "$PATHS_FILE" || run_all "could not read the staged path list out of pages.yml"
          echo "--- staged paths ---"; cat "$PATHS_FILE"; echo "--------------------"
          API="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=20"
          RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "Accept: application/vnd.github+json" "$API") \
            || run_all "could not reach the deployments API"
          DEPLOYMENTS_FILE="${RUNNER_TEMP:-.}/pages-deployments.tsv"
          printf '%s' "$RESP" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              try {
                const j = JSON.parse(s);
                if (!Array.isArray(j)) process.exit(1);
                for (const d of j) {
                  if (!d || !d.sha || !d.statuses_url) process.exit(1);
                  process.stdout.write(`${d.sha}\t${d.statuses_url}\n`);
                }
              } catch (_) { process.exit(1); }
            });' > "$DEPLOYMENTS_FILE" || run_all "could not parse the deployments API reply"
          [ -s "$DEPLOYMENTS_FILE" ] || run_all "no github-pages deployment recorded yet"
          LIVE=""
          while IFS=$'\t' read -r SHA STATUSES_URL; do
            STATUS_RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                               -H "Accept: application/vnd.github+json" "${STATUSES_URL}?per_page=1") \
              || run_all "could not read deployment status for $SHA"
            STATE=$(printf '%s' "$STATUS_RESP" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try { const j = JSON.parse(s); if (Array.isArray(j) && j[0] && j[0].state) process.stdout.write(j[0].state); }
                catch (_) {}
              });') || run_all "could not parse deployment status for $SHA"
            case "$STATE" in
              success) LIVE="$SHA"; break ;;
              inactive|failure|error|queued|pending|in_progress) ;;
              *) run_all "deployment $SHA has no trustworthy status" ;;
            esac
          done < "$DEPLOYMENTS_FILE"
          case "${LIVE:-}" in "") run_all "no successful active github-pages deployment found" ;; esac
          git cat-file -e "${LIVE}^{commit}" 2>/dev/null || run_all "live SHA $LIVE unreachable in this checkout"
          CHANGED=$(git diff --name-only "$LIVE" "$GITHUB_SHA") || run_all "git diff against $LIVE failed"
          echo "--- changed since live ($LIVE) ---"; echo "$CHANGED"; echo "----------------------------------"
          # Content hashes cover only index.html tags. Deferred renderer code
          # uses ?v=<build>, and mutable assets/manifest/icons/vendor are served
          # cache-first at stable paths, so those bytes require a strictly newer
          # shell/service-worker generation than the active deployment.
          # (The "strictly newer build generation" check that stood here is
          # gone: pages.yml stamps the generation from the commit count at
          # deploy time, so it is newer by construction — 2026-09-01.)
          # smoke.spec.js is deliberately excluded from the generic selected
          # job, whose 120 s cap is too short for its measured render probes.
          # A test-only edit does not change _site, but must still exercise the
          # fixed 420 s smoke shards that own this spec's blocking coverage.
          if printf '%s\n' "$CHANGED" | grep -qx 'tests/specs/smoke.spec.js'; then
            run_all "the fixed smoke spec itself changed"
          fi
          # A staged entry is either a file (index.html) or a directory (js) — match
          # the whole name or anything under it, anchored so `jsfoo/x` cannot pass
          # as `js`.
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if printf '%s\n' "$CHANGED" | grep -qE "^${p}(/|$)"; then
              run_all "the diff touches a shipped path ($p)"
            fi
          done < "$PATHS_FILE"
          echo "ships=false" >> "$GITHUB_OUTPUT"
          echo "SKIPPING SMOKE: nothing in this diff reaches _site/ — the deployed bytes are unchanged since $LIVE"
      # Chromium only — the suite never targets firefox/webkit, and installing
      # all three triples the step for nothing.
      #
      # CACHED across runs: the download is ~25 s on every browser job, every run,
      # for a binary pinned by the @playwright/test version in package-lock.json.
      # Keyed on that lock file so a Playwright bump misses the cache and refetches.
      - name: Cache Chromium
        if: steps.shipfilter.outputs.ships != 'false'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # A cold cache installs both the browser and its OS dependencies. On a cache
      # hit the browser is already complete and ubuntu-latest already satisfied
      # the same dependency set for the cached run; invoking --with-deps again
      # needlessly enters apt. One stalled mirror consumed this job's full 30 min.
      - name: Install Chromium on cache miss
        if: steps.shipfilter.outputs.ships != 'false' && steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # test:smoke, NOT test:tiny. This step said `test:tiny` against a
      # 20-minute cap and a "~3 min" estimate, and the arithmetic never worked:
      # test:tiny is smoke + dev-tools + logging = 71 tests, CI pins
      # `workers: 2` (playwright.config.js), and a SwiftShader test on a shared
      # runner measured 90-115 s. That is ~53 minutes of work in a 20-minute
      # box. Run 31016070670 got to 30/71 before the timeout killed it — dead on
      # that trajectory, and with `0 failed` the whole way, so the job was never
      # telling us anything about the code.
      #
      # A gate that is always killed provides no coverage, so this is not a
      # reduction in what CI checks — it is the difference between nine specs
      # that report and seventy-one that never finish. dev-tools and logging
      # belong in a local `tools/ci/test-bg.mjs` run, which is where the workflow
      # header already says the full suite lives.
      # ONE WORKER, AND A PER-TEST TIMEOUT THAT FITS THE RUNNER. With the spec
      # count fixed, run 31019857052 still failed — but as `failure` rather than
      # `cancelled`, which is the first time this gate reported anything real.
      # Both failures were `Test timeout of 120000ms exceeded`, neither was an
      # assertion, and both were the two SwiftShader RENDERING specs (grid start
      # 175.7 s, corner approach 150.6 s).
      #
      # The log contains its own controlled experiment. `speed readout updates
      # after jump()` timed out at 125.2 s while a second worker was busy, then
      # PASSED on retry at 110.6 s in the window where the status line shows w8
      # running alone. Same test, same commit, same machine: two concurrent
      # SwiftShader contexts blow the limit and one does not. That is the
      # oversubscription signature CLAUDE.md describes — every failure a timeout,
      # not one of them an expectation that did not hold — and it is measuring
      # the runner, not the game.
      #
      # `workers: 2` is right for a 4-core dev box and wrong here, so APEX_WORKERS
      # (playwright.config.js's documented override) pins it to 1. The timeout
      # goes to 240 s because even uncontended the runner needed 110.6 s against
      # a 120 s limit — margin that thin is a coin flip, and a coin flip in a
      # deploy gate is what this whole exercise has been about.
      #
      # Serial and slower per pass is still far cheaper than the retries and the
      # false red: 9 specs, no contention, well inside the 20-minute cap.
      #
      # 240 -> 420 s, SAME ARGUMENT AS THE 120 -> 240 RAISE ABOVE, RE-MEASURED.
      # The reasoning that set 240 ("even uncontended the runner needed 110.6 s
      # against a 120 s limit") held until the runner pool got slower than the
      # pool it was measured on. MEASURED 2026-08-14, three separate runs, one
      # worker, no contention from our side:
      #   run 1407  grid start renders a non-blank frame   334 s (retry passed)
      #   run 1407  the select screen is a circuit picker  240 s (retry passed)
      #   run 1412  corner approach renders a non-blank    309 s, RETRY ALSO
      #             timed out -> terminal FAIL, deploy blocked
      # The third one is the reason this is not "just flakiness to retry past":
      # both attempts exceeded the cap, so the gate reported failure for a suite
      # that passes 9/9 locally on the same commit.
      #
      # The cap is now measured against the RUNNER, not the test: the same log
      # records `race bahrain` taking 94.3 s to boot where a dev box takes ~4 s,
      # so the spec was doing correct work ~20x slower than it costs anywhere
      # else. 420 s clears tonight's worst observed pass (334 s) with the same
      # ~25 % margin the 240 s figure was chosen to give over its own 110.6 s
      # worst case. If a spec ever genuinely hangs, the job's own
      # `timeout-minutes: 50` is the real backstop — a per-test cap set below
      # the machine's noise floor only converts slow into red.
      #
      # 420000 -> 900000, for the reason the job cap moved: measured on Pages
      # #1854, `minimap canvas has content` needed 640.6 s and `grid start
      # renders a non-blank frame` 488.0 s on a starved runner, both against a
      # 420 s cap, while the SAME specs pass in seconds locally. 900 s clears
      # the 640.6 s worst observed with ~40 % margin — the same kind of margin
      # 420 was chosen to give over its own 334 s worst case, re-measured
      # against a runner that has since got slower. This raises a BUDGET, not a
      # tolerance: no assertion changed, and a spec that genuinely hangs still
      # goes red, just later.
      - name: Smoke
        if: steps.shipfilter.outputs.ships != 'false' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          APEX_WORKERS: 1
        # --shard splits smoke.spec.js's tests across the four matrix VMs; the
        # flag passes through tools/ci/run-playwright.mjs verbatim (it forwards
        # argv to `playwright test`). Unsharded this step took 30-37 min.
        run: npm run test:smoke -- --timeout=900000 --shard=${{ matrix.shard }}/4
      # The wide run: the whole boot group, 4 shards, nightly — or, on dispatch,
      # whichever browser group the `group` input names (default tiny).
      - name: Boot group (nightly) / dispatched group
        if: steps.shipfilter.outputs.ships != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          APEX_WORKERS: 1
          GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.group || 'tiny' }}
        run: npm run "test:${GROUP:-tiny}" -- --timeout=900000 --shard=${{ matrix.shard }}/4
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Shard-scoped name: same-named artifacts from parallel matrix jobs
          # collide on upload-artifact@v4 (it hard-fails on duplicates).
          name: playwright-artifacts-smoke-${{ matrix.shard }}
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  driving-model:
    name: Driving model (characterization traces)
    runs-on: ubuntu-latest
    # 42 s measured in CI (run 31197770813, step 7). The old 10-minute cap was
    # consumed entirely by an uncached Chromium install on run 32083395969, so
    # the characterization never started and Pages was blocked. Keep the same
    # lockfile-keyed browser cache as smoke and leave enough room for a genuine
    # cold install on a slow shared runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium on cache miss
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # THE DRIVING MODEL'S OWN GATE, which nothing was running.
      #
      # tests/specs/physics-characterization.spec.js pins six-sample traces of four
      # scenarios and fails if the driving model's numbers move. It is not in
      # guards (browser spec, not node), not in sweeps (geometry only), and not
      # in smoke's spec list — so it had never run in CI, and locally it had
      # never passed either. The result: 175 commits of deliberate physics work
      # (geometric RACE PACE, the PACE regrid, the SPEED STEER taper, the
      # wheelbase recentre) drifted past it with nothing to say so, and the
      # baseline was ~9 % stale before anyone looked. A gate nobody runs is not
      # a gate.
      #
      # ITS OWN JOB, NOT A STEP IN SMOKE — and it landed as a step first, which
      # is the mistake worth recording. Appending it to smoke was the cheap
      # move: smoke is the only job that installs the browser binaries, so it
      # cost nothing extra. But a step inherits its job's fate in both
      # directions. It ran only AFTER smoke's twelve minutes, so a red smoke
      # meant the driving-model gate never executed at all — a gate that
      # silently does not run is the exact failure class the header above
      # documents. And GitHub's checks list reports JOBS, not steps, so a
      # failure surfaced as "Smoke (page boots, __apex responds)" — defeating
      # the stated reason for making it a separate step in the first place.
      #
      # The cost argument was also weaker than it looked. The gate's critical
      # path is sweeps (~15 min) and smoke (13m21s measured); a job that takes
      # ~40 s of setup plus 42 s of test runs alongside them and adds ZERO
      # wall-clock. One runner is the whole price of an independent verdict.
      #
      # No `needs:` — this is orthogonal to whether the page boots. It answers
      # one question, in its own name: did the driving model's numbers move?
      - name: Characterization traces
        env:
          APEX_WORKERS: 1
        run: npm test -- tests/specs/physics-characterization.spec.js --timeout=240000
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-driving-model
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  # RENDERER SPECS ON A REAL GPU. Every other browser job in this file runs on
  # ubuntu-latest, whose only WebGPU/WebGL adapter is SwiftShader, and the
  # renderer group (`gfx`: 240-480 s budgets under software rasterisation) has
  # never been in CI at all — the header's "deliberately NOT here" clause.
  # docs/research/CI-RENDERING-PERFORMANCE.md §"There IS a real GPU" measured
  # the runner images: macos-latest (Apple silicon) reports a HARDWARE Metal
  # adapter on STOCK flags, and the two defects that real GPU has found so far
  # were invisible to every software test. So the renderer specs get their own
  # macOS job (PROCESS-SPEEDUP-2026-09 §1.4 / §4.5).
  #
  # TWO JOBS, NOT ONE. macOS minutes bill at 10x, so the "does this diff touch
  # the renderer?" question is answered on a ubuntu runner first (seconds, no
  # npm ci) and the macOS runner is only ever allocated when the answer is
  # yes. A step-level skip inside the macOS job — the sweeps pattern — would
  # still pay for the macOS checkout and npm ci on every push.
  renderer-filter:
    name: Does this diff touch the renderer?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NOT IN THE DEPLOY GATE — a decision, not an omission. pages.yml reaches
    # this file through `ci: uses: ./.github/workflows/ci.yml` and then
    # `current-tip: needs: ci`, so the called workflow's conclusion is the
    # AGGREGATE of every job in it: there is no `needs:` list to leave a job
    # out of, and any new job that RUNS on a Pages call joins the gate by
    # itself. The gate's whole recorded history in this header is a job that
    # was never measured, timed out on a starved runner, and blocked deploys
    # while reporting "0 failures". A brand-new job on an image nothing here
    # has ever run a Playwright spec on is exactly that risk, and §4.5 of the
    # plan puts the gate at guards + driving-model + one smoke shard +
    # conditional sweeps (~5 min) with the GPU work on the nightly cron. So:
    # skipped on the Pages call (a skipped job does not fail the aggregate),
    # run nightly and on dispatch. Branch pushes and PRs no longer reach it
    # (2026-09-02, Actions minutes): the path filter below is kept for the
    # day it is promoted, but a push skips this job outright, which skips
    # renderer-macos with it through `needs:`.
    #
    # The Pages call is recognised by `inputs.concurrency_key`, which pages.yml
    # ALWAYS forwards and nothing else sets — not by `github.event_name`, which
    # a reusable workflow reports as the CALLER's event ("push"), the reason
    # the sweeps filter accepts `push|workflow_call` either way. Promoting this
    # job into the gate once it has a measured green history is one line:
    # delete this `if:`.
    if: ${{ !inputs.concurrency_key && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    outputs:
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same shape as the sweeps filter, same rule: FAIL SAFE, NEVER FAIL OPEN.
      # Any path that cannot resolve a diff RUNS the job. A pull request has a
      # real base (pull_request.base.sha) where the sweeps filter has none, so
      # it is diffed rather than fail-safed — otherwise every PR would pay for
      # a macOS runner.
      - name: Does this diff touch the renderer?
        id: filter
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          run_all() { echo "renderer=true" >> "$GITHUB_OUTPUT"; echo "RUNNING RENDERER SPECS: $1"; exit 0; }
          case "$EVENT" in
            push|pull_request) ;;
            *) run_all "event is '$EVENT', not a push/pull_request" ;;
          esac
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) run_all "no before-sha (new branch, first push)" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_all "before-sha $BEFORE unreachable (force push?)"
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || run_all "git diff failed"
          echo "--- changed files ---"; echo "$CHANGED"; echo "---------------------"
          # The spec half is DERIVED from package.json's test:gfx, as the sweeps
          # filter derives its suite list — a retyped list drifts.
          SPECS_FILE="${RUNNER_TEMP:-.}/gfx-specs.txt"
          node -e 'const s=require("./package.json").scripts["test:gfx"]||"";const m=s.match(/tests\/specs\/[^\s]+/g)||[];if(!m.length)process.exit(1);process.stdout.write(m.join("\n")+"\n")' > "$SPECS_FILE" \
            || run_all "could not read the gfx spec list out of package.json"
          echo "--- gfx specs ---"; cat "$SPECS_FILE"; echo "-----------------"
          # js/render/** is every backend (GLX, WGX, TLX, gltf, assets); the
          # js/game/ files are the lighting/atmosphere/tuner modules whose
          # numbers the lighting-ab / image-grade / tuner-grade specs pin.
          # The two playwright configs carry the launch flags this job depends
          # on, tests/helpers/ is what every spec boots through, and the
          # workflow file is here so an edit to THIS job runs it.
          if printf '%s\n' "$CHANGED" | grep -qE '^(js/render/|js/game/lighting[^/]*\.js$|js/game/track-lights\.js$|js/game/frame-lights\.js$|js/game/light-presets\.js$|js/game/atmosphere\.js$|js/game/tuner\.js$|playwright(\.gpu)?\.config\.js$|\.github/workflows/ci\.yml$|tests/helpers/)' \
            || printf '%s\n' "$CHANGED" | grep -qxF -f "$SPECS_FILE"; then
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING RENDERER SPECS: the diff touches the renderer, its lighting modules, a gfx spec or the launch config"
          else
            echo "renderer=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING RENDERER SPECS: nothing in this diff reaches the renderer"
          fi

  renderer-macos:
    name: Renderer specs on a real GPU (macos-latest, Metal)
    needs: renderer-filter
    # A job-level `if:` on a `needs:` output is fine HERE, where the sweeps
    # comment forbids it, because this job is already outside the deploy gate
    # (renderer-filter is skipped on the Pages call, so this is too). The
    # "skipped reads as passed" hazard the sweeps avoid is about a job whose
    # verdict the deploy consumes; nothing consumes this one but the checks list.
    # Nightly, or a dispatch that asked for it (`renderer_macos: true`);
    # never a push — see the filter's header and the dispatch input.
    if: needs.renderer-filter.outputs.renderer == 'true' && (github.event_name == 'schedule' || inputs.renderer_macos == true)
    runs-on: macos-latest
    # 30 is a GUESS, and the header says what to do about that: the six specs
    # declare 240-480 s budgets measured under SwiftShader, where a boot is
    # 11-33 s; the census measured a ~4 s boot on this image's Metal adapter.
    # Re-time on the first green run and replace this number and the header's.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Same lockfile-keyed cache as smoke / driving-model, at macOS's browser
      # path (~/Library/Caches, not ~/.cache). The key already carries
      # runner.os, so it never collides with the Linux entries.
      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The FULL browser, the way gpu-census.yml installs it — not the headless
      # shell, which ships without navigator.gpu. `install chromium` fetches
      # both; playwright.gpu.config.js selects the full one. No `--with-deps`:
      # that is apt, and this is not Linux.
      - name: Install Chromium on cache miss
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # PROVE THE GPU BEFORE TRUSTING THE RUN. The whole point of this job is
      # the hardware adapter; if the image ever loses it (a runner-image
      # change, a Chromium that stops seeing Metal) the specs would silently
      # run on SwiftShader and this job would become a slower ubuntu job that
      # still says "macOS". AGENTS.md: a software run is not evidence about a
      # player's machine. The tri-state census (tools/gpu-census.mjs) is the
      # same one gpu-census.yml gates on; `=== true` on purpose, so a census
      # that measured nothing (null) fails rather than passing vacuously.
      - name: Adapter census — is the Metal adapter still there?
        run: |
          node tools/gpu-census.mjs --json census-macos.json
          node -e '
            const r = require("./census-macos.json");
            if (r.anyHardware !== true) {
              console.error("::error::renderer-macos: the census found NO hardware adapter (anyHardware=" + r.anyHardware + ") — this run would measure SwiftShader on a Mac, not the GPU");
              process.exit(1);
            }
          '
      # playwright.gpu.config.js is playwright.config.js with ONE difference:
      # the launch drops the `--use-angle=swiftshader` pin every other run
      # carries and selects the full Chromium (`channel: "chromium"`). The
      # shared config is untouched — it is a protected contract file — and the
      # --config flag passes through tools/ci/run-playwright.mjs verbatim. NEVER
      # add --use-angle=vulkan anywhere on this job: on macOS that one flag
      # forces ANGLE onto SwiftShader and requestAdapter() returns null
      # (CI-RENDERING-PERFORMANCE.md §There IS a real GPU, trap 1). Two
      # workers: a real GPU does not have SwiftShader's ~1.9x second-worker
      # penalty (docs/TESTING.md), and the budget is the image's to measure.
      # --timeout=600000 is a CEILING for the first runs, not a tolerance: the
      # specs keep their own budgets, and the job cap is the real backstop.
      - name: Renderer specs (test:gfx)
        env:
          APEX_WORKERS: 2
        run: npm run test:gfx -- --config=playwright.gpu.config.js --timeout=600000
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-renderer-macos
          path: |
            census-macos.json
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore

  selected:
    name: Selected specs (change-aware gate)
    runs-on: ubuntu-latest
    # BLOCKING ON BRANCH PUSHES AND PULL REQUESTS. A PR's event.before is not its
    # comparison base, so the selector uses pull_request.base.sha explicitly;
    # pushes use event.before. workflow_call remains disabled: the Pages workflow
    # already gates deploys with guards / sweeps / smoke / driving-model, and its
    # event payload does not carry a PR base.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    #
    # The budget maths is tools/ci/select-budget.mjs (measured: 79.7 s/test at one
    # worker on a shared runner; a TIMING-OUT test costs timeout x (1+retries)).
    # Hence retries 0 and --timeout=120000 here — the selector's settings, not
    # smoke's gate settings (420 s, one retry): a retry only doubles the cost
    # of the news this job exists to deliver. The fixed smoke and driving-model
    # specs are excluded here because their independent blocking jobs own their
    # measured timeout policies; duplicating smoke here caused run 32103664606
    # to turn four green 420 s shards into a false red at exactly 120 s.
    # tools/ci/select-specs.mjs decomposes
    # pick-tests' groups into specs, fits them to the budget surviving one
    # timeout, and NAMES every spec it skips — silent truncation would read as
    # "covered".
    # 26, DERIVED, not guessed — and 20 was wrong. The budget models the
    # EXPECTED cost (one failure at 120 s + nine passes at 79.7 s = ~14 min),
    # but the TRUE worst case is every selected test hitting the per-test
    # timeout: 10 x 120 s = 20 min, plus ~4 min of setup (npm ci + chromium)
    # = ~24 min. At 20 the job would have been CANCELLED in that case — and
    # this workflow's own header records that a cancelled job reads as "0
    # failures" and once hid a dead deploy. A selected gate that dies of its
    # own cap teaches nothing; 26 covers the worst case with margin, and the
    # budget (not the cap) stays the thing that bounds the selection.
    #
    # Re-derive this if the budget, the per-test timeout, or the retry count
    # changes: cap >= (tests x per-test timeout) + setup + margin.
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # PREVIOUSLY-FAILING SPECS, carried across runs. Fowler's TIA survey
      # records Microsoft's TIA and Google's Testar both re-running the last
      # run's failures unconditionally — a test that just failed is the single
      # best predictor of failing again, and a fresh runner otherwise forgets.
      # restore-keys makes a miss harmless: the file is simply absent and the
      # selector proceeds without it.
      - name: Restore last run's failing specs
        uses: actions/cache/restore@v4
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            selected-failed-${{ github.ref_name }}-
      - name: Select specs for this change
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          fail() { echo "::error::SELECTED GATE FAILED CLOSED: $1"; exit 1; }
          # Resolve comparison base with HEAD~1 fallback for force-push/first-branch.
          BEFORE="$(EVENT="$EVENT" PUSH_BEFORE="$PUSH_BEFORE" PR_BASE="${PR_BASE:-}" \
            bash tools/ci/ci-resolve-before.sh)" || fail "could not resolve comparison base"
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000) fail "no valid comparison base for $EVENT" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || fail "comparison base $BEFORE is unreachable"
          node tools/ci/select-specs.mjs --since "$BEFORE" --failed-from .selected-failed.txt --json > sel.json \
            || fail "selector failed"
          node -e '
            const r = require("./sel.json");
            if (r.reason === "unmatched") {
              console.error("SELECTED GATE FAILED CLOSED: changed files matched no selection rule");
              process.exit(1);
            }
            const specs = r.selected.map((s) => s.file).join(" ");
            console.log(`reason=${r.reason}; groups: ${r.groups.join(", ") || "(none)"}`);
            console.log(`fits ${r.testsFit} tests; selected ${r.testsSelected} across ${r.selected.length} specs`);
            for (const s of r.overBudgetSpecs)
              console.log(`EXCLUDED (declares ${s.ownTimeoutSec}s timeout): ${s.file} (${s.tests} tests)`);
            for (const s of r.coveredByFixedGates)
              console.log(`COVERED BY FIXED BLOCKING GATE: ${s.file} (${s.tests} tests)`);
            for (const s of r.skipped) console.log(`SKIPPED (over budget): ${s.file} (${s.tests} tests)`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `specs=${specs}\n`);
          '
      - name: Install browser
        if: steps.sel.outputs.specs != ''
        run: npx playwright install --with-deps chromium
      - name: Run the selection
        if: steps.sel.outputs.specs != ''
        env:
          APEX_WORKERS: 1
        run: npm test -- ${{ steps.sel.outputs.specs }} --retries=0 --timeout=120000
      # Record what failed so the NEXT run hoists it to the front. junit.xml is
      # the machine-readable half of the reporter set playwright.config already
      # writes; parsing it here keeps the tool free of CI-specific formats.
      - name: Record failing specs for the next run
        if: always() && steps.sel.outputs.specs != ''
        # tools/ci/junit-failed.mjs, not an inline regex: Playwright writes
        # <system-out> BEFORE <failure>/<error> inside a testcase, so the
        # "testcase immediately followed by failure" regex this replaced never
        # matched (two red runs on 2026-09-02 both said "no failures to carry"),
        # and its classname lacks the tests/ prefix the selector filters on.
        run: node tools/ci/junit-failed.mjs artifacts > .selected-failed.txt || true
      - name: Save failing specs
        if: always() && steps.sel.outputs.specs != ''
        uses: actions/cache/save@v4
        with:
          path: .selected-failed.txt
          key: selected-failed-${{ github.ref_name }}-${{ github.run_id }}
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-selected
          path: |
            artifacts/test-results-*/
            artifacts/report-*/
          retention-days: 7
          if-no-files-found: ignore
