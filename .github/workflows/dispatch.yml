name: Dispatch (retired)
# Implementation-agent dispatch is retired in every mode. This file exists only
# to make an accidental/manual invocation visibly inert during queue migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    name: Implementation-agent launch retired
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'This workflow is retired; only PR test executors are managed.'
