name: GPU census

# Find a real GPU this project can actually reach.
#
# Every rendering verdict the agent container can produce is a SOFTWARE verdict:
# `vulkaninfo --summary` there reports one PHYSICAL_DEVICE_TYPE_CPU (llvmpipe)
# and /dev/dri does not exist, so no Chrome flag, Xvfb run or MCP can conjure
# hardware. That is fine for validation — llvmpipe is a conformant Vulkan 1.3
# implementation, so Dawn rejects exactly what it would reject on a player's
# machine, which is how the env-probe attachment-state defect was found — and
# useless for anything that only appears on real silicon.
#
# The published answers about GitHub's images contradict each other: the M1
# macOS announcement says GPU hardware acceleration is on by default,
# actions/runner-images#7085 asks for Metal passthrough as a missing feature.
# Rather than believe either, ASK each image:
#
#   census     — is there an adapter behind navigator.gpu, and does its identity
#                look like a known software rasteriser? Four flag sets, because
#                "stock" (what a player runs) and "--enable-unsafe-webgpu" do
#                not agree even in the agent container: stock returns NO adapter
#                there at all.
#   game-check — boot the ACTUAL GAME on the three.js/WebGPU path and report
#                GLX.gpuErrors(), the env-probe state and the ?gfxdebug=1
#                overlay. Same hooks the overlay prints for a player, so a CI
#                answer and a pasted player answer compare directly.
#
# Dispatch-only. It costs runner minutes on images the normal gate never uses
# (macOS bills at a multiplier), so it runs when someone asks a question, not on
# every push.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Circuit for the game check"
        required: false
        default: "montreal"
      images:
        description: "Runner images, comma-separated (ubuntu-latest, macos-latest, macos-13, windows-latest)"
        required: false
        default: "ubuntu-latest,macos-latest,windows-latest"
      census_only:
        description: "Skip the game checks — just the adapter answer (seconds, not tens of minutes)"
        type: boolean
        required: false
        default: false
      force:
        description: "apex26.tlxForceHw for the game checks (sky,env,chunked,batches,shadow or 1) — exercise gates that never run on software"
        required: false
        default: ""
      ls:
        description: "Extra localStorage for ALL game checks, space-separated apex26.k=v — how a flagged renderer path gets tested on real hardware (e.g. apex26.instCellCache=1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gpu-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The input is a string; turn it into the matrix the next job fans out over,
  # so a dispatcher can drop macOS (the expensive one) without editing the file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.split.outputs.images }}
    steps:
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ["IMAGES"]
          allow = {"ubuntu-latest", "ubuntu-24.04", "macos-latest", "macos-15", "macos-14",
                   "macos-13", "windows-latest", "windows-2022"}
          picked = [i.strip() for i in raw.split(",") if i.strip() in allow]
          print("images=" + json.dumps(picked or ["ubuntu-latest"]))
          PY
        env:
          IMAGES: ${{ inputs.images }}

  census:
    needs: plan
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # The FULL browser, not the headless shell: the shell ships without
      # navigator.gpu, and censusing it answers a question about the binary
      # rather than about the machine.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium OS deps (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: What does the OS think it has
        continue-on-error: true
        shell: bash
        run: |
          echo "--- platform ---"; uname -a || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            ls -la /dev/dri 2>&1 || echo "no /dev/dri"
            (command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>&1 | head -30) || echo "no vulkaninfo"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            system_profiler SPDisplaysDataType 2>&1 | head -40 || true
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -c "Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,AdapterRAM | Format-List" || true
          fi

      - name: WebGPU adapter census
        id: census
        shell: bash
        run: node tools/gpu-census.mjs --json "census-${{ matrix.image }}.json"

      # Put the verdict in the job summary, not just the log. A job's log is a
      # 404 until the whole job ends, so a 20-minute game check hides a census
      # that finished in 15 seconds — which is exactly what happened on the
      # first run, on the one image whose answer was in doubt.
      - name: Census → job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.image }}"
            echo '```'
            node -e '
              const r = require("./census-${{ matrix.image }}.json");
              console.log("anyHardware:", r.anyHardware, "| platform:", r.platform, r.arch);
              for (const x of r.runs) {
                const a = x.adapter || {};
                console.log([x.flags.padEnd(12), String(x.verdict).padEnd(12),
                  "adapter=" + [a.vendor, a.architecture, a.device, a.description].filter(Boolean).join("/"),
                  "webgl=" + ((x.webgl && x.webgl.renderer) || "-")].join("  "));
              }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs whatever the census said: a software answer here is still the
      # cross-check that the portable path works, and if an image DOES have
      # hardware this is the first real-GPU run this project has ever had.
      - name: Game check — three.js / WebGPU
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          FORCE="${{ inputs.force }}"
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track }}" \
            --backend three --path webgpu \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgpu-${{ matrix.image }}.json" \
            --shot "game-webgpu-${{ matrix.image }}.png"

      - name: Game check — three.js / WebGL2 (control)
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          FORCE="${{ inputs.force }}"
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track }}" \
            --backend three --path webgl2 \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgl2-${{ matrix.image }}.json" \
            --shot "game-webgl2-${{ matrix.image }}.png"

      # GLX — the DEFAULT backend, and until now the only one this workflow
      # never looked at. Both checks above force three.js (TLX); a change to
      # js/render/glx.js could regress every player's renderer and this job
      # would still go green. That is how a flagged GLX path came to be
      # described as "gated on a real GPU" when nothing here could test it.
      - name: Game check — GLX / WebGL2 (the default backend)
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track }}" \
            --backend webgl2 $LS \
            --json "game-glx-${{ matrix.image }}.json" \
            --shot "game-glx-${{ matrix.image }}.png"

      # THE GATE. Before this step the job was green whatever the game said:
      # both checks above are continue-on-error and nothing read the JSON they
      # write, so run 33228195259 concluded "success" while this same macOS job
      # reported envFail 81 — an exception on every env-probe face, no
      # environment reflections in the world at all. A surface that reports and
      # does not gate catches a regression exactly once, by hand, and this one
      # is dispatch-only so nothing else will notice.
      #
      # Errors gate; APPEARANCE is only reported. A brightness floor is the kind
      # of threshold that goes flaky and then gets widened to pass, which
      # AGENTS.md forbids outright — meanLuma goes in the summary for a human.
      - name: Verdict — fail the job on what the game reported
        if: ${{ always() && !inputs.census_only }}
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const image = process.env.IMAGE;
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (_) { return null; } };
            const census = read(`census-${image}.json`);
            // Only a machine the census called hardware can be held to the
            // hardware expectations; a software image legitimately reports
            // softAdapter true and a skipped (blank) env probe.
            const hardware = !!(census && census.anyHardware);
            const bad = [];
            const rows = [`## ${image} — real-GPU verdict`, "", "```",
              `census anyHardware: ${hardware}`];
            // "glx" is the default backend. Its rows carry no backendState /
            // envState (those are TLX-only reads), and every check below that
            // touches them is absent-safe — so for GLX the gate is ok/phase and
            // gpuErrors, which is the right gate for it anyway.
            for (const path3 of ["webgpu", "webgl2", "glx"]) {
              const file = `game-${path3}-${image}.json`;
              const g = read(file);
              if (!g) { bad.push(`${path3}: ${file} missing — the check produced nothing`); continue; }
              const gfx = g.gfx || {}, env = gfx.envState || {}, be = gfx.backendState || {};
              const frame = g.frame || {};
              rows.push(`${path3.padEnd(7)} phase=${g.phase} ok=${g.ok} ` +
                `gpuErrors=${gfx.gpuErrors} envFail=${env.fail} envReady=${env.ready} ` +
                `envBlank=${env.blank} gaveUp=${env.gaveUp} softAdapter=${be.softAdapter} ` +
                `headless=${be.headless} meanLuma=${frame.meanLuma != null ? frame.meanLuma : "n/a"}`);
            // Print the REASON. gpu-game-check records out.error on every caught
            // failure, and this row used to drop it — which is why a Windows
            // outage read as contentless and got misfiled as "WARP is slow"
            // for two sessions. docs/PERF-FINDINGS.md 2f.
              if (g.error) rows.push(`${" ".repeat(8)}error: ${String(g.error).slice(0, 200)}`);
              if (g.root) rows.push(`${" ".repeat(8)}root:  ${g.root}`);
              if (g.ok !== true || g.phase !== "done") bad.push(`${path3}: did not finish (phase=${g.phase}, ok=${g.ok})${g.error ? " — " + String(g.error).slice(0, 200) : ""}`);
            // An ABSENT count must not read as clean. gpuErrors was defined only
            // on WGX, so this clause was vacuous on the GLX leg from the day that
            // leg was added — it reported null and passed forever. GLX has a real
            // counter now; a missing one means the backend stopped reporting.
              if (gfx.gpuErrors == null) bad.push(`${path3}: NO gpuErrors count reported — the error check would pass vacuously (see docs/PERF-FINDINGS.md 2e)`);
              else if (gfx.gpuErrors > 0) bad.push(`${path3}: ${gfx.gpuErrors} uncaptured GPU errors — ${String(gfx.gpuFirstError || "").slice(0, 160)}`);
              if ((env.fail || 0) > 0) bad.push(`${path3}: ${env.fail} env-probe faces FAILED — ${String(env.failMsg || "").slice(0, 160)}`);
              if (env.gaveUp) bad.push(`${path3}: the env probe stood down — it could not succeed`);
              if (hardware && be.softAdapter === true) bad.push(`${path3}: softAdapter TRUE on an adapter the census called hardware — the classification regressed and the game is running the degraded content path`);
            }
            rows.push("```", "");
            if (bad.length) rows.push("**FAILED**", "", ...bad.map((b) => `- ${b}`));
            try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n"); } catch (_) { /* summary is best-effort */ }
            console.log(rows.join("\n"));
            for (const b of bad) console.error(`::error::REAL-GPU GATE: ${b}`);
            process.exit(bad.length ? 1 : 0);
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-census-${{ matrix.image }}
          path: |
            census-*.json
            game-*.json
            game-*.png
          if-no-files-found: warn
          retention-days: 14
