name: GPU census

# Find a real GPU this project can actually reach.
#
# Every rendering verdict the agent container can produce is a SOFTWARE verdict:
# `vulkaninfo --summary` there reports one PHYSICAL_DEVICE_TYPE_CPU (llvmpipe)
# and /dev/dri does not exist, so no Chrome flag, Xvfb run or MCP can conjure
# hardware. That is fine for validation — llvmpipe is a conformant Vulkan 1.3
# implementation, so Dawn rejects exactly what it would reject on a player's
# machine, which is how the env-probe attachment-state defect was found — and
# useless for anything that only appears on real silicon.
#
# The published answers about GitHub's images contradict each other: the M1
# macOS announcement says GPU hardware acceleration is on by default,
# actions/runner-images#7085 asks for Metal passthrough as a missing feature.
# Rather than believe either, ASK each image:
#
#   census     — is there an adapter behind navigator.gpu, and does its identity
#                look like a known software rasteriser? Four flag sets, because
#                "stock" (what a player runs) and "--enable-unsafe-webgpu" do
#                not agree even in the agent container: stock returns NO adapter
#                there at all.
#   game-check — boot the ACTUAL GAME on four backend paths and report
#                GLX.gpuErrors(), the env-probe state and the ?gfxdebug=1
#                overlay. Same hooks the overlay prints for a player, so a CI
#                answer and a pasted player answer compare directly.
#
# Three ways in, never an ordinary push:
#   dispatch  — `gh workflow run gpu-census.yml --ref <branch> -f images=…`, or
#               the GitHub MCP `actions_run_trigger`.
#   request   — agent push-request (2026-09-09). Agents' GH App tokens cannot
#               workflow_dispatch (403); they CAN push an edit of
#               .github/gpu-census-request.json on a cursor/** or claude/**
#               branch, which runs THAT branch's tree with the file's inputs.
#               Still in daily use (runs 38603534048, 38610120171, 38611116514
#               on 2026-10-14).
#   nightly   — staggered from ci.yml's boot group (ci.yml 04:17 UTC, this
#               05:47; PROCESS-SPEEDUP-2026-09 §4.5), and SKIPPED when nothing
#               under the renderer paths changed since the last green nightly
#               (the plan job's `gate` step; an unknown base runs).
#
# A scheduled run has NO inputs — every `inputs.*` reads as the empty string —
# so each input carries its dispatch default inline (`|| 'x'`) and the schedule
# gates on exactly what a default dispatch gates on. The schedule runs on the
# default branch only (GitHub's rule).
#
# The Verdict is tools/gfx/census-verdict.mjs (fixture tests in
# tests/unit/census-verdict.test.mjs and gfx-backend-canary.test.mjs).

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Circuit for the game check"
        required: false
        default: "montreal"
      images:
        description: "Runner images, comma-separated (macos-latest is the one real GPU; ubuntu-latest, macos-13, windows-latest are software and hit the 30-min cap on the game checks — add census_only for their adapter answer)"
        required: false
        default: "macos-latest"
      census_only:
        description: "Skip the game checks — just the adapter answer (seconds, not tens of minutes)"
        type: boolean
        required: false
        default: false
      force:
        description: "apex26.tlxForceHw for the game checks (sky,env,chunked,batches,shadow or 1) — exercise gates that never run on software"
        required: false
        default: ""
      ls:
        description: "Extra localStorage for ALL game checks, space-separated apex26.k=v — how a flagged renderer path gets tested on real hardware (e.g. apex26.instCellCache=1)"
        required: false
        default: ""
      clock:
        description: "Hour the in-run A/B pins (0-23). Pins the SKY only — it cannot add lamps to a track built without them."
        required: false
        default: "12"
      tod:
        description: "Time of day the track is BUILT with (day|night|dawn|dusk). This is what bakes the lamps, and so what decides whether the per-chunk lamp branch can run at all. Empty = the circuit's own default."
        required: false
        default: ""
      # Appended LAST so every earlier input keeps its position (hunt 4 H5).
      # The game's default camera is helmet, whose cockpit glass latches
      # TLX's full mirror mip chain, so the mirror-mip cap (apex26.tlxMirMips)
      # only shows on a chase leg. A choice input (GitHub caps a dispatch at
      # 25 inputs; this is the 8th) — the plan job re-checks it for push requests.
      # chase>cockpit (hunt 5 E) starts on chase and switches onboard halfway
      # through the driven window: where the opt-in lazy mirror warm
      # (ls apex26.tlxMirWarmLazy=1) is paid, read back as warmEnd.mirrorLazy.
      cam:
        description: "Player camera for ALL game checks: helmet (the game's default, as before), chase (shows TLX's mirror-mip cap; helmet latches the full chain), or chase>cockpit (switch onboard mid-window: the lazy mirror warm's pause)"
        type: choice
        options: ["helmet", "chase", "chase>cockpit"]
        required: false
        default: "helmet"
      # Appended LAST, the 9th of GitHub's 25 dispatch inputs (hunt 5 E): HOW the
      # race starts. api = __apex.race(), every census before this; menu = the
      # player's path (title > RACE > RACE SETUP > START RACE) after the menu's
      # car prep and TLX program warm settle; menu-full = the same at player pace
      # (garage drive-out + flyby). Re-checked by the plan job for push requests.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_dispatchinputs
      entry:
        description: "How ALL game checks enter the race: api (__apex.race, as before), menu (the player's RACE! after the menu prep/warm), menu-full (the same at player pace: drive-out + flyby)"
        type: choice
        options: ["api", "menu", "menu-full"]
        required: false
        default: "api"
  push:
    branches: ["cursor/**", "claude/**"]
    paths: [".github/gpu-census-request.json"]

permissions:
  contents: read

# DISPATCH: one census per ref at a time, and a second dispatch QUEUES instead
# of cancelling the first (an A/B arm dispatched behind another used to cancel
# it seconds in: runs 38530816497, 38518364574, 38464070445). GitHub keeps at
# most ONE pending run per group (`queue: single`, the default), so a THIRD
# dispatch replaces the queued second: dispatch A/B arms one at a time.
# PUSH REQUESTS: one group per run_id, so two request legs (baseline /
# variant) never cancel or queue behind each other.
# NIGHTLY: its own group, the only one that cancels (a stuck previous nightly);
# it never cancels a person's dispatch.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: gpu-census-${{ (github.event_name == 'push' && format('{0}-{1}', github.ref, github.run_id)) || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  # The input is a string; turn it into the matrix the next job fans out over,
  # so a dispatcher can pick images without editing the file.
  # Push requests read .github/gpu-census-request.json from THIS commit.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the nightly gate lists this workflow's runs
    outputs:
      images: ${{ steps.split.outputs.images }}
      track: ${{ steps.split.outputs.track }}
      ls: ${{ steps.split.outputs.ls }}
      clock: ${{ steps.split.outputs.clock }}
      tod: ${{ steps.split.outputs.tod }}
      force: ${{ steps.split.outputs.force }}
      census_only: ${{ steps.split.outputs.census_only }}
      cam: ${{ steps.split.outputs.cam }}
      entry: ${{ steps.split.outputs.entry }}
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # ONE gate, by event; a dispatch always runs.
      #
      # PUSH — INHERITED REQUESTS DO NOT RUN (2026-09-24). `paths:` matches
      # the pushed RANGE, so a session branch that merges the deploy tip
      # re-fired the census for every request someone else already measured
      # there: 40 of 74 push runs in 48 h. A push runs the census only when a
      # NON-MERGE commit on the branch's own first-parent line in this push
      # edited the request. The deploy branch always runs.
      #
      # SCHEDULE — A NIGHTLY THAT TESTS SOMETHING (audit G1). Skip only when
      # the diff from the last GREEN nightly's commit is KNOWN and touches none
      # of the renderer paths; anything unknown (no green nightly, an API
      # error, a commit missing from this clone, a failed diff) runs. A red or
      # cancelled nightly is not green, so the next night runs again.
      # https://docs.github.com/en/rest/actions/workflow-runs#list-workflow-runs-for-a-workflow
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$BRANCH" != "claude/f1-game-project-26h3ng" ]; then
            F=.github/gpu-census-request.json
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BASE="$BEFORE"
            else
              BASE=$(git merge-base origin/claude/f1-game-project-26h3ng "$GITHUB_SHA" 2>/dev/null || echo "")
            fi
            OWN=$( [ -n "$BASE" ] && git log --first-parent --no-merges --format=%h "$BASE..$GITHUB_SHA" -- "$F" || echo "unknown")
            if [ -n "$OWN" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "census: this push's own commit(s) edited the request: $OWN"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::gpu-census skipped: the request change arrived by merge (already measured where it was made). Edit the request on this branch, or dispatch, to measure this tree."
            fi
            exit 0
          fi
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          PATHS="js/render js/lighting tools/gfx vendor .github/workflows/gpu-census.yml"
          LAST=$(gh api "repos/$REPO/actions/workflows/gpu-census.yml/runs?event=schedule&status=success&branch=$BRANCH&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -z "$LAST" ] || ! git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "census: no usable last green nightly (${LAST:-none}) — running"; exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$LAST" "$GITHUB_SHA" -- $PATHS); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "census: diff from $LAST failed — running"; exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gpu-census nightly skipped: nothing under $PATHS changed since the last green nightly ($LAST). Dispatch to measure anyway."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "census: $(echo "$CHANGED" | wc -l) renderer path(s) changed since $LAST:"; echo "$CHANGED" | head -20
          fi
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          req = {}
          if os.environ.get("EVENT") == "push":
            with open(".github/gpu-census-request.json", encoding="utf-8") as f:
              req = json.load(f)
          allow = {"ubuntu-latest", "ubuntu-24.04", "macos-latest", "macos-15", "macos-14",
                   "macos-13", "windows-latest", "windows-2022"}
          raw = str(req.get("images") or os.environ.get("INPUT_IMAGES") or "macos-latest")
          # One line per key: a value carrying a newline (a pushed request file,
          # a dispatch input) would add its own `key=` lines to GITHUB_OUTPUT.
          one = lambda v: " ".join(str(v).splitlines()).strip()
          picked = [i.strip() for i in raw.split(",") if i.strip() in allow]
          print("images=" + json.dumps(picked or ["macos-latest"]))
          print("track=" + one(req.get("track") or os.environ.get("INPUT_TRACK") or "montreal"))
          print("ls=" + one(req.get("ls") or os.environ.get("INPUT_LS") or ""))
          # The HOUR the in-run A/B pins: 12 (noon, no lamps) measures the
          # PLAIN draw branch, 2 (night) the per-chunk lamp branch (census 146).
          try: ck = int(req.get("clock", os.environ.get("INPUT_CLOCK") or 12))
          except (TypeError, ValueError): ck = 12
          print("clock=" + str(ck if 0 <= ck <= 23 else 12))
          # The time of day the track is BUILT with — what bakes the lamps.
          td = str(req.get("tod") or os.environ.get("INPUT_TOD") or "")
          print("tod=" + (td if td in ("day", "night", "dawn", "dusk") else ""))
          print("force=" + one(req.get("force") or os.environ.get("INPUT_FORCE") or ""))
          co = req.get("census_only")
          if co is None:
            co = (os.environ.get("INPUT_CENSUS_ONLY") or "").lower() in ("true", "1")
          print("census_only=" + ("true" if co else "false"))
          # The player camera (hunt 4 H5). A push request bypasses the
          # dispatch form's choice list, so the allowlist is enforced here too.
          cm = str(req.get("cam") or os.environ.get("INPUT_CAM") or "helmet").strip()
          print("cam=" + (cm if cm in ("helmet", "chase", "chase>cockpit") else "helmet"))
          # The race entry (hunt 5 E), allowlisted for the same reason.
          en = str(req.get("entry") or os.environ.get("INPUT_ENTRY") or "api").strip()
          print("entry=" + (en if en in ("api", "menu", "menu-full") else "api"))
          PY
        env:
          EVENT: ${{ github.event_name }}
          # Dispatch/schedule defaults — a schedule leaves inputs empty; a push
          # request's own fields win over these.
          # macos-latest is the DEFAULT for all three (2026-10-14; the nightly
          # since 2026-09-29): ubuntu-latest and windows-latest have no hardware
          # adapter, and their four software game checks ended `cancelled` at
          # the 30-minute job cap on every run measured. Their adapter answer
          # is a census_only dispatch away.
          INPUT_IMAGES: ${{ inputs.images || 'macos-latest' }}
          INPUT_TRACK: ${{ inputs.track || 'montreal' }}
          INPUT_LS: ${{ inputs.ls || '' }}
          INPUT_CLOCK: ${{ inputs.clock || '' }}
          INPUT_TOD: ${{ inputs.tod || '' }}
          INPUT_FORCE: ${{ inputs.force || '' }}
          INPUT_CENSUS_ONLY: ${{ inputs.census_only || false }}
          INPUT_CAM: ${{ inputs.cam || 'helmet' }}
          INPUT_ENTRY: ${{ inputs.entry || 'api' }}

  census:
    needs: plan
    if: ${{ needs.plan.outputs.run != 'false' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      CENSUS_TRACK: ${{ needs.plan.outputs.track }}
      CENSUS_LS: ${{ needs.plan.outputs.ls }}
      CENSUS_CLOCK: ${{ needs.plan.outputs.clock }}
      CENSUS_TOD: ${{ needs.plan.outputs.tod }}
      IMAGE: ${{ matrix.image }}   # run-block uses read $IMAGE, never a ${{ }} expansion (zizmor template-injection)
      CENSUS_FORCE: ${{ needs.plan.outputs.force }}
      CENSUS_ONLY: ${{ needs.plan.outputs.census_only }}
      CENSUS_CAM: ${{ needs.plan.outputs.cam }}
      CENSUS_ENTRY: ${{ needs.plan.outputs.entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-apex   # Node 22 + npm ci

      # Prefer full Chromium for a consistent census binary. WebGPU support
      # in headless-shell builds varies; test the adapter rather than
      # inferring support from the executable name.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium OS deps (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: What does the OS think it has
        continue-on-error: true
        shell: bash
        run: |
          echo "--- platform ---"; uname -a || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            ls -la /dev/dri 2>&1 || echo "no /dev/dri"
            (command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>&1 | head -30) || echo "no vulkaninfo"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            system_profiler SPDisplaysDataType 2>&1 | head -40 || true
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -c "Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,AdapterRAM | Format-List" || true
          fi

      - name: WebGPU adapter census
        id: census
        shell: bash
        run: node tools/gfx/gpu-census.mjs --json "census-${IMAGE}.json"

      # Put the verdict in the job summary, not just the log. A job's log is a
      # 404 until the whole job ends, so the game checks would hide a census
      # that finished in 15 seconds — which is exactly what happened on the
      # first run, on the one image whose answer was in doubt.
      - name: Census → job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${IMAGE}"
            echo '```'
            node -e '
              const r = require("./census-" + process.env.IMAGE + ".json");
              console.log("anyHardware:", r.anyHardware, "| platform:", r.platform, r.arch);
              for (const x of r.runs) {
                const a = x.adapter || {};
                console.log([x.flags.padEnd(12), String(x.verdict).padEnd(12),
                  "adapter=" + [a.vendor, a.architecture, a.device, a.description].filter(Boolean).join("/"),
                  "webgl=" + ((x.webgl && x.webgl.renderer) || "-")].join("  "));
              }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs whatever the census said: a software answer here is still the
      # cross-check that the portable path works.
      #
      # FOUR legs, four steps — deliberately not a composite action, whose
      # steps take no `timeout-minutes`, so one hung leg would eat the others'
      # budget. Each leg is capped at 6 min (the longest measured leg is
      # 3.2 min), so a hang ends THAT step red and the Verdict below names the
      # missing or unfinished leg, inside the job's 30-min cap; at 20 min each
      # a hang ran the job into its cap and the run read `cancelled`.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepstimeout-minutes
      #
      # EVERY leg pins apex26.wgxCapture=0 (SCREENSHOTS = NATIVE) BEFORE $LS,
      # so the leg runs the present path a player has and a dispatcher's `ls`
      # can still override it. Under automation the backends otherwise blit:
      # tlx.js arms its readback when `!forceWebGL && _capPref !== "0" &&
      # (_softAdapter || _headless || cap==="1")` and `_headless` is
      # navigator.webdriver; WGX soft-presented every frame (spa dusk 20.8 vs
      # 36.7 fps pinned, hunt 4 I3); GLX shot one stale gen-1 frame (I1). The
      # Verdict gates TLX softBlit and WGX softPresent on hardware unless the
      # dispatch overrode the pin.
      - name: iPhone garage diagnostic experiments
        if: ${{ needs.plan.outputs.census_only != 'true' }}
        continue-on-error: true
        timeout-minutes: 12
        run: node scratch/iphone-garage-native.mjs

      - name: Upload phone garage captures before controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-garage
          path: artifacts/iphone-native/
          if-no-files-found: error
          retention-days: 7

      - name: Game check — three.js / WebGPU
        if: ${{ needs.plan.outputs.census_only != 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |   # zizmor: ignore[template-injection] matrix.image is one of the plan job's allow-listed runner-image names; census-verdict.test.mjs pins this form
          FORCE="${CENSUS_FORCE}"
          LS=""; for kv in ${CENSUS_LS}; do LS="$LS --ls $kv"; done
          # wgxCapture=0 IS THE POINT OF THIS LEG. tlx.js arms its soft blit
          # (GPU readback + putImageData every frame) whenever
          # `!forceWebGL && (_softAdapter || _headless || cap==="1")`, and
          # `_headless` is `navigator.webdriver` — true in EVERY automated run.
          # So until 2026-09-22 this leg timed the headless readback and never
          # once the swapchain present a player gets, on any image, including
          # the hardware ones. Every fps/frames/luma number this column has
          # ever produced for WebGPU was that blit (PERF-FINDINGS 2t read a
          # 46.9-vs-66.2 gap straight off it). "0" = NATIVE keeps three's
          # swapchain; the `path:` row below prints softBlit so a regression
          # here is visible rather than silently re-measured.
          node tools/gfx/gpu-game-check.mjs "${CENSUS_TRACK}" --clock "${CENSUS_CLOCK:-12}" ${CENSUS_TOD:+--tod "$CENSUS_TOD"} --cam "${CENSUS_CAM:-helmet}" --entry "${CENSUS_ENTRY:-api}" \
            --backend three --path webgpu --ls apex26.wgxCapture=0 --beats 20 \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgpu-${{ matrix.image }}.json" \
            --shot "game-webgpu-${{ matrix.image }}.png"

      # The control: the same pin (a no-op here — forceWebGL short-circuits
      # the blit), so the two TLX legs differ in exactly ONE variable.
      - name: Game check — three.js / WebGL2 (control)
        if: ${{ needs.plan.outputs.census_only != 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |   # zizmor: ignore[template-injection] matrix.image is one of the plan job's allow-listed runner-image names; census-verdict.test.mjs pins this form
          FORCE="${CENSUS_FORCE}"
          LS=""; for kv in ${CENSUS_LS}; do LS="$LS --ls $kv"; done
          # Same pin as the WebGPU leg, and a no-op here: forceWebGL
          # short-circuits _softBlit. Written anyway so the two TLX legs differ
          # in exactly ONE variable — the three path — which is the only thing
          # that makes this a control.
          node tools/gfx/gpu-game-check.mjs "${CENSUS_TRACK}" --clock "${CENSUS_CLOCK:-12}" ${CENSUS_TOD:+--tod "$CENSUS_TOD"} --cam "${CENSUS_CAM:-helmet}" --entry "${CENSUS_ENTRY:-api}" \
            --backend three --path webgl2 --ls apex26.wgxCapture=0 --beats 20 \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgl2-${{ matrix.image }}.json" \
            --shot "game-webgl2-${{ matrix.image }}.png"

      # GLX — the explicit WebGL2 backend and the fallback every backend
      # failure lands on; without this leg a js/render/glx/ regression could
      # go green here.
      - name: Game check — GLX / WebGL2 (the default backend)
        if: ${{ needs.plan.outputs.census_only != 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |   # zizmor: ignore[template-injection] matrix.image is one of the plan job's allow-listed runner-image names; census-verdict.test.mjs pins this form
          LS=""; for kv in ${CENSUS_LS}; do LS="$LS --ls $kv"; done
          # wgxCapture=0 = SCREENSHOTS NATIVE, which GLX honours since hunt 4
          # I1: no preserveDrawingBuffer and no opaque #game-soft overlay — the
          # present path a player has. Under the headless UA GLX otherwise blits
          # to that overlay only when a capture waits, so census 450-455 shot
          # one gen-1 frame for every A/B capture. A dispatcher's ls (after
          # this pin) can override it; the A/B rows print the mode and gens.
          node tools/gfx/gpu-game-check.mjs "${CENSUS_TRACK}" --clock "${CENSUS_CLOCK:-12}" ${CENSUS_TOD:+--tod "$CENSUS_TOD"} --cam "${CENSUS_CAM:-helmet}" --entry "${CENSUS_ENTRY:-api}" \
            --beats 20 --ls apex26.wgxCapture=0 --backend webgl2 $LS \
            --json "game-glx-${{ matrix.image }}.json" \
            --shot "game-glx-${{ matrix.image }}.png"

      # WGX — the native WebGPU backend (js/render/webgpu/), opt-in for
      # players; the in-container Dawn validates but never executes, so this
      # is its only real-GPU evidence. The Verdict holds it to: bound
      # (backendState().api "webgpu", not a GLX fallback), the swapchain
      # (softPresent false), and gpuErrors 0.
      - name: Game check — WGX / WebGPU (native, opt-in)
        if: ${{ needs.plan.outputs.census_only != 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |   # zizmor: ignore[template-injection] matrix.image is one of the plan job's validated runner-image names; ci-coverage.test.mjs pins this exact form
          LS=""; for kv in ${CENSUS_LS}; do LS="$LS --ls $kv"; done
          # wgxCapture=0 (hunt 4 I3), as on the other three legs: without it WGX
          # soft-presents every frame under the headless UA — copyTextureToBuffer,
          # a fresh 2.4-3.7 MB MAP_READ buffer, mapAsync, a JS loop and
          # putImageData — which no player pays. Pinned by hand on spa dusk:
          # 20.8 -> 36.7 fps in the driven window, busy 11.7 -> 7.5 ms/frame.
          # The HeadlessChrome UA still forces MSAA 1 via _softAdapter
          # (wgx.js), which this pin does not undo.
          node tools/gfx/gpu-game-check.mjs "${CENSUS_TRACK}" --clock "${CENSUS_CLOCK:-12}" ${CENSUS_TOD:+--tod "$CENSUS_TOD"} --cam "${CENSUS_CAM:-helmet}" --entry "${CENSUS_ENTRY:-api}" \
            --beats 20 --ls apex26.wgxCapture=0 --backend webgpu $LS \
            --json "game-wgx-${{ matrix.image }}.json" \
            --shot "game-wgx-${{ matrix.image }}.png"

      # THE GATE. The four legs above are continue-on-error, so before this
      # step the job was green whatever the game said (run 33228195259 passed
      # with envFail 81). tools/gfx/census-verdict.mjs reads the census and the
      # four leg JSONs, writes the rows to the job summary, and exits 1 on a
      # missing or unfinished leg, a GPU or shader error, failed env-probe
      # faces, and — on an image the census called hardware — absent counts,
      # softAdapter true, WGX not bound, or TLX/WGX off the native present path.
      # It reads IMAGE, CENSUS_LS (job env) and GITHUB_STEP_SUMMARY.
      - name: Phone garage experiment verdict
        if: ${{ !cancelled() && needs.plan.outputs.census_only != 'true' }}
        run: node -e 'if (!require("./artifacts/iphone-native/report.json").ok) process.exit(1)'

      - name: Verdict — fail the job on what the game reported
        if: ${{ !cancelled() && needs.plan.outputs.census_only != 'true' }}
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: node tools/gfx/census-verdict.mjs

      # https://github.com/actions/upload-artifact#retention-period — 7 days:
      # a census is read the day it runs; older answers live in the docs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-census-${{ matrix.image }}
          path: |
            census-*.json
            game-*.json
            game-*.png
          if-no-files-found: warn
          retention-days: 7
