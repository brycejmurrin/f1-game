name: GPU census

# Find a real GPU this project can actually reach.
#
# Every rendering verdict the agent container can produce is a SOFTWARE verdict:
# `vulkaninfo --summary` there reports one PHYSICAL_DEVICE_TYPE_CPU (llvmpipe)
# and /dev/dri does not exist, so no Chrome flag, Xvfb run or MCP can conjure
# hardware. That is fine for validation — llvmpipe is a conformant Vulkan 1.3
# implementation, so Dawn rejects exactly what it would reject on a player's
# machine, which is how the env-probe attachment-state defect was found — and
# useless for anything that only appears on real silicon.
#
# The published answers about GitHub's images contradict each other: the M1
# macOS announcement says GPU hardware acceleration is on by default,
# actions/runner-images#7085 asks for Metal passthrough as a missing feature.
# Rather than believe either, ASK each image:
#
#   census     — is there an adapter behind navigator.gpu, and does its identity
#                look like a known software rasteriser? Four flag sets, because
#                "stock" (what a player runs) and "--enable-unsafe-webgpu" do
#                not agree even in the agent container: stock returns NO adapter
#                there at all.
#   game-check — boot the ACTUAL GAME on the three.js/WebGPU path and report
#                GLX.gpuErrors(), the env-probe state and the ?gfxdebug=1
#                overlay. Same hooks the overlay prints for a player, so a CI
#                answer and a pasted player answer compare directly.
#
# Dispatch, and NIGHTLY (2026-09-01) — never on push. It costs runner minutes on
# images the normal gate never uses (macOS bills at a multiplier), so it runs
# when someone asks a question and once a night beside ci.yml's boot group
# (same cron, PROCESS-SPEEDUP-2026-09 §4.5): the two real-GPU defects the
# Verdict step has caught were found only when someone happened to dispatch
# this, and a gate that fires on request catches a regression exactly once.
#
# A scheduled run has NO inputs — every `inputs.*` reads as the empty string —
# so each input used below carries its dispatch default inline (`|| 'x'`), and
# `census_only` reads as false, which is the FULL check: the schedule gates on
# exactly what a default dispatch gates on. The schedule runs on the default
# branch only (GitHub's rule), like ci.yml's nightly.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Circuit for the game check"
        required: false
        default: "montreal"
      images:
        description: "Runner images, comma-separated (ubuntu-latest, macos-latest, macos-13, windows-latest)"
        required: false
        default: "ubuntu-latest,macos-latest,windows-latest"
      census_only:
        description: "Skip the game checks — just the adapter answer (seconds, not tens of minutes)"
        type: boolean
        required: false
        default: false
      force:
        description: "apex26.tlxForceHw for the game checks (sky,env,chunked,batches,shadow or 1) — exercise gates that never run on software"
        required: false
        default: ""
      ls:
        description: "Extra localStorage for ALL game checks, space-separated apex26.k=v — how a flagged renderer path gets tested on real hardware (e.g. apex26.instCellCache=1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gpu-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The input is a string; turn it into the matrix the next job fans out over,
  # so a dispatcher can drop macOS (the expensive one) without editing the file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.split.outputs.images }}
    steps:
      - id: split
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ["IMAGES"]
          allow = {"ubuntu-latest", "ubuntu-24.04", "macos-latest", "macos-15", "macos-14",
                   "macos-13", "windows-latest", "windows-2022"}
          picked = [i.strip() for i in raw.split(",") if i.strip() in allow]
          print("images=" + json.dumps(picked or ["ubuntu-latest"]))
          PY
        env:
          # Dispatch default restated for the schedule (inputs are empty there).
          IMAGES: ${{ inputs.images || 'ubuntu-latest,macos-latest,windows-latest' }}

  census:
    needs: plan
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # The FULL browser, not the headless shell: the shell ships without
      # navigator.gpu, and censusing it answers a question about the binary
      # rather than about the machine.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium OS deps (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: What does the OS think it has
        continue-on-error: true
        shell: bash
        run: |
          echo "--- platform ---"; uname -a || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            ls -la /dev/dri 2>&1 || echo "no /dev/dri"
            (command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>&1 | head -30) || echo "no vulkaninfo"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            system_profiler SPDisplaysDataType 2>&1 | head -40 || true
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -c "Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,AdapterRAM | Format-List" || true
          fi

      - name: WebGPU adapter census
        id: census
        shell: bash
        run: node tools/gpu-census.mjs --json "census-${{ matrix.image }}.json"

      # Put the verdict in the job summary, not just the log. A job's log is a
      # 404 until the whole job ends, so a 20-minute game check hides a census
      # that finished in 15 seconds — which is exactly what happened on the
      # first run, on the one image whose answer was in doubt.
      - name: Census → job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.image }}"
            echo '```'
            node -e '
              const r = require("./census-${{ matrix.image }}.json");
              console.log("anyHardware:", r.anyHardware, "| platform:", r.platform, r.arch);
              for (const x of r.runs) {
                const a = x.adapter || {};
                console.log([x.flags.padEnd(12), String(x.verdict).padEnd(12),
                  "adapter=" + [a.vendor, a.architecture, a.device, a.description].filter(Boolean).join("/"),
                  "webgl=" + ((x.webgl && x.webgl.renderer) || "-")].join("  "));
              }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs whatever the census said: a software answer here is still the
      # cross-check that the portable path works, and if an image DOES have
      # hardware this is the first real-GPU run this project has ever had.
      - name: Game check — three.js / WebGPU
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          FORCE="${{ inputs.force }}"
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track || 'montreal' }}" \
            --backend three --path webgpu \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgpu-${{ matrix.image }}.json" \
            --shot "game-webgpu-${{ matrix.image }}.png"

      - name: Game check — three.js / WebGL2 (control)
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          FORCE="${{ inputs.force }}"
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track || 'montreal' }}" \
            --backend three --path webgl2 \
            ${FORCE:+--ls apex26.tlxForceHw=$FORCE} $LS \
            --json "game-webgl2-${{ matrix.image }}.json" \
            --shot "game-webgl2-${{ matrix.image }}.png"

      # GLX — the DEFAULT backend, and until now the only one this workflow
      # never looked at. Both checks above force three.js (TLX); a change to
      # js/render/glx.js could regress every player's renderer and this job
      # would still go green. That is how a flagged GLX path came to be
      # described as "gated on a real GPU" when nothing here could test it.
      - name: Game check — GLX / WebGL2 (the default backend)
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track || 'montreal' }}" \
            --backend webgl2 $LS \
            --json "game-glx-${{ matrix.image }}.json" \
            --shot "game-glx-${{ matrix.image }}.png"

      # WGX — the native WebGPU backend (js/render/webgpu/), opt-in for players.
      # Until 2026-09-02 the "webgpu" leg above was three.js on WebGPU (TLX), so
      # a WGX shader or present-path change had NO real-GPU evidence at all: the
      # in-container Dawn validates but never executes (tools/wgx-validate.mjs).
      # The Verdict holds this leg to: WGX actually bound (GLX.softPresent is
      # exported by WGX only), the swapchain path on hardware (softPresent
      # false — the CPU blit is the SwiftShader path and the "WebGPU is laggy"
      # class), and gpuErrors 0.
      - name: Game check — WGX / WebGPU (native, opt-in)
        if: ${{ !inputs.census_only }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          LS=""; for kv in ${{ inputs.ls }}; do LS="$LS --ls $kv"; done
          node tools/gpu-game-check.mjs "${{ inputs.track || 'montreal' }}" \
            --backend webgpu $LS \
            --json "game-wgx-${{ matrix.image }}.json" \
            --shot "game-wgx-${{ matrix.image }}.png"

      # THE GATE. Before this step the job was green whatever the game said:
      # both checks above are continue-on-error and nothing read the JSON they
      # write, so run 33228195259 concluded "success" while this same macOS job
      # reported envFail 81 — an exception on every env-probe face, no
      # environment reflections in the world at all. A surface that reports and
      # does not gate catches a regression exactly once, by hand, and this one
      # is dispatch-only so nothing else will notice.
      #
      # Errors gate; APPEARANCE is only reported. A brightness floor is the kind
      # of threshold that goes flaky and then gets widened to pass, which
      # AGENTS.md forbids outright — meanLuma goes in the summary for a human.
      - name: Verdict — fail the job on what the game reported
        if: ${{ always() && !inputs.census_only }}
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const image = process.env.IMAGE;
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (_) { return null; } };
            const census = read(`census-${image}.json`);
            // Only a machine the census called hardware can be held to the
            // hardware expectations; a software image legitimately reports
            // softAdapter true and a skipped (blank) env probe.
            // TRI-STATE, deliberately not coerced. `!!` mapped BOTH "measured,
            // no hardware" and "measured nothing" to false, and false is what
            // switches off the three strongest clauses below (a missing
            // gpuErrors count, softAdapter on hardware). A census that failed to
            // launch therefore downgraded this gate to a software gate and let
            // it report success — the same absence-reads-as-normal shape this
            // gate was hardened against. docs/PERF-FINDINGS.md 2j.
            const hardware = !!(census && census.anyHardware === true);
            const censusUnknown = !census || census.anyHardware == null;
            const bad = [];
            if (censusUnknown) bad.push(
              `census-${image}.json: the census measured NOTHING (anyHardware ` +
              `null or file unreadable) — this run cannot tell hardware from ` +
              `software, so the hardware-only checks below would pass vacuously`);
            const rows = [`## ${image} — real-GPU verdict`, "", "```",
              `census anyHardware: ${hardware}`];
            // "glx" is the default backend. Its rows carry no backendState /
            // envState: gpu-game-check reads those only when g.__tlx exists
            // (tools/gpu-game-check.mjs 205-207), so for GLX the gate is
            // ok/phase and gpuErrors, which is the right gate for it anyway.
            // Every check below that touches an env/backend field is therefore
            // either absent-safe or scoped to tlxLeg — an absence check aimed
            // at all three legs would fail GLX on hardware for reporting
            // exactly what it is built to report.
            for (const path3 of ["webgpu", "webgl2", "glx", "wgx"]) {
              const file = `game-${path3}-${image}.json`;
              const g = read(file);
              if (!g) { bad.push(`${path3}: ${file} missing — the check produced nothing`); continue; }
              const gfx = g.gfx || {}, env = gfx.envState || {}, be = gfx.backendState || {};
              // The two TLX legs are three.js BY CONSTRUCTION (--backend three,
              // above), so they MUST bring an env probe with them. Scoping on
              // the leg name rather than on "does this row have a __tlx" is the
              // whole point: a TLX leg that fell back to GLX loses envState too,
              // and that is a regression to fail on, not a reason to go quiet.
              const tlxLeg = path3 === "webgpu" || path3 === "webgl2";
              const frame = g.frame || {};
              rows.push(`${path3.padEnd(7)} phase=${g.phase} ok=${g.ok} ` +
                `gpuErrors=${gfx.gpuErrors} envFail=${env.fail} envReady=${env.ready} ` +
                `envBlank=${env.blank} gaveUp=${env.gaveUp} softAdapter=${be.softAdapter} ` +
                `headless=${be.headless} meanLuma=${frame.meanLuma != null ? frame.meanLuma : "n/a"}`);
            // Print the REASON. gpu-game-check records out.error on every caught
            // failure, and this row used to drop it — which is why a Windows
            // outage read as contentless and got misfiled as "WARP is slow"
            // for two sessions. docs/PERF-FINDINGS.md 2f.
              if (g.error) rows.push(`${" ".repeat(8)}error: ${String(g.error).slice(0, 200)}`);
              if (g.root) rows.push(`${" ".repeat(8)}root:  ${g.root}`);
            // Why the ten fields above are empty. bounded() in gpu-game-check
            // turns a failed read into a VALUE, so the run still says done/ok
            // and every field derived from gfx comes out undefined — which
            // reads exactly like a backend with nothing to report.
              if (g.gfxReadFailed) rows.push(`${" ".repeat(8)}gfx:   ${g.gfxReadFailed}`);
              if (g.overlayReadFailed) rows.push(`${" ".repeat(8)}ovl:   ${g.overlayReadFailed}`);
            // Why meanLuma is empty. It read "n/a" on every leg of every run
            // for months because gpu-game-check never wrote out.frame at all —
            // an empty column is not the same as a dark frame, and the row said
            // neither. Appearance still does not GATE (a brightness floor goes
            // flaky and then gets widened, which AGENTS.md forbids); it now
            // either carries a number or says why it does not.
              if (g.frameReadFailed) rows.push(`${" ".repeat(8)}luma:  ${g.frameReadFailed}`);
              if (g.ok !== true || g.phase !== "done") bad.push(`${path3}: did not finish (phase=${g.phase}, ok=${g.ok})${g.error ? " — " + String(g.error).slice(0, 200) : ""}`);
            // An ABSENT count must not read as clean. gpuErrors was defined only
            // on WGX, so this clause was vacuous on the GLX leg from the day that
            // leg was added — it reported null and passed forever. GLX has a real
            // counter now; a missing one means the backend stopped reporting.
            // A read that FAILED is not the same as a backend that reports no
            // count, though both leave gpuErrors undefined — the row above says
            // which either way. Blocking only on hardware, for the same reason
            // as the count below: on a software image a leg that cannot bring
            // its backend up is information, not a regression signal, and the
            // gate exists to protect the real-GPU answer.
              if (hardware && g.gfxReadFailed) bad.push(`${path3}: the gfx read failed, so this leg proved NOTHING — ${g.gfxReadFailed}`);
            // hardware-only, like softAdapter and the env checks below: this
            // clause exists so an absent count cannot read as clean ON THE
            // REAL-GPU RUN. A software image may legitimately not bring a
            // backend up at all, and failing the job for that is noise, not
            // rigour. macos-latest still fails loudly if it stops reporting.
              else if (hardware && gfx.gpuErrors == null) bad.push(`${path3}: NO gpuErrors count reported — the error check would pass vacuously (see docs/PERF-FINDINGS.md 2e)`);
              else if (gfx.gpuErrors > 0) bad.push(`${path3}: ${gfx.gpuErrors} uncaptured GPU errors — ${String(gfx.gpuFirstError || "").slice(0, 160)}`);
              // `(env.fail || 0) > 0` was the SAME banned shape as the gpuErrors
              // fix twelve lines up, on the same object: a build that stops
              // exporting envState().fail reads as clean. Absence fails on
              // hardware instead. envState().fail is `_envFailN`, initialised 0
              // (js/render/three/tlx.js 1112) and always a number once the
              // surface exists — so on a hardware TLX leg an ABSENT count means
              // the surface is gone or envState() threw, never "no failures".
              // docs/PERF-FINDINGS.md 2j.
              if (hardware && tlxLeg && env.fail == null) bad.push(`${path3}: NO env-probe fail count reported — the env check would pass vacuously`);
              else if (env.fail > 0) bad.push(`${path3}: ${env.fail} env-probe faces FAILED — ${String(env.failMsg || "").slice(0, 160)}`);
              // gaveUp needs no absence clause of its own: it lives on the same
              // envState object, so it is missing exactly when fail is missing
              // and the clause above has already failed the run. A second push
              // would name one root cause twice.
              if (env.gaveUp) bad.push(`${path3}: the env probe stood down — it could not succeed`);
              if (hardware && be.softAdapter === true) bad.push(`${path3}: softAdapter TRUE on an adapter the census called hardware — the classification regressed and the game is running the degraded content path`);
              // The WGX leg: gpu-game-check reports wgx (GLX.softPresent exists,
              // i.e. WGX bound rather than falling back to GLX) and wgxSoftPresent.
              if (path3 === "wgx") {
                rows.push(`${" ".repeat(8)}wgx:   bound=${gfx.wgx} softPresent=${gfx.wgxSoftPresent} engine=${gfx.engine}`);
                if (hardware && gfx.wgx !== true) bad.push(`wgx: WGX did not bind on a hardware adapter (fell back to GLX, or the surface stopped reporting) — this leg proved nothing about js/render/webgpu/`);
                else if (hardware && gfx.wgxSoftPresent === true) bad.push(`wgx: WGX is soft-presenting (CPU blit) on a hardware adapter — the swapchain path is off, every frame pays a readback + putImageData`);
              }
            }
            rows.push("```", "");
            if (bad.length) rows.push("**FAILED**", "", ...bad.map((b) => `- ${b}`));
            try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n"); } catch (_) { /* summary is best-effort */ }
            console.log(rows.join("\n"));
            for (const b of bad) console.error(`::error::REAL-GPU GATE: ${b}`);
            process.exit(bad.length ? 1 : 0);
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-census-${{ matrix.image }}
          path: |
            census-*.json
            game-*.json
            game-*.png
          if-no-files-found: warn
          retention-days: 14
