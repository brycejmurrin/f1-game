name: Capture gallery
run-name: Native capture gallery on ${{ github.ref_name }}

# Opt-in native captures using the existing matrix and exporter on a browser-capable runner.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push
on:
  workflow_dispatch:
  push:
    branches: ["cursor/**"]
    paths: [".github/capture-gallery-request.json"]
permissions:
  contents: read
concurrency:
  group: capture-gallery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate request, capture native images and export portable gallery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { parseArgs, expandMatrix } from './tools/shot/lib/design-matrix.mjs';
          const request = JSON.parse(fs.readFileSync('.github/capture-gallery-request.json', 'utf8'));
          const allowed = new Set(['team','part','angles','colours','lights','variants','baseline','backend','fill','fov','viewport']);
          if (request.schemaVersion !== 1 || !Array.isArray(request.args) || !request.args.length || request.args.length > 13 || Object.keys(request).some(k => !['schemaVersion','args'].includes(k))) throw new Error('invalid capture request');
          const seen = new Set();
          for (const arg of request.args) {
            const m = typeof arg === 'string' && /^--([a-z]+)=(.+)$/.exec(arg);
            if (!m || !allowed.has(m[1]) || seen.has(m[1]) || arg.length > 2048) throw new Error('unknown, duplicate or unsafe capture argument');
            seen.add(m[1]);
          }
          const options = parseArgs(request.args);
          const count = expandMatrix(options).reduce((n,g) => n + g.cells.length, 0);
          if (count < 1 || count > 24) throw new Error('capture requires 1..24 cells');
          console.log(JSON.stringify({source:process.env.GITHUB_SHA,cells:count,backend:options.backend}));
          const commands = [
            ['tools/shot/design-matrix.mjs', ...request.args, '--run=ci-capture', '--out=artifacts/design-matrix/ci-capture'],
            ['tools/shot/capture-gallery.mjs', '--input=artifacts/design-matrix/ci-capture/gallery.json', '--assets=artifacts/design-matrix/ci-capture', '--out=artifacts/capture-site']
          ];
          for (const args of commands) {
            const result = spawnSync(process.execPath, args, {stdio:'inherit'});
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status || 1);
          }
          NODE
      - name: Upload images, source receipts and gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-gallery-${{ github.sha }}
          path: |
            artifacts/design-matrix/ci-capture/
            artifacts/capture-site/
          if-no-files-found: warn
          retention-days: 7
