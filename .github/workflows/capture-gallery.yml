name: Capture gallery
run-name: Native capture gallery on ${{ github.ref_name }}

# Bounded, opt-in native capture when a local browser/GPU is unavailable.
# Dispatch only (2026-10-27, review WP-W1): agent tokens dispatch fine, so the old
# push-request relay is gone. Commit .github/capture-gallery-request.json on your
# branch, then `gh workflow run capture-gallery.yml --ref <branch>`.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
# https://docs.github.com/en/actions/tutorials/store-and-share-data
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-gallery-${{ github.ref }}${{ vars.ACTIONS_COORDINATOR_MODE == 'active' && github.run_id || '' }}
  cancel-in-progress: ${{ (vars.ACTIONS_COORDINATOR_MODE != 'active' && vars.ACTIONS_COORDINATOR_MODE != 'paused') && (false) }}

jobs:
  capture:
    if: ${{ (vars.ACTIONS_COORDINATOR_MODE != 'active' && vars.ACTIONS_COORDINATOR_MODE != 'paused') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-apex
      - name: Validate bounded capture request
        run: node tools/shot/run-capture-request.mjs --plan
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Capture native frames and export gallery
        run: node tools/shot/run-capture-request.mjs
      - name: Upload images, camera receipts and portable gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-gallery-${{ github.sha }}
          path: |
            artifacts/design-matrix/ci-capture/
            artifacts/capture-site/
          if-no-files-found: warn
          retention-days: 7

  request-admission:
    concurrency:
      group: actions-claim
      queue: max
    name: Record request for bounded Actions admission
    if: ${{ vars.ACTIONS_COORDINATOR_MODE == 'active' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Trusted request adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/f1-game-project-26h3ng
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve the request without starting its expensive work
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_WORKFLOW: capture-gallery.yml
        run: node tools/ci/actions/cli.mjs request --workflow "$REQUEST_WORKFLOW" --event-file "$GITHUB_EVENT_PATH"
